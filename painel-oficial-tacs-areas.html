<style id="portalTacsAdminUiStandardV1">
/*
 * Conecta Saúde Comunitária — UI administrativa canônica
 * Contrato: CSC-CENTRAL-ADMIN-UI-APP4-2026-09-10
 * Referência: 4 • App institucional
 * Fonte única de verdade visual para os painéis administrativos.
 * Este CSS é injetado inline para evitar requisição adicional em runtime.
 * PROTEÇÃO: não renomear/remover IDs, classes funcionais, data-*, campos ou seletores usados pelo JavaScript.
 * Portal do Morador / Portal TACS público permanece fora deste escopo.
 */
:root{
  color-scheme:dark;
  --tacs-app-bg:#071827;
  --tacs-app-top:#0b263d;
  --tacs-app-card:#102d46;
  --tacs-app-card2:#153b58;
  --tacs-app-line:#2b5a76;
  --tacs-app-text:#f7fcff;
  --tacs-app-muted:#adc4d2;
  --tacs-app-accent:#83efa9;
  --tacs-app-accent2:#62c8e8;
  --tacs-app-primary:#176c94;
  --tacs-app-nav:#091e30;
  --tacs-app-shadow:0 16px 35px rgba(0,0,0,.30);
  --tacs-app-shadow-soft:0 9px 20px rgba(0,0,0,.22);
  --tacs-app-danger:#972f3d;
  --tacs-app-warning:#8a661c;
  --tacs-app-success:#176a48;

  /* aliases legados: mantêm componentes antigos coerentes sem tocar na lógica */
  --tacs-petroleo:var(--tacs-app-top);
  --tacs-petroleo-2:var(--tacs-app-primary);
  --tacs-petroleo-3:#2084ac;
  --tacs-borda:var(--tacs-app-accent2);
  --tacs-fundo:var(--tacs-app-bg);
  --tacs-superficie:var(--tacs-app-card);
  --tacs-texto:var(--tacs-app-text);
  --tacs-texto-claro:var(--tacs-app-text);
  --tacs-sucesso:var(--tacs-app-success);
  --tacs-alerta:var(--tacs-app-warning);
  --tacs-perigo:var(--tacs-app-danger);
  --tacs-raio-campo:16px;
  --tacs-raio-botao:17px;
  --tacs-raio-card:24px;
  --tacs-sombra-acao:var(--tacs-app-shadow-soft);
}

*,*::before,*::after{box-sizing:border-box}
html{
  max-width:100%;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
  background:var(--tacs-app-bg)!important;
}
body{
  margin:0!important;
  max-width:100%;
  min-height:100svh;
  overflow-x:hidden;
  color:var(--tacs-app-text)!important;
  background:
    radial-gradient(circle at 92% 3%,rgba(98,200,232,.10),transparent 25%),
    radial-gradient(circle at 8% 92%,rgba(131,239,169,.06),transparent 28%),
    linear-gradient(180deg,var(--tacs-app-top),var(--tacs-app-bg))!important;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif!important;
  font-weight:400;
  line-height:1.45;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  background:linear-gradient(180deg,rgba(255,255,255,.015),transparent 28%);
}

/* Cabeçalho institucional único */
header{
  position:relative!important;
  min-height:150px;
  padding:calc(22px + env(safe-area-inset-top)) 18px 26px 92px!important;
  overflow:hidden;
  color:var(--tacs-app-text)!important;
  background:linear-gradient(145deg,#0b263d 0%,#102d46 58%,#153b58 100%)!important;
  border:0!important;
  border-bottom:1px solid var(--tacs-app-line)!important;
  box-shadow:0 12px 30px rgba(0,0,0,.22)!important;
}
header::before{
  content:"";
  position:absolute;
  left:18px;
  bottom:18px;
  width:58px;
  height:58px;
  border-radius:50%;
  background:url('/atendimento-acs-farmaceutico/conecta-saude-homologacao/v15/assets/conecta-saude-central-canonico-2026-09-09.png?v=20260909-3') center/contain no-repeat;
  filter:none;
}
header::after{
  content:"CONECTA SAÚDE COMUNITÁRIA";
  position:absolute;
  left:88px;
  right:16px;
  bottom:36px;
  color:var(--tacs-app-accent)!important;
  font-size:.72rem;
  line-height:1.1;
  font-weight:900;
  letter-spacing:.10em;
  text-transform:uppercase;
}
header h1{
  margin:14px 0 7px!important;
  max-width:760px;
  color:#fff!important;
  font-size:clamp(1.95rem,8vw,2.85rem)!important;
  line-height:1.03!important;
  letter-spacing:-.04em!important;
  overflow-wrap:break-word;
}
header p{margin:0!important;max-width:760px;color:var(--tacs-app-muted)!important;font-size:1rem!important}
header .badge,header .seal,header .selo{
  display:inline-flex!important;
  align-items:center;
  max-width:100%;
  padding:7px 10px!important;
  border:1px solid rgba(131,239,169,.55)!important;
  border-radius:999px!important;
  background:rgba(131,239,169,.07)!important;
  color:var(--tacs-app-accent)!important;
  box-shadow:none!important;
  font-size:.72rem!important;
  font-weight:900!important;
  letter-spacing:.06em!important;
}

main{
  width:min(920px,100%)!important;
  margin:0 auto!important;
  padding:16px 13px calc(76px + env(safe-area-inset-bottom))!important;
}

h1,h2,h3,.title,.section-title{
  color:var(--tacs-app-text)!important;
  font-weight:800!important;
  letter-spacing:-.02em;
  line-height:1.13;
  overflow-wrap:break-word;
}
h2{font-size:clamp(1.3rem,5.5vw,1.7rem)!important}
h3{font-size:1.12rem!important}
p,label,.sub,.muted,.meta,small{line-height:1.42;overflow-wrap:break-word}
.muted,.sub,.meta,small{color:var(--tacs-app-muted)!important}
label{color:var(--tacs-app-text)!important;font-weight:800!important}

/* Superfícies e cards — mesma profundidade do App institucional */
.panel,.painel,.card,.box,.caixa,.area-row,.maprow,.health-card,.summary-card,.stat,.metric,.item,.cartao,.newbox,.areaEnvio,.area-control,.lock,.grupoProfissional,.saude-aparelho,.saude-vazio{
  min-width:0;
  max-width:100%;
  color:var(--tacs-app-text)!important;
  background:linear-gradient(145deg,#174765,#0c3049)!important;
  border:2px solid #69b8c0!important;
  border-radius:24px!important;
  box-shadow:0 4px 0 #062334,0 9px 18px rgba(0,27,48,.35)!important;
}
.panel,.painel,.card,.box,.caixa,.newbox{padding:17px!important;margin-bottom:15px}
.card h2,.card h3,.panel h2,.panel h3,.painel h2,.painel h3,.box h2,.caixa h1,.newbox h2,
.cartao h3,.item h3,.area-row strong,.grupoProfissionalNome strong{color:#fff!important}
.card summary>div,details summary>div:first-child,.row>*,.grid>*,.stats>*,.summary>*,.metrics>*{min-width:0}

/* Resumos e indicadores */
.resumo,.summary,.stats,.metrics,.saude-resumo{gap:10px!important}
.numero,.number,.stat,.metric,.saude-numero,.quick-card{
  min-width:0;
  color:var(--tacs-app-text)!important;
  background:linear-gradient(145deg,var(--tacs-app-card2),var(--tacs-app-card))!important;
  border:1px solid var(--tacs-app-line)!important;
  border-radius:19px!important;
  box-shadow:var(--tacs-app-shadow-soft)!important;
}
.numero strong,.number strong,.stat strong,.metric strong,.saude-numero strong{color:var(--tacs-app-accent)!important}
.numero span,.number span,.stat span,.metric span,.saude-numero span{color:var(--tacs-app-muted)!important}

/* Campos: claros por legibilidade, integrados ao tema escuro */
input,select,textarea,button,.btn,.botao{max-width:100%;font:inherit}
input:not([type="checkbox"]):not([type="radio"]),select,textarea,.field,.campo,.validadeCampo,.validadeControle{
  width:100%;
  min-width:0;
  min-height:54px;
  border:1px solid #577f98!important;
  border-radius:16px!important;
  background:#f7fbfd!important;
  color:#102d40!important;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.05)!important;
}
input:not([type="checkbox"]):not([type="radio"]),select,textarea,.field,.campo,.validadeControle{padding:11px 13px!important}
input[readonly],textarea[readonly],.field[readonly],.campo[readonly]{background:#dfeaf0!important;color:#445e6d!important}
textarea{min-height:110px;resize:vertical}
input[type="checkbox"],input[type="radio"]{accent-color:#62c8e8}
input:focus-visible,select:focus-visible,textarea:focus-visible,.field:focus-visible,.campo:focus-visible{
  outline:3px solid rgba(98,200,232,.30)!important;
  outline-offset:1px!important;
  border-color:var(--tacs-app-accent2)!important;
}

/* Botões e ações */
button,.btn,.botao{
  min-height:54px;
  border-radius:17px!important;
  font-weight:850!important;
  line-height:1.18;
  white-space:normal;
  overflow-wrap:break-word;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  transition:transform .10s ease,filter .10s ease,box-shadow .10s ease!important;
}
.btn,.botao,button[type="submit"],.primary-action,.action-primary,
button[id*="salvar"],button[id*="save"],button[class*="salvar"],button[class*="save"]{
  background:linear-gradient(180deg,#1d759b,#145574)!important;
  color:#fff!important;
  border:2px solid #69b8c0!important;
  box-shadow:0 3px 0 #062334,0 7px 15px rgba(0,0,0,.18)!important;
}
.btn.green,.botao.verde,.action-primary{
  background:linear-gradient(180deg,#1d759b,#145574)!important;
  color:#fff!important;
  border-color:#72d6bd!important;
}
.btn.gray,.botao.cinza,.botao.secundario{background:#29475a!important;border-color:#58798c!important;color:#fff!important}
.btn.red,.btn-danger,.botao.perigo,.botao.vermelho,.danger,.dangerous,.delete,.remove,.red-action{
  background:linear-gradient(180deg,#a33b48,#7e2e38)!important;
  color:#fff!important;
  border-color:#d47d86!important;
}
button:active:not(:disabled),.btn:active:not(:disabled),.botao:active:not(:disabled){transform:translateY(2px) scale(.985)!important;filter:brightness(1.08)}
button:disabled,.btn:disabled,.botao:disabled{opacity:.46!important;cursor:not-allowed!important;filter:saturate(.65)}
button:focus-visible,.btn:focus-visible,.botao:focus-visible,a:focus-visible{outline:3px solid #ffd54f!important;outline-offset:3px!important}

/* Abas */
.tabs,.abas,.login-tabs{gap:8px!important}
.tab,.aba{
  min-width:0;
  background:#0c3049!important;
  color:var(--tacs-app-muted)!important;
  border:1px solid var(--tacs-app-line)!important;
  box-shadow:none!important;
}
.tab.active,.aba.ativa,.tabs button.active,[role="tab"][aria-selected="true"]{
  background:#145574!important;
  color:#fff!important;
  border-color:#72d6bd!important;
  box-shadow:0 0 0 2px rgba(131,239,169,.10)!important;
}

/* Details/listas */
details,.cartao,.item{overflow:hidden}
details>summary,.cartao summary,.item summary,.grupoProfissional>summary{
  list-style:none;
  color:#fff!important;
  background:linear-gradient(145deg,#174765,#0c3049)!important;
  border:0!important;
}
details>summary::-webkit-details-marker,.cartao summary::-webkit-details-marker,.item summary::-webkit-details-marker{display:none}
.corpo,.body,.agendaProfissionalCorpo{
  min-width:0;
  color:var(--tacs-app-text)!important;
  background:#0b263d!important;
  border-top:1px solid var(--tacs-app-line)!important;
}
.check,.maprow{
  color:var(--tacs-app-text)!important;
  background:#102d46!important;
  border:1px solid #416985!important;
  box-shadow:none!important;
}

/* Status e avisos */
.status{
  color:var(--tacs-app-muted)!important;
  background:#0b263d!important;
  border:1px solid var(--tacs-app-line)!important;
  border-radius:16px!important;
  box-shadow:none!important;
}
.status.ok{color:#bff4d0!important;background:rgba(23,106,72,.30)!important;border-color:#458c68!important}
.status.warn,.status.aviso{color:#f4d99c!important;background:rgba(138,102,28,.28)!important;border-color:#9c7a32!important}
.status.err,.status.erro{color:#ffc1c9!important;background:rgba(151,47,61,.28)!important;border-color:#aa5966!important}
.nota,.note{
  color:#d8ebf4!important;
  background:#102d46!important;
  border:1px solid #416985!important;
  border-radius:18px!important;
  box-shadow:none!important;
}

/* Selos */
.signal,.sinal,.badge,.seal,.selo,.status-badge,.pill,.chip,.tag,.estado,.state-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  max-width:100%;
  border-radius:999px!important;
  padding:.45em .8em!important;
  line-height:1.05;
  font-weight:850!important;
}
.signal,.sinal,.pill,.chip,.tag{background:#0b263d!important;color:#dcebf3!important;border:1px solid #416985!important}
.signal.off,.sinal.inativo,.pill.off{background:#57313a!important;color:#ffd0d5!important;border-color:#85515b!important}
.sinal.ativo,.pill:not(.off){color:#c7f7d6!important}

/* Agendas: preservar controles e diferenças funcionais */
.grupoProfissional{padding:0!important}
.grupoProfissional>summary{padding:14px 15px!important}
.grupoProfissionalMeta{color:var(--tacs-app-muted)!important}
.grupoAcao{background:#0b263d!important;color:#fff!important;border:1px solid var(--tacs-app-accent2)!important}
.agendaProfissionalCorpo{padding:11px!important}
.cartao .corpo{background:#0b263d!important}
.cartao[data-chave^="NUTRICIONISTA|"] label:has(+ input[name="vagasEmergenciais"]),
.cartao[data-chave^="NUTRICIONISTA|"] input[name="vagasEmergenciais"]{display:none!important}

/* Saúde das notificações / suporte */
.saude-notificacoes,.saude-lista{color:var(--tacs-app-text)!important}
.saude-resumo .saude-numero{box-shadow:var(--tacs-app-shadow-soft)!important}
.saude-resumo button.saude-numero[data-saude-filtro="ATIVO"]{background:linear-gradient(145deg,#145d50,#0b453e)!important;border-color:#48aa91!important}
.saude-resumo button.saude-numero[data-saude-filtro="REPARO"]{background:linear-gradient(145deg,#70591d,#4d3c13)!important;border-color:#b6963b!important}
.saude-resumo button.saude-numero[data-saude-filtro="INATIVO"]{background:linear-gradient(145deg,#723640,#51262e)!important;border-color:#a65a65!important}
.saude-resumo button.saude-numero[data-saude-filtro="SEM_CONFIRMACAO"]{background:linear-gradient(145deg,#8a531e,#603912)!important;border-color:#c27a31!important}
.saude-resumo button.saude-numero[data-saude-filtro] strong,.saude-resumo button.saude-numero[data-saude-filtro] span{color:#fff!important}
.saude-meta{color:var(--tacs-app-muted)!important}

/* Tabelas */
.tablewrap{overflow:auto;border:1px solid var(--tacs-app-line)!important;border-radius:17px!important;background:#0b263d!important}
table{color:var(--tacs-app-text)!important;background:#0b263d!important}
th{background:#153b58!important;color:#fff!important}
td,th{border-color:#294b63!important}
td{color:#dcebf3!important}

/* Carregamentos de wrappers oficiais */
.carga,.loading{min-height:100svh!important;background:var(--tacs-app-bg)!important;color:#fff!important}
.carga .caixa,.loading .box{width:min(620px,calc(100% - 28px));margin:auto!important}
.erro,.error{color:#ffc1c9!important}

/* Viewer da Central: mantém o app shell sem aparência de página antiga */
.viewer{background:var(--tacs-app-bg)!important}
.viewer-bar{
  background:linear-gradient(180deg,#102d46,#0b263d)!important;
  color:#fff!important;
  border-bottom:1px solid var(--tacs-app-line)!important;
  box-shadow:0 8px 22px rgba(0,0,0,.22)!important;
}
.viewer-back{background:#145574!important;color:#fff!important;border:1px solid #69b8c0!important;border-radius:14px!important}
.viewer iframe{background:var(--tacs-app-bg)!important}

/* Componentes antigos de contraste deixam de fazer sentido no padrão canônico */
#portalTacsContrastToggleV1,#contrastToggle,#alternarContraste,.contrasteBotao,.preferenciaVisual{display:none!important}

/* Não interferir em pontes técnicas ocultas */
[hidden],.hidden,.oculto{display:none!important}
.ponte,.bridge{pointer-events:none!important}

footer,.footer{
  max-width:100%;
  padding-bottom:calc(22px + env(safe-area-inset-bottom))!important;
  color:var(--tacs-app-muted)!important;
  background:#071827!important;
  border-top:1px solid var(--tacs-app-line)!important;
  line-height:1.35;
}

@media(max-width:430px){
  header{padding-left:15px!important;padding-right:15px!important;padding-bottom:88px!important}
  header::before{left:15px;width:54px;height:54px}
  header::after{left:80px;bottom:34px;font-size:.66rem}
  main{padding-left:11px!important;padding-right:11px!important}
  .panel,.painel,.card,.box,.caixa,.newbox{padding:14px!important;border-radius:21px!important}
  button,.btn,.botao{min-height:56px}
  .card summary,.cartao summary,.item summary{align-items:flex-start!important}
  .signal,.sinal,.badge,.seal,.selo,.status-badge,.pill,.chip,.tag{white-space:normal!important;text-align:center}
  .module-grid,.health-grid{gap:9px!important}
  .module{border-radius:19px!important}
}

@media(min-width:700px){
  main{padding-top:20px!important}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
  }
}
</style>
