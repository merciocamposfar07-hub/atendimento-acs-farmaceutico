<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Conecta Saúde Comunitária — Homologação v5</title>
<style>
:root{--ink:#102033;--muted:#637486;--sheet:#f3f7fb;--paper:#fffaf3;--orange:#f47b20;--orange2:#ff9b38;--teal:#168f93;--teal2:#49ddd4;--blue:#0b4668;--soft:#dfe8ef;--danger:#d73535;--warn:#85520b;--shadow:0 22px 55px rgba(25,38,55,.16)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#07131f;color:var(--ink)}body{min-height:100svh;overflow-x:hidden}.app{min-height:100svh;background:linear-gradient(180deg,#f47b20 0,#ff8f2f 24%,#fff4e6 24.3%,#f3f7fb 100%);max-width:520px;margin:0 auto;position:relative}.header{padding:calc(env(safe-area-inset-top) + 18px) 18px 18px;color:#fff}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand h2{font-size:22px;line-height:1.02;margin:0;font-weight:950;letter-spacing:-.045em}.brand small{display:block;margin-top:3px;color:rgba(255,255,255,.84);font-weight:760}.bell{position:relative;border:0;border-radius:18px;background:rgba(255,255,255,.20);width:52px;height:52px;display:grid;place-items:center;box-shadow:inset 0 1px rgba(255,255,255,.32),0 10px 22px rgba(100,48,8,.18)}.bell svg{width:27px;height:27px}.badge{position:absolute;right:7px;top:7px;min-width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;font-size:12px;font-weight:950;display:grid;place-items:center;border:2px solid #f47b20}.sheet{margin:-8px 12px 0;background:var(--sheet);border-radius:32px 32px 0 0;min-height:calc(100svh - 112px);padding:18px 14px calc(env(safe-area-inset-bottom) + 24px);box-shadow:0 -15px 42px rgba(37,49,67,.16)}.card{background:var(--paper);border:1px solid rgba(16,32,51,.08);border-radius:28px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.title{font-size:27px;line-height:1.05;margin:0 0 9px;font-weight:950;letter-spacing:-.048em}.sub{margin:0;color:var(--muted);font-size:15.8px;line-height:1.43;font-weight:610}.progress{display:flex;gap:6px;margin:4px 0 18px}.dot{height:7px;flex:1;border-radius:99px;background:#d8e1eb}.dot.on{background:linear-gradient(90deg,#13969a,#50d9d1)}.field{margin:16px 0}.field label{display:block;text-align:left;font-size:13px;font-weight:900;color:#39485b;margin:0 0 8px}.field input,.field textarea{width:100%;border-radius:20px;border:1px solid rgba(16,32,51,.16);background:#fff;padding:0 16px;color:#102033;outline:none;box-shadow:inset 0 1px 2px rgba(16,32,51,.04);font-weight:800}.field input{height:60px;font-size:22px}.field textarea{min-height:112px;padding-top:14px;font-size:17px;line-height:1.35;resize:none}.field input:focus,.field textarea:focus{border-color:#1aaea8;box-shadow:0 0 0 4px rgba(50,212,200,.18)}.btn{width:100%;min-height:58px;border:0;border-radius:21px;background:linear-gradient(135deg,#0e677e,#0b405e);color:#fff;font-size:17px;font-weight:950;box-shadow:0 14px 28px rgba(12,66,95,.25);padding:0 16px}.btn.orange{background:linear-gradient(135deg,#ff9b38,#f47b20);box-shadow:0 14px 28px rgba(244,123,32,.28)}.btn.alt{background:#fff;color:#17324b;border:1px solid rgba(16,32,51,.12);box-shadow:none}.btn:active{transform:translateY(1px)}.row{display:flex;gap:10px}.notice{border-radius:22px;padding:14px 15px;background:#eaf7f5;border:1px solid rgba(19,133,111,.18);color:#105847;font-size:14px;line-height:1.35;font-weight:760;margin-top:12px}.warn{background:#fff4dd;border-color:rgba(244,123,32,.28);color:#835112}.errorText{color:#a92131;font-weight:900;margin:12px 0 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile,.person,.service{border:0;text-align:left;background:#fff;border-radius:24px;padding:15px;min-height:120px;box-shadow:0 12px 26px rgba(31,49,69,.08);border:1px solid rgba(16,32,51,.07);position:relative;color:#102033}.tile b,.service b{display:block;font-size:16.5px;margin-top:10px;line-height:1.05}.tile small,.service small,.person small{display:block;color:#6b7b8e;margin-top:5px;font-weight:680;line-height:1.28}.service.on{outline:3px solid rgba(50,212,200,.36);border-color:#1fb7ae}.ico,.avatar,.miniLogo{background:radial-gradient(circle at 32% 24%,#fff 0,#eefcff 15%,#6fe1d9 36%,#168f93 65%,#083e5d 100%);box-shadow:0 15px 30px rgba(25,93,111,.25),inset 0 2px 3px rgba(255,255,255,.78),inset 0 -12px 18px rgba(0,39,60,.28)}.miniLogo{width:56px;height:56px;border-radius:20px;display:grid;place-items:center;flex:none;box-shadow:0 16px 28px rgba(75,38,9,.24),0 0 0 8px rgba(255,255,255,.14),inset 0 2px 3px rgba(255,255,255,.78),inset 0 -12px 18px rgba(0,39,60,.26)}.miniLogo svg{width:37px;height:37px}.ico{width:48px;height:48px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#edf8fb);box-shadow:inset 0 1px #fff,0 8px 18px rgba(32,55,78,.1)}.ico svg{width:31px;height:31px;stroke:#0c6680}.avatar{width:62px;height:62px;border-radius:24px;display:grid;place-items:center;flex:none}.avatar svg{width:36px;height:36px}.person{display:flex;align-items:center;gap:12px;min-height:82px;width:100%;margin-bottom:10px}.person b{font-size:16px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.mini{border-radius:19px;background:#fff;border:1px solid rgba(16,32,51,.07);padding:12px}.mini span{display:block;color:#708196;font-size:12px;font-weight:850}.mini b{display:block;color:#102033;font-size:15px;margin-top:3px}.foot{font-size:12px;color:#7a8b9d;line-height:1.35;text-align:center;margin:14px 6px 0}.panel{position:fixed;inset:0;z-index:7;background:rgba(4,12,22,.38);backdrop-filter:blur(8px);display:none;align-items:flex-end}.panel.on{display:flex}.drawer{width:100%;max-height:88svh;overflow:auto;background:#f7fafc;border-radius:34px 34px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);box-shadow:0 -20px 55px rgba(5,17,31,.28)}.drawerHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.drawerHead h3{font-size:24px;line-height:1.04;margin:0;font-weight:950;letter-spacing:-.04em}.x{width:46px;height:46px;border-radius:18px;border:0;background:#fff;font-size:24px;color:#17324b}.item{background:#fff;border-radius:22px;padding:14px;margin:10px 0;border:1px solid rgba(16,32,51,.07);box-shadow:0 8px 18px rgba(31,49,69,.06)}.item b{display:block}.item small{display:block;margin-top:4px;color:#64768a;line-height:1.32;font-weight:650}.status{display:inline-flex;border-radius:999px;padding:6px 10px;background:#e8f7f4;color:#116a59;font-size:12px;font-weight:900;margin-top:9px}.splash{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 34%,rgba(255,255,255,.22),transparent 20%),linear-gradient(160deg,#ffad48 0%,#f47b20 43%,#e46017 100%);display:grid;grid-template-rows:1fr auto;align-items:center;justify-items:center;padding:calc(env(safe-area-inset-top) + 28px) 22px calc(env(safe-area-inset-bottom) + 28px);transition:opacity .46s ease,visibility .46s ease}.splash.off{opacity:0;visibility:hidden}.orbit{position:relative;width:min(82vw,370px);height:min(82vw,370px);display:grid;place-items:center}.ring{position:absolute;width:80%;height:80%;border-radius:50%;border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 0 44px rgba(255,255,255,.18),0 0 60px rgba(107,58,20,.24);animation:pulse 2.8s ease-in-out infinite}.halo{position:absolute;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,255,255,.10) 48%,transparent 72%)}.logo3d{width:144px;height:144px;border-radius:48px;background:radial-gradient(circle at 31% 22%,#fff 0,#eefcff 15%,#72e3db 35%,#168d93 61%,#083d5c 100%);display:grid;place-items:center;box-shadow:0 32px 62px rgba(70,33,6,.34),0 0 0 18px rgba(255,255,255,.12),0 0 56px rgba(255,255,255,.36),inset 0 5px 10px rgba(255,255,255,.66),inset 0 -18px 28px rgba(0,39,60,.34)}.logo3d svg{width:91px;height:91px;filter:drop-shadow(0 8px 10px rgba(0,36,60,.28))}.orb{position:absolute;width:72px;height:72px;border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(255,237,214,.86));display:grid;place-items:center;box-shadow:0 18px 36px rgba(84,42,8,.24),inset 0 1px 1px rgba(255,255,255,.8);filter:saturate(.92)}.orb svg{width:42px;height:42px;stroke:#0b506b}.o1{top:14px;left:50%;transform:translateX(-50%)}.o2{right:8px;top:45%;transform:translateY(-50%)}.o3{bottom:20px;left:50%;transform:translateX(-50%)}.o4{left:8px;top:45%;transform:translateY(-50%)}.splashText{width:min(100%,430px);text-align:center;color:#fff;text-shadow:0 3px 14px rgba(92,38,0,.32)}.splashText h1{font-size:31px;line-height:1.02;margin:0 0 12px;font-weight:950;letter-spacing:-.045em}.splashText p{font-size:16px;line-height:1.42;margin:0;color:rgba(255,255,255,.93);font-weight:720}.loader{margin:22px auto 0;width:180px;height:7px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}.loader span{display:block;width:42%;height:100%;border-radius:99px;background:#fff;animation:load 1.1s ease-in-out infinite}@keyframes load{0%{transform:translateX(-115%)}100%{transform:translateX(250%)}}@keyframes pulse{50%{transform:scale(1.035);opacity:.86}}@media(max-width:370px){.title{font-size:24px}.sheet{padding-left:10px;padding-right:10px}.grid{gap:9px}.tile{padding:13px}.splashText h1{font-size:27px}.orb{width:62px;height:62px}.logo3d{width:128px;height:128px}}
</style>
</head>
<body>
<div class="splash" id="splash" aria-label="Abertura do aplicativo"><div class="orbit"><div class="ring"></div><div class="halo"></div><div class="orb o1" data-icon="steth"></div><div class="orb o2" data-icon="pro"></div><div class="orb o3" data-icon="unit"></div><div class="orb o4" data-icon="leaf"></div><div class="logo3d" data-logo></div></div><div class="splashText"><h1>Conecta Saúde Comunitária</h1><p>Canal digital entre moradores, TACS e Unidade de Saúde para organizar avisos, campanhas, agendas, solicitações e acompanhamento da comunidade.</p><div class="loader"><span></span></div></div></div>
<main class="app"><header class="header"><div class="topline"><div class="brand"><div class="miniLogo" data-logo></div><div><h2>Conecta Saúde</h2><small>Comunidade • TACS • Unidade</small></div></div><button class="bell" id="bell" aria-label="Notificações" data-icon="bell"><span class="badge">2</span></button></div></header><section class="sheet" id="view"></section></main>
<div class="panel" id="panel"><div class="drawer"><div class="drawerHead"><h3 id="panelTitle"></h3><button class="x" id="closePanel">×</button></div><div id="panelBody"></div></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s);const view=$('#view');
const state={cpf:'',dob:'',pin:'',person:null,member:null,pending:false,service:null};
const people=[{name:'Maria de Souza',cpf:'52998224725',dob:'12/05/1988',family:'F1',area:'Sítio Japaranduba'},{name:'João de Souza',cpf:'',dob:'20/08/1986',family:'F1',area:'Sítio Japaranduba'},{name:'Ana de Souza',cpf:'',dob:'14/09/2014',family:'F1',area:'Sítio Japaranduba'}];
const icons={logo:`<svg viewBox="0 0 120 120" fill="none"><path d="M38 35c9-13 33-15 47 0" stroke="white" stroke-width="9" stroke-linecap="round"/><path d="M82 85c-10 12-35 13-48-2" stroke="white" stroke-width="9" stroke-linecap="round"/><path d="M42 61h14l7-15 12 31 8-16h14" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="61" r="6" fill="white"/><circle cx="99" cy="61" r="6" fill="white"/></svg>`,bell:`<svg viewBox="0 0 64 64" fill="none"><path d="M22 50h20M25 54c2 4 12 4 14 0M18 45h28c-5-5-5-13-5-19a9 9 0 0 0-18 0c0 6 0 14-5 19Z" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,steth:`<svg viewBox="0 0 64 64" fill="none"><path d="M20 12v15a12 12 0 0 0 24 0V12M14 12h10M40 12h10" stroke="#0b506b" stroke-width="5" stroke-linecap="round"/><path d="M32 39v5a11 11 0 0 0 22 0v-5" stroke="#0b506b" stroke-width="5" stroke-linecap="round"/><circle cx="54" cy="35" r="5" stroke="#0b506b" stroke-width="5"/></svg>`,pro:`<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="21" r="10" stroke="#0b506b" stroke-width="5"/><path d="M15 53c3-13 31-13 34 0" stroke="#0b506b" stroke-width="5" stroke-linecap="round"/><path d="M47 16l6-6M17 16l-6-6" stroke="#49a99f" stroke-width="4" stroke-linecap="round"/></svg>`,unit:`<svg viewBox="0 0 64 64" fill="none"><path d="M14 54V24l18-12 18 12v30" stroke="#0b506b" stroke-width="5" stroke-linejoin="round"/><path d="M24 54V36h16v18M24 27h16" stroke="#0b506b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,leaf:`<svg viewBox="0 0 64 64" fill="none"><path d="M52 13C31 13 15 24 15 41c0 7 5 11 12 11 18 0 25-19 25-39Z" stroke="#0b506b" stroke-width="5" stroke-linejoin="round"/><path d="M18 50c8-13 19-22 31-31" stroke="#49a99f" stroke-width="5" stroke-linecap="round"/></svg>`,calendar:`<svg viewBox="0 0 64 64" fill="none"><rect x="12" y="16" width="40" height="38" rx="8" stroke="#0c6680" stroke-width="5"/><path d="M21 10v12M43 10v12M13 28h38" stroke="#0c6680" stroke-width="5" stroke-linecap="round"/></svg>`,msg:`<svg viewBox="0 0 64 64" fill="none"><path d="M13 16h38v27H28L17 52v-9h-4V16Z" stroke="#0c6680" stroke-width="5" stroke-linejoin="round"/></svg>`,family:`<svg viewBox="0 0 64 64" fill="none"><circle cx="24" cy="22" r="8" stroke="#0c6680" stroke-width="5"/><circle cx="43" cy="25" r="7" stroke="#0c6680" stroke-width="5"/><path d="M10 53c3-14 25-14 28 0M32 53c2-9 17-10 22 0" stroke="#0c6680" stroke-width="5" stroke-linecap="round"/></svg>`,person:`<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="22" r="10" stroke="#0c6680" stroke-width="5"/><path d="M14 53c4-16 32-16 36 0" stroke="#0c6680" stroke-width="5" stroke-linecap="round"/></svg>`,send:`<svg viewBox="0 0 64 64" fill="none"><path d="M11 32l42-18-9 39-11-15-14 11 8-16-16-1Z" stroke="#0c6680" stroke-width="5" stroke-linejoin="round"/></svg>`};
function applyIcons(){document.querySelectorAll('[data-logo]').forEach(el=>el.innerHTML=icons.logo);document.querySelectorAll('[data-icon]').forEach(el=>{const name=el.getAttribute('data-icon');const badge=el.querySelector('.badge')?.outerHTML||'';el.innerHTML=(icons[name]||'')+badge;});}
function dots(n){return '<div class="progress">'+[1,2,3].map(i=>`<span class="dot ${i<=n?'on':''}"></span>`).join('')+'</div>'}
function cpfMask(v){let d=(v||'').replace(/\D/g,'').slice(0,11);return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}
function dobMask(v){let d=(v||'').replace(/\D/g,'').slice(0,8);if(d.length>4)return d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4);if(d.length>2)return d.slice(0,2)+'/'+d.slice(2);return d}
function card(html){view.innerHTML=html;applyIcons();window.scrollTo({top:0,behavior:'instant'});} 
function error(id,msg){const e=$(id);if(e)e.textContent=msg||'';}
function stepCpf(){card(`<div class="card">${dots(1)}<h1 class="title">Acesso do morador</h1><p class="sub">Digite o CPF somente quando estiver correto. A busca só acontece depois que você tocar em confirmar.</p><div class="field"><label for="cpf">CPF</label><input id="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" maxlength="14" value="${cpfMask(state.cpf)}"></div><button class="btn orange" id="cpfBtn">Confirmar CPF e continuar</button><p class="errorText" id="cpfErr"></p><div class="notice warn">Homologação segura: este teste não grava CPF, não envia SMS e não vincula seu aparelho a nenhum morador real.</div></div><p class="foot">Conecta Saúde Comunitária • v5</p>`);const input=$('#cpf');input.oninput=()=>{state.cpf=input.value.replace(/\D/g,'').slice(0,11);input.value=cpfMask(state.cpf)};$('#cpfBtn').onclick=()=>{if(state.cpf.length!==11){error('#cpfErr','Digite os 11 números do CPF.');return}const found=people.find(p=>p.cpf===state.cpf);if(found){state.person=found;state.member=found;state.pending=false;stepPin()}else stepDob()};}
function stepDob(){card(`<div class="card">${dots(2)}<h1 class="title">Confirmar nascimento</h1><p class="sub">CPF não localizado neste teste. Isso não bloqueia a solicitação. Informe a data de nascimento para continuar.</p><div class="field"><label for="dob">Data de nascimento</label><input id="dob" inputmode="numeric" autocomplete="off" placeholder="DD/MM/AAAA" maxlength="10" value="${state.dob}"></div><div class="row"><button class="btn alt" id="back">Corrigir CPF</button><button class="btn orange" id="dobBtn">Continuar</button></div><p class="errorText" id="dobErr"></p><div class="notice">Regra mantida: dado ausente ou pendente não impede o morador de solicitar atendimento.</div></div>`);const input=$('#dob');input.oninput=()=>{state.dob=dobMask(input.value);input.value=state.dob};$('#back').onclick=stepCpf;$('#dobBtn').onclick=()=>{if(!/^\d{2}\/\d{2}\/\d{4}$/.test(state.dob)){error('#dobErr','Digite a data completa.');return}const matches=people.filter(p=>p.dob===state.dob);if(matches.length){state.person={...matches[0],cpf:state.cpf};state.member=state.person;state.pending=false}else{state.person={name:'Morador em identificação',cpf:state.cpf,dob:state.dob,family:'',area:'Sítio Japaranduba'};state.member=state.person;state.pending=true}stepPin()};}
function stepPin(){card(`<div class="card">${dots(3)}<h1 class="title">Criar PIN</h1><p class="sub">Crie 4 números para acessar o aplicativo. Nesta homologação o PIN fica apenas na tela de teste.</p><div class="field"><label for="pin1">PIN</label><input id="pin1" inputmode="numeric" type="password" maxlength="4" placeholder="••••"></div><div class="field"><label for="pin2">Confirmar PIN</label><input id="pin2" inputmode="numeric" type="password" maxlength="4" placeholder="••••"></div><div class="row"><button class="btn alt" id="back">Voltar</button><button class="btn orange" id="pinBtn">Criar PIN</button></div><p class="errorText" id="pinErr"></p></div>`);$('#back').onclick=()=> state.person&&state.person.cpf?stepCpf():stepDob();$('#pinBtn').onclick=()=>{let a=$('#pin1').value.replace(/\D/g,''),b=$('#pin2').value.replace(/\D/g,'');if(a.length!==4){error('#pinErr','O PIN precisa ter 4 números.');return}if(a!==b){error('#pinErr','Os dois PINs precisam ser iguais.');return}state.pin=a;stepNotify()};}
function stepNotify(){card(`<div class="card"><h1 class="title">Notificações</h1><p class="sub">No fluxo real, o morador será orientado a ativar notificações após CPF e PIN. Aqui a autorização é apenas simulada.</p><div class="notice">Simulação: nenhum push real será enviado e nenhum aparelho será vinculado.</div><button class="btn orange" id="ok">Simular ativação e continuar</button></div>`);$('#ok').onclick=stepFamily;}
function familyMembers(){return state.person&&state.person.family==='F1'?people.filter(p=>p.family==='F1'):state.person?[state.person]:[]}
function stepFamily(){const list=familyMembers().map((p,i)=>`<button class="person" data-i="${i}"><span class="avatar" data-icon="person"></span><span><b>${p.name}</b><small>${p.dob} • ${p.area}</small></span></button>`).join('');card(`<div class="card"><h1 class="title">Família</h1><p class="sub">Escolha para quem deseja usar os serviços.</p>${state.pending?'<div class="notice warn">Cadastro em revisão administrativa. A solicitação continua liberada.</div>':''}<div style="margin-top:14px">${list}</div></div>`);document.querySelectorAll('.person[data-i]').forEach(btn=>btn.onclick=()=>{state.member=familyMembers()[Number(btn.dataset.i)];home()});}
function home(){const p=state.member||state.person;card(`<div class="card"><div class="profile"><span class="avatar" data-icon="person"></span><div><h1 class="title" style="margin-bottom:4px">${p.name}</h1><p class="sub">${p.area} • acesso do morador</p></div></div>${state.pending?'<div class="notice warn">Pendência cadastral em revisão. O pedido não fica bloqueado.</div>':''}</div><div class="grid"><button class="tile" data-go="services"><span class="ico" data-icon="send"></span><b>Solicitar atendimento</b><small>Escolher serviço e enviar pedido</small></button><button class="tile" data-go="agendas"><span class="ico" data-icon="calendar"></span><b>Agendas</b><small>Dias de atendimento da unidade</small></button><button class="tile" data-go="messages"><span class="ico" data-icon="msg"></span><b>Recados</b><small>Avisos enviados ao morador</small><span class="badge">2</span></button><button class="tile" data-go="campaigns"><span class="ico" data-icon="leaf"></span><b>Campanhas</b><small>Ações mensais de saúde</small></button><button class="tile" data-go="family"><span class="ico" data-icon="family"></span><b>Minha família</b><small>Trocar integrante familiar</small></button><button class="tile" data-go="profile"><span class="ico" data-icon="person"></span><b>Meu perfil</b><small>Dados e situação cadastral</small></button></div><p class="foot">Homologação v5 • sem gravação real</p>`);document.querySelector('[data-go="services"]').onclick=services;document.querySelector('[data-go="family"]').onclick=stepFamily;document.querySelector('[data-go="agendas"]').onclick=()=>openPanel('Agendas','<div class="item"><b>Médica</b><small>Segunda-feira • manhã • agenda editável no administrativo.</small><span class="status">exemplo</span></div><div class="item"><b>Nutricionista</b><small>Quinta-feira • manhã • sem vaga de emergência.</small><span class="status">exemplo</span></div><div class="item"><b>Dentista</b><small>Vagas comuns e emergência odontológica conforme regra da unidade.</small><span class="status">exemplo</span></div>');document.querySelector('[data-go="messages"]').onclick=()=>openPanel('Recados','<div class="item"><b>Atualização da unidade</b><small>Este é um recado demonstrativo com confirmação de recebimento.</small><span class="status">pendente</span></div><div class="item"><b>Documento pendente</b><small>Avisos importantes aparecem com sino e marcador vermelho.</small><span class="status">pendente</span></div>');document.querySelector('[data-go="campaigns"]').onclick=()=>openPanel('Campanhas','<div class="item"><b>Campanha mensal</b><small>Área para campanhas automáticas do calendário de saúde pública.</small><span class="status">homologação</span></div>');document.querySelector('[data-go="profile"]').onclick=()=>openPanel('Meu perfil',`<div class="item"><b>${p.name}</b><small>CPF: ${cpfMask(state.cpf)}<br>Nascimento: ${p.dob}<br>Área: ${p.area}</small><span class="status">${state.pending?'em revisão':'identificado'}</span></div>`);}
function services(){const p=state.member||state.person;const options=['Atendimento médico','Atendimento com enfermeira','Atendimento com nutricionista','Atendimento odontológico','Visita domiciliar do TACS','Acompanhamento do Bolsa Família'];card(`<div class="card"><h1 class="title">Solicitar atendimento</h1><p class="sub">Morador selecionado: <b>${p.name}</b>. Escolha um serviço.</p><div class="notice warn">Teste seguro: não consome vaga real e não grava solicitação na planilha.</div></div><div class="grid">${options.map((s,i)=>`<button class="service" data-s="${s}"><span class="ico" data-icon="${i===2?'leaf':i===4?'family':i===5?'msg':'steth'}"></span><b>${s}</b><small>${i===2?'Sem vaga de emergência':i===3?'Vaga comum ou urgência odontológica':'Pedido para triagem da unidade'}</small></button>`).join('')}</div><div class="card" style="margin-top:14px"><div class="field"><label for="desc">Descrição do pedido</label><textarea id="desc" placeholder="Explique seu pedido"></textarea></div><div class="row"><button class="btn alt" id="backHome">Voltar</button><button class="btn orange" id="send" disabled>Enviar teste</button></div><p class="errorText" id="svcErr"></p></div>`);let selected='';document.querySelectorAll('.service').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.service').forEach(x=>x.classList.remove('on'));btn.classList.add('on');selected=btn.dataset.s;$('#send').disabled=false});$('#backHome').onclick=home;$('#send').onclick=()=>{if(!selected){error('#svcErr','Escolha um serviço.');return}openPanel('Solicitação enviada',`<div class="item"><b>${selected}</b><small>Pedido de teste registrado somente nesta tela para ${p.name}. Nenhuma planilha real foi alterada.</small><span class="status">homologação</span></div><button class="btn orange" onclick="document.getElementById('panel').classList.remove('on');home()">Voltar ao início</button>`)};}
function openPanel(title,html){$('#panelTitle').textContent=title;$('#panelBody').innerHTML=html;$('#panel').classList.add('on');applyIcons();}
$('#closePanel').onclick=()=>$('#panel').classList.remove('on');$('#bell').onclick=()=>openPanel('Notificações','<div class="item"><b>Recado novo</b><small>Confirmação de recebimento será exigida no fluxo real.</small><span class="status">pendente</span></div><div class="item"><b>Campanha ativa</b><small>Campanhas aparecerão aqui com aviso para o morador.</small><span class="status">pendente</span></div>');
window.addEventListener('error',e=>alert('Erro visual do teste: '+e.message));
applyIcons();stepCpf();setTimeout(()=>{$('#splash')?.classList.add('off')},2300);
</script>
</body>
</html>
