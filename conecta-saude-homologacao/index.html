<style>
:root{--bg:#020812;--teal:#26ead0;--blue:#168cff;--line:#1268d8;--txt:#fff;--muted:#c7d4df;--card:#0b2439}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100svh;overflow-x:hidden;-webkit-font-smoothing:antialiased}button,input{font:inherit}.opening{min-height:100svh;background:radial-gradient(circle at 50% 25%,rgba(18,106,205,.27),transparent 36%),linear-gradient(180deg,#020812 0,#030b18 62%,#020812 100%);padding:calc(env(safe-area-inset-top) + 8px) 18px calc(env(safe-area-inset-bottom) + 138px);overflow:auto}.wrap{width:min(100%,430px);margin:0 auto}.stage{position:relative;height:clamp(390px,52svh,540px);overflow:hidden}.hex{position:absolute;left:50%;top:50%;width:98%;aspect-ratio:1;transform:translate(-50%,-50%);opacity:.95;filter:drop-shadow(0 0 16px rgba(0,118,255,.28))}.hex svg{width:100%;height:100%;overflow:visible;display:block}.logo{position:absolute;left:50%;top:50%;width:clamp(168px,48vw,232px);height:clamp(168px,48vw,232px);border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;background:radial-gradient(circle at 31% 21%,#fff 0,#d6ecff 10%,#1a447d 33%,#071e55 68%,#020716 100%);box-shadow:0 0 0 7px rgba(31,104,255,.18),0 0 0 18px rgba(11,45,98,.25),0 0 48px rgba(31,130,255,.62),inset 0 9px 18px rgba(255,255,255,.55),inset 0 -24px 38px rgba(0,3,18,.74);z-index:4}.logo svg{width:74%;height:74%;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}.orb{position:absolute;left:var(--x);top:var(--y);width:clamp(68px,18vw,92px);height:clamp(68px,18vw,92px);border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;color:white;z-index:6;will-change:transform,opacity;box-shadow:0 18px 34px rgba(0,0,0,.38),inset 0 4px 8px rgba(255,255,255,.46),inset 0 -14px 24px rgba(0,0,0,.34)}.orb:before{content:"";position:absolute;inset:6px 8px auto 8px;height:23px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.58),transparent)}.orb svg{width:54%;height:54%;position:relative;z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28))}.o1{--x:32%;--y:17%;background:radial-gradient(circle at 35% 24%,#fff,#52afff 18%,#0756cf 66%,#041847)}.o2{--x:68%;--y:17%;background:radial-gradient(circle at 35% 24%,#fff,#63ef8c 18%,#08a843 66%,#043719)}.o3{--x:91%;--y:40%;background:radial-gradient(circle at 35% 24%,#fff,#b879ff 18%,#7525dd 66%,#260858)}.o4{--x:84%;--y:64%;background:radial-gradient(circle at 35% 24%,#fff,#ff75b3 18%,#e51871 66%,#520626)}.o5{--x:64%;--y:78%;background:radial-gradient(circle at 35% 24%,#fff,#63c8ff 18%,#1685d9 66%,#06315f)}.o6{--x:36%;--y:78%;background:radial-gradient(circle at 35% 24%,#fff,#ffad4a 18%,#ff4f14 66%,#5a1406)}.o7{--x:9%;--y:63%;background:radial-gradient(circle at 35% 24%,#fff,#63fff0 18%,#03aeb8 66%,#034b5c)}.o8{--x:9%;--y:40%;background:radial-gradient(circle at 35% 24%,#fff,#ffe26c 18%,#d69600 66%,#4e3100)}.copy{text-align:center;margin-top:0}.kicker{color:var(--teal);font-size:clamp(13px,3.2vw,16px);letter-spacing:.28em;font-weight:950;margin:0 0 15px;white-space:nowrap;text-shadow:0 0 13px rgba(38,234,208,.38)}h1{font-size:clamp(37px,8.8vw,53px);line-height:1.08;letter-spacing:-.055em;margin:0 0 22px;text-align:center;text-shadow:0 4px 10px rgba(0,0,0,.72)}.lightline{height:1px;background:linear-gradient(90deg,transparent,#0b61cf 20%,#72f5ff 50%,#0b61cf 80%,transparent);position:relative;margin:0 0 24px}.lightline:after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;border-radius:50%;background:#64f7ff;box-shadow:0 0 18px #3bdfff;transform:translate(-50%,-50%)}.concepts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;align-items:center;margin:0 0 24px}.concept{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:9px;text-align:left;font-size:clamp(10px,2.75vw,13px);line-height:1.18;font-weight:650;color:#fff;min-height:42px}.concept+.concept{border-left:1px solid rgba(58,223,204,.75);padding-left:10px;margin-left:10px}.concept svg{width:37px;height:37px;filter:drop-shadow(0 0 10px rgba(34,236,208,.35))}.c1{color:#15e5b8}.c2{color:#1195ff}.c3{color:#f6b21a}.network{display:flex;justify-content:center;align-items:center;gap:clamp(11px,4vw,20px);font-size:clamp(14px,3.6vw,17px);font-weight:900;letter-spacing:.32em;margin:0 0 30px;white-space:nowrap}.network b{color:var(--teal);font-size:1.42em;letter-spacing:0;text-shadow:0 0 13px rgba(38,234,208,.55)}.access{width:100%;height:clamp(66px,8.5svh,78px);border:0;border-radius:22px;background:linear-gradient(100deg,#13e7c0,#1fcddd 45%,#168cff);box-shadow:0 18px 38px rgba(0,128,255,.32),inset 0 1px 0 rgba(255,255,255,.35);color:#06111f;font-size:clamp(22px,5vw,28px);font-weight:950;display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:20px}.access span{font-size:1.25em}.screen{min-height:100svh;background:radial-gradient(circle at 50% 0,rgba(19,82,145,.26),transparent 38%),linear-gradient(180deg,#020812,#061426);padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 96px)}.shell{width:min(100%,620px);margin:0 auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}.back{background:transparent;border:1.5px solid #2f78a7;border-radius:16px;color:white;min-height:48px;padding:0 14px;font-weight:850}.pill{border:1px solid #2f78a7;border-radius:999px;color:#9fead7;padding:8px 13px;font-size:14px;white-space:nowrap}.title{font-size:clamp(36px,8.3vw,52px);line-height:1.02;letter-spacing:-.055em;margin:0 0 16px;text-align:left}.lead{font-size:20px;line-height:1.42;color:#c3d1dc;margin:0 0 24px}.notice{background:#0c2c42;border-left:4px solid var(--teal);border-radius:16px;padding:16px 18px;color:#d7e5ef;font-size:18px;line-height:1.35;margin:14px 0 28px}.field{margin:18px 0}.field label{display:block;font-size:19px;font-weight:900;margin:0 0 10px}.field input{width:100%;height:64px;border:1.6px solid #2f78a7;border-radius:18px;background:#071d31;color:#fff;padding:0 16px;outline:none;font-size:23px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.module{border:1.5px solid #2f78a7;border-radius:24px;background:linear-gradient(160deg,#0d2d45,#07192d);color:#fff;text-align:left;box-shadow:0 14px 28px rgba(0,0,0,.22);padding:18px;min-height:128px}.module b{display:block;font-size:22px;line-height:1.05}.module small{display:block;color:#a9bbcb;font-size:16px;line-height:1.25;margin-top:7px}.footer{color:#8299ad;text-align:center;font-size:13px;margin-top:22px}@media(max-height:760px){.stage{height:370px}h1{font-size:34px;margin-bottom:16px}.kicker{font-size:12px;margin-bottom:10px}.concepts{margin-bottom:16px}.network{margin-bottom:20px}.opening{padding-bottom:120px}}@media(max-width:380px){.stage{height:340px}.logo{width:156px;height:156px}.orb{width:60px;height:60px}.concept svg{width:30px;height:30px}.concept{font-size:10px;gap:6px}.network{font-size:12px;letter-spacing:.25em}h1{font-size:31px}.kicker{font-size:10px}}
</style>

<body><div id="app"><main class="opening"><section class="wrap"><div class="stage" id="stage"><div class="hex"><svg viewBox="0 0 500 500" fill="none"><path d="M250 18 452 134v232L250 482 48 366V134L250 18Z" stroke="#1166c8" stroke-width="1.2"/><path d="M250 84 394 167v166L250 416 106 333V167L250 84Z" stroke="#136fd3" stroke-width="1"/><path d="M250 146 340 198v104L250 354 160 302V198L250 146Z" stroke="#1b78dc" stroke-width="1"/><ellipse cx="250" cy="250" rx="236" ry="188" stroke="#0c63cf" stroke-opacity=".55"/><ellipse cx="250" cy="250" rx="205" ry="163" stroke="#1d99ff" stroke-opacity=".35"/><circle cx="250" cy="18" r="4" fill="#43f5ff"/><circle cx="452" cy="134" r="4" fill="#43f5ff"/><circle cx="455" cy="365" r="4" fill="#43f5ff"/><circle cx="250" cy="482" r="4" fill="#43f5ff"/><circle cx="48" cy="366" r="4" fill="#43f5ff"/><circle cx="48" cy="134" r="4" fill="#43f5ff"/></svg></div><div class="logo"><svg viewBox="0 0 120 120" fill="none"><path d="M76 25A40 40 0 1 0 77 94" stroke="white" stroke-width="18" stroke-linecap="round"/><path d="M80 47v32M64 63h32" stroke="#5ff1dd" stroke-width="18" stroke-linecap="round"/></svg></div><div class="orb o1" data-x="32" data-y="17" data-i="0"><svg viewBox="0 0 64 64" fill="currentColor"><circle cx="24" cy="19" r="8"/><path d="M9 53c1-13 10-20 23-20 5 0 9 1 13 3v17H9Z"/><path d="M35 32 50 20l12 12v21H48V40H37v13h-6V36l4-4Z"/></svg></div><div class="orb o2" data-x="68" data-y="17" data-i="1"><svg viewBox="0 0 64 64" fill="currentColor"><circle cx="32" cy="20" r="10"/><path d="M13 56c2-16 12-25 19-25s17 9 19 25H13Z"/><path d="M19 36c0 11 4 17 13 17s13-6 13-17" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="22" cy="52" r="4"/><circle cx="42" cy="52" r="4"/></svg></div><div class="orb o3" data-x="91" data-y="40" data-i="2"><svg viewBox="0 0 64 64" fill="currentColor"><path d="M18 25h28v30H18z"/><circle cx="32" cy="22" r="11"/><path d="M18 14h28v9H18z"/><path d="M32 9v12M26 15h12" stroke="#3a0a76" stroke-width="4" stroke-linecap="round"/></svg></div><div class="orb o4" data-x="84" data-y="64" data-i="3"><svg viewBox="0 0 64 64" fill="currentColor"><circle cx="25" cy="19" r="9"/><path d="M8 54c1-14 10-22 24-22 4 0 8 1 12 3-3 4-5 9-5 14v5H8Z"/><path d="M48 55s-12-7-12-16c0-5 4-9 9-9 2 0 4 1 5 3 1-2 3-3 5-3 5 0 9 4 9 9 0 9-16 16-16 16Z"/></svg></div><div class="orb o5" data-x="64" data-y="78" data-i="4"><svg viewBox="0 0 64 64" fill="none"><path d="M20 11c6-3 9 1 12 1s6-4 12-1c8 4 8 18 3 29-3 7-4 13-9 13-4 0-3-10-6-10s-2 10-6 10c-5 0-6-6-9-13-5-11-5-25 3-29Z" fill="white"/></svg></div><div class="orb o6" data-x="36" data-y="78" data-i="5"><svg viewBox="0 0 64 64" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="35" cy="12" r="5" fill="white" stroke="none"/><path d="M33 21 23 32l12 7 9 13M34 23l11 8M24 52h28M18 41h18M25 32l-8 7"/></svg></div><div class="orb o7" data-x="9" data-y="63" data-i="6"><svg viewBox="0 0 64 64" fill="none"><path d="M40 12c-14 0-25 10-25 24v17h20v-8h8c8 0 14-7 14-16 0-10-7-17-17-17Z" fill="white"/><path d="M33 24c-5 0-9 4-9 8 0 5 4 8 9 8h2c5 0 9-3 9-8 0-4-4-8-9-8h-2Z" fill="#02aeba"/><path d="M33 26v12M26 31h6M37 31h6" stroke="white" stroke-width="2" stroke-linecap="round"/></svg></div><div class="orb o8" data-x="9" data-y="40" data-i="7"><svg viewBox="0 0 64 64" fill="currentColor"><path d="M15 39h34v14H15z"/><path d="M31 36C28 24 18 20 10 21c1 10 9 17 21 15ZM34 36c3-13 13-19 24-18-2 12-11 19-24 18Z"/></svg></div></div><div class="copy"><div class="kicker">CONECTA SAÚDE COMUNITÁRIA</div><h1>Saúde, comunidade e cuidado conectados.</h1><div class="lightline"></div><div class="concepts"><div class="concept c1"><svg viewBox="0 0 64 64" fill="currentColor"><circle cx="22" cy="20" r="8"/><circle cx="42" cy="20" r="8"/><circle cx="32" cy="16" r="9"/><path d="M7 52c1-12 9-18 21-18h8c12 0 20 6 21 18H7Z"/></svg><span>CONECTA<br>PESSOAS</span></div><div class="concept c2"><svg viewBox="0 0 64 64" fill="currentColor"><path d="M32 54S8 40 8 23c0-8 6-14 14-14 5 0 8 2 10 6 2-4 6-6 10-6 8 0 14 6 14 14 0 17-24 31-24 31Z"/><path d="M16 33h10l4-10 8 20 5-10h7" stroke="#021225" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>PROMOVE<br>SAÚDE</span></div><div class="concept c3"><svg viewBox="0 0 64 64" fill="currentColor"><path d="M8 29 32 9l24 20v26H16V34H8v-5Z"/><path d="M32 29v16M24 37h16" stroke="#021225" stroke-width="5" stroke-linecap="round"/></svg><span>FORTALECE<br>A COMUNIDADE</span></div></div><div class="network"><span>TACS</span><b>+</b><span>COMUNIDADE</span><b>+</b><span>UNIDADE</span></div><button class="access" id="access">Acessar conta <span>›</span></button></div></section></main></div><script>
const app=document.getElementById('app');let raf=0;function ease(x){return x<0?0:x>1?1:(1-Math.cos(Math.PI*x))/2}function animate(){if(raf)cancelAnimationFrame(raf);const stage=document.getElementById('stage'),nodes=[...document.querySelectorAll('.orb')];let start=performance.now();function tick(now){const r=stage.getBoundingClientRect(),cx=r.width/2,cy=r.height/2,rx=r.width*.42,ry=r.height*.36;let ph=((now-start)%9000)/9000;nodes.forEach(n=>{const bx=Number(n.dataset.x)/100*r.width,by=Number(n.dataset.y)/100*r.height,base=Math.atan2((by-cy)/ry,(bx-cx)/rx);let a=base,rad=1,op=1,sc=1;if(ph<.16){rad=ease(ph/.16);op=rad;sc=.18+.82*rad}else if(ph<.56){a=base+Math.sin((ph-.16)/.40*Math.PI*2)*.035;sc=1+.018*Math.sin(now/500+Number(n.dataset.i))}else if(ph<.80){a=base+((ph-.56)/.24)*Math.PI*2}else{let q=ease((ph-.80)/.20);a=base+Math.PI*2;rad=1-q;op=1-q;sc=1-.82*q}let x=cx+Math.cos(a)*rx*rad,y=cy+Math.sin(a)*ry*rad;n.style.opacity=op.toFixed(3);n.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) scale(${sc})`});raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)}function screen(t,l,b){if(raf)cancelAnimationFrame(raf);app.innerHTML=`<main class="screen"><div class="shell"><div class="top"><button class="back" id="back">‹ Voltar</button><span class="pill">Homologação</span></div><h1 class="title">${t}</h1><p class="lead">${l}</p>${b}<p class="footer">Ambiente de teste: nenhum CPF, vaga, SMS ou vínculo real é gravado.</p></div></main>`;document.getElementById('back').onclick=()=>location.reload()}document.getElementById('access').onclick=()=>screen('Acessar conta','Fluxo único do Conecta Saúde Comunitária: morador, TACS, profissional da unidade e administrador entram no mesmo app.',`<div class="field"><label>CPF</label><input inputmode="numeric" placeholder="000.000.000-00"></div><button class="access" onclick="roles()">Confirmar CPF</button>`);window.roles=()=>screen('Perfil de teste','Na versão real, o perfil vem das permissões do cadastro. Aqui é apenas homologação visual.',`<div class="grid"><button class="module" onclick="home('Morador')"><b>Morador</b><small>Família, solicitações, recados e campanhas</small></button><button class="module" onclick="home('TACS')"><b>TACS</b><small>Área, moradores e solicitações</small></button><button class="module" onclick="home('Profissional da unidade')"><b>Profissional da unidade</b><small>Agendas, vagas e serviços</small></button><button class="module" onclick="home('Administrador')"><b>Administrador</b><small>Painéis administrativos completos</small></button></div>`);window.home=(r)=>screen('Conecta Saúde Comunitária',`Perfil aberto: ${r}. App único, módulos por permissão.`,`<div class="notice">Homologação segura. Não grava dados reais.</div><div class="grid"><button class="module"><b>Moradores</b><small>Cadastro e atualização</small></button><button class="module"><b>Recados e campanhas</b><small>Avisos da área</small></button><button class="module"><b>Agendas e vagas</b><small>Dias, horários e situação</small></button><button class="module"><b>Profissionais e serviços</b><small>Equipe da unidade</small></button></div>`);animate();
</script></body></html>
