<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020812">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Conecta Saúde Comunitária — Abertura v19</title>
<style>
:root{--bg:#020812;--green:#20e2c5;--blue:#168cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
.page{position:fixed;inset:0;background:
  radial-gradient(circle at 50% 28%,rgba(0,108,255,.16),transparent 32%),
  linear-gradient(180deg,#020812 0%,#020916 55%,#020812 100%);
  display:flex;align-items:center;justify-content:center}
.poster{position:relative;width:min(100vw,calc(100svh * .5628));aspect-ratio:941/1672;max-height:100svh;overflow:hidden;background:
  radial-gradient(circle at 52% 31%,rgba(10,88,173,.17),transparent 28%);
  transform:translateZ(0)}

/* ABERTURA CANÔNICA — imagem aprovada como estado visual final.
   Movimento: 8 pictogramas saem juntos do C+, completam uma volta,
   retornam juntos ao C+ e o ciclo recomeça. */
.tracks{position:absolute;left:0;top:0;width:100%;height:58.6%;z-index:1;overflow:visible;opacity:0;animation:tracksIn .65s .20s ease-out forwards}
.tracks path,.tracks polyline{fill:none;vector-effect:non-scaling-stroke}
.hexA{stroke:#1477f3;stroke-width:1.3;opacity:.72}
.hexB{stroke:#0f62ce;stroke-width:1.1;opacity:.47}
.hexC{stroke:#0c53b3;stroke-width:1;opacity:.38}
.orbit{stroke:#1a87ff;stroke-width:1.25;opacity:.56}
.spark{stroke:#80f6ff;stroke-width:2.1;stroke-linecap:round;stroke-dasharray:2.5 27;opacity:.96;filter:drop-shadow(0 0 6px #31cfff);animation:spark 3.1s linear infinite}
@keyframes tracksIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes spark{to{stroke-dashoffset:-148}}

.logoHalo{position:absolute;left:52.07%;top:32.06%;width:42%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);z-index:2;background:radial-gradient(circle,rgba(12,122,255,.25),rgba(8,68,145,.11) 55%,transparent 73%);filter:blur(3px);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.72;transform:translate(-50%,-50%) scale(.98)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.035)}}
.logo{position:absolute;left:52.07%;top:32.06%;width:38.1%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.74);opacity:0;z-index:5;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(0,0,0,.42));animation:logoIn .80s .06s cubic-bezier(.2,.82,.2,1) forwards}
@keyframes logoIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.72)}66%{opacity:1;transform:translate(-50%,-50%) scale(1.035)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}

.pic{position:absolute;left:52.07%;top:32.06%;width:14.4%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.18);opacity:0;z-index:6;will-change:transform,opacity;pointer-events:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.34))}
.pic img{display:block;width:100%;height:100%;object-fit:contain}
#p7,#p8{width:14.1%}

.lower{position:absolute;inset:0;z-index:9;pointer-events:none}
.lower>*{opacity:0;transform:translateY(10px);animation:lowerIn .55s cubic-bezier(.22,.8,.25,1) forwards}
.kicker{position:absolute;left:5%;right:5%;top:55.00%;text-align:center;color:#27e4ca;font-weight:820;letter-spacing:.285em;font-size:clamp(11px,2.65vw,18px);white-space:nowrap;text-shadow:0 0 9px rgba(39,228,202,.28);animation-delay:.82s}
.title{position:absolute;left:10.2%;right:8.5%;top:58.05%;font-size:clamp(33px,6.65vw,47px);line-height:1.06;letter-spacing:-.046em;font-weight:900;text-align:left;text-shadow:0 4px 10px rgba(0,0,0,.45);animation-delay:.96s}
.divider{position:absolute;left:6.2%;right:6.2%;top:70.75%;height:1.4px;background:linear-gradient(90deg,transparent,#1574db 18%,#75f5ff 50%,#1574db 82%,transparent);box-shadow:0 0 10px rgba(52,203,255,.42);animation-delay:1.08s}
.divider:after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;background:#eaffff;transform:translate(-50%,-50%);box-shadow:0 0 5px #fff,0 0 15px #35deff,0 0 22px #168cff}
.concepts{position:absolute;left:5.7%;right:5.7%;top:73.45%;display:grid;grid-template-columns:1fr 1fr 1.18fr;align-items:center;animation-delay:1.18s}
.concept{min-height:54px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:7px;padding:0 11px;text-align:left;font-size:clamp(9px,2.2vw,13px);line-height:1.17;color:#fff}
.concept:first-child{padding-left:0}
.concept+.concept{border-left:1px solid rgba(69,221,202,.72)}
.concept svg{width:clamp(34px,7.0vw,45px);height:clamp(34px,7.0vw,45px)}
.network{position:absolute;left:7%;right:7%;top:81.55%;display:flex;align-items:center;justify-content:center;gap:clamp(10px,3.5vw,22px);font-size:clamp(10px,2.45vw,15px);letter-spacing:.34em;white-space:nowrap;animation-delay:1.30s}
.network b{color:#28e4c8;font-size:1.5em;letter-spacing:0}
.cta{position:absolute;left:7.2%;right:7.2%;top:87.00%;height:7.0%;border:0;border-radius:999px;background:linear-gradient(100deg,#16e9c3 0%,#1bcfdd 52%,#168cff 100%);box-shadow:0 14px 28px rgba(0,124,255,.22),inset 0 1px 0 rgba(255,255,255,.42);font-size:clamp(22px,4.8vw,31px);font-weight:900;color:#06111e;display:flex;align-items:center;justify-content:center;gap:12px;animation-delay:1.42s;pointer-events:auto}
.cta:active{transform:scale(.985)}
.cta span{font-size:1.36em;line-height:1}
@keyframes lowerIn{to{opacity:1;transform:translateY(0)}}

.access{display:none;position:absolute;inset:0;background:linear-gradient(180deg,#020812,#07182c);z-index:30;padding:calc(env(safe-area-inset-top) + 28px) 24px}
.access.on{display:block}
.access h2{font-size:40px;margin:0 0 14px}
.access p{color:#c0cfda;font-size:19px;line-height:1.4}
.back{height:58px;border-radius:18px;border:1px solid #2e78a6;background:#0c2b43;color:#fff;font-weight:800;font-size:18px;padding:0 18px}
@media(max-width:380px){.title{font-size:31px}.concept{gap:4px;padding:0 7px}.network{font-size:9.7px;gap:8px}.kicker{font-size:10.5px}}
</style>
</head>
<body>
<main class="page">
<section class="poster" id="poster" aria-label="Abertura Conecta Saúde Comunitária">
  <svg class="tracks" viewBox="0 0 941 980" preserveAspectRatio="none" aria-hidden="true">
    <polyline class="hexA" points="490,52 821,259 821,724 490,937 90,724 90,306 490,52"/>
    <polyline class="hexB" points="490,105 760,270 760,680 490,850 152,680 152,330 490,105"/>
    <polyline class="hexC" points="490,160 676,275 676,625 490,760 240,625 240,370 490,160"/>
    <path class="orbit" d="M88 540 C90 292 250 105 490 78 C735 105 835 292 835 540 C835 760 706 900 490 944 C265 908 95 755 88 540"/>
    <path class="spark" d="M88 540 C90 292 250 105 490 78 C735 105 835 292 835 540 C835 760 706 900 490 944 C265 908 95 755 88 540"/>
  </svg>
  <div class="logoHalo"></div>
  <img class="logo" id="logo" src="" alt="Símbolo Conecta Saúde Comunitária">
  <div class="pic" id="p1"><img src="" alt="Morador"></div>
  <div class="pic" id="p2"><img src="" alt="Profissional médico"></div>
  <div class="pic" id="p3"><img src="" alt="Enfermagem"></div>
  <div class="pic" id="p4"><img src="" alt="Cuidado"></div>
  <div class="pic" id="p5"><img src="" alt="Saúde bucal"></div>
  <div class="pic" id="p6"><img src="" alt="Atividade física"></div>
  <div class="pic" id="p7"><img src="" alt="Saúde mental"></div>
  <div class="pic" id="p8"><img src="" alt="Nutrição"></div>

  <div class="lower">
    <div class="kicker">CONECTA SAÚDE COMUNITÁRIA</div>
    <div class="title">Saúde, comunidade e<br>cuidado conectados.</div>
    <div class="divider"></div>
    <div class="concepts">
      <div class="concept"><svg viewBox="0 0 64 64" fill="#24e1c1"><circle cx="21" cy="23" r="9"/><circle cx="43" cy="23" r="9"/><circle cx="32" cy="16" r="9"/><path d="M5 54c1-12 7-18 16-18s15 6 16 18zm22 0c1-12 7-18 16-18s15 6 16 18z"/></svg><span>CONECTA<br>PESSOAS</span></div>
      <div class="concept"><svg viewBox="0 0 64 64"><path d="M32 55C16 43 8 34 8 22c0-9 7-15 15-15 5 0 9 2 13 7 4-5 8-7 13-7 8 0 15 6 15 15 0 12-8 21-32 33z" fill="#159cff"/><path d="M13 31h12l4-10 7 20 5-10h12" fill="none" stroke="#061526" stroke-width="4"/></svg><span>PROMOVE<br>SAÚDE</span></div>
      <div class="concept"><svg viewBox="0 0 64 64" fill="#f5aa15"><path d="M6 31 32 9l26 22-5 6-4-4v22H15V33l-4 4z"/><path d="M32 31v16M24 39h16" fill="none" stroke="#08121d" stroke-width="5" stroke-linecap="round"/></svg><span>FORTALECE<br>A COMUNIDADE</span></div>
    </div>
    <div class="network"><span>TACS</span><b>+</b><span>COMUNIDADE</span><b>+</b><span>UNIDADE</span></div>
    <button class="cta" id="cta">Acessar conta <span>›</span></button>
  </div>

  <section class="access" id="access">
    <h2>Acessar conta</h2>
    <p>Entrada única do Conecta Saúde Comunitária. O perfil e os módulos são definidos pelas permissões do cadastro.</p>
    <button class="back" id="back">‹ Voltar</button>
  </section>
</section>
</main>
<script src="v15/assets/central.js"></script>
<script src="v15/assets/pictos.js"></script>
<script>
(() => {
  const A=window.CS_ASSETS||{};
  document.getElementById("logo").src=A.central||"";
  const sources=[A.home,A.doc,A.nurse,A.care,A.tooth,A.run,A.brain,A.leaf];
  sources.forEach((src,i)=>document.querySelector("#p"+(i+1)+" img").src=src||"");
  const poster=document.getElementById('poster');
  const pics=[...Array(8)].map((_,i)=>document.getElementById('p'+(i+1)));
  const vectors=[
    [-176,-325],
    [133,-325],
    [331,-116],
    [309,113],
    [120,278],
    [-157,278],
    [-345,112],
    [-371,-115]
  ];
  const REF_W=941, REF_H=1672;
  const CYCLE=8200;
  let start=performance.now();
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const easeOutCubic=t=>1-Math.pow(1-t,3);
  const easeInCubic=t=>t*t*t;
  const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  function animate(now){
    const rect=poster.getBoundingClientRect();
    const sx=rect.width/REF_W, sy=rect.height/REF_H;
    let p=((now-start)%CYCLE)/CYCLE;
    let radial=0, alpha=0, rot=0, baseScale=.18;
    if(p<.15){
      const t=easeOutCubic(p/.15);
      radial=t; alpha=clamp(t*1.25,0,1); rot=0; baseScale=.18+.82*t;
    } else if(p<.72){
      const t=easeInOut((p-.15)/.57);
      radial=1; alpha=1; rot=t*Math.PI*2; baseScale=1;
    } else if(p<.84){
      const t=easeInCubic((p-.72)/.12);
      radial=1-t; alpha=1-t; rot=Math.PI*2+t*.42; baseScale=1-.80*t;
    } else {
      radial=0; alpha=0; rot=0; baseScale=.18;
    }
    const c=Math.cos(rot), s=Math.sin(rot);
    pics.forEach((el,i)=>{
      const dx=vectors[i][0], dy=vectors[i][1];
      const rx=(dx*c-dy*s)*sx*radial;
      const ry=(dx*s+dy*c)*sy*radial;
      const depth=1 + (Math.sin(rot + i*.78)*.025*radial);
      const sc=baseScale*depth;
      el.style.opacity=alpha.toFixed(3);
      el.style.transform=`translate(-50%,-50%) translate3d(${rx.toFixed(2)}px,${ry.toFixed(2)}px,0) scale(${sc.toFixed(3)})`;
    });
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
  document.getElementById('cta').onclick=()=>document.getElementById('access').classList.add('on');
  document.getElementById('back').onclick=()=>document.getElementById('access').classList.remove('on');
})();
</script>
</body>
</html>
