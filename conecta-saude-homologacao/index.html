<!doctype html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no'>
<meta name='theme-color' content='#020812'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'>
<title>Conecta Saúde Comunitária — v12</title>
<style>
:root{--bg:#020812;--ink:#fff;--muted:#b7c6d4;--teal:#22e6cc;--blue:#168cff;--card:#0b243a;--line:#2e78a9;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}body{min-height:100svh;overflow-x:hidden;-webkit-font-smoothing:antialiased}button,input{font:inherit}.opening{min-height:100svh;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 10px) 18px calc(env(safe-area-inset-bottom) + 110px);background:radial-gradient(circle at 50% 25%,rgba(22,116,220,.23),transparent 36%),linear-gradient(180deg,#020812 0,#030b18 62%,#020812 100%)}.wrap{width:min(100%,440px);margin:0 auto}.stage{position:relative;width:100%;height:clamp(390px,54svh,520px);margin:0 auto 10px}.hex,.hex2,.hex3{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(96vw,430px);height:min(96vw,430px);opacity:.78}.hex:before,.hex2:before,.hex3:before{content:'';position:absolute;inset:0;border:1.2px solid rgba(38,127,255,.30);border-radius:18%;clip-path:polygon(50% 0,92% 25%,92% 75%,50% 100%,8% 75%,8% 25%);box-shadow:0 0 30px rgba(15,104,232,.20)}.hex2{width:min(75vw,335px);height:min(75vw,335px);opacity:.62}.hex3{width:min(55vw,250px);height:min(55vw,250px);opacity:.55}.track{position:absolute;left:50%;top:50%;width:min(98vw,430px);height:min(98vw,430px);border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(32,126,235,.28);box-shadow:0 0 45px rgba(13,90,220,.18) inset}.track:after{content:'';position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 32deg,rgba(0,204,255,.82) 38deg,transparent 48deg,transparent 138deg,rgba(0,204,255,.60) 144deg,transparent 154deg,transparent 260deg,rgba(255,191,98,.8) 266deg,transparent 276deg,transparent);animation:lightSpin 6.8s linear infinite;filter:blur(.25px)}.spark{position:absolute;width:10px;height:10px;border-radius:50%;background:#36e8ff;box-shadow:0 0 16px #36e8ff}.s1{left:49%;top:3%}.s2{right:12%;top:20%}.s3{right:6%;top:45%}.s4{left:15%;bottom:17%}.s5{left:50%;bottom:5%}.logo{position:absolute;left:50%;top:50%;width:clamp(174px,47vw,224px);height:clamp(174px,47vw,224px);border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;background:radial-gradient(circle at 31% 22%,#fff 0,#d6f1ff 10%,#1c4a86 33%,#071f59 68%,#020716 100%);box-shadow:0 0 0 8px rgba(35,105,255,.14),0 0 0 20px rgba(11,45,98,.25),0 0 56px rgba(39,143,255,.68),inset 0 9px 20px rgba(255,255,255,.56),inset 0 -26px 40px rgba(0,3,20,.74);z-index:5}.logo svg{width:75%;height:75%;filter:drop-shadow(0 8px 13px rgba(0,0,0,.55))}.node{position:absolute;left:50%;top:50%;width:clamp(58px,16vw,78px);height:clamp(58px,16vw,78px);border-radius:50%;display:grid;place-items:center;z-index:4;will-change:transform,opacity;box-shadow:0 18px 34px rgba(0,0,0,.42),inset 0 4px 8px rgba(255,255,255,.50),inset 0 -14px 24px rgba(0,0,0,.34)}.node:before{content:'';position:absolute;left:14%;right:14%;top:8%;height:30%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.62),transparent)}.node svg{width:58%;height:58%;position:relative;z-index:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28))}.home{background:radial-gradient(circle at 35% 24%,#fff,#5fc4ff 16%,#0762d5 66%,#041847)}.doctor{background:radial-gradient(circle at 35% 24%,#fff,#65f18d 16%,#08aa4c 66%,#03381a)}.nurse{background:radial-gradient(circle at 35% 24%,#fff,#b879ff 16%,#7525dd 66%,#260858)}.heart{background:radial-gradient(circle at 35% 24%,#fff,#ff75b3 16%,#e51871 66%,#520626)}.tooth{background:radial-gradient(circle at 35% 24%,#fff,#63c8ff 16%,#1685d9 66%,#06315f)}.run{background:radial-gradient(circle at 35% 24%,#fff,#ffad4a 16%,#ff4f14 66%,#5a1406)}.head{background:radial-gradient(circle at 35% 24%,#fff,#63fff0 16%,#03aeb8 66%,#034b5c)}.leaf{background:radial-gradient(circle at 35% 24%,#fff,#ffe26c 16%,#d69600 66%,#4e3100)}@keyframes lightSpin{to{transform:rotate(360deg)}}.copy{text-align:center}.kicker{color:var(--teal);letter-spacing:.31em;font-size:clamp(11px,2.9vw,14px);font-weight:950;margin:2px 0 14px}.title{font-size:clamp(38px,9vw,52px);line-height:1.04;letter-spacing:-.055em;font-weight:950;margin:0 0 22px;text-shadow:0 8px 18px rgba(0,0,0,.45)}.line{height:1px;background:linear-gradient(90deg,transparent,#147ad8 22%,#4befff 50%,#147ad8 78%,transparent);position:relative;margin:0 0 22px}.line:after{content:'';position:absolute;left:50%;top:50%;width:15px;height:15px;border-radius:50%;background:#48efff;box-shadow:0 0 20px #48efff;transform:translate(-50%,-50%)}.features{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;align-items:center;margin-bottom:22px}.feat{min-height:56px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:9px;text-align:left;padding:0 8px;border-left:1px solid rgba(56,224,207,.62)}.feat:first-child{border-left:0;padding-left:0}.feat:last-child{padding-right:0}.feat svg{width:38px;height:38px;filter:drop-shadow(0 0 9px rgba(49,221,255,.38))}.feat span{font-size:clamp(10px,2.75vw,13px);line-height:1.16;color:#edf5fa;text-transform:uppercase}.network{display:flex;justify-content:center;align-items:center;gap:15px;color:#fff;letter-spacing:.38em;font-size:clamp(12px,3vw,15px);font-weight:850;margin-bottom:28px}.network b{color:var(--teal);font-size:26px;letter-spacing:0}.btn{width:100%;height:70px;border:0;border-radius:25px;background:linear-gradient(100deg,#18e7c3,#20c5df 48%,#168cff);box-shadow:0 18px 38px rgba(15,123,236,.34);color:#06111f;font-size:24px;font-weight:950}.btn:active{transform:translateY(1px)}.screen{min-height:100svh;background:radial-gradient(circle at 50% 0,rgba(19,82,145,.26),transparent 38%),linear-gradient(180deg,#020812,#061426);padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 96px)}.shell{width:min(100%,620px);margin:0 auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}.brand h2{font-size:23px;line-height:1.08;margin:0;font-weight:900}.brand small{display:block;color:var(--muted);font-size:16px;margin-top:3px}.pill{border:1px solid var(--line);border-radius:999px;color:#9fead7;padding:8px 13px;font-size:14px;white-space:nowrap}.notice{background:#0c2c42;border-left:4px solid var(--teal);border-radius:16px;padding:16px 18px;color:#d7e5ef;font-size:18px;line-height:1.35;margin:14px 0 28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.module{border:1.5px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#0d2d45,#07192d);color:#fff;text-align:left;box-shadow:0 14px 28px rgba(0,0,0,.22);min-height:142px;padding:17px}.module b{display:block;font-size:21px;line-height:1.08}.module small{display:block;color:var(--muted);font-size:16px;line-height:1.25;margin-top:7px}.ico{width:50px;height:50px;border-radius:18px;background:#0e3552;display:grid;place-items:center;margin-bottom:16px;color:var(--teal);font-size:27px}.field{margin:18px 0}.field label{display:block;font-size:19px;font-weight:900;margin-bottom:10px}.field input{width:100%;height:64px;border:1.6px solid var(--line);border-radius:18px;background:#071d31;color:#fff;padding:0 16px;outline:none;font-size:23px;font-weight:800}.back{background:transparent;border:1.5px solid var(--line);border-radius:16px;color:white;min-height:48px;padding:0 14px;font-weight:850}@media(max-width:390px){.stage{height:385px}.title{font-size:37px}.btn{height:64px}.feat{gap:7px}.feat svg{width:32px;height:32px}.network{gap:10px;letter-spacing:.31em}.logo{width:174px;height:174px}.node{width:62px;height:62px}}@media(max-height:760px){.stage{height:355px}.logo{width:158px;height:158px}.node{width:58px;height:58px}.title{font-size:34px}.kicker{font-size:10px;margin-bottom:10px}.features{margin-bottom:15px}.network{margin-bottom:16px}.btn{height:60px}}
</style>
</head>
<body><div id='app'></div>
<script>
const app=document.getElementById('app');
const icon={logo:`<svg viewBox='0 0 120 120' fill='none'><path d='M77 24A40 40 0 1 0 77 96' stroke='white' stroke-width='19' stroke-linecap='round'/><path d='M80 48v32M64 64h32' stroke='#5ff1dd' stroke-width='18' stroke-linecap='round'/></svg>`,home:`<svg viewBox='0 0 64 64' fill='white'><circle cx='24' cy='18' r='8'/><path d='M10 52c2-13 25-13 28 0H10Z'/><path d='M30 35 45 23l15 12h-6v19H37V35h-7Z'/></svg>`,doctor:`<svg viewBox='0 0 64 64' fill='white'><circle cx='32' cy='17' r='8'/><path d='M18 31c4 6 24 6 28 0 7 4 10 13 10 25H8c0-12 3-21 10-25Z'/><path d='M20 36v8a9 9 0 0 0 18 0v-8h-6v8a3 3 0 0 1-6 0v-8h-6Zm25 1a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z'/></svg>`,nurse:`<svg viewBox='0 0 64 64' fill='white'><path d='M19 10h26l4 11H15l4-11Zm10 3h6v3h3v5h-3v3h-6v-3h-3v-5h3v-3Z'/><circle cx='32' cy='31' r='9'/><path d='M13 56c2-15 36-15 38 0H13Z'/></svg>`,heart:`<svg viewBox='0 0 64 64' fill='white'><circle cx='24' cy='18' r='9'/><path d='M8 53c2-17 30-17 33 0H8Z'/><path d='M44 28c-5-7-16-1-12 8 3 7 12 12 12 12s9-5 12-12c4-9-7-15-12-8Z'/></svg>`,tooth:`<svg viewBox='0 0 64 64' fill='white'><path d='M20 10c6-3 9 1 12 1s6-4 12-1c9 4 9 18 3 31-3 7-4 13-9 13-4 0-3-11-6-11s-2 11-6 11c-5 0-6-6-9-13-6-13-6-27 3-31Z'/></svg>`,run:`<svg viewBox='0 0 64 64' fill='white'><circle cx='39' cy='13' r='6'/><path d='M30 21h14l7 10-6 4-5-7h-6l8 9-9 20h-8l7-16-7-7-8 8-5-5 11-13c2-2 4-3 7-3Z'/><path d='M12 57h40v4H12z'/></svg>`,head:`<svg viewBox='0 0 64 64' fill='white'><path d='M31 8C18 8 9 18 9 31c0 8 4 15 11 19v6h23v-9c7-4 12-10 12-19C55 16 45 8 31 8Zm5 15a10 10 0 1 1-12 16 10 10 0 0 1 12-16Z'/><path d='M28 29h8v4h-8z' fill='#22e6cc'/></svg>`,leaf:`<svg viewBox='0 0 64 64' fill='white'><path d='M11 42c18-1 34-12 42-30 4 19-7 39-31 40H11V42Z'/><path d='M17 48c10-11 21-19 33-28' stroke='#fff' stroke-width='5' stroke-linecap='round' fill='none'/></svg>`,people:`<svg viewBox='0 0 64 64' fill='#22e6cc'><circle cx='31' cy='18' r='9'/><circle cx='13' cy='25' r='7'/><circle cx='50' cy='25' r='7'/><path d='M12 55c2-16 36-16 39 0H12Z'/><path d='M2 55c1-10 17-12 22-5v5H2Zm38 0v-5c6-7 22-5 23 5H40Z'/></svg>`,pulse:`<svg viewBox='0 0 64 64'><path d='M32 56S8 42 8 23C8 11 23 7 32 18 41 7 56 11 56 23c0 19-24 33-24 33Z' fill='#168cff'/><path d='M14 33h10l5-10 8 19 5-9h8' stroke='#06111f' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>`,unit:`<svg viewBox='0 0 64 64' fill='#ffbf28'><path d='M8 30 32 10l24 20v25H39V41H25v14H8V30Z'/><path d='M32 22v20M22 32h20' stroke='#06111f' stroke-width='5' stroke-linecap='round'/></svg>`};
function openScreen(){app.innerHTML=`<main class='opening'><div class='wrap'><section class='stage' id='stage'><div class='track'></div><div class='hex'></div><div class='hex2'></div><div class='hex3'></div><i class='spark s1'></i><i class='spark s2'></i><i class='spark s3'></i><i class='spark s4'></i><i class='spark s5'></i><div class='logo'>${icon.logo}</div><div class='node home' data-x='34' data-y='13'>${icon.home}</div><div class='node doctor' data-x='68' data-y='14'>${icon.doctor}</div><div class='node nurse' data-x='90' data-y='37'>${icon.nurse}</div><div class='node heart' data-x='84' data-y='64'>${icon.heart}</div><div class='node tooth' data-x='63' data-y='82'>${icon.tooth}</div><div class='node run' data-x='32' data-y='80'>${icon.run}</div><div class='node head' data-x='11' data-y='56'>${icon.head}</div><div class='node leaf' data-x='10' data-y='34'>${icon.leaf}</div></section><section class='copy'><div class='kicker'>CONECTA SAÚDE COMUNITÁRIA</div><h1 class='title'>Saúde, comunidade e cuidado conectados.</h1><div class='line'></div><div class='features'><div class='feat'>${icon.people}<span>CONECTA<br>PESSOAS</span></div><div class='feat'>${icon.pulse}<span>PROMOVE<br>SAÚDE</span></div><div class='feat'>${icon.unit}<span>FORTALECE<br>A COMUNIDADE</span></div></div><div class='network'><span>TACS</span><b>+</b><span>COMUNIDADE</span><b>+</b><span>UNIDADE</span></div><button class='btn' id='start'>Acessar conta ›</button></section></div></main>`;document.getElementById('start').onclick=access;animateOrbit();}
function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}
function animateOrbit(){const stage=document.getElementById('stage'),nodes=[...document.querySelectorAll('.node')];let t0=performance.now();function frame(now){const rect=stage.getBoundingClientRect(),cx=rect.width/2,cy=rect.height/2,cycle=((now-t0)%11800)/11800;let k=1,rot=0,op=1;if(cycle<.15){k=ease(cycle/.15);op=k}else if(cycle<.76){k=1;rot=0}else if(cycle<.88){let q=ease((cycle-.76)/.12);k=1-q;rot=q*210;op=1-q*.85}else{let q=ease((cycle-.88)/.12);k=q;rot=(1-q)*210;op=q}nodes.forEach((n,i)=>{let fx=(+n.dataset.x/100)*rect.width-cx,fy=(+n.dataset.y/100)*rect.height-cy;let a=Math.atan2(fy,fx)+rot*Math.PI/180;let r=Math.hypot(fx,fy)*k;let x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;n.style.opacity=op;n.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) scale(${.25+.75*k})`;});requestAnimationFrame(frame)}requestAnimationFrame(frame)}
function access(){app.innerHTML=`<main class='screen'><div class='shell'><div class='top'><div class='brand'><h2>Conecta Saúde Comunitária</h2><small>App único por perfil</small></div><span class='pill'>Homologação</span></div><div class='notice'>Ambiente de teste: não grava CPF, não envia SMS e não vincula aparelho a morador real.</div><div class='field'><label>CPF</label><input inputmode='numeric' placeholder='000.000.000-00'></div><button class='btn' onclick='profiles()'>Confirmar CPF e continuar</button></div></main>`}
function profiles(){app.innerHTML=`<main class='screen'><div class='shell'><div class='top'><div class='brand'><h2>Escolha o perfil de teste</h2><small>O app é um só. O painel muda conforme permissão.</small></div></div><div class='grid'><button class='module' onclick='home("Morador")'><div class='ico'>👤</div><b>Morador</b><small>Família, recados, campanhas, agendas, serviços e perfil.</small></button><button class='module' onclick='home("TACS")'><div class='ico'>🧭</div><b>TACS</b><small>Área, moradores, solicitações e acompanhamento comunitário.</small></button><button class='module' onclick='home("Profissional")'><div class='ico'>🩺</div><b>Profissional da unidade</b><small>Agenda, vagas, atendimentos e serviços vinculados.</small></button><button class='module' onclick='home("Administrador")'><div class='ico'>⚙️</div><b>Administrador</b><small>Todos os painéis administrativos do projeto.</small></button></div></div></main>`}
function home(role){const admin=['Moradores','Suporte aos moradores','Recados e campanhas','Agendas e vagas','Profissionais e serviços','TACS e áreas','Municípios e organizações','Portal do Morador'];const mor=['Minha família','Recados','Campanhas','Agendas','Serviços','Profissionais','Meu Perfil'];const pro=['Minha agenda','Vagas','Atendimentos','Serviços da unidade'];const tacs=['Solicitações da área','Moradores da microárea','Recados','Campanhas','Acompanhamento'];let list=role==='Administrador'?admin:role==='Morador'?mor:role==='Profissional'?pro:tacs;app.innerHTML=`<main class='screen'><div class='shell'><button class='back' onclick='profiles()'>‹ Voltar</button><div class='top'><div class='brand'><h2>Painel ${role}</h2><small>Conecta Saúde Comunitária</small></div><span class='pill'>${role}</span></div><div class='grid'>${list.map(x=>`<button class='module'><div class='ico'>•</div><b>${x}</b><small>Módulo preservado para homologação.</small></button>`).join('')}</div></div></main>`}
openScreen();
</script>
</body>
</html>
