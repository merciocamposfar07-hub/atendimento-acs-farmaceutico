<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#020812'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'><title>Conecta Saúde Comunitária — v8</title><style>:root{--bg:#020812;--bg2:#061429;--card:#0b2338;--line:#2f78a7;--txt:#fff;--muted:#a9bbcb;--teal:#26ead0;--blue:#168cff;--danger:#ff4b6e;--shadow:0 26px 65px rgba(0,0,0,.44)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif}body{min-height:100svh;overflow-x:hidden;-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}.opening{min-height:100svh;padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 118px);display:flex;flex-direction:column;justify-content:flex-start;background:radial-gradient(circle at 50% 29%,rgba(22,116,220,.25),transparent 36%),linear-gradient(180deg,#020812 0,#030b18 62%,#020812 100%);overflow:hidden}.stage{position:relative;width:min(100%,430px);height:clamp(365px,48svh,470px);margin:0 auto 8px;display:grid;place-items:center}.rings{position:absolute;width:min(88vw,420px);height:min(88vw,420px);border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 59px,rgba(65,145,235,.25) 60px 61px,transparent 62px 118px);opacity:.8}.rings:before,.rings:after{content:'';position:absolute;inset:12%;border-radius:50%;border:1px solid rgba(39,136,255,.28);box-shadow:0 0 28px rgba(18,104,230,.18)}.rings:after{inset:27%}.mainLogo{position:absolute;width:182px;height:182px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 31% 22%,#fff 0,#bfdfff 10%,#163e79 34%,#08205a 67%,#030a1a 100%);box-shadow:0 0 0 8px rgba(35,105,255,.14),0 0 0 20px rgba(11,45,98,.25),0 0 48px rgba(39,143,255,.62),inset 0 8px 18px rgba(255,255,255,.56),inset 0 -24px 36px rgba(0,3,20,.72);z-index:3;animation:logoIn .65s ease-out both}.mainLogo svg{width:132px;height:132px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}.orb{position:absolute;left:50%;top:50%;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:#fff;opacity:0;box-shadow:0 18px 34px rgba(0,0,0,.38),inset 0 4px 8px rgba(255,255,255,.46),inset 0 -14px 23px rgba(0,0,0,.34);z-index:2;animation:emerge 2.2s cubic-bezier(.18,.86,.22,1) forwards;animation-delay:var(--d)}.orb:before{content:'';position:absolute;inset:6px 8px auto 8px;height:22px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent)}.orb svg{width:42px;height:42px;position:relative;z-index:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.26))}.o1{--l:50%;--t:4%;--d:.12s;background:radial-gradient(circle at 35% 24%,#fff,#58afff 18%,#0756cf 66%,#041847)}.o2{--l:79%;--t:15%;--d:.18s;background:radial-gradient(circle at 35% 24%,#fff,#ffbf5d 18%,#e59b00 66%,#4e3200)}.o3{--l:95%;--t:43%;--d:.24s;background:radial-gradient(circle at 35% 24%,#fff,#63fff0 18%,#03aeb8 66%,#034b5c)}.o4{--l:82%;--t:70%;--d:.30s;background:radial-gradient(circle at 35% 24%,#fff,#ffad4a 18%,#ff4f14 66%,#5a1406)}.o5{--l:50%;--t:86%;--d:.36s;background:radial-gradient(circle at 35% 24%,#fff,#63c8ff 18%,#1685d9 66%,#06315f)}.o6{--l:18%;--t:72%;--d:.42s;background:radial-gradient(circle at 35% 24%,#fff,#ff75b3 18%,#e51871 66%,#520626)}.o7{--l:5%;--t:44%;--d:.48s;background:radial-gradient(circle at 35% 24%,#fff,#b879ff 18%,#7525dd 66%,#260858)}.o8{--l:20%;--t:17%;--d:.54s;background:radial-gradient(circle at 35% 24%,#fff,#ff8fc0 18%,#df176d 66%,#460723)}@keyframes logoIn{from{transform:scale(.74);opacity:.0}to{transform:scale(1);opacity:1}}@keyframes emerge{0%{left:50%;top:50%;transform:translate(-50%,-50%) scale(.12);opacity:0}30%{left:50%;top:50%;transform:translate(-50%,-50%) scale(.48);opacity:.9}74%{left:var(--l);top:var(--t);transform:translate(-50%,-50%) scale(1.08);opacity:1}100%{left:var(--l);top:var(--t);transform:translate(-50%,-50%) scale(1);opacity:1}}.copy{width:min(100%,440px);margin:0 auto;text-align:left}.kicker{color:var(--teal);letter-spacing:.31em;font-size:12px;font-weight:950;margin:0 0 15px}.copy h1{font-size:clamp(35px,8vw,47px);line-height:1.08;letter-spacing:-.055em;margin:0 0 18px}.concepts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin:0 0 20px;color:#dbe6ee}.concept{text-align:center;border-left:1px solid rgba(112,172,222,.52);font-size:14px;line-height:1.25}.concept:first-child{border-left:0;text-align:left}.concept:last-child{text-align:right}.miniico{height:25px;margin-top:10px;color:#45d8ff}.network{text-align:center;color:#9fe3d0;letter-spacing:.29em;font-size:12px;font-weight:850;margin:0 0 28px}.btn{width:100%;min-height:64px;border:0;border-radius:22px;background:linear-gradient(100deg,#19e0bd,#21c5de 48%,#168cff);color:#06111f;font-size:21px;font-weight:950;box-shadow:0 16px 34px rgba(12,116,211,.32);padding:0 18px}.btn:active{transform:translateY(1px)}.screen{min-height:100svh;background:radial-gradient(circle at 50% 0,rgba(19,82,145,.26),transparent 38%),linear-gradient(180deg,#020812,#061426);padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 96px)}.shell{width:min(100%,620px);margin:0 auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}.brand h2{font-size:23px;line-height:1.08;margin:0;font-weight:900;letter-spacing:-.03em}.brand small{display:block;color:var(--muted);font-size:16px;margin-top:3px}.pill{border:1px solid var(--line);border-radius:999px;color:#9fead7;padding:8px 13px;font-size:14px;white-space:nowrap}.notice{background:#0c2c42;border-left:4px solid var(--teal);border-radius:16px;padding:16px 18px;color:#d7e5ef;font-size:18px;line-height:1.35;margin:14px 0 28px}.title{font-size:clamp(38px,8.4vw,52px);line-height:1.02;letter-spacing:-.055em;margin:0 0 16px}.lead{font-size:21px;line-height:1.42;color:#c3d1dc;margin:0 0 24px}.card{border:1.5px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#0d2c44,#07192d);box-shadow:var(--shadow);padding:20px;margin:0 0 18px}.field{margin:18px 0}.field label{display:block;font-size:19px;font-weight:900;margin:0 0 10px}.field input,.field textarea{width:100%;border:1.6px solid var(--line);border-radius:18px;background:#071d31;color:#fff;padding:0 16px;outline:none}.field input{height:66px;font-size:24px;font-weight:800}.field textarea{min-height:126px;padding-top:14px;font-size:19px;line-height:1.35;resize:none}.field input:focus,.field textarea:focus{box-shadow:0 0 0 4px rgba(32,224,192,.16);border-color:#29d7cd}.warn{color:#ffd371;font-weight:800;font-size:17px;line-height:1.4;margin-top:14px}.err{color:#ff8fa0;font-weight:900;font-size:17px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.module,.person,.service{border:1.5px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#0d2d45,#07192d);color:#fff;text-align:left;box-shadow:0 14px 28px rgba(0,0,0,.22)}.module{min-height:150px;padding:18px}.moduleIcon,.personIcon,.serviceIcon{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;margin-bottom:18px;box-shadow:inset 0 2px 4px rgba(255,255,255,.35),inset 0 -10px 16px rgba(0,0,0,.32),0 10px 22px rgba(0,0,0,.26);background:radial-gradient(circle at 35% 24%,#fff,#63c8ff 18%,#1685d9 66%,#06315f)}.moduleIcon svg,.personIcon svg,.serviceIcon svg{width:32px;height:32px}.module b,.service b{display:block;font-size:22px;line-height:1.05}.module small,.service small,.person small{display:block;color:var(--muted);font-size:16px;line-height:1.25;margin-top:7px}.person{width:100%;display:flex;align-items:center;gap:14px;padding:15px;margin-bottom:12px}.personIcon{margin-bottom:0;flex:none}.person b{font-size:20px}.service{width:100%;min-height:110px;padding:18px;display:flex;align-items:center;gap:14px}.serviceIcon{margin-bottom:0;flex:none}.service.on{border-color:var(--teal);box-shadow:0 0 0 4px rgba(32,224,192,.15),0 14px 28px rgba(0,0,0,.22)}.row{display:flex;gap:12px}.row .btn{min-height:60px}.footer{color:#8299ad;text-align:center;font-size:13px;margin-top:22px}.back{background:transparent;border:1.5px solid var(--line);border-radius:16px;color:white;min-height:48px;padding:0 14px;font-weight:850}.panel{position:fixed;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(10px);display:none;align-items:flex-end;z-index:9}.panel.on{display:flex}.drawer{width:100%;max-height:86svh;overflow:auto;background:#071426;border:1px solid #173e5b;border-radius:28px 28px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 22px);box-shadow:0 -24px 50px rgba(0,0,0,.46)}.drawerHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.drawerHead h3{font-size:28px;line-height:1.05;margin:0}.x{width:48px;height:48px;border-radius:16px;border:1px solid var(--line);background:#0b2237;color:#fff;font-size:28px}.item{border:1px solid #2d6f99;border-radius:18px;background:#0b2237;padding:15px;margin:10px 0}.item b{display:block;font-size:18px}.item small{display:block;color:var(--muted);margin-top:5px;font-size:16px;line-height:1.35}.status{display:inline-flex;border-radius:999px;padding:7px 11px;background:rgba(32,224,192,.14);color:#9cebd9;font-size:13px;font-weight:900;margin-top:10px}.profileBtns{display:grid;gap:12px}.profileBtns .module{min-height:auto}.roleTag{display:inline-block;border-radius:999px;border:1px solid #2d6f99;padding:5px 10px;color:#9fead7;font-size:12px;margin-top:12px;font-weight:900}@media(max-width:380px){.opening{padding-left:16px;padding-right:16px}.stage{height:360px;min-height:340px}.orb{width:62px;height:62px}.orb svg{width:36px;height:36px}.mainLogo{width:158px;height:158px}.mainLogo svg{width:113px;height:113px}.copy h1{font-size:33px}.title{font-size:36px}.lead{font-size:19px}.module{min-height:136px;padding:16px}.module b{font-size:21px}.grid{gap:11px}.concept{font-size:12px}.network,.kicker{font-size:11px}.btn{min-height:60px}}</style></head><body><div id='app'></div><div class='panel' id='panel'><div class='drawer'><div class='drawerHead'><h3 id='panelTitle'></h3><button class='x' id='closePanel'>×</button></div><div id='panelBody'></div></div></div><script>const app=document.getElementById('app'),panel=document.getElementById('panel'),panelTitle=document.getElementById('panelTitle'),panelBody=document.getElementById('panelBody');const st={cpf:'',pin:'',role:'morador',person:{name:'João de Souza',local:'Sítio Japaranduba'}};const icons={logo:`<svg viewBox='0 0 120 120' fill='none'><path d='M76 25A40 40 0 1 0 77 94' stroke='white' stroke-width='18' stroke-linecap='round'/><path d='M80 47v32M64 63h32' stroke='#5ff1dd' stroke-width='18' stroke-linecap='round'/></svg>`,tooth:`<svg viewBox='0 0 64 64' fill='none'><path d='M20 11c6-3 9 1 12 1s6-4 12-1c8 4 8 18 3 29-3 7-4 13-9 13-4 0-3-10-6-10s-2 10-6 10c-5 0-6-6-9-13-5-11-5-25 3-29Z' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/></svg>`,run:`<svg viewBox='0 0 64 64' fill='none'><circle cx='37' cy='12' r='5' fill='white'/><path d='M29 21l11 8-7 9 11 12M28 24l-8 8M32 38l-10 13' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/></svg>`,mind:`<svg viewBox='0 0 64 64' fill='none'><path d='M18 49V38c-8-4-8-23 8-29 13-5 28 4 28 18 0 9-6 17-15 20' stroke='white' stroke-width='5' stroke-linecap='round'/><path d='M27 29c-1-7 11-8 10 0 5-1 7 8 0 9H27c-7-1-5-10 0-9Z' stroke='white' stroke-width='4' stroke-linejoin='round'/></svg>`,leaf:`<svg viewBox='0 0 64 64' fill='none'><path d='M11 42c24 4 37-10 43-28-24-2-39 9-43 28Z' stroke='white' stroke-width='5' stroke-linejoin='round'/><path d='M16 42c12-12 23-18 34-23' stroke='white' stroke-width='5' stroke-linecap='round'/></svg>`,doctor:`<svg viewBox='0 0 64 64' fill='none'><circle cx='32' cy='18' r='10' fill='white'/><path d='M14 54c3-13 10-20 18-20s15 7 18 20' fill='white'/><path d='M24 37v8M40 37v8M21 48h22' stroke='#072052' stroke-width='4' stroke-linecap='round'/></svg>`,nurse:`<svg viewBox='0 0 64 64' fill='none'><path d='M17 21h30v10c0 10-7 18-15 18s-15-8-15-18V21Z' fill='white'/><path d='M20 16h24v9H20z' fill='white'/><path d='M32 17v7M28 20h8' stroke='#072052' stroke-width='3' stroke-linecap='round'/><path d='M14 56c4-8 11-12 18-12s14 4 18 12' fill='white'/></svg>`,heart:`<svg viewBox='0 0 64 64' fill='none'><circle cx='27' cy='18' r='9' fill='white'/><path d='M13 54c3-13 9-20 17-20 3 0 6 1 8 3' stroke='white' stroke-width='7' stroke-linecap='round'/><path d='M45 34c5-6 15 1 8 10l-8 8-8-8c-7-9 3-16 8-10Z' stroke='white' stroke-width='5' stroke-linejoin='round'/></svg>`,family:`<svg viewBox='0 0 64 64' fill='none'><circle cx='32' cy='20' r='8' fill='currentColor'/><circle cx='17' cy='27' r='6' fill='currentColor' opacity='.82'/><circle cx='47' cy='27' r='6' fill='currentColor' opacity='.82'/><path d='M20 54c3-12 8-18 12-18s9 6 12 18M5 54c2-8 6-13 12-13M59 54c-2-8-6-13-12-13' stroke='currentColor' stroke-width='6' stroke-linecap='round'/></svg>`,home:`<svg viewBox='0 0 64 64' fill='none'><path d='M11 31L32 13l21 18v21H38V39H26v13H11V31Z' fill='currentColor'/></svg>`,bell:`<svg viewBox='0 0 64 64' fill='none'><path d='M22 50h20M25 54c2 4 12 4 14 0M18 45h28c-5-5-5-13-5-19a9 9 0 0 0-18 0c0 6 0 14-5 19Z' stroke='currentColor' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/></svg>`,cal:`<svg viewBox='0 0 64 64' fill='none'><path d='M13 17h38v35H13z' stroke='currentColor' stroke-width='5'/><path d='M13 27h38M22 11v11M42 11v11' stroke='currentColor' stroke-width='5' stroke-linecap='round'/></svg>`,map:`<svg viewBox='0 0 64 64' fill='none'><path d='M12 18l13-5 14 5 13-5v33l-13 5-14-5-13 5V18Z' stroke='currentColor' stroke-width='5' stroke-linejoin='round'/><path d='M25 13v33M39 18v33' stroke='currentColor' stroke-width='5'/></svg>`,user:`<svg viewBox='0 0 64 64' fill='none'><circle cx='32' cy='22' r='12' fill='currentColor'/><path d='M12 56c4-14 12-21 20-21s16 7 20 21' fill='currentColor'/></svg>`,support:`<svg viewBox='0 0 64 64' fill='none'><path d='M32 12a18 18 0 0 0-18 18v8h8V28a10 10 0 0 1 20 0v10h8v-8A18 18 0 0 0 32 12Z' fill='currentColor'/><path d='M25 48h8c8 0 14-5 16-12' stroke='currentColor' stroke-width='5' stroke-linecap='round'/></svg>`};function putIcons(){document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=icons[e.dataset.i]||icons.user)}function splash(){app.innerHTML=`<section class='opening'><div class='stage'><div class='rings'></div><div class='orb o1' data-i='tooth'></div><div class='orb o2' data-i='leaf'></div><div class='orb o3' data-i='doctor'></div><div class='orb o4' data-i='run'></div><div class='orb o5' data-i='user'></div><div class='orb o6' data-i='heart'></div><div class='orb o7' data-i='mind'></div><div class='orb o8' data-i='nurse'></div><div class='mainLogo'>${icons.logo}</div></div><div class='copy'><div class='kicker'>CONECTA SAÚDE COMUNITÁRIA</div><h1>Saúde, comunidade e cuidado conectados.</h1><div class='concepts'><div class='concept'>CONECTA<br>PESSOAS<div class='miniico'>${icons.family}</div></div><div class='concept'>PROMOVE<br>SAÚDE<div class='miniico'>${icons.leaf}</div></div><div class='concept'>FORTALECE<br>A COMUNIDADE<div class='miniico'>${icons.home}</div></div></div><div class='network'>TACS + COMUNIDADE + UNIDADE</div><button class='btn' id='start'>Começar ›</button></div></section>`;putIcons();document.getElementById('start').onclick=access}function shell(title,lead,body,back){app.innerHTML=`<section class='screen'><div class='shell'><div class='top'><button class='back' id='back'>‹ Voltar</button><span class='pill'>Homologação v8</span></div><h1 class='title'>${title}</h1><p class='lead'>${lead}</p>${body}<p class='footer'>Teste seguro: não grava CPF, não envia SMS e não vincula aparelho a morador real.</p></div></section>`;document.getElementById('back').onclick=back||splash;putIcons()}function access(err){shell('Acesso do app','Um único app. O perfil liberado define se a pessoa entra como morador, TACS, profissional da unidade ou administrador.',`<div class='card'><div class='field'><label>CPF</label><input id='cpf' inputmode='numeric' maxlength='14' placeholder='000.000.000-00' value='${st.cpf}'></div><div class='field'><label>PIN</label><input id='pin' inputmode='numeric' maxlength='4' type='password' placeholder='••••'></div><div class='warn'>Nesta homologação, use qualquer CPF visual e PIN de 4 números.</div>${err?`<div class='err'>${err}</div>`:''}<button class='btn' id='go'>Confirmar e continuar</button></div>`,splash);document.getElementById('cpf').oninput=e=>{let d=e.target.value.replace(/\D/g,'').slice(0,11);e.target.value=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');st.cpf=e.target.value};document.getElementById('go').onclick=()=>{let p=document.getElementById('pin').value.replace(/\D/g,'');if(p.length!==4)return access('O PIN precisa ter 4 números.');st.pin=p;profiles()}}function profiles(){shell('Escolha o perfil de teste','No uso real, essa escolha virá das permissões do cadastro. Aqui aparece para homologar o app único.',`<div class='profileBtns'><button class='module' data-role='morador'><div class='moduleIcon' data-i='user'></div><b>Morador</b><small>Recados, campanhas, família, agenda, serviços e perfil.</small></button><button class='module' data-role='tacs'><div class='moduleIcon' data-i='map'></div><b>TACS</b><small>Solicitações da área, moradores, visitas e avisos da comunidade.</small></button><button class='module' data-role='profissional'><div class='moduleIcon' data-i='doctor'></div><b>Profissional da unidade</b><small>Agenda, vagas, atendimentos e serviços vinculados.</small></button><button class='module' data-role='admin'><div class='moduleIcon' data-i='support'></div><b>Administrador</b><small>Painéis administrativos completos do projeto.</small></button></div>`,access);putIcons();document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{st.role=b.dataset.role;home()})}const moduleSets={morador:[['cal','Agendas','Dias, horários e vagas'],['doctor','Profissionais','Equipe da unidade'],['support','Serviços','Solicitações'],['bell','Campanhas','Ações de saúde'],['bell','Recados','Avisos da unidade'],['user','Meu perfil','Dados e família']],tacs:[['map','Minha área','Moradores e microárea'],['support','Solicitações','Demandas recebidas'],['cal','Agenda da unidade','Dias e vagas'],['bell','Recados','Avisos para moradores'],['heart','Campanhas','Acompanhamento comunitário'],['user','Famílias','Vínculos familiares']],profissional:[['cal','Minha agenda','Dias, horários e vagas'],['support','Atendimentos','Solicitações vinculadas'],['doctor','Serviços','Cadastro profissional'],['bell','Avisos','Comunicação da unidade']],admin:[['user','Moradores','Buscar, cadastrar e atualizar moradores da área'],['support','Suporte aos moradores','Diagnosticar aparelhos e orientar reparos sem alterar vínculos existentes'],['bell','Recados e campanhas','Publicar informações e acompanhar avisos da área'],['cal','Agendas e vagas','Dias, horários, vagas e situação dos atendimentos'],['doctor','Profissionais e serviços','Cadastro e disponibilidade dos profissionais da unidade'],['map','TACS e áreas','Cadastro territorial, agentes e novas áreas'],['map','Municípios e organizações','Estrutura global e vínculo das áreas'],['home','Portal do Morador','Abrir portal público da área selecionada']]};function roleName(){return st.role==='admin'?'Administrador':st.role==='tacs'?'TACS':st.role==='profissional'?'Profissional da unidade':'Morador'}function home(){let mods=moduleSets[st.role].map(m=>`<button class='module' onclick='openPanel(${JSON.stringify(m[1])})'><div class='moduleIcon' data-i='${m[0]}'></div><b>${m[1]}</b><small>${m[2]}</small>${st.role==='admin'&&m[1].includes('TACS')?'<span class=roleTag>Administrador</span>':''}</button>`).join('');app.innerHTML=`<section class='screen'><div class='shell'><div class='top'><div class='brand'><h2>Conecta Saúde Comunitária</h2><small>${st.person.name} • ${st.person.local}</small></div><span class='pill'>${roleName()}</span></div><div class='notice'>Ambiente de teste: nenhuma vaga real será consumida, nenhum Push real será enviado e nenhum vínculo real será alterado.</div><h1 class='title'>Como podemos ajudar?</h1><div class='grid'>${mods}</div><button class='btn' style='margin-top:20px' onclick='profiles()'>Trocar perfil de teste</button></div></section>`;putIcons()}function openPanel(t){panelTitle.textContent=t;panelBody.innerHTML=`<div class='item'><b>${t}</b><small>Módulo presente no app único Conecta Saúde Comunitária. Nesta homologação visual, a tela confirma a navegação e preserva dados reais.</small><span class='status'>Teste funcional</span></div>`;panel.classList.add('on')}document.getElementById('closePanel').onclick=()=>panel.classList.remove('on');splash();</script></body></html>
