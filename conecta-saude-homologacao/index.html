<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020812">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Conecta Saúde Comunitária — abertura canônica v10</title>
<style>
:root{--bg:#020812;--bg2:#061426;--card:#0b2338;--line:#2f78a7;--txt:#fff;--muted:#b8c7d5;--teal:#21e8cc;--blue:#158bff;--warn:#ffd371;--shadow:0 25px 60px rgba(0,0,0,.44)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100svh;overflow-x:hidden;-webkit-font-smoothing:antialiased}button,input{font:inherit}
.opening{min-height:100svh;padding:calc(env(safe-area-inset-top) + 10px) 18px calc(env(safe-area-inset-bottom) + 122px);background:radial-gradient(circle at 50% 27%,rgba(20,118,230,.24),transparent 37%),linear-gradient(180deg,#020812 0,#030b18 60%,#020812 100%);overflow:auto}.stage{position:relative;width:min(100%,430px);height:clamp(375px,48svh,455px);margin:0 auto 14px;display:grid;place-items:center}.hex{position:absolute;width:min(92vw,430px);height:min(92vw,430px);opacity:.72}.hex svg{width:100%;height:100%;overflow:visible}.hex path{fill:none;stroke:#126fc8;stroke-width:1.1;opacity:.38;filter:drop-shadow(0 0 8px rgba(30,140,255,.35))}.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#39dfff;box-shadow:0 0 14px #39dfff;animation:spark 5.4s linear infinite}.s1{left:48%;top:4%}.s2{right:8%;top:24%;animation-delay:-1.1s}.s3{left:13%;bottom:24%;animation-delay:-2.6s}.s4{right:23%;bottom:8%;animation-delay:-3.9s}@keyframes spark{50%{opacity:.25;transform:scale(.7)}100%{transform:scale(1)}}.central{position:absolute;width:190px;height:190px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 22%,#fff 0,#c4e8ff 11%,#173c73 35%,#071f58 66%,#030a1a 100%);box-shadow:0 0 0 8px rgba(34,111,255,.15),0 0 0 22px rgba(12,50,105,.28),0 0 52px rgba(37,143,255,.62),inset 0 8px 19px rgba(255,255,255,.58),inset 0 -24px 38px rgba(0,3,20,.74);z-index:3}.central svg{width:136px;height:136px;filter:drop-shadow(0 9px 14px rgba(0,0,0,.48))}.orb{position:absolute;left:50%;top:50%;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;opacity:0;z-index:2;will-change:transform,opacity;box-shadow:0 18px 36px rgba(0,0,0,.38),inset 0 4px 9px rgba(255,255,255,.50),inset 0 -15px 24px rgba(0,0,0,.35)}.orb:before{content:"";position:absolute;left:9px;right:9px;top:6px;height:24px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.58),transparent)}.orb svg{width:45px;height:45px;position:relative;z-index:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28))}.home{background:radial-gradient(circle at 35% 24%,#fff,#65c6ff 17%,#0d6ede 65%,#05265a)}.doctor{background:radial-gradient(circle at 35% 24%,#fff,#70f49d 17%,#08a947 65%,#053b1d)}.nurse{background:radial-gradient(circle at 35% 24%,#fff,#b982ff 17%,#6f29d9 65%,#27085a)}.care{background:radial-gradient(circle at 35% 24%,#fff,#ff80bb 17%,#de1a73 65%,#520629)}.tooth{background:radial-gradient(circle at 35% 24%,#fff,#67caff 17%,#1683d9 65%,#07315f)}.run{background:radial-gradient(circle at 35% 24%,#fff,#ffb25f 17%,#f05a16 65%,#5a1605)}.brain{background:radial-gradient(circle at 35% 24%,#fff,#6dfff0 17%,#05aeb9 65%,#064854)}.leaf{background:radial-gradient(circle at 35% 24%,#fff,#ffe16a 17%,#d49a00 65%,#4e3300)}.copy{width:min(100%,430px);margin:0 auto;text-align:left}.kicker{color:var(--teal);letter-spacing:.30em;font-size:clamp(11px,2.9vw,14px);font-weight:950;margin:0 0 15px}.headline{font-size:clamp(36px,8.4vw,49px);line-height:1.08;letter-spacing:-.055em;margin:0 0 22px;font-weight:950}.rule{height:1px;background:linear-gradient(90deg,transparent,#159cff 22%,#e9fdff 50%,#159cff 78%,transparent);margin:0 0 18px;position:relative}.rule:after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:#dffcff;box-shadow:0 0 18px #2acaff;transform:translate(-50%,-50%)}.triad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:center;margin:0 0 18px}.triad>div{display:flex;align-items:center;justify-content:center;gap:8px;border-left:1px solid rgba(36,221,206,.7);min-height:48px}.triad>div:first-child{border-left:0;justify-content:flex-start}.triad>div:last-child{justify-content:flex-end}.triad svg{width:32px;height:32px;flex:none}.triad span{font-size:clamp(10px,2.8vw,13px);line-height:1.15;color:#edf8ff}.network{text-align:center;color:#dbe8f1;letter-spacing:.35em;font-size:clamp(11px,2.9vw,13px);font-weight:700;margin:0 0 30px}.network b{color:var(--teal);font-weight:950}.btn{width:100%;min-height:68px;border:0;border-radius:24px;background:linear-gradient(100deg,#18e2bf,#20cbe0 50%,#158cff);color:#06111f;font-size:22px;font-weight:950;box-shadow:0 17px 36px rgba(12,116,211,.34);padding:0 20px}.btn:active{transform:translateY(1px)}
.screen{min-height:100svh;background:radial-gradient(circle at 50% 0,rgba(19,82,145,.25),transparent 38%),linear-gradient(180deg,#020812,#061426);padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 96px)}.shell{width:min(100%,620px);margin:0 auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}.brand h2{font-size:23px;line-height:1.08;margin:0;font-weight:900;letter-spacing:-.03em}.brand small{display:block;color:var(--muted);font-size:16px;margin-top:3px}.pill{border:1px solid var(--line);border-radius:999px;color:#9fead7;padding:8px 13px;font-size:14px;white-space:nowrap}.notice{background:#0c2c42;border-left:4px solid var(--teal);border-radius:16px;padding:16px 18px;color:#d7e5ef;font-size:18px;line-height:1.35;margin:14px 0 26px}.title{font-size:clamp(36px,8.4vw,52px);line-height:1.02;letter-spacing:-.055em;margin:0 0 16px}.lead{font-size:20px;line-height:1.42;color:#c3d1dc;margin:0 0 22px}.card,.module,.person,.service{border:1.5px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#0d2c44,#07192d);box-shadow:var(--shadow);color:#fff}.card{padding:20px;margin:0 0 18px}.field{margin:18px 0}.field label{display:block;font-size:19px;font-weight:900;margin:0 0 10px}.field input{width:100%;height:64px;border:1.6px solid var(--line);border-radius:18px;background:#071d31;color:#fff;padding:0 16px;outline:none;font-size:23px;font-weight:800}.field input:focus{box-shadow:0 0 0 4px rgba(32,224,192,.16);border-color:#29d7cd}.warn{color:var(--warn);font-weight:800;font-size:17px;line-height:1.4;margin-top:14px}.err{color:#ff8fa0;font-weight:900;font-size:17px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.module{min-height:140px;padding:17px;text-align:left}.module b,.service b{display:block;font-size:21px;line-height:1.08}.module small,.service small,.person small{display:block;color:var(--muted);font-size:16px;line-height:1.25;margin-top:7px}.moduleIcon,.personIcon,.serviceIcon{width:50px;height:50px;border-radius:18px;display:grid;place-items:center;margin-bottom:16px;background:radial-gradient(circle at 35% 24%,#fff,#63c8ff 18%,#1685d9 66%,#06315f);box-shadow:inset 0 2px 4px rgba(255,255,255,.35),inset 0 -10px 16px rgba(0,0,0,.32),0 10px 22px rgba(0,0,0,.26)}.moduleIcon svg,.personIcon svg,.serviceIcon svg{width:30px;height:30px}.person{width:100%;display:flex;align-items:center;gap:14px;padding:15px;margin-bottom:12px;text-align:left}.personIcon{margin-bottom:0;flex:none}.person b{font-size:20px}.service{width:100%;min-height:106px;padding:17px;display:flex;align-items:center;gap:14px;text-align:left}.serviceIcon{margin-bottom:0;flex:none}.service.on{border-color:var(--teal);box-shadow:0 0 0 4px rgba(32,224,192,.15),0 14px 28px rgba(0,0,0,.22)}.row{display:flex;gap:12px}.row .btn{min-height:58px}.footer{color:#8299ad;text-align:center;font-size:13px;margin-top:22px}.back{background:transparent;border:1.5px solid var(--line);border-radius:16px;color:white;min-height:48px;padding:0 14px;font-weight:850}.profileBtns{display:grid;gap:12px}.profileBtns .module{min-height:auto}.roleTag{display:inline-block;border-radius:999px;border:1px solid #2d6f99;padding:5px 10px;color:#9fead7;font-size:12px;margin-top:12px;font-weight:900}
@media(max-width:390px){.opening{padding-left:16px;padding-right:16px}.stage{height:350px;min-height:330px}.central{width:160px;height:160px}.central svg{width:116px;height:116px}.orb{width:62px;height:62px}.orb svg{width:37px;height:37px}.headline{font-size:34px}.triad{gap:6px}.network{letter-spacing:.27em}.btn{min-height:62px}.module{min-height:132px;padding:15px}.module b{font-size:20px}.grid{gap:11px}}
</style>
</head>
<body>
<div id="app"></div>
<svg width="0" height="0" style="position:absolute;visibility:hidden"><defs>
<symbol id="logo" viewBox="0 0 120 120"><path d="M77 24A42 42 0 1 0 78 96" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round"/><path d="M82 46v34M65 63h34" stroke="#5ff1dd" stroke-width="17" stroke-linecap="round"/></symbol>
<symbol id="home" viewBox="0 0 64 64"><path d="M17 33 32 20l15 13v18H36V39h-8v12H17V33Z" fill="#fff"/><circle cx="24" cy="21" r="9" fill="#fff"/></symbol>
<symbol id="doctor" viewBox="0 0 64 64"><circle cx="32" cy="17" r="9" fill="#fff"/><path d="M18 52V40c0-8 6-14 14-14s14 6 14 14v12" fill="#fff"/><path d="M23 31v12m18-12v12" stroke="#0b4d37" stroke-width="3" stroke-linecap="round"/><circle cx="23" cy="45" r="3" fill="#0b4d37"/><path d="M41 43a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z" stroke="#0b4d37" stroke-width="3"/></symbol>
<symbol id="nurse" viewBox="0 0 64 64"><path d="M21 14h22v11H21z" fill="#fff"/><path d="M32 13v9M27 18h10" stroke="#522ccf" stroke-width="3"/><circle cx="32" cy="30" r="10" fill="#fff"/><path d="M17 55c2-10 9-15 15-15s13 5 15 15" fill="#fff"/></symbol>
<symbol id="care" viewBox="0 0 64 64"><circle cx="24" cy="20" r="10" fill="#fff"/><path d="M10 55c2-13 9-22 18-22 7 0 13 4 16 11" fill="#fff"/><path d="M46 31c6-8 18 1 9 11l-9 9-9-9c-9-10 3-19 9-11Z" fill="#fff"/></symbol>
<symbol id="tooth" viewBox="0 0 64 64"><path d="M20 11c6-3 9 1 12 1s6-4 12-1c8 4 8 18 3 29-3 7-4 13-9 13-4 0-3-10-6-10s-2 10-6 10c-5 0-6-6-9-13-5-11-5-25 3-29Z" fill="#fff"/></symbol>
<symbol id="run" viewBox="0 0 64 64"><circle cx="34" cy="12" r="6" fill="#fff"/><path d="M29 20 40 28l-6 10 11 11M27 26l-9 6M28 39l-9 12M40 28l8-4" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 55h30" stroke="#fff" stroke-width="5" stroke-linecap="round"/></symbol>
<symbol id="brain" viewBox="0 0 64 64"><path d="M13 36a19 19 0 1 1 30 15v7H24v-9c-7-2-11-7-11-13Z" fill="#fff"/><path d="M25 30c1-8 13-8 14 0m-19 8c3-5 10-5 12 0m3-9c5 1 8 4 8 9" fill="none" stroke="#067486" stroke-width="3" stroke-linecap="round"/></symbol>
<symbol id="leaf" viewBox="0 0 64 64"><path d="M49 15C28 17 18 29 18 48c18-1 30-12 31-33Z" fill="#fff"/><path d="M18 48c8-11 17-18 31-33" stroke="#c18b00" stroke-width="4" stroke-linecap="round"/></symbol>
<symbol id="people" viewBox="0 0 64 64"><circle cx="32" cy="21" r="10" fill="currentColor"/><circle cx="15" cy="28" r="7" fill="currentColor"/><circle cx="49" cy="28" r="7" fill="currentColor"/><path d="M12 56c2-13 11-21 20-21s18 8 20 21H12Z" fill="currentColor"/><path d="M3 56c1-9 7-15 15-16M61 56c-1-9-7-15-15-16" stroke="currentColor" stroke-width="8" stroke-linecap="round"/></symbol>
<symbol id="heart" viewBox="0 0 64 64"><path d="M32 55 13 36C1 24 17 7 32 22 47 7 63 24 51 36L32 55Z" fill="currentColor"/><path d="M14 36h10l5-10 8 20 5-10h8" stroke="#06111f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="house" viewBox="0 0 64 64"><path d="M8 33 32 12l24 21v22H39V40H25v15H8V33Z" fill="currentColor"/><path d="M32 26v18M23 35h18" stroke="#06111f" stroke-width="4" stroke-linecap="round"/></symbol>
</defs></svg>
<script>
const app=document.getElementById('app');
const st={role:'morador',person:{name:'João de Souza',local:'Sítio Japaranduba'},service:null};
function use(id,cls=''){return `<svg class="${cls}" viewBox="0 0 64 64"><use href="#${id}"></use></svg>`}
function logo(){return '<svg viewBox="0 0 120 120"><use href="#logo"></use></svg>'}
function opening(){app.innerHTML=`<main class="opening"><section class="stage" id="stage"><div class="hex"><svg viewBox="0 0 430 430"><path d="M215 18 392 120v190L215 412 38 310V120Z"/><path d="M215 68 348 145v140L215 362 82 285V145Z"/><path d="M215 118 305 170v90L215 312 125 260v-90Z"/></svg></div><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><div class="central">${logo()}</div><div class="orb home" data-a="-112">${use('home')}</div><div class="orb doctor" data-a="-62">${use('doctor')}</div><div class="orb nurse" data-a="-12">${use('nurse')}</div><div class="orb care" data-a="36">${use('care')}</div><div class="orb tooth" data-a="78">${use('tooth')}</div><div class="orb run" data-a="118">${use('run')}</div><div class="orb brain" data-a="167">${use('brain')}</div><div class="orb leaf" data-a="206">${use('leaf')}</div></section><section class="copy"><p class="kicker">CONECTA SAÚDE COMUNITÁRIA</p><h1 class="headline">Saúde, comunidade e cuidado conectados.</h1><div class="rule"></div><div class="triad"><div style="color:#18e7bf">${use('people')}<span>CONECTA<br>PESSOAS</span></div><div style="color:#178cff">${use('heart')}<span>PROMOVE<br>SAÚDE</span></div><div style="color:#ffc033">${use('house')}<span>FORTALECE<br>A COMUNIDADE</span></div></div><p class="network">TACS <b>+</b> COMUNIDADE <b>+</b> UNIDADE</p><button class="btn" id="start">Acessar conta ›</button></section></main>`;document.getElementById('start').onclick=access;animateOrbit();}
function animateOrbit(){const stage=document.getElementById('stage');const orbs=[...document.querySelectorAll('.orb')];const cycle=6500;let t0=performance.now();function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}function frame(t){let p=((t-t0)%cycle)/cycle;let r,rot,op;if(p<.18){r=ease(p/.18);rot=0;op=r}else if(p<.70){r=1;rot=((p-.18)/.52)*Math.PI*2;op=1}else if(p<.88){r=1-ease((p-.70)/.18);rot=Math.PI*2;op=r}else{r=0;rot=0;op=0}const rect=stage.getBoundingClientRect();const cx=rect.width/2,cy=rect.height*.47,rx=rect.width*.43,ry=rect.height*.38;orbs.forEach(o=>{const a=(Number(o.dataset.a)*Math.PI/180)+rot;const x=cx+Math.cos(a)*rx*r;const y=cy+Math.sin(a)*ry*r;o.style.opacity=op.toFixed(3);o.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) scale(${(.55+.45*r).toFixed(3)})`;});requestAnimationFrame(frame)}requestAnimationFrame(frame)}
function access(){app.innerHTML=`<main class="screen"><div class="shell"><div class="top"><div class="brand"><h2>Conecta Saúde Comunitária</h2><small>Um app único por perfil de acesso</small></div><span class="pill">Homologação</span></div><h1 class="title">Acessar conta</h1><p class="lead">Nesta fase o acesso é de teste. Nenhum CPF, SMS, Push ou vínculo de aparelho real será gravado.</p><div class="card"><div class="field"><label>CPF</label><input id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00"></div><div class="field"><label>PIN</label><input id="pin" inputmode="numeric" maxlength="4" placeholder="••••"></div><button class="btn" id="goRole">Continuar</button><p class="warn">Fluxo canônico: CPF confirmado pelo usuário → PIN → perfil autorizado → painel correspondente.</p></div></div></main>`;document.getElementById('cpf').oninput=e=>e.target.value=maskCpf(e.target.value);document.getElementById('goRole').onclick=roles;}
function maskCpf(v){let d=v.replace(/\D/g,'').slice(0,11);return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}
function roles(){app.innerHTML=`<main class="screen"><div class="shell"><button class="back" onclick="access()">‹ Voltar</button><h1 class="title">Perfil de teste</h1><p class="lead">O Conecta é um app único. O painel muda conforme o perfil autorizado.</p><div class="profileBtns"><button class="module" onclick="home('morador')"><b>Morador</b><small>Família, solicitações, recados, campanhas, agendas e perfil.</small></button><button class="module" onclick="home('tacs')"><b>TACS</b><small>Área, moradores, solicitações e acompanhamento comunitário.</small></button><button class="module" onclick="home('profissional')"><b>Profissional da unidade</b><small>Agenda, vagas, atendimentos e serviços vinculados.</small></button><button class="module" onclick="home('admin')"><b>Administrador</b><small>Painéis administrativos completos do projeto.</small></button></div></div></main>`}
function home(role){st.role=role;const label={morador:'Morador',tacs:'TACS',profissional:'Profissional da unidade',admin:'Administrador'}[role];const mods=role==='admin'?['Moradores','Suporte aos moradores','Recados e campanhas','Agendas e vagas','Profissionais e serviços','TACS e áreas','Municípios e organizações','Portal do Morador']:role==='morador'?['Agendas','Profissionais','Serviços','Campanhas','Recados','Meu Perfil','Minha família']:role==='tacs'?['Solicitações da área','Moradores da microárea','Recados e campanhas','Agendas da unidade','Acompanhamento Bolsa Família','Visitas domiciliares']:['Agenda do profissional','Vagas','Atendimentos','Serviços vinculados','Avisos da unidade','Profissionais'];app.innerHTML=`<main class="screen"><div class="shell"><button class="back" onclick="roles()">‹ Trocar perfil</button><div class="top"><div class="brand"><h2>Conecta Saúde Comunitária</h2><small>${st.person.name} • ${st.person.local}</small></div><span class="pill">${label}</span></div><div class="notice">Ambiente de homologação: nenhum dado real será alterado.</div><h1 class="title">Painel ${label}</h1><div class="grid">${mods.map((m,i)=>`<button class="module" onclick="moduleOpen('${m.replace(/'/g,'')}')"><span class="moduleIcon">${use(i%3===0?'home':i%3===1?'doctor':'leaf')}</span><b>${m}</b><small>${role==='admin'?'Painel administrativo do app único.':'Módulo interno do perfil.'}</small></button>`).join('')}</div><p class="footer">Conecta Saúde Comunitária • abertura canônica v10</p></div></main>`}
window.moduleOpen=m=>{alert(m+' — módulo de homologação visual.')};opening();
</script>
</body>
</html>
