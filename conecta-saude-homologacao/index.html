<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020812">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Conecta Saúde Comunitária</title>
<style>
:root{--bg:#020812;--cyan:#18e4cd;--blue:#188eff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
.page{min-height:100svh;background:radial-gradient(circle at 50% 23%,rgba(0,110,255,.20),transparent 35%),linear-gradient(#020812,#020916 54%,#020812);display:flex;justify-content:center}
.poster{position:relative;width:min(100vw,540px);aspect-ratio:864/1402;overflow:hidden;background:radial-gradient(circle at 50% 27%,rgba(6,78,156,.25),transparent 31%)}
.tracks{position:absolute;inset:0;z-index:1;width:100%;height:61.5%;filter:drop-shadow(0 0 8px rgba(0,128,255,.35))}
.tracks path{fill:none;vector-effect:non-scaling-stroke}.hex1{stroke:#0e64da;stroke-width:1.25}.hex2{stroke:#0c56c0;stroke-width:1;opacity:.62}.hex3{stroke:#0a4ca6;stroke-width:1;opacity:.45}.arc{stroke:#1598ff;stroke-width:1.3;opacity:.7}.flow{stroke:#41c8ff;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:4 25;animation:flow 2.2s linear infinite;filter:drop-shadow(0 0 5px #1fa7ff)}
@keyframes flow{to{stroke-dashoffset:-116}}
.logo{position:absolute;left:49.65%;top:29.03%;width:34.72%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:4;object-fit:contain;filter:drop-shadow(0 0 14px rgba(0,123,255,.55)) drop-shadow(0 14px 15px rgba(0,0,0,.38))}
.logoHalo{position:absolute;left:49.65%;top:29.03%;width:41%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);z-index:3;background:radial-gradient(circle,rgba(18,134,255,.18),rgba(7,73,154,.08) 55%,transparent 72%);filter:blur(2px);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.04);opacity:.78}}
.orbitGroup{position:absolute;inset:0;z-index:5;transform-origin:49.65% 29.03%;will-change:transform,opacity;animation:orbitGroup 12s cubic-bezier(.4,0,.2,1) infinite}
.pic{position:absolute;width:15.05%;aspect-ratio:1;transform:translate(-50%,-50%);will-change:transform}.pic img{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 8px 11px rgba(0,0,0,.38));will-change:transform;animation:counter 12s cubic-bezier(.4,0,.2,1) infinite}
.p1{left:33.6806%;top:7.7033%}.p2{left:13.0787%;top:22.3966%}.p3{left:66.7824%;top:8.8445%}.p4{left:14.5833%;top:37.3752%}.p5{left:87.7315%;top:22.3252%}.p6{left:34.8380%;top:47.1469%}.p7{left:84.8380%;top:37.1612%}.p8{left:64.9306%;top:49.5720%}
@keyframes orbitGroup{0%,4%{transform:scale(.035) rotate(-18deg);opacity:0}14%{transform:scale(1) rotate(0);opacity:1}27%{transform:scale(1) rotate(0);opacity:1}69%{transform:scale(1) rotate(360deg);opacity:1}78%{transform:scale(1) rotate(360deg);opacity:1}93%{transform:scale(.035) rotate(390deg);opacity:0}100%{transform:scale(.035) rotate(390deg);opacity:0}}
@keyframes counter{0%,27%{transform:rotate(0deg)}69%,78%{transform:rotate(-360deg)}93%,100%{transform:rotate(-390deg)}}
.kicker{position:absolute;left:7%;right:7%;top:60.2%;text-align:center;color:#28e4cc;font-weight:820;letter-spacing:.285em;font-size:clamp(12px,3.15vw,19px);white-space:nowrap;text-shadow:0 0 10px rgba(40,228,204,.32);z-index:8}
.title{position:absolute;left:9.8%;right:8%;top:64.0%;font-size:clamp(34px,7.35vw,48px);line-height:1.06;letter-spacing:-.052em;font-weight:900;text-align:left;z-index:8;text-shadow:0 4px 10px rgba(0,0,0,.52)}
.divider{position:absolute;left:5.5%;right:5.5%;top:75.45%;height:1.5px;background:linear-gradient(90deg,transparent,#126ede 18%,#70f4ff 50%,#126ede 82%,transparent);box-shadow:0 0 10px rgba(40,188,255,.5);z-index:8}.divider:after{content:"";position:absolute;left:50%;top:50%;width:13px;height:13px;border-radius:50%;background:#d7ffff;transform:translate(-50%,-50%);box-shadow:0 0 5px #fff,0 0 15px #34dfff,0 0 24px #168cff}
.concepts{position:absolute;left:5.6%;right:5.6%;top:78.55%;display:grid;grid-template-columns:1fr 1fr 1.18fr;align-items:center;z-index:8}.concept{min-height:58px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;padding:0 12px;text-align:left;font-size:clamp(9.5px,2.35vw,14px);line-height:1.2;color:#fff}.concept:first-child{padding-left:0}.concept+.concept{border-left:1px solid rgba(79,229,210,.72)}.concept svg{width:clamp(36px,7.5vw,48px);height:clamp(36px,7.5vw,48px)}
.network{position:absolute;left:7%;right:7%;top:86.35%;display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,25px);font-size:clamp(11px,2.7vw,16px);letter-spacing:.34em;white-space:nowrap;z-index:8}.network b{color:#25e4c7;font-size:1.5em;letter-spacing:0}
.cta{position:absolute;left:7.7%;right:7.7%;top:91.0%;height:6.6%;border:0;border-radius:999px;background:linear-gradient(100deg,#16e9c3 0%,#1dcbdc 52%,#168cff 100%);box-shadow:0 14px 30px rgba(0,124,255,.25),inset 0 1px 0 rgba(255,255,255,.42);font-size:clamp(23px,5vw,32px);font-weight:900;color:#06111e;display:flex;align-items:center;justify-content:center;gap:14px;z-index:9}.cta:active{transform:scale(.987)}.cta span{font-size:1.35em;line-height:1}
.access{display:none;position:absolute;inset:0;background:linear-gradient(180deg,#020812,#07182c);z-index:20;padding:calc(env(safe-area-inset-top) + 28px) 24px}.access.on{display:block}.access h2{font-size:40px;margin:0 0 14px}.access p{color:#c0cfda;font-size:19px;line-height:1.4}.back{height:58px;border-radius:18px;border:1px solid #2e78a6;background:#0c2b43;color:#fff;font-weight:800;font-size:18px;padding:0 18px}
@media(max-width:380px){.title{font-size:31px}.concept{gap:5px;padding:0 8px}.network{font-size:10px;gap:9px}.kicker{font-size:11px}}
</style>
</head>
<body>
<main class="page"><section class="poster" id="poster">
  <svg class="tracks" viewBox="0 0 864 862" preserveAspectRatio="none" aria-hidden="true">
    <path class="hex1" d="M432 10 L800 220 L800 620 L432 846 L64 620 L64 220 Z"/>
    <path class="hex2" d="M432 82 L728 250 L728 586 L432 760 L136 586 L136 250 Z"/>
    <path class="hex3" d="M432 160 L650 286 L650 540 L432 666 L214 540 L214 286 Z"/>
    <path class="arc" d="M64 430 C72 220 230 60 432 28 C648 60 792 230 800 430 C792 640 640 814 432 846 C220 815 72 650 64 430"/>
    <path class="flow" d="M64 430 C72 220 230 60 432 28 C648 60 792 230 800 430 C792 640 640 814 432 846 C220 815 72 650 64 430"/>
  </svg>
  <div class="logoHalo"></div>
  <img class="logo" id="logo" alt="Conecta Saúde Comunitária">
  <div class="orbitGroup" id="orbitGroup">
    <div class="pic p1"><img id="p1" alt="Morador"></div>
    <div class="pic p2"><img id="p2" alt="Nutrição"></div>
    <div class="pic p3"><img id="p3" alt="Profissional médico"></div>
    <div class="pic p4"><img id="p4" alt="Saúde mental"></div>
    <div class="pic p5"><img id="p5" alt="Enfermagem"></div>
    <div class="pic p6"><img id="p6" alt="Atividade física"></div>
    <div class="pic p7"><img id="p7" alt="Cuidado"></div>
    <div class="pic p8"><img id="p8" alt="Saúde bucal"></div>
  </div>
  <div class="kicker">CONECTA SAÚDE COMUNITÁRIA</div>
  <div class="title">Saúde, comunidade e<br>cuidado conectados.</div>
  <div class="divider"></div>
  <div class="concepts">
    <div class="concept"><svg viewBox="0 0 64 64" fill="#24e1c1"><circle cx="21" cy="23" r="9"/><circle cx="43" cy="23" r="9"/><circle cx="32" cy="16" r="9"/><path d="M5 54c1-12 7-18 16-18s15 6 16 18zm22 0c1-12 7-18 16-18s15 6 16 18z"/></svg><span>CONECTA<br>PESSOAS</span></div>
    <div class="concept"><svg viewBox="0 0 64 64"><path d="M32 55C16 43 8 34 8 22c0-9 7-15 15-15 5 0 9 2 13 7 4-5 8-7 13-7 8 0 15 6 15 15 0 12-8 21-32 33z" fill="#159cff"/><path d="M13 31h12l4-10 7 20 5-10h12" fill="none" stroke="#061526" stroke-width="4"/></svg><span>PROMOVE<br>SAÚDE</span></div>
    <div class="concept"><svg viewBox="0 0 64 64" fill="#f5aa15"><path d="M6 31 32 9l26 22-5 6-4-4v22H15V33l-4 4z"/><path d="M32 31v16M24 39h16" fill="none" stroke="#08121d" stroke-width="5" stroke-linecap="round"/></svg><span>FORTALECE<br>A COMUNIDADE</span></div>
  </div>
  <div class="network"><span>TACS</span><b>+</b><span>COMUNIDADE</span><b>+</b><span>UNIDADE</span></div>
  <button class="cta" id="cta">Acessar conta <span>›</span></button>
  <section class="access" id="access"><h2>Acessar conta</h2><p>Entrada única do Conecta Saúde Comunitária. O perfil e os módulos são definidos pelas permissões do cadastro.</p><button class="back" id="back">‹ Voltar</button></section>
</section></main>
<script src="v15/assets/central.js"></script>
<script src="v15/assets/pictos.js"></script>
<script>
(function(){
  const A=window.CS_ASSETS||{};
  document.getElementById('logo').src=A.central||'';
  const map=[A.home,A.leaf,A.doc,A.brain,A.nurse,A.run,A.care,A.tooth];
  map.forEach((src,i)=>{document.getElementById('p'+(i+1)).src=src||''});
  document.getElementById('cta').onclick=()=>document.getElementById('access').classList.add('on');
  document.getElementById('back').onclick=()=>document.getElementById('access').classList.remove('on');
})();
</script>
</body></html>
