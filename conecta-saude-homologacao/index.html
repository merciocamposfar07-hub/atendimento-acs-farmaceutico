<style>
:root{--bg:#020812;--bg2:#061426;--card:#0b2237;--card2:#0e2d47;--line:#2b6f9e;--txt:#fff;--muted:#a9bbcb;--teal:#1fe0c0;--blue:#168cff;--red:#ff4b6e;--shadow:0 26px 65px rgba(0,0,0,.42)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100svh;overflow-x:hidden;-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}.opening{min-height:100svh;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 22px);display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 50% 29%,rgba(18,93,156,.26),transparent 35%),linear-gradient(180deg,#020812 0%,#030b18 62%,#020812 100%);overflow:hidden}.stage{position:relative;height:min(54svh,560px);min-height:380px;width:min(100%,560px);margin:0 auto;display:grid;place-items:center}.rings{position:absolute;width:min(86vw,440px);height:min(86vw,440px);border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 63px,rgba(57,122,176,.24) 64px 65px,transparent 66px 127px);opacity:.82}.glow{position:absolute;width:270px;height:270px;border-radius:50%;background:radial-gradient(circle,rgba(21,127,230,.31),rgba(21,127,230,.10) 50%,transparent 72%)}.mainLogo{position:absolute;width:178px;height:178px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 31% 23%,#fff 0,#c8ecff 10%,#11346b 35%,#08235b 67%,#030a1a 100%);box-shadow:0 0 0 8px rgba(35,105,255,.14),0 0 0 18px rgba(11,45,98,.25),0 0 42px rgba(39,143,255,.55),inset 0 7px 16px rgba(255,255,255,.55),inset 0 -22px 35px rgba(0,3,20,.72);z-index:3}.mainLogo svg{width:126px;height:126px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}.planet{position:absolute;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 18px 32px rgba(0,0,0,.36),inset 0 3px 7px rgba(255,255,255,.42),inset 0 -13px 22px rgba(0,0,0,.34);z-index:2}.planet svg{width:40px;height:40px;stroke:white;fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.planet:before{content:"";position:absolute;inset:6px 8px auto 8px;height:20px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.45),transparent)}.p1{top:4%;left:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 24%,#fff,#3fa1ff 18%,#094dd2 66%,#04144a)}.p2{top:14%;right:12%;background:radial-gradient(circle at 35% 24%,#fff,#ffad4a 18%,#ff4f14 66%,#5a1406)}.p3{top:38%;right:0;background:radial-gradient(circle at 35% 24%,#fff,#63fff0 18%,#03aeb8 66%,#034b5c)}.p4{right:8%;bottom:13%;background:radial-gradient(circle at 35% 24%,#fff,#ffe26c 18%,#d69600 66%,#4e3100)}.p5{bottom:4%;left:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 24%,#fff,#63c8ff 18%,#1685d9 66%,#06315f)}.p6{left:9%;bottom:12%;background:radial-gradient(circle at 35% 24%,#fff,#43f18c 18%,#04a649 66%,#033b1b)}.p7{top:39%;left:0;background:radial-gradient(circle at 35% 24%,#fff,#b879ff 18%,#7525dd 66%,#260858)}.p8{top:15%;left:12%;background:radial-gradient(circle at 35% 24%,#fff,#ff75b3 18%,#e51871 66%,#520626)}.copy{width:min(100%,560px);margin:0 auto;text-align:left}.kicker{color:var(--teal);letter-spacing:.31em;font-size:13px;font-weight:950;margin-bottom:18px}.copy h1{font-size:clamp(38px,8.5vw,54px);line-height:1.08;letter-spacing:-.055em;margin:0 0 20px}.concepts{display:grid;grid-template-columns:1fr 1fr 1fr;margin:0 0 22px;color:#dbe6ee}.concept{text-align:center;border-left:1px solid rgba(112,172,222,.48);font-size:15px;line-height:1.25}.concept:first-child{border-left:0;text-align:left}.concept:last-child{text-align:right}.network{text-align:center;color:#9fe3d0;letter-spacing:.28em;font-size:13px;font-weight:850;margin:0 0 28px}.btn{width:100%;min-height:68px;border:0;border-radius:22px;background:linear-gradient(100deg,#19e0bd,#21c5de 48%,#168cff);color:#06111f;font-size:20px;font-weight:950;box-shadow:0 16px 34px rgba(12,116,211,.32);padding:0 18px}.btn.alt{background:transparent;border:1.5px solid var(--line);color:white;box-shadow:none}.btn:active{transform:translateY(1px)}.screen{min-height:100svh;background:radial-gradient(circle at 50% 0,rgba(19,82,145,.26),transparent 38%),linear-gradient(180deg,#020812,#061426);padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 24px)}.shell{width:min(100%,620px);margin:0 auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}.brand h2{font-size:23px;line-height:1.08;margin:0;font-weight:900;letter-spacing:-.03em}.brand small{display:block;color:var(--muted);font-size:16px;margin-top:3px}.pill{border:1px solid var(--line);border-radius:999px;color:#9fead7;padding:8px 13px;font-size:14px}.notice{background:#0c2c42;border-left:4px solid var(--teal);border-radius:16px;padding:16px 18px;color:#d7e5ef;font-size:18px;line-height:1.35;margin:14px 0 28px}.title{font-size:clamp(40px,8.8vw,58px);line-height:1.02;letter-spacing:-.055em;margin:0 0 16px}.lead{font-size:22px;line-height:1.42;color:#c3d1dc;margin:0 0 24px}.card{border:1.5px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#0d2c44,#07192d);box-shadow:var(--shadow);padding:20px;margin:0 0 18px}.progress{display:flex;gap:8px;margin-bottom:20px}.bar{height:8px;border-radius:999px;background:#1a3c58;flex:1}.bar.on{background:linear-gradient(90deg,var(--teal),var(--blue))}.field{margin:18px 0}.field label{display:block;font-size:20px;font-weight:900;margin:0 0 10px}.field input,.field textarea{width:100%;border:1.6px solid var(--line);border-radius:18px;background:#071d31;color:#fff;padding:0 16px;outline:none}.field input{height:66px;font-size:24px;font-weight:800}.field textarea{min-height:126px;padding-top:14px;font-size:19px;line-height:1.35;resize:none}.warn{color:#ffd371;font-weight:800;font-size:17px;line-height:1.4;margin-top:14px}.err{color:#ff8fa0;font-weight:900;font-size:17px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.module,.person,.service{border:1.5px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#0d2d45,#07192d);color:#fff;text-align:left;box-shadow:0 14px 28px rgba(0,0,0,.22)}.module{min-height:150px;padding:22px 20px}.moduleIcon,.personIcon,.serviceIcon{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;margin-bottom:20px;box-shadow:inset 0 2px 4px rgba(255,255,255,.35),inset 0 -10px 16px rgba(0,0,0,.32),0 10px 22px rgba(0,0,0,.26)}.moduleIcon svg,.personIcon svg,.serviceIcon svg{width:33px;height:33px;stroke:white;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.module b,.service b{display:block;font-size:24px;line-height:1.05}.module small,.service small,.person small{display:block;color:var(--muted);font-size:18px;line-height:1.25;margin-top:7px}.person{width:100%;display:flex;align-items:center;gap:14px;padding:15px;margin-bottom:12px}.personIcon{margin-bottom:0;flex:none}.person b{font-size:20px}.service{width:100%;min-height:112px;padding:18px;display:flex;align-items:center;gap:14px}.serviceIcon{margin-bottom:0;flex:none}.service.on{border-color:var(--teal);box-shadow:0 0 0 4px rgba(32,224,192,.15),0 14px 28px rgba(0,0,0,.22)}.footer{color:#8299ad;text-align:center;font-size:13px;margin-top:22px}.row{display:flex;gap:12px}.row .btn{min-height:60px}.panel{position:fixed;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(10px);display:none;align-items:flex-end;z-index:9}.panel.on{display:flex}.drawer{width:100%;max-height:86svh;overflow:auto;background:#071426;border:1px solid #173e5b;border-radius:28px 28px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 22px);box-shadow:0 -24px 50px rgba(0,0,0,.46)}.drawerHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.drawerHead h3{font-size:28px;line-height:1.05;margin:0}.x{width:48px;height:48px;border-radius:16px;border:1px solid var(--line);background:#0b2237;color:#fff;font-size:28px}.item{border:1px solid #2d6f99;border-radius:18px;background:#0b2237;padding:15px;margin:10px 0}.item b{display:block;font-size:18px}.item small{display:block;color:var(--muted);margin-top:5px;font-size:16px;line-height:1.35}.status{display:inline-flex;border-radius:999px;padding:7px 11px;background:rgba(32,224,192,.14);color:#9cebd9;font-size:13px;font-weight:900;margin-top:10px}@media(max-width:380px){.planet{width:60px;height:60px}.planet svg{width:34px;height:34px}.mainLogo{width:152px;height:152px}.mainLogo svg{width:108px;height:108px}.stage{min-height:360px}.copy h1{font-size:35px}.title{font-size:37px}.lead{font-size:20px}.module b{font-size:22px}.module{min-height:136px;padding:18px}.grid{gap:11px}.concept{font-size:13px}.network{font-size:12px}}
</style>

</section>
<section class="copy"><div class="kicker">CONECTA SAÚDE COMUNITÁRIA</div><h1>Saúde, comunidade e cuidado conectados.</h1><div class="concepts"><div class="concept">CONECTA<br>PESSOAS</div><div class="concept">PROMOVE<br>SAÚDE</div><div class="concept">FORTALECE<br>A COMUNIDADE</div></div><div class="network">TACS + COMUNIDADE + UNIDADE</div><button class="btn" id="startBtn">Começar</button></section>

<script>
(function(){
'use strict';
var app=document.getElementById('app'),panel=document.getElementById('panel'),panelTitle=document.getElementById('panelTitle'),panelBody=document.getElementById('panelBody');
var state={cpf:'',dob:'',pin:'',person:null,member:null,service:null,pending:false};
var people=[{name:'João de Souza',cpf:'52998224725',dob:'28/12/1984',family:'F1'},{name:'Maria de Souza',cpf:'',dob:'12/05/1988',family:'F1'},{name:'Ana de Souza',cpf:'',dob:'14/09/2014',family:'F1'}];
var svgs={agenda:'<svg viewBox="0 0 64 64"><path d="M18 13v9M46 13v9M14 24h36M16 17h32v34H16z"/><path d="M25 34h4M36 34h4M25 43h4M36 43h4"/></svg>',pro:'<svg viewBox="0 0 64 64"><circle cx="32" cy="20" r="8"/><path d="M18 51c3-12 25-12 28 0"/><path d="M47 20v13M40 27h14"/></svg>',serv:'<svg viewBox="0 0 64 64"><path d="M18 29c0-9 7-16 16-16s16 7 16 16-7 16-16 16H23l-8 6 3-11"/><path d="M27 29h14M34 22v14"/></svg>',camp:'<svg viewBox="0 0 64 64"><path d="M17 35l28-15v28L17 35Z"/><path d="M17 35v14c0 4 7 4 7 0v-10"/></svg>',rec:'<svg viewBox="0 0 64 64"><path d="M22 50h20M25 54c2 4 12 4 14 0M18 45h28c-5-5-5-13-5-19a9 9 0 0 0-18 0c0 6 0 14-5 19Z"/></svg>',perfil:'<svg viewBox="0 0 64 64"><circle cx="32" cy="22" r="9"/><path d="M16 52c4-14 28-14 32 0"/></svg>',dent:'<svg viewBox="0 0 64 64"><path d="M24 14c-8 0-11 8-8 18l6 18c1 3 6 3 7 0l3-10 3 10c1 3 6 3 7 0l6-18c3-10 0-18-8-18-4 0-6 2-8 2s-4-2-8-2Z"/></svg>',home:'<svg viewBox="0 0 64 64"><path d="M14 32l18-16 18 16v20H20V32"/><path d="M27 52V38h10v14"/></svg>',pin:'<svg viewBox="0 0 64 64"><rect x="16" y="29" width="32" height="24" rx="4"/><path d="M23 29v-8a9 9 0 0 1 18 0v8"/><path d="M32 39v5"/></svg>'};
function icon(n,bg){return '<span class="moduleIcon" style="background:'+bg+'">'+(svgs[n]||svgs.serv)+'</span>'}
function fmtCpf(v){var d=String(v||'').replace(/\D/g,'').slice(0,11);return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}
function fmtDob(v){var d=String(v||'').replace(/\D/g,'').slice(0,8);if(d.length>4)return d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4);if(d.length>2)return d.slice(0,2)+'/'+d.slice(2);return d}
function bars(n){var h='<div class="progress">';for(var i=1;i<=4;i++)h+='<span class="bar '+(i<=n?'on':'')+'"></span>';return h+'</div>'}
function wrap(title,lead,step,body,back){app.innerHTML='<main class="screen"><div class="shell"><div class="top"><button class="btn alt" id="back" style="width:auto;min-height:44px;padding:0 16px">‹ Voltar</button><span class="pill">Homologação v7</span></div><h1 class="title">'+title+'</h1><p class="lead">'+lead+'</p><div class="card">'+bars(step)+body+'</div><div class="footer">Teste seguro: não grava CPF, não envia SMS e não vincula aparelho a morador real.</div></div></main>';document.getElementById('back').onclick=back}
function cpf(err){wrap('Acesso do morador','Digite o CPF apenas quando estiver correto. A busca só acontece depois de confirmar.',1,'<div class="field"><label>CPF</label><input id="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" maxlength="14" value="'+fmtCpf(state.cpf)+'"></div><button class="btn" id="goCpf">Confirmar CPF e continuar</button><div class="warn">Homologação segura: este teste não grava CPF, não envia SMS e não vincula seu aparelho.</div>'+(err?'<div class="err">'+err+'</div>':''),opening);var input=document.getElementById('cpf');input.oninput=function(){state.cpf=this.value.replace(/\D/g,'').slice(0,11);this.value=fmtCpf(state.cpf)};document.getElementById('goCpf').onclick=function(){if(state.cpf.length!==11){cpf('Digite os 11 números do CPF.');return}var p=people.find(function(x){return x.cpf===state.cpf});if(p){state.person=p;pin()}else dob()}}
function dob(err){wrap('Confirmação por nascimento','CPF não localizado na base de teste. Isso não bloqueia a solicitação.',2,'<div class="field"><label>Data de nascimento</label><input id="dob" inputmode="numeric" autocomplete="off" placeholder="DD/MM/AAAA" maxlength="10" value="'+state.dob+'"></div><button class="btn" id="goDob">Continuar</button>'+(err?'<div class="err">'+err+'</div>':''),cpf);var input=document.getElementById('dob');input.oninput=function(){state.dob=fmtDob(this.value);this.value=state.dob};document.getElementById('goDob').onclick=function(){if(!/^\d{2}\/\d{2}\/\d{4}$/.test(state.dob)){dob('Digite a data completa.');return}state.pending=true;state.person={name:'Morador em identificação',cpf:state.cpf,dob:state.dob,family:''};pin()}}
function pin(err){wrap('Crie seu PIN','Escolha 4 números. Nesta homologação o PIN fica apenas no teste da tela.',3,'<div class="field"><label>PIN</label><input id="pin1" type="password" inputmode="numeric" maxlength="4"></div><div class="field"><label>Confirmar PIN</label><input id="pin2" type="password" inputmode="numeric" maxlength="4"></div><button class="btn" id="goPin">Criar PIN</button>'+(err?'<div class="err">'+err+'</div>':''),cpf);document.getElementById('goPin').onclick=function(){var a=document.getElementById('pin1').value.replace(/\D/g,''),b=document.getElementById('pin2').value.replace(/\D/g,'');if(a.length!==4){pin('O PIN precisa ter 4 números.');return}if(a!==b){pin('Os dois PINs precisam ser iguais.');return}state.pin=a;notify()}}
function notify(){wrap('Notificações','Neste teste o Push é apenas simulado para não vincular seu aparelho.',4,'<div class="notice">Quando a versão real for autorizada, o app pedirá permissão de notificação somente depois do acesso do morador.</div><button class="btn" id="goNotify">Continuar sem Push real</button>',pin);document.getElementById('goNotify').onclick=family}
function family(){var list=(state.person&&state.person.family==='F1'?people:[state.person||people[0]]);var html=list.map(function(p,i){return '<button class="person" data-i="'+i+'"><span class="personIcon" style="background:radial-gradient(circle at 32% 22%,#fff,#7ef0a4 18%,#079d45 67%,#043719)">'+svgs.perfil+'</span><span><b>'+p.name+'</b><small>'+p.dob+' • Sítio Japaranduba</small></span></button>'}).join('');wrap('Família vinculada','Escolha para quem deseja usar os serviços.',4,(state.pending?'<div class="notice">Cadastro em revisão. A solicitação não será bloqueada.</div>':'')+html,notify);document.querySelectorAll('[data-i]').forEach(function(b){b.onclick=function(){state.member=list[Number(this.getAttribute('data-i'))];home()}})}
function home(){var p=state.member||state.person||people[0];app.innerHTML='<main class="screen"><div class="shell"><div class="top"><div class="brand"><h2>Conecta Saúde Comunitária</h2><small>'+p.name+' • Sítio Japaranduba</small></div><span class="pill">Morador</span></div><div class="notice">Ambiente de teste: nenhuma vaga real será consumida e nenhum Push real será enviado.</div><h1 class="title">Como podemos ajudar?</h1><div class="grid"><button class="module" data-panel="agendas">'+icon('agenda','radial-gradient(circle at 32% 22%,#fff,#7ec7ff 18%,#0c61d8 67%,#072052)')+'<b>Agendas</b><small>Dias e horários</small></button><button class="module" data-panel="profissionais">'+icon('pro','radial-gradient(circle at 32% 22%,#fff,#ff8fc0 18%,#df176d 67%,#460723)')+'<b>Profissionais</b><small>Equipe da unidade</small></button><button class="module" id="services">'+icon('serv','radial-gradient(circle at 32% 22%,#fff,#b884ff 18%,#6822d8 67%,#21094b)')+'<b>Serviços</b><small>Solicitações</small></button><button class="module" data-panel="campanhas">'+icon('camp','radial-gradient(circle at 32% 22%,#fff,#ffe07c 18%,#c58a00 67%,#493100)')+'<b>Campanhas</b><small>Ações de saúde</small></button><button class="module" data-panel="recados">'+icon('rec','radial-gradient(circle at 32% 22%,#fff,#6ff3ff 18%,#0aa7bb 67%,#073c4c)')+'<b>Recados</b><small>Avisos da unidade</small></button><button class="module" data-panel="perfil">'+icon('perfil','radial-gradient(circle at 32% 22%,#fff,#9ed8ff 18%,#237cc0 67%,#062d56)')+'<b>Meu Perfil</b><small>Dados e família</small></button></div><button class="btn alt" style="margin-top:18px" id="trocar">Trocar integrante da família</button><div class="footer">Conecta Saúde Comunitária • v7</div></div></main>';document.getElementById('services').onclick=services;document.getElementById('trocar').onclick=family;document.querySelectorAll('[data-panel]').forEach(function(b){b.onclick=function(){openPanel(this.getAttribute('data-panel'))}})}
function services(){var opts=[['Atendimento médico','Solicitar orientação ou vaga disponível','serv'],['Atendimento odontológico','Consulta comum ou urgência odontológica','dent'],['Enfermagem','Acompanhamento e orientação da unidade','pro'],['Nutricionista','Agendamento e acompanhamento nutricional','leaf'],['Visita domiciliar do TACS','Solicitar visita quando necessário','home'],['Bolsa Família','Acompanhamento de peso, altura e atualização','perfil']];var body='<div class="notice">Escolha um serviço. Esta homologação não envia a solicitação real.</div>'+opts.map(function(o,i){return '<button class="service" data-s="'+i+'"><span class="serviceIcon" style="background:radial-gradient(circle at 32% 22%,#fff,#72e3db 18%,#168d93 67%,#083d5c)">'+(svgs[o[2]]||svgs.serv)+'</span><span><b>'+o[0]+'</b><small>'+o[1]+'</small></span></button>'}).join('')+'<div class="field"><label>Descrição</label><textarea id="desc" placeholder="Explique seu pedido"></textarea></div><button class="btn" id="send">Enviar solicitação de teste</button>';wrap('Serviços','Selecione o atendimento necessário para o morador escolhido.',4,body,home);document.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){document.querySelectorAll('.service').forEach(function(x){x.classList.remove('on')});b.classList.add('on');state.service=b.querySelector('b').textContent}});document.getElementById('send').onclick=function(){if(!state.service){alert('Escolha um serviço.');return}openPanel('enviado')}}
function openPanel(name){var titles={agendas:'Agendas',profissionais:'Profissionais',campanhas:'Campanhas',recados:'Recados',perfil:'Meu Perfil',enviado:'Solicitação enviada'};var bodies={agendas:'<div class="item"><b>Médica</b><small>Segunda-feira pela manhã • exemplo de homologação.</small><span class="status">Teste</span></div><div class="item"><b>Dentista</b><small>Vagas comuns e urgência odontológica separadas.</small><span class="status">Teste</span></div>',profissionais:'<div class="item"><b>Equipe da unidade</b><small>Médica, enfermeira, nutricionista, odontologia e TACS. Dados fictícios.</small></div>',campanhas:'<div class="item"><b>Campanhas de saúde</b><small>Aqui entrarão campanhas mensais e avisos da unidade.</small></div>',recados:'<div class="item"><b>Recado com confirmação</b><small>Modelo visual para confirmação de recebimento pelo morador.</small><span class="status">Pendente</span></div>',perfil:'<div class="item"><b>'+((state.member||state.person||people[0]).name)+'</b><small>Dados de teste. Nenhuma alteração em cadastro real.</small></div>',enviado:'<div class="item"><b>Pedido registrado no teste</b><small>Serviço: '+(state.service||'não informado')+'. Nenhuma vaga real foi consumida.</small><span class="status">Homologação</span></div>'};panelTitle.textContent=titles[name]||'Conecta Saúde';panelBody.innerHTML=bodies[name]||'<div class="item"><b>Módulo de teste</b></div>';panel.classList.add('on')}
document.getElementById('closePanel').onclick=function(){panel.classList.remove('on')};panel.onclick=function(e){if(e.target===panel)panel.classList.remove('on')};
