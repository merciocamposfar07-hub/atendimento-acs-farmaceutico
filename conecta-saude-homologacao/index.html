<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Conecta Saúde Comunitária — Homologação v6</title>
<style>
:root{--bg:#020812;--bg2:#061429;--card:#0b2237;--card2:#0e2b43;--line:#2d6f99;--txt:#fff;--muted:#a9bbcb;--teal:#20e0c0;--blue:#168cff;--red:#ff4b6e;--gold:#ffc033;--green:#1fcf6f;--purple:#7c3cff;--shadow:0 26px 65px rgba(0,0,0,.42)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100svh;overflow-x:hidden;-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}.opening{min-height:100svh;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 22px);display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 50% 30%,rgba(18,93,156,.26),transparent 34%),linear-gradient(180deg,#020812 0%,#030b18 62%,#020812 100%);overflow:hidden}.stage{position:relative;height:min(54svh,560px);min-height:390px;width:min(100%,560px);margin:0 auto;display:grid;place-items:center}.rings{position:absolute;width:min(86vw,440px);height:min(86vw,440px);border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 64px,rgba(56,120,171,.23) 65px 66px,transparent 67px 128px);opacity:.78}.glow{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(21,127,230,.30),rgba(21,127,230,.10) 49%,transparent 72%);filter:blur(.3px)}.mainLogo{position:absolute;width:178px;height:178px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 31% 23%,#ffffff 0,#c8ecff 10%,#11346b 35%,#08235b 67%,#030a1a 100%);box-shadow:0 0 0 8px rgba(35,105,255,.14),0 0 0 18px rgba(11,45,98,.25),0 0 42px rgba(39,143,255,.55),inset 0 7px 16px rgba(255,255,255,.55),inset 0 -22px 35px rgba(0,3,20,.72);z-index:3}.mainLogo svg{width:126px;height:126px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}.planet{position:absolute;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 18px 32px rgba(0,0,0,.36),inset 0 3px 7px rgba(255,255,255,.42),inset 0 -13px 22px rgba(0,0,0,.34);z-index:2}.planet svg{width:40px;height:40px}.planet:before{content:"";position:absolute;inset:6px 8px auto 8px;height:20px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.44),transparent)}.p1{top:4%;left:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 24%,#fff,#3fa1ff 18%,#094dd2 66%,#04144a)}.p2{top:14%;right:12%;background:radial-gradient(circle at 35% 24%,#fff,#ffad4a 18%,#ff4f14 66%,#5a1406)}.p3{top:38%;right:0;background:radial-gradient(circle at 35% 24%,#fff,#63fff0 18%,#03aeb8 66%,#034b5c)}.p4{right:8%;bottom:13%;background:radial-gradient(circle at 35% 24%,#fff,#ffe26c 18%,#d69600 66%,#4e3100)}.p5{bottom:4%;left:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 24%,#fff,#63c8ff 18%,#1685d9 66%,#06315f)}.p6{left:9%;bottom:12%;background:radial-gradient(circle at 35% 24%,#fff,#43f18c 18%,#04a649 66%,#033b1b)}.p7{top:39%;left:0;background:radial-gradient(circle at 35% 24%,#fff,#b879ff 18%,#7525dd 66%,#260858)}.p8{top:15%;left:12%;background:radial-gradient(circle at 35% 24%,#fff,#ff75b3 18%,#e51871 66%,#520626)}.copy{width:min(100%,560px);margin:0 auto;text-align:left}.kicker{color:var(--teal);letter-spacing:.31em;font-size:13px;font-weight:950;margin-bottom:18px}.copy h1{font-size:clamp(38px,8.5vw,54px);line-height:1.08;letter-spacing:-.055em;margin:0 0 20px}.concepts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin:0 0 22px;color:#dbe6ee}.concept{text-align:center;border-left:1px solid rgba(112,172,222,.48);font-size:15px;line-height:1.25}.concept:first-child{border-left:0;text-align:left}.concept:last-child{text-align:right}.network{text-align:center;color:#9fe3d0;letter-spacing:.28em;font-size:13px;font-weight:850;margin:0 0 28px}.btn{width:100%;min-height:68px;border:0;border-radius:22px;background:linear-gradient(100deg,#19e0bd,#21c5de 48%,#168cff);color:#06111f;font-size:20px;font-weight:950;box-shadow:0 16px 34px rgba(12,116,211,.32);padding:0 18px}.btn.alt{background:transparent;border:1.5px solid var(--line);color:white;box-shadow:none}.btn:active{transform:translateY(1px)}.screen{min-height:100svh;background:radial-gradient(circle at 50% 0,rgba(19,82,145,.26),transparent 38%),linear-gradient(180deg,#020812,#061426);padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 24px)}.shell{width:min(100%,620px);margin:0 auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}.brand h2{font-size:23px;line-height:1.08;margin:0;font-weight:900;letter-spacing:-.03em}.brand small{display:block;color:var(--muted);font-size:16px;margin-top:3px}.pill{border:1px solid var(--line);border-radius:999px;color:#9fead7;padding:8px 13px;font-size:14px}.notice{background:#0c2c42;border-left:4px solid var(--teal);border-radius:16px;padding:16px 18px;color:#d7e5ef;font-size:18px;line-height:1.35;margin:14px 0 28px}.title{font-size:clamp(40px,8.8vw,58px);line-height:1.02;letter-spacing:-.055em;margin:0 0 16px}.lead{font-size:22px;line-height:1.42;color:#c3d1dc;margin:0 0 24px}.card{border:1.5px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#0d2c44,#07192d);box-shadow:var(--shadow);padding:20px;margin:0 0 18px}.progress{display:flex;gap:8px;margin-bottom:20px}.bar{height:8px;border-radius:999px;background:#1a3c58;flex:1}.bar.on{background:linear-gradient(90deg,var(--teal),var(--blue))}.field{margin:18px 0}.field label{display:block;font-size:20px;font-weight:900;margin:0 0 10px}.field input,.field textarea{width:100%;border:1.6px solid var(--line);border-radius:18px;background:#071d31;color:#fff;padding:0 16px;outline:none}.field input{height:66px;font-size:24px;font-weight:800}.field textarea{min-height:126px;padding-top:14px;font-size:19px;line-height:1.35;resize:none}.field input:focus,.field textarea:focus{box-shadow:0 0 0 4px rgba(32,224,192,.16);border-color:#29d7cd}.warn{color:#ffd371;font-weight:800;font-size:17px;line-height:1.4;margin-top:14px}.err{color:#ff8fa0;font-weight:900;font-size:17px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.module,.person,.service{border:1.5px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#0d2d45,#07192d);color:#fff;text-align:left;box-shadow:0 14px 28px rgba(0,0,0,.22)}.module{min-height:150px;padding:22px 20px}.moduleIcon,.personIcon,.serviceIcon{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;margin-bottom:20px;box-shadow:inset 0 2px 4px rgba(255,255,255,.35),inset 0 -10px 16px rgba(0,0,0,.32),0 10px 22px rgba(0,0,0,.26)}.moduleIcon svg,.personIcon svg,.serviceIcon svg{width:33px;height:33px}.module b,.service b{display:block;font-size:24px;line-height:1.05}.module small,.service small,.person small{display:block;color:var(--muted);font-size:18px;line-height:1.25;margin-top:7px}.person{width:100%;display:flex;align-items:center;gap:14px;padding:15px;margin-bottom:12px}.personIcon{margin-bottom:0;flex:none}.person b{font-size:20px}.service{width:100%;min-height:112px;padding:18px;display:flex;align-items:center;gap:14px}.serviceIcon{margin-bottom:0;flex:none}.service.on{border-color:var(--teal);box-shadow:0 0 0 4px rgba(32,224,192,.15),0 14px 28px rgba(0,0,0,.22)}.footer{color:#8299ad;text-align:center;font-size:13px;margin-top:22px}.row{display:flex;gap:12px}.row .btn{min-height:60px}.panel{position:fixed;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(10px);display:none;align-items:flex-end;z-index:9}.panel.on{display:flex}.drawer{width:100%;max-height:86svh;overflow:auto;background:#071426;border:1px solid #173e5b;border-radius:28px 28px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 22px);box-shadow:0 -24px 50px rgba(0,0,0,.46)}.drawerHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.drawerHead h3{font-size:28px;line-height:1.05;margin:0}.x{width:48px;height:48px;border-radius:16px;border:1px solid var(--line);background:#0b2237;color:#fff;font-size:28px}.item{border:1px solid #2d6f99;border-radius:18px;background:#0b2237;padding:15px;margin:10px 0}.item b{display:block;font-size:18px}.item small{display:block;color:var(--muted);margin-top:5px;font-size:16px;line-height:1.35}.status{display:inline-flex;border-radius:999px;padding:7px 11px;background:rgba(32,224,192,.14);color:#9cebd9;font-size:13px;font-weight:900;margin-top:10px}@media(max-width:380px){.planet{width:60px;height:60px}.planet svg{width:34px;height:34px}.mainLogo{width:152px;height:152px}.mainLogo svg{width:108px;height:108px}.stage{min-height:360px}.copy h1{font-size:35px}.title{font-size:37px}.lead{font-size:20px}.module b{font-size:22px}.module{min-height:136px;padding:18px}.grid{gap:11px}.concept{font-size:13px}.network{font-size:12px}}
</style>
</head>
<body><div id="app"></div><div class="panel" id="panel"><div class="drawer"><div class="drawerHead"><h3 id="panelTitle"></h3><button class="x" id="closePanel">×</button></div><div id="panelBody"></div></div></div>
<script>
'use strict';
const app=document.getElementById('app'),panel=document.getElementById('panel'),panelTitle=document.getElementById('panelTitle'),panelBody=document.getElementById('panelBody');
const state={cpf:'',dob:'',pin:'',person:null,member:null,pending:false,service:null};
const people=[{name:'João de Souza',cpf:'52998224725',dob:'28/12/1984',family:'F1'},{name:'Maria de Souza',cpf:'',dob:'12/05/1988',family:'F1'},{name:'Ana de Souza',cpf:'',dob:'14/09/2014',family:'F1'}];
const colors={agenda:'radial-gradient(circle at 32% 22%,#fff,#7ec7ff 18%,#0c61d8 67%,#072052)',pro:'radial-gradient(circle at 32% 22%,#fff,#ff8fc0 18%,#df176d 67%,#460723)',serv:'radial-gradient(circle at 32% 22%,#fff,#b884ff 18%,#6822d8 67%,#21094b)',camp:'radial-gradient(circle at 32% 22%,#fff,#ffe07c 18%,#c58a00 67%,#493100)',rec:'radial-gradient(circle at 32% 22%,#fff,#6ff3ff 18%,#0aa7bb 67%,#073c4c)',perfil:'radial-gradient(circle at 32% 22%,#fff,#9ed8ff 18%,#237cc0 67%,#062d56)',dent:'radial-gradient(circle at 32% 22%,#fff,#79bcff 18%,#0759c9 67%,#061d4c)',run:'radial-gradient(circle at 32% 22%,#fff,#ffad63 18%,#e94716 67%,#541708)',leaf:'radial-gradient(circle at 32% 22%,#fff,#f7df70 18%,#c39100 67%,#3e2d00)',user:'radial-gradient(circle at 32% 22%,#fff,#7ef0a4 18%,#079d45 67%,#043719)'};
function logo(){return '<svg viewBox="0 0 200 200" aria-hidden="true"><text x="34" y="138" font-size="122" font-weight="900" font-family="Arial,sans-serif" fill="white">C</text><rect x="126" y="74" width="24" height="72" rx="7" fill="#56e9d1"/><rect x="102" y="98" width="72" height="24" rx="7" fill="#56e9d1"/></svg>'}
function icon(n){const s='stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"';const f='fill="currentColor"';let p={dent:`<path ${s} d="M25 18c7-8 16-3 23 0 7-3 16-8 23 0 8 9 2 22-2 34-4 13-5 27-13 27-5 0-5-17-8-17s-3 17-8 17c-8 0-9-14-13-27-4-12-10-25-2-34Z"/>`,run:`<circle ${f} cx="48" cy="16" r="8"/><path ${s} d="M45 31 33 45l15 9 13 22M50 33l16 12M36 49 23 62"/>`,brain:`<path ${s} d="M37 27c-12 0-20 8-20 20 0 9 5 16 13 19v13h37V66c8-3 13-10 13-19 0-12-8-20-20-20-3-8-20-8-23 0Z"/><path ${s} d="M38 38c8 0 11 5 11 12M61 38c-8 0-11 5-11 12"/>`,leaf:`<path ${s} d="M23 66c29 3 50-16 55-43-29-3-50 16-55 43Z"/><path ${s} d="M25 67c15-19 31-29 51-42"/>`,person:`<circle ${s} cx="50" cy="29" r="14"/><path ${s} d="M24 79c4-18 48-18 52 0"/>`,doctor:`<circle ${s} cx="50" cy="24" r="12"/><path ${s} d="M25 82V59c0-10 50-10 50 0v23M38 61v19M62 61v19"/><path ${s} d="M44 70h12M50 64v12"/>`,steth:`<path ${s} d="M29 19v23c0 15 32 15 32 0V19M61 42v12c0 13 18 13 18 0"/><circle ${s} cx="79" cy="54" r="8"/>`,heart:`<path ${s} d="M28 36c0-10 12-16 22-4 10-12 22-6 22 4 0 17-22 31-22 31S28 53 28 36Z"/><path ${s} d="M34 79h32"/>`,bell:`<path ${s} d="M32 82h36M39 90c5 8 22 8 26 0M26 74h48c-8-8-8-22-8-34a16 16 0 0 0-32 0c0 12 0 26-8 34Z"/>`,family:`<circle ${s} cx="35" cy="32" r="11"/><circle ${s} cx="66" cy="34" r="10"/><path ${s} d="M17 79c3-15 33-18 45-6M50 79c4-13 27-15 33 0"/>`,calendar:`<path ${s} d="M22 27h56v52H22zM22 43h56M34 20v14M66 20v14"/><path ${s} d="M36 57h8M56 57h8M36 69h8"/>`,meg:`<path ${s} d="M23 55h15l36-19v42L38 59H23zM38 59l8 18"/>`,clipboard:`<path ${s} d="M32 22h36v12H32zM25 29h50v56H25zM36 51h28M36 65h20"/>`};return `<svg viewBox="0 0 100 100" aria-hidden="true">${p[n]||p.person}</svg>`}
function paint(root=document){root.querySelectorAll('[data-logo]').forEach(e=>e.innerHTML=logo());root.querySelectorAll('[data-icon]').forEach(e=>{e.innerHTML=icon(e.dataset.icon)+(e.innerHTML.includes('badge')?e.innerHTML:'')})}
function opening(){app.innerHTML=`<main class="opening"><section class="stage"><div class="rings"></div><div class="glow"></div><div class="planet p1" data-icon="dent"></div><div class="planet p2" data-icon="run"></div><div class="planet p3" data-icon="brain"></div><div class="planet p4" data-icon="leaf"></div><div class="planet p5" data-icon="person"></div><div class="planet p6" data-icon="doctor"></div><div class="planet p7" data-icon="steth"></div><div class="planet p8" data-icon="heart"></div><div class="mainLogo" data-logo></div></section><section class="copy"><div class="kicker">CONECTA SAÚDE COMUNITÁRIA</div><h1>Saúde, comunidade e cuidado conectados.</h1><div class="concepts"><div class="concept">CONECTA<br>PESSOAS</div><div class="concept">PROMOVE<br>SAÚDE</div><div class="concept">FORTALECE<br>A COMUNIDADE</div></div><div class="network">TACS + COMUNIDADE + UNIDADE</div><button class="btn" id="start">Começar</button></section></main>`;paint();document.getElementById('start').onclick=cpf}
function header(){const name=state.member?.name||state.person?.name||'Homologação';return `<div class="top"><div class="brand"><h2>Conecta Saúde Comunitária</h2><small>${name} • Sítio Japaranduba</small></div><span class="pill">Morador</span></div>`}
function page(title,lead,body,step,back){app.innerHTML=`<main class="screen"><div class="shell">${header()}<section class="card"><div class="progress">${[1,2,3].map(i=>`<span class="bar ${i<=step?'on':''}"></span>`).join('')}</div><h1 class="title">${title}</h1><p class="lead">${lead}</p>${body}</section><p class="footer">Conecta Saúde Comunitária • homologação v6</p></div></main>`;paint(app);if(back){let b=document.createElement('button');b.className='btn alt';b.textContent='Voltar';b.onclick=back;document.querySelector('.card').appendChild(b)}}
function fmt(v){let d=String(v||'').replace(/\D/g,'').slice(0,11);return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}
function cpf(err=''){page('Acesso do morador','Digite o CPF somente quando estiver correto. A busca só acontece depois que você tocar em confirmar.',`<div class="field"><label>CPF</label><input id="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" maxlength="14" value="${fmt(state.cpf)}"></div><button class="btn" id="next">Confirmar CPF e continuar</button><div class="notice">Homologação segura: este teste não grava CPF, não envia SMS e não vincula seu aparelho a nenhum morador real.</div>${err?`<div class="err">${err}</div>`:''}`,1,null);let inp=document.getElementById('cpf');inp.oninput=()=>{state.cpf=inp.value.replace(/\D/g,'').slice(0,11);inp.value=fmt(state.cpf)};document.getElementById('next').onclick=()=>{if(state.cpf.length!==11)return cpf('Digite os 11 números do CPF.');let p=people.find(x=>x.cpf===state.cpf);if(p){state.person=p;state.member=p;return pin()}dob()}}
function dob(err=''){page('Confirmar nascimento','CPF não localizado na base de teste. Isso não bloqueia a solicitação.',`<div class="field"><label>Data de nascimento</label><input id="dob" inputmode="numeric" placeholder="DD/MM/AAAA" maxlength="10" value="${state.dob}"></div><button class="btn" id="next">Continuar</button><div class="warn">Em produção, essa etapa procurará cadastro antigo por CNS/SUS quando o CPF não existir na linha do morador.</div>${err?`<div class="err">${err}</div>`:''}`,2,cpf);let inp=document.getElementById('dob');inp.oninput=()=>{let d=inp.value.replace(/\D/g,'').slice(0,8);inp.value=d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d;state.dob=inp.value};document.getElementById('next').onclick=()=>{if(!/^\d{2}\/\d{2}\/\d{4}$/.test(state.dob))return dob('Digite a data completa.');state.pending=true;state.person={name:'Morador em identificação',cpf:state.cpf,dob:state.dob,family:'P'};state.member=state.person;pin()}}
function pin(err=''){page('Criar PIN','Escolha 4 números para proteger o acesso neste aparelho.',`<div class="field"><label>PIN</label><input id="p1" inputmode="numeric" type="password" maxlength="4"></div><div class="field"><label>Confirmar PIN</label><input id="p2" inputmode="numeric" type="password" maxlength="4"></div><button class="btn" id="next">Criar PIN</button>${err?`<div class="err">${err}</div>`:''}`,3,cpf);document.getElementById('next').onclick=()=>{let a=document.getElementById('p1').value.replace(/\D/g,''),b=document.getElementById('p2').value.replace(/\D/g,'');if(a.length!==4)return pin('O PIN precisa ter 4 números.');if(a!==b)return pin('Os PINs precisam ser iguais.');state.pin=a;notify()}}
function notify(){page('Notificações','Nesta homologação a permissão é simulada. A solicitação real de Push ficará para a etapa própria.',`<button class="btn" id="next">Continuar para família</button><div class="notice">Nenhum Push real será enviado nesta tela.</div>`,3,pin);document.getElementById('next').onclick=family}
function family(){let list=(state.person.family==='F1'?people:[state.person]).map((p,i)=>`<button class="person" data-i="${i}"><span class="personIcon" style="background:${colors.user}" data-icon="person"></span><span><b>${p.name}</b><small>${p.dob} • Sítio Japaranduba</small></span></button>`).join('');page(state.person.family==='F1'?'Família vinculada':'Identificação pendente',state.person.family==='F1'?'Escolha o integrante para continuar.':'A pendência cadastral não impede o teste da solicitação.',`${state.pending?'<div class="notice">Cadastro em revisão administrativa. O morador continua podendo solicitar atendimento.</div>':''}${list}`,3,notify);document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let arr=state.person.family==='F1'?people:[state.person];state.member=arr[Number(b.dataset.i)];home()});paint(app)}
function home(){let p=state.member||state.person;app.innerHTML=`<main class="screen"><div class="shell"><div class="top"><div class="brand"><h2>Conecta Saúde Comunitária</h2><small>${p.name} • Sítio Japaranduba</small></div><span class="pill">Morador</span></div><div class="notice">Ambiente de teste: nenhuma vaga real será consumida e nenhum Push real será enviado.</div><h1 class="title">Como podemos ajudar?</h1><div class="grid">${module('agenda','Agendas','Dias e horários','calendar')} ${module('pro','Profissionais','Equipe da unidade','doctor')} ${module('serv','Serviços','Solicitações','steth')} ${module('camp','Campanhas','Ações de saúde','meg')} ${module('rec','Recados','Avisos da unidade','bell')} ${module('perfil','Meu Perfil','Dados e família','person')}</div><br><button class="btn alt" id="swap">Trocar integrante da família</button><p class="footer">Conecta Saúde Comunitária • homologação v6</p></div></main>`;paint(app);document.querySelector('[data-m="serv"]').onclick=services;document.querySelector('[data-m="agenda"]').onclick=()=>modal('Agendas','<div class="item"><b>Médica</b><small>Segunda-feira • manhã • disponibilidade simulada.</small><span class="status">teste</span></div><div class="item"><b>Nutricionista</b><small>Atendimento agendado conforme calendário da unidade.</small><span class="status">sem emergência</span></div>');document.querySelector('[data-m="pro"]').onclick=()=>modal('Profissionais','<div class="item"><b>Médica</b><small>Agenda da unidade.</small></div><div class="item"><b>Enfermeira</b><small>Atendimento e orientações.</small></div><div class="item"><b>Nutricionista</b><small>Acompanhamento nutricional.</small></div><div class="item"><b>TACS</b><small>Apoio comunitário e solicitações.</small></div>');document.querySelector('[data-m="camp"]').onclick=()=>modal('Campanhas','<div class="item"><b>Campanha ativa</b><small>Espaço reservado para campanha do mês.</small></div>');document.querySelector('[data-m="rec"]').onclick=()=>modal('Recados','<div class="item"><b>Aviso da unidade</b><small>Confirmação de recebimento será validada em etapa posterior.</small></div>');document.querySelector('[data-m="perfil"]').onclick=()=>modal('Meu Perfil',`<div class="item"><b>${p.name}</b><small>${p.dob} • CPF ${p.cpf?fmt(p.cpf):'em revisão'}</small><span class="status">${state.pending?'pendente':'homologação'}</span></div>`);document.getElementById('swap').onclick=family}
function module(key,title,sub,ic){return `<button class="module" data-m="${key}"><span class="moduleIcon" style="background:${colors[key]}" data-icon="${ic}"></span><b>${title}</b><small>${sub}</small></button>`}
function services(){let arr=[['Atendimento médico','Solicitar avaliação na unidade','doctor'],['Enfermeira','Atendimento e orientação','clipboard'],['Nutricionista','Consulta nutricional','leaf'],['Dentista','Atendimento odontológico','dent'],['Bolsa Família','Acompanhamento obrigatório','family'],['Visita do TACS','Solicitar visita comunitária','person']];let html='<div class="grid">'+arr.map((s,i)=>`<button class="service" data-s="${i}"><span class="serviceIcon" style="background:${colors.serv}" data-icon="${s[2]}"></span><span><b>${s[0]}</b><small>${s[1]}</small></span></button>`).join('')+'</div><div class="field"><label>Descrição</label><textarea id="desc" placeholder="Explique o pedido"></textarea></div><button class="btn" id="send">Enviar solicitação de teste</button>';page('Solicitar serviço','Escolha o serviço em cartões. Não há seletor nativo nem consumo de vaga real.',html,3,home);paint(app);document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-s]').forEach(x=>x.classList.remove('on'));b.classList.add('on');state.service=b.innerText.trim()});document.getElementById('send').onclick=()=>modal('Solicitação enviada','<div class="item"><b>Fluxo concluído em homologação.</b><small>Nenhum cadastro real, vaga real ou Push real foi alterado.</small><span class="status">teste registrado visualmente</span></div>')}
function modal(t,html){panelTitle.textContent=t;panelBody.innerHTML=html;paint(panelBody);panel.classList.add('on')}document.getElementById('closePanel').onclick=()=>panel.classList.remove('on');panel.onclick=e=>{if(e.target===panel)panel.classList.remove('on')};opening();
</script></body></html>
