<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#020812"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Conecta Saúde Comunitária — v9</title><style>:root{--bg:#020812;--bg2:#061426;--card:#0b2338;--card2:#0f314b;--line:#2f78a7;--txt:#fff;--muted:#b6c5d2;--teal:#22e3c8;--blue:#168cff;--danger:#ff4b6e;--shadow:0 24px 58px rgba(0,0,0,.42)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif}body{min-height:100svh;overflow-x:hidden;-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}.opening{min-height:100svh;padding:calc(env(safe-area-inset-top) + 8px) 18px calc(env(safe-area-inset-bottom) + 128px);background:radial-gradient(circle at 50% 26%,rgba(22,116,220,.24),transparent 36%),linear-gradient(180deg,#020812 0,#030b18 62%,#020812 100%);overflow:auto}.stage{position:relative;width:min(100%,430px);height:clamp(306px,40svh,370px);margin:0 auto 10px;display:grid;place-items:center}.rings{position:absolute;width:min(86vw,390px);height:min(86vw,390px);border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 53px,rgba(65,145,235,.23) 54px 55px,transparent 56px 106px);opacity:.82}.rings:before,.rings:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(37,131,255,.26)}.rings:before{inset:12%}.rings:after{inset:27%}.mainLogo{position:absolute;width:clamp(142px,39vw,176px);height:clamp(142px,39vw,176px);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 31% 22%,#fff 0,#c8e9ff 10%,#12396f 34%,#071f58 67%,#030a1a 100%);box-shadow:0 0 0 8px rgba(35,105,255,.14),0 0 0 18px rgba(11,45,98,.25),0 0 42px rgba(39,143,255,.58),inset 0 8px 18px rgba(255,255,255,.56),inset 0 -22px 35px rgba(0,3,20,.72);z-index:3;animation:logoIn .55s ease-out both}.mainLogo svg{width:74%;height:74%;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}.orb{position:absolute;left:50%;top:50%;width:clamp(54px,15vw,70px);height:clamp(54px,15vw,70px);border-radius:50%;display:grid;place-items:center;color:#fff;opacity:0;box-shadow:0 16px 30px rgba(0,0,0,.36),inset 0 4px 8px rgba(255,255,255,.46),inset 0 -13px 22px rgba(0,0,0,.34);z-index:2;animation:emerge 2s cubic-bezier(.18,.86,.22,1) forwards;animation-delay:var(--d)}.orb:before{content:"";position:absolute;inset:6px 8px auto 8px;height:20px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent)}.orb svg{width:58%;height:58%;position:relative;z-index:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.26))}.o1{--l:50%;--t:4%;--d:.08s;background:radial-gradient(circle at 35% 24%,#fff,#58afff 18%,#0756cf 66%,#041847)}.o2{--l:78%;--t:16%;--d:.14s;background:radial-gradient(circle at 35% 24%,#fff,#ffbf5d 18%,#e59b00 66%,#4e3200)}.o3{--l:93%;--t:43%;--d:.20s;background:radial-gradient(circle at 35% 24%,#fff,#63fff0 18%,#03aeb8 66%,#034b5c)}.o4{--l:82%;--t:70%;--d:.26s;background:radial-gradient(circle at 35% 24%,#fff,#ffad4a 18%,#ff4f14 66%,#5a1406)}.o5{--l:50%;--t:86%;--d:.32s;background:radial-gradient(circle at 35% 24%,#fff,#63c8ff 18%,#1685d9 66%,#06315f)}.o6{--l:18%;--t:72%;--d:.38s;background:radial-gradient(circle at 35% 24%,#fff,#ff75b3 18%,#e51871 66%,#520626)}.o7{--l:7%;--t:44%;--d:.44s;background:radial-gradient(circle at 35% 24%,#fff,#b879ff 18%,#7525dd 66%,#260858)}.o8{--l:20%;--t:17%;--d:.50s;background:radial-gradient(circle at 35% 24%,#fff,#ff8fc0 18%,#df176d 66%,#460723)}@keyframes logoIn{from{transform:scale(.76);opacity:0}to{transform:scale(1);opacity:1}}@keyframes emerge{0%{left:50%;top:50%;transform:translate(-50%,-50%) scale(.12);opacity:0}30%{left:50%;top:50%;transform:translate(-50%,-50%) scale(.48);opacity:.9}78%{left:var(--l);top:var(--t);transform:translate(-50%,-50%) scale(1.07);opacity:1}100%{left:var(--l);top:var(--t);transform:translate(-50%,-50%) scale(1);opacity:1}}.copy{width:min(100%,430px);margin:0 auto;text-align:left}.kicker{color:var(--teal);letter-spacing:.30em;font-size:clamp(10px,2.7vw,13px);font-weight:950;margin:0 0 12px}.copy h1{font-size:clamp(31px,7.6vw,45px);line-height:1.09;letter-spacing:-.055em;margin:0 0 15px}.concepts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin:0 0 14px;color:#dbe6ee}.concept{text-align:center;border-left:1px solid rgba(112,172,222,.52);font-size:clamp(11px,3vw,14px);line-height:1.25}.concept:first-child{border-left:0;text-align:left}.concept:last-child{text-align:right}.miniico{height:20px;margin-top:7px;color:#45d8ff}.miniico svg{height:20px;width:28px}.network{text-align:center;color:#9fe3d0;letter-spacing:.25em;font-size:clamp(10px,2.8vw,12px);font-weight:850;margin:0 0 18px}.btn{width:100%;min-height:60px;border:0;border-radius:22px;background:linear-gradient(100deg,#19e0bd,#21c5de 48%,#168cff);color:#06111f;font-size:20px;font-weight:950;box-shadow:0 16px 34px rgba(12,116,211,.32);padding:0 18px}.btn:active{transform:translateY(1px)}.screen{min-height:100svh;background:radial-gradient(circle at 50% 0,rgba(19,82,145,.26),transparent 38%),linear-gradient(180deg,#020812,#061426);padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 96px)}.shell{width:min(100%,620px);margin:0 auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}.brand h2{font-size:23px;line-height:1.08;margin:0;font-weight:900;letter-spacing:-.03em}.brand small{display:block;color:var(--muted);font-size:16px;margin-top:3px}.pill{border:1px solid var(--line);border-radius:999px;color:#9fead7;padding:8px 13px;font-size:14px;white-space:nowrap}.notice{background:#0c2c42;border-left:4px solid var(--teal);border-radius:16px;padding:16px 18px;color:#d7e5ef;font-size:18px;line-height:1.35;margin:14px 0 28px}.title{font-size:clamp(36px,8.3vw,52px);line-height:1.02;letter-spacing:-.055em;margin:0 0 16px}.lead{font-size:20px;line-height:1.42;color:#c3d1dc;margin:0 0 24px}.card{border:1.5px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#0d2c44,#07192d);box-shadow:var(--shadow);padding:20px;margin:0 0 18px}.field{margin:18px 0}.field label{display:block;font-size:19px;font-weight:900;margin:0 0 10px}.field input,.field textarea{width:100%;border:1.6px solid var(--line);border-radius:18px;background:#071d31;color:#fff;padding:0 16px;outline:none}.field input{height:64px;font-size:23px;font-weight:800}.field textarea{min-height:126px;padding-top:14px;font-size:19px;line-height:1.35;resize:none}.field input:focus,.field textarea:focus{box-shadow:0 0 0 4px rgba(32,224,192,.16);border-color:#29d7cd}.warn{color:#ffd371;font-weight:800;font-size:17px;line-height:1.4;margin-top:14px}.err{color:#ff8fa0;font-weight:900;font-size:17px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.module,.person,.service{border:1.5px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#0d2d45,#07192d);color:#fff;text-align:left;box-shadow:0 14px 28px rgba(0,0,0,.22)}.module{min-height:142px;padding:17px}.moduleIcon,.personIcon,.serviceIcon{width:50px;height:50px;border-radius:18px;display:grid;place-items:center;margin-bottom:16px;box-shadow:inset 0 2px 4px rgba(255,255,255,.35),inset 0 -10px 16px rgba(0,0,0,.32),0 10px 22px rgba(0,0,0,.26);background:radial-gradient(circle at 35% 24%,#fff,#63c8ff 18%,#1685d9 66%,#06315f)}.moduleIcon svg,.personIcon svg,.serviceIcon svg{width:30px;height:30px}.module b,.service b{display:block;font-size:21px;line-height:1.05}.module small,.service small,.person small{display:block;color:var(--muted);font-size:16px;line-height:1.25;margin-top:7px}.person{width:100%;display:flex;align-items:center;gap:14px;padding:15px;margin-bottom:12px}.personIcon{margin-bottom:0;flex:none}.person b{font-size:20px}.service{width:100%;min-height:106px;padding:17px;display:flex;align-items:center;gap:14px}.serviceIcon{margin-bottom:0;flex:none}.service.on{border-color:var(--teal);box-shadow:0 0 0 4px rgba(32,224,192,.15),0 14px 28px rgba(0,0,0,.22)}.row{display:flex;gap:12px}.row .btn{min-height:58px}.footer{color:#8299ad;text-align:center;font-size:13px;margin-top:22px}.back{background:transparent;border:1.5px solid var(--line);border-radius:16px;color:white;min-height:48px;padding:0 14px;font-weight:850}.panel{position:fixed;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(10px);display:none;align-items:flex-end;z-index:9}.panel.on{display:flex}.drawer{width:100%;max-height:86svh;overflow:auto;background:#071426;border:1px solid #173e5b;border-radius:28px 28px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 22px);box-shadow:0 -24px 50px rgba(0,0,0,.46)}.drawerHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.drawerHead h3{font-size:28px;line-height:1.05;margin:0}.x{width:48px;height:48px;border-radius:16px;border:1px solid var(--line);background:#0b2237;color:#fff;font-size:28px}.item{border:1px solid #2d6f99;border-radius:18px;background:#0b2237;padding:15px;margin:10px 0}.item b{display:block;font-size:18px}.item small{display:block;color:var(--muted);margin-top:5px;font-size:16px;line-height:1.35}.status{display:inline-flex;border-radius:999px;padding:7px 11px;background:rgba(32,224,192,.14);color:#9cebd9;font-size:13px;font-weight:900;margin-top:10px}.profileBtns{display:grid;gap:12px}.profileBtns .module{min-height:auto}.roleTag{display:inline-block;border-radius:999px;border:1px solid #2d6f99;padding:5px 10px;color:#9fead7;font-size:12px;margin-top:12px;font-weight:900}@media(max-width:380px){.opening{padding-left:16px;padding-right:16px}.stage{height:300px;min-height:295px}.copy h1{font-size:30px}.title{font-size:35px}.lead{font-size:19px}.module{min-height:132px;padding:15px}.module b{font-size:20px}.grid{gap:11px}.btn{min-height:58px}}</style></head><body><div id="app"></div><div class="panel" id="panel"><div class="drawer"><div class="drawerHead"><h3 id="panelTitle"></h3><button class="x" id="closePanel">×</button></div><div id="panelBody"></div></div></div><script>const app=document.getElementById('app'),panel=document.getElementById('panel'),panelTitle=document.getElementById('panelTitle'),panelBody=document.getElementById('panelBody');const st={cpf:'',pin:'',role:'morador',person:{name:'João de Souza',local:'Sítio Japaranduba'}};const icons={logo:`<svg viewBox="0 0 120 120" fill="none"><path d="M76 25A40 40 0 1 0 77 94" stroke="white" stroke-width="18" stroke-linecap="round"/><path d="M80 47v32M64 63h32" stroke="#5ff1dd" stroke-width="18" stroke-linecap="round"/></svg>`,tooth:`<svg viewBox="0 0 64 64" fill="none"><path d="M20 11c6-3 9 1 12 1s6-4 12-1c8 4 8 18 3 29-3 7-4 13-9 13-4 0-3-10-6-10s-2 10-6 10c-5 0-6-6-9-13-5-11-5-25 3-29Z" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,run:`<svg viewBox="0 0 64 64" fill="none"><path d="M35 14a5 5 0 1 1-10 0 5 5 0 0 1 10 0ZM28 23l-8 11 12 5 5 12M36 28l8 5M30 39l-12 10" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,leaf:`<svg viewBox="0 0 64 64" fill="none"><path d="M48 16C28 17 17 28 18 48c20-1 31-12 30-32Z" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 47c8-11 16-18 28-30" stroke="white" stroke-width="5" stroke-linecap="round"/></svg>`,brain:`<svg viewBox="0 0 64 64" fill="none"><path d="M23 45H16a8 8 0 0 1-1-16 10 10 0 0 1 19-5 11 11 0 1 1 7 21h-5" stroke="white" stroke-width="5" stroke-linecap="round"/><path d="M27 35h10M32 30v10" stroke="white" stroke-width="4" stroke-linecap="round"/></svg>`,user:`<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="20" r="10" fill="white"/><path d="M15 53c2-12 11-18 17-18s15 6 17 18" fill="white"/></svg>`,pro:`<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="16" r="7" fill="white"/><path d="M18 54c2-13 9-22 14-22s12 9 14 22" fill="white"/><path d="M24 39h16" stroke="#0b2458" stroke-width="4" stroke-linecap="round"/></svg>`,nurse:`<svg viewBox="0 0 64 64" fill="none"><path d="M21 26h22v23H21z" fill="white"/><circle cx="32" cy="18" r="8" fill="white"/><path d="M23 10h18v9H23z" fill="white"/><path d="M32 12v5M29 15h6" stroke="#0b2458" stroke-width="3" stroke-linecap="round"/></svg>`,group:`<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="23" r="8" fill="#55caff"/><circle cx="19" cy="27" r="6" fill="#55caff"/><circle cx="45" cy="27" r="6" fill="#55caff"/><path d="M15 52c2-10 10-15 17-15s15 5 17 15" fill="#55caff"/><path d="M5 52c2-8 8-12 14-12M59 52c-2-8-8-12-14-12" stroke="#55caff" stroke-width="5" stroke-linecap="round"/></svg>`,home:`<svg viewBox="0 0 64 64" fill="none"><path d="M9 30 32 12l23 18v23H39V38H25v15H9V30Z" fill="#55caff"/></svg>`};function icon(k){return icons[k]||icons.user}function opening(){app.innerHTML=`<main class="opening"><section class="stage"><div class="rings"></div><div class="mainLogo">${icon('logo')}</div><div class="orb o1">${icon('tooth')}</div><div class="orb o2">${icon('leaf')}</div><div class="orb o3">${icon('pro')}</div><div class="orb o4">${icon('run')}</div><div class="orb o5">${icon('user')}</div><div class="orb o6">${icon('user')}</div><div class="orb o7">${icon('brain')}</div><div class="orb o8">${icon('nurse')}</div></section><section class="copy"><div class="kicker">CONECTA SAÚDE COMUNITÁRIA</div><h1>Saúde, comunidade e cuidado conectados.</h1><div class="concepts"><div class="concept">CONECTA<br>PESSOAS<div class="miniico">${icon('group')}</div></div><div class="concept">PROMOVE<br>SAÚDE<div class="miniico">${icon('leaf')}</div></div><div class="concept">FORTALECE<br>A COMUNIDADE<div class="miniico">${icon('home')}</div></div></div><div class="network">TACS + COMUNIDADE + UNIDADE</div><button class="btn" id="start">Começar ›</button></section></main>`;document.getElementById('start').onclick=access}function screen(title,lead,body,back){app.innerHTML=`<main class="screen"><div class="shell"><div class="top"><button class="back" id="back">‹ Voltar</button><span class="pill">Homologação v9</span></div><h1 class="title">${title}</h1><p class="lead">${lead}</p>${body}<p class="footer">Teste seguro: não grava CPF, não envia SMS e não vincula aparelho a morador real.</p></div></main>`;document.getElementById('back').onclick=back||opening}function access(err=''){screen('Acesso único','Um app só. O perfil liberado define se a pessoa entra como morador, TACS, profissional da unidade ou administrador.',`<div class="card"><div class="field"><label>CPF</label><input id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00"></div><button class="btn" id="go">Confirmar CPF e continuar</button>${err?`<div class="err">${err}</div>`:''}<div class="warn">A busca só acontece depois do toque no botão.</div></div>`,opening);const cpf=document.getElementById('cpf');cpf.oninput=()=>{let d=cpf.value.replace(/\D/g,'').slice(0,11);cpf.value=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')};document.getElementById('go').onclick=()=>pin()}function pin(){screen('PIN de acesso','Crie e confirme um PIN de 4 números para continuar no teste.',`<div class="card"><div class="field"><label>PIN</label><input id="p1" inputmode="numeric" type="password" maxlength="4"></div><div class="field"><label>Confirmar PIN</label><input id="p2" inputmode="numeric" type="password" maxlength="4"></div><button class="btn" id="go">Continuar</button><div id="e" class="err"></div></div>`,access);document.getElementById('go').onclick=()=>{let a=p1.value,b=p2.value;if(a.length!==4||a!==b){e.textContent='Confira o PIN.';return}roles()}}function roles(){screen('Escolha o perfil de teste','No app real, isso virá das permissões do cadastro. Aqui é só para homologar o app único.',`<div class="profileBtns"><button class="module" data-r="morador"><b>Morador</b><small>Família, recados, campanhas, agenda, serviços e perfil.</small></button><button class="module" data-r="tacs"><b>TACS</b><small>Área, moradores, solicitações, campanhas e agenda da unidade.</small></button><button class="module" data-r="profissional"><b>Profissional da unidade</b><small>Agenda, vagas, atendimentos, serviços e avisos.</small></button><button class="module" data-r="admin"><b>Administrador</b><small>Painéis administrativos completos do projeto.</small></button></div>`,pin);document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{st.role=b.dataset.r;home()})}function home(){const name=st.role==='admin'?'Administrador':st.role==='tacs'?'TACS':st.role==='profissional'?'Profissional da unidade':'Morador';const modules=st.role==='admin'?['Moradores','Suporte aos moradores','Recados e campanhas','Agendas e vagas','Profissionais e serviços','TACS e áreas','Municípios e organizações','Portal do Morador']:st.role==='tacs'?['Solicitações da área','Moradores da microárea','Recados','Campanhas','Agenda da unidade','Acompanhamento da comunidade']:st.role==='profissional'?['Minha agenda','Vagas','Atendimentos','Serviços vinculados','Avisos da unidade','Profissionais']:['Agendas','Profissionais','Serviços','Campanhas','Recados','Meu Perfil'];screen('Como podemos ajudar?',`Conecta Saúde Comunitária • ${name} • ${st.person.local}`,`<div class="notice">Ambiente de teste. Nenhuma vaga real será consumida e nenhum Push real será enviado.</div><div class="grid">${modules.map((m,i)=>`<button class="module" onclick="openPanel('${m.replace(/'/g,'')}')"><div class="moduleIcon">${icon(['tooth','pro','brain','leaf','user','nurse','group','home'][i%8])}</div><b>${m}</b><small>${desc(m)}</small></button>`).join('')}</div><button class="btn" style="margin-top:18px" onclick="roles()">Trocar perfil de teste</button>`,roles)}function desc(m){return {'Moradores':'Buscar, cadastrar e atualizar moradores.','Suporte aos moradores':'Diagnóstico sem alterar vínculos existentes.','Recados e campanhas':'Publicar informações e acompanhar avisos.','Agendas e vagas':'Dias, horários, vagas e situação.','Profissionais e serviços':'Cadastro e disponibilidade da unidade.','TACS e áreas':'Cadastro territorial e agentes.','Municípios e organizações':'Estrutura global e vínculos.','Portal do Morador':'Abrir portal público da área.'}[m]||'Módulo em homologação.'}window.openPanel=function(t){panelTitle.textContent=t;panelBody.innerHTML=`<div class="item"><b>${t}</b><small>Este módulo pertence ao app único Conecta Saúde Comunitária e será liberado conforme o perfil de acesso.</small><span class="status">homologação</span></div>`;panel.classList.add('on')};document.getElementById('closePanel').onclick=()=>panel.classList.remove('on');opening();</script></body></html>
