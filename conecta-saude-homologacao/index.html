<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020817">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Conecta Saúde Comunitária</title>
<style>
html,body{margin:0;min-height:100%;background:#020817;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}#loading{min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box;color:#cbd8e2}#loading strong{display:block;color:#fff;font-size:20px;margin-bottom:8px}#loading small{color:#8fa5b7}
</style>
</head>
<body>
<div id="loading"><div><strong>Conecta Saúde Comunitária</strong>Carregando versão de homologação…</div></div>
<script>
(async()=>{
  try{
    const files=['gz-00.b64','gz-01.b64','gz-02.b64','gz-03.b64','gz-04.b64'];
    const parts=await Promise.all(files.map(async n=>{
      const r=await fetch(n+'?v=20260908-2',{cache:'no-store'});
      if(!r.ok) throw new Error('Falha ao carregar '+n+' ('+r.status+')');
      return r.text();
    }));
    const b64=parts.join('').replace(/\s+/g,'');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    if(!('DecompressionStream' in window)) throw new Error('Este navegador precisa ser atualizado para abrir a homologação.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    if(!/^\s*<!doctype html/i.test(html)) throw new Error('Pacote da aplicação inválido.');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='<div><strong>Não foi possível carregar o teste.</strong><small>'+String(e.message||e)+'</small></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
