<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#020817">
  <title>Conecta Saúde Comunitária</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020817;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100svh;display:grid;place-items:center;padding:24px;text-align:center}main{width:min(100%,460px)}.mark{width:92px;height:92px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle,#155d95,#073a55 62%,#020817);box-shadow:0 0 42px rgba(22,140,255,.35)}h1{font-size:28px;line-height:1.05;margin:0 0 10px;letter-spacing:-.03em}p{margin:0;color:#b8c9d5;line-height:1.45}.bar{height:7px;margin:22px 0 12px;border-radius:999px;background:#10283f;overflow:hidden}.bar span{display:block;width:45%;height:100%;border-radius:999px;background:linear-gradient(90deg,#18e2b4,#168cff);animation:load 1.1s ease-in-out infinite}@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(245%)}}.err{margin-top:16px;padding:14px;border:1px solid #9f4754;border-radius:16px;background:#2a1119;color:#ffd5db;text-align:left;font-size:14px;white-space:pre-wrap}.small{font-size:12px;margin-top:14px;color:#7890a2}</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1>Conecta Saúde Comunitária</h1>
  <p id="status">Carregando versão de homologação pelo GitHub Pages.</p>
  <div class="bar" aria-hidden="true"><span></span></div>
  <p class="small">Ambiente de teste. Nenhum dado real será alterado.</p>
  <div id="error" class="err" hidden></div>
</main>
<script>
(function(){
  'use strict';
  var version = '20260908-1730';
  var chunks = ['gz-01.b64','gz-02.b64','gz-03.b64','gz-04.b64'];
  var status = document.getElementById('status');
  var box = document.getElementById('error');
  function fail(message){
    status.textContent = 'Não foi possível carregar a homologação.';
    box.hidden = false;
    box.textContent = message + '\n\nAtualize a página. Se continuar, informe este erro.';
  }
  function b64ToBytes(base64){
    var clean = String(base64 || '').replace(/\s+/g,'');
    var binary = atob(clean);
    var bytes = new Uint8Array(binary.length);
    for(var i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }
  async function gunzip(bytes){
    if(!('DecompressionStream' in window)) throw new Error('Este navegador não tem DecompressionStream para abrir o pacote comprimido.');
    var ds = new DecompressionStream('gzip');
    var stream = new Blob([bytes]).stream().pipeThrough(ds);
    return await new Response(stream).text();
  }
  async function start(){
    try{
      status.textContent = 'Baixando arquivos da homologação...';
      var parts = await Promise.all(chunks.map(function(name){
        return fetch(name + '?v=' + version, {cache:'no-store'}).then(function(r){
          if(!r.ok) throw new Error(name + ' retornou HTTP ' + r.status);
          return r.text();
        });
      }));
      status.textContent = 'Abrindo aplicação...';
      var html = await gunzip(b64ToBytes(parts.join('')));
      if(!/^\s*<!doctype html|^\s*<html/i.test(html)) throw new Error('O pacote carregou, mas não parece conter HTML válido.');
      document.open();
      document.write(html);
      document.close();
    }catch(e){
      fail(e && e.message ? e.message : String(e));
    }
  }
  start();
}());
</script>
</body>
</html>
