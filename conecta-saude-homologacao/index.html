<!doctype html>
<html lang="pt-BR">
<head>

<title>Conecta Saúde Comunitária — v11</title>
<style>
:root{--bg:#020812;--teal:#22ead0;--blue:#168cff;--line:#1e72c8;--muted:#b8c8d6;--r:min(37vw,156px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100svh;overflow-x:hidden;-webkit-font-smoothing:antialiased}button,input{font:inherit}.opening{min-height:100svh;padding:calc(env(safe-area-inset-top) + 8px) 18px calc(env(safe-area-inset-bottom) + 128px);background:radial-gradient(circle at 50% 28%,rgba(16,110,205,.30),transparent 38%),linear-gradient(180deg,#020812 0,#030b18 62%,#020812 100%);overflow:auto}.wrap{width:min(100%,430px);margin:0 auto}.stage{height:clamp(330px,46svh,438px);position:relative;display:grid;place-items:center;overflow:hidden;margin:0 auto 12px;isolation:isolate}.hex{position:absolute;inset:2% 0 0;width:100%;height:100%;opacity:.72;filter:drop-shadow(0 0 10px rgba(22,132,255,.32))}.hex polygon{fill:none;stroke:rgba(34,125,235,.50);stroke-width:.75}.hex circle{fill:#2de9ff;filter:drop-shadow(0 0 7px #2de9ff)}.rings{position:absolute;left:50%;top:50%;width:min(88vw,396px);height:min(88vw,396px);transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(44,137,255,.30);box-shadow:0 0 34px rgba(22,126,255,.22),inset 0 0 42px rgba(30,119,255,.18)}.rings:before,.rings:after{content:"";position:absolute;border-radius:50%;inset:10%;border:1px solid rgba(67,148,255,.22)}.rings:after{inset:26%}.trail{position:absolute;left:50%;top:50%;width:min(86vw,384px);height:min(86vw,384px);transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(from 250deg,transparent 0 9%,rgba(48,202,255,.95) 11%,transparent 17%,transparent 37%,rgba(30,147,255,.9) 42%,transparent 49%,transparent 70%,rgba(255,178,71,.88) 74%,transparent 82%,transparent 100%);mask:radial-gradient(circle,transparent 0 78%,#000 79% 82%,transparent 83%);z-index:2;animation:trailSpin 3.2s linear infinite}.logo{position:absolute;width:clamp(164px,44vw,210px);height:clamp(164px,44vw,210px);border-radius:50%;display:grid;place-items:center;z-index:5;background:radial-gradient(circle at 31% 22%,#fff 0,#c7e8ff 10%,#12396f 34%,#071f58 67%,#030a1a 100%);box-shadow:0 0 0 8px rgba(35,105,255,.16),0 0 0 20px rgba(11,45,98,.28),0 0 48px rgba(39,143,255,.65),inset 0 8px 18px rgba(255,255,255,.56),inset 0 -23px 35px rgba(0,3,20,.72);animation:pulse 6.2s ease-in-out infinite}.logo svg{width:74%;height:74%;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}.orbit{position:absolute;left:50%;top:50%;width:0;height:0;z-index:7;transform-origin:0 0;animation:orbitReturn 9.8s cubic-bezier(.28,.9,.21,1) infinite}.spin{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;animation:orbitSpin 9.8s linear infinite}.bubble{position:absolute;left:0;top:0;width:clamp(58px,15.5vw,74px);height:clamp(58px,15.5vw,74px);border-radius:50%;display:grid;place-items:center;transform:rotate(var(--a)) translate(var(--r)) rotate(calc(-1 * var(--a))) translate(-50%,-50%);box-shadow:0 16px 30px rgba(0,0,0,.36),inset 0 4px 8px rgba(255,255,255,.46),inset 0 -13px 22px rgba(0,0,0,.34);filter:drop-shadow(0 0 10px rgba(28,160,255,.26))}.bubble:before{content:"";position:absolute;inset:6px 8px auto 8px;height:20px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.56),transparent)}.bubble svg{width:56%;height:56%;position:relative;z-index:1;fill:#fff;stroke:#fff;stroke-width:0}.spin .bubble svg{animation:counterSpin 9.8s linear infinite}.b1{background:radial-gradient(circle at 35% 24%,#fff,#58afff 18%,#0756cf 66%,#041847)}.b2{background:radial-gradient(circle at 35% 24%,#fff,#22ef7b 18%,#05a844 66%,#033719)}.b3{background:radial-gradient(circle at 35% 24%,#fff,#ab72ff 18%,#7026da 66%,#230750)}.b4{background:radial-gradient(circle at 35% 24%,#fff,#ff75b3 18%,#e51871 66%,#520626)}.b5{background:radial-gradient(circle at 35% 24%,#fff,#63c8ff 18%,#1685d9 66%,#06315f)}.b6{background:radial-gradient(circle at 35% 24%,#fff,#ffad4a 18%,#ff4f14 66%,#5a1406)}.b7{background:radial-gradient(circle at 35% 24%,#fff,#61fff0 18%,#05aeb6 66%,#034b5c)}.b8{background:radial-gradient(circle at 35% 24%,#fff,#ffcc5f 18%,#d99a00 66%,#4e3200)}.copy{text-align:center;position:relative;z-index:3}.kicker{color:var(--teal);letter-spacing:.29em;font-size:clamp(11px,2.85vw,14px);line-height:1.25;font-weight:950;margin:0 0 12px;text-shadow:0 0 14px rgba(34,234,208,.5)}.copy h1{font-size:clamp(34px,8vw,47px);line-height:1.08;letter-spacing:-.055em;margin:0 0 20px;font-weight:950;text-shadow:0 5px 18px rgba(0,0,0,.62)}.sep{height:1px;background:linear-gradient(90deg,transparent,rgba(34,190,255,.85),transparent);position:relative;margin:0 0 18px}.sep:after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:50%;background:#6ff5ff;transform:translate(-50%,-50%);box-shadow:0 0 18px #30cfff}.concepts{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;gap:0;margin:0 0 18px}.concept{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;text-align:left;min-height:50px;border-left:1px solid rgba(43,218,206,.8);padding:0 8px;font-size:clamp(10.5px,2.8vw,13px);line-height:1.18}.concept:first-child{border-left:0;padding-left:0}.concept svg{width:32px;height:32px;filter:drop-shadow(0 0 10px rgba(34,234,208,.3))}.people svg{fill:#22eacb}.heart svg{fill:#168cff}.house svg{fill:#f2b827}.network{display:flex;align-items:center;justify-content:center;gap:16px;color:#fff;letter-spacing:.28em;font-size:clamp(12px,3vw,15px);font-weight:850;margin:0 0 24px;white-space:nowrap}.network .plus{color:var(--teal);font-size:22px;letter-spacing:0;text-shadow:0 0 12px rgba(34,234,208,.7)}.btn{width:100%;min-height:64px;border:0;border-radius:22px;background:linear-gradient(100deg,#16eac8,#21c5de 50%,#168cff);color:#06111f;font-size:21px;font-weight:950;box-shadow:0 0 26px rgba(33,197,222,.38),0 16px 34px rgba(12,116,211,.34);padding:0 18px;display:flex;align-items:center;justify-content:center;gap:12px}.btn:active{transform:translateY(1px)}.screen{min-height:100svh;background:radial-gradient(circle at 50% 0,rgba(19,82,145,.26),transparent 38%),linear-gradient(180deg,#020812,#061426);padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 96px)}.shell{width:min(100%,620px);margin:0 auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}.brand h2{font-size:23px;line-height:1.08;margin:0;font-weight:900}.brand small{display:block;color:var(--muted);font-size:16px;margin-top:3px}.pill{border:1px solid #2f78a7;border-radius:999px;color:#9fead7;padding:8px 13px;font-size:14px}.title{font-size:clamp(36px,8.3vw,52px);line-height:1.02;letter-spacing:-.055em;margin:0 0 16px}.lead{font-size:20px;line-height:1.42;color:#c3d1dc;margin:0 0 24px}.card{border:1.5px solid #2f78a7;border-radius:24px;background:linear-gradient(160deg,#0d2c44,#07192d);box-shadow:0 20px 45px rgba(0,0,0,.3);padding:20px;margin:0 0 18px}.field{margin:18px 0}.field label{display:block;font-size:19px;font-weight:900;margin:0 0 10px}.field input{width:100%;height:64px;border:1.6px solid #2f78a7;border-radius:18px;background:#071d31;color:#fff;padding:0 16px;outline:none;font-size:23px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.module{border:1.5px solid #2f78a7;border-radius:24px;background:linear-gradient(160deg,#0d2d45,#07192d);color:#fff;text-align:left;box-shadow:0 14px 28px rgba(0,0,0,.22);padding:17px;min-height:132px}.module b{display:block;font-size:21px;line-height:1.05}.module small{display:block;color:#a9bbcb;font-size:16px;line-height:1.25;margin-top:7px}.back{background:transparent;border:1.5px solid #2f78a7;border-radius:16px;color:white;min-height:48px;padding:0 14px;font-weight:850}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}@keyframes orbitReturn{0%{transform:scale(.04);opacity:0}12%{transform:scale(1);opacity:1}62%{transform:scale(1);opacity:1}78%{transform:scale(.04);opacity:.35}100%{transform:scale(.04);opacity:0}}@keyframes orbitSpin{0%,12%{transform:rotate(0deg)}62%{transform:rotate(360deg)}100%{transform:rotate(360deg)}}@keyframes counterSpin{0%,12%{transform:rotate(0deg)}62%{transform:rotate(-360deg)}100%{transform:rotate(-360deg)}}@keyframes trailSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}@media(max-width:380px){:root{--r:min(37vw,148px)}.opening{padding-left:16px;padding-right:16px}.stage{height:clamp(318px,45svh,370px)}.logo{width:150px;height:150px}.bubble{width:58px;height:58px}.copy h1{font-size:31px}.kicker{font-size:10.5px}.concept{font-size:10px;gap:5px;padding:0 5px}.concept svg{width:26px;height:26px}.network{font-size:11px;gap:10px;letter-spacing:.22em}.btn{min-height:60px;font-size:20px}}
</style>
</head>
<body><div id="app"></div><script>
const app=document.getElementById('app');
const I={logo:`<svg viewBox="0 0 120 120" fill="none"><path d="M76 24A40 40 0 1 0 77 96" stroke="white" stroke-width="18" stroke-linecap="round"/><path d="M82 47v32M66 63h32" stroke="#61f2dd" stroke-width="18" stroke-linecap="round"/></svg>`,home:`<svg viewBox="0 0 64 64"><circle cx="23" cy="21" r="9"/><path d="M9 55c1-13 8-23 16-23s15 10 16 23H9Z"/><path d="M35 31l11-9 11 9v22H35V31Z"/><path d="M43 53V40h8v13" fill="#07204b"/></svg>`,doctor:`<svg viewBox="0 0 64 64"><circle cx="32" cy="19" r="10"/><path d="M15 57c2-17 11-26 17-26s15 9 17 26H15Z"/><path d="M22 37v10a10 10 0 0 0 20 0V37" fill="none" stroke="white" stroke-width="4"/><circle cx="45" cy="47" r="4"/></svg>`,nurse:`<svg viewBox="0 0 64 64"><path d="M20 13h24v13H20z"/><path d="M29 15h6v9h-6z" fill="#220750"/><path d="M27 18h10v3H27z" fill="#220750"/><circle cx="32" cy="31" r="10"/><path d="M16 57c3-14 10-21 16-21s13 7 16 21H16Z"/></svg>`,care:`<svg viewBox="0 0 64 64"><circle cx="29" cy="18" r="9"/><path d="M12 56c2-15 10-25 18-25 7 0 12 5 15 12"/><path d="M47 56s-12-7-12-16c0-5 3-8 7-8 3 0 5 2 5 4 1-2 3-4 6-4 4 0 7 3 7 8 0 9-13 16-13 16Z"/></svg>`,tooth:`<svg viewBox="0 0 64 64"><path d="M20 11c6-3 9 1 12 1s6-4 12-1c8 4 8 18 3 29-3 7-4 13-9 13-4 0-3-10-6-10s-2 10-6 10c-5 0-6-6-9-13-5-11-5-25 3-29Z"/></svg>`,run:`<svg viewBox="0 0 64 64"><circle cx="37" cy="12" r="6"/><path d="M32 22l-9 10 10 6 8 14" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 25l12 4" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/><path d="M29 39l-12 13" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/><path d="M14 56h36" stroke="white" stroke-width="4" stroke-linecap="round"/></svg>`,brain:`<svg viewBox="0 0 64 64"><path d="M18 43V21c0-7 5-12 12-12 5 0 9 2 12 6 7 1 11 7 11 14 0 8-6 14-15 14H18Z" fill="none" stroke="white" stroke-width="5" stroke-linejoin="round"/><path d="M30 12v31M42 17c-6 1-8 5-8 10m-3-7c-5 2-7 6-7 12" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/></svg>`,leaf:`<svg viewBox="0 0 64 64"><path d="M14 42c22 2 35-10 39-30-21 2-35 12-39 30Z"/><path d="M19 41c9-7 18-13 29-20" stroke="#4e3200" stroke-width="4" stroke-linecap="round"/></svg>`};
function lower(k){if(k==='people')return `<svg viewBox="0 0 64 64"><circle cx="32" cy="17" r="10"/><circle cx="16" cy="22" r="7"/><circle cx="48" cy="22" r="7"/><path d="M16 52c1-13 9-22 16-22s15 9 16 22H16Z"/><path d="M3 52c1-10 6-17 13-17 3 0 6 1 8 3-4 4-7 9-8 14H3ZM48 52c-1-5-4-10-8-14 2-2 5-3 8-3 7 0 12 7 13 17H48Z"/></svg>`;if(k==='heart')return `<svg viewBox="0 0 64 64"><path d="M32 55S7 39 7 21c0-9 6-15 14-15 5 0 9 3 11 7 2-4 6-7 11-7 8 0 14 6 14 15 0 18-25 34-25 34Z"/><path d="M16 32h10l4-10 8 21 5-11h7" fill="none" stroke="#04111f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;return `<svg viewBox="0 0 64 64"><path d="M7 30 32 9l25 21v24a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3V30Z"/><path d="M32 29v17M24 37h16" stroke="#04111f" stroke-width="5" stroke-linecap="round"/></svg>`}
function splash(){app.innerHTML=`<main class="opening"><div class="wrap"><section class="stage"><svg class="hex" viewBox="0 0 430 430" preserveAspectRatio="xMidYMid meet"><polygon points="215,18 370,108 370,288 215,378 60,288 60,108"/><polygon points="215,70 324,133 324,258 215,321 106,258 106,133"/><polygon points="215,118 282,157 282,235 215,274 148,235 148,157"/><circle cx="215" cy="18" r="3.5"/><circle cx="370" cy="108" r="3.5"/><circle cx="370" cy="288" r="3.5"/><circle cx="215" cy="378" r="3.5"/><circle cx="60" cy="288" r="3.5"/><circle cx="60" cy="108" r="3.5"/></svg><div class="rings"></div><div class="trail"></div><div class="logo">${I.logo}</div><div class="orbit"><div class="spin"><span class="bubble b1" style="--a:-120deg">${I.home}</span><span class="bubble b2" style="--a:-60deg">${I.doctor}</span><span class="bubble b3" style="--a:0deg">${I.nurse}</span><span class="bubble b4" style="--a:30deg">${I.care}</span><span class="bubble b5" style="--a:70deg">${I.tooth}</span><span class="bubble b6" style="--a:110deg">${I.run}</span><span class="bubble b7" style="--a:150deg">${I.brain}</span><span class="bubble b8" style="--a:-180deg">${I.leaf}</span></div></div></section><section class="copy"><div class="kicker">CONECTA SAÚDE COMUNITÁRIA</div><h1>Saúde, comunidade e cuidado conectados.</h1><div class="sep"></div><div class="concepts"><div class="concept people">${lower('people')}<span>CONECTA<br>PESSOAS</span></div><div class="concept heart">${lower('heart')}<span>PROMOVE<br>SAÚDE</span></div><div class="concept house">${lower('house')}<span>FORTALECE<br>A COMUNIDADE</span></div></div><div class="network"><span>TACS</span><span class="plus">+</span><span>COMUNIDADE</span><span class="plus">+</span><span>UNIDADE</span></div><button class="btn" id="access">Acessar conta <span>›</span></button></section></div></main>`;document.getElementById('access').onclick=access}
function access(){app.innerHTML=`<main class="screen"><div class="shell"><div class="top"><div class="brand"><h2>Conecta Saúde Comunitária</h2><small>Aplicativo único por perfil</small></div><span class="pill">Homologação</span></div><h1 class="title">Acesso</h1><p class="lead">Teste visual da abertura canônica. Nenhum CPF, SMS, Push ou vínculo real é gravado.</p><div class="card"><div class="field"><label>CPF</label><input inputmode="numeric" placeholder="000.000.000-00"></div><button class="btn" onclick="profiles()">Continuar</button></div><button class="back" onclick="splash()">Voltar para abertura</button></div></main>`}
function profiles(){app.innerHTML=`<main class="screen"><div class="shell"><div class="top"><div class="brand"><h2>Conecta Saúde Comunitária</h2><small>Morador • TACS • Profissional • Administrador</small></div><span class="pill">App único</span></div><h1 class="title">Escolha de perfil de teste</h1><p class="lead">Na versão real, o perfil aparece conforme permissão do servidor.</p><div class="grid"><button class="module"><b>Morador</b><small>Família, recados, campanhas, serviços e perfil.</small></button><button class="module"><b>TACS</b><small>Área, solicitações, moradores e acompanhamento.</small></button><button class="module"><b>Profissional</b><small>Agenda, vagas, atendimentos e avisos da unidade.</small></button><button class="module"><b>Administrador</b><small>Painéis administrativos herdados do Portal TACS.</small></button></div><br><button class="back" onclick="splash()">Voltar para abertura</button></div></main>`}
splash();
</script></body></html>
