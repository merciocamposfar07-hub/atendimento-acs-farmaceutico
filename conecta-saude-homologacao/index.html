<style>
:root{--ink:#102033;--muted:#617184;--paper:#fffaf3;--sheet:#f4f8fb;--orange:#f47b20;--orange2:#ff9b38;--teal:#168f93;--teal2:#49ddd4;--blue:#0c4668;--soft:#e8f1f5;--danger:#d73535;--warn:#8a560e;--shadow:0 22px 55px rgba(25,38,55,.16)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#07131f;color:var(--ink)}body{min-height:100svh;overflow-x:hidden}.app{min-height:100svh;background:linear-gradient(180deg,#f47b20 0,#ff8f2f 24%,#fff4e6 24.3%,#f4f8fb 100%);max-width:520px;margin:0 auto;position:relative}.header{padding:calc(env(safe-area-inset-top) + 18px) 18px 18px;color:#fff}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand h2{font-size:22px;line-height:1.02;margin:0;font-weight:950;letter-spacing:-.045em}.brand small{display:block;margin-top:3px;color:rgba(255,255,255,.82);font-weight:760}.bell{position:relative;border:0;border-radius:18px;background:rgba(255,255,255,.20);width:52px;height:52px;display:grid;place-items:center;box-shadow:inset 0 1px rgba(255,255,255,.32),0 10px 22px rgba(100,48,8,.18)}.bell svg{width:26px}.badge{position:absolute;right:7px;top:7px;min-width:20px;height:20px;border-radius:50%;background:var(--danger);color:white;font-size:12px;font-weight:950;display:grid;place-items:center;border:2px solid #f47b20}.sheet{margin:-8px 12px 0;background:var(--sheet);border-radius:32px 32px 0 0;min-height:calc(100svh - 112px);padding:18px 14px calc(env(safe-area-inset-bottom) + 24px);box-shadow:0 -15px 42px rgba(37,49,67,.16)}.card{background:var(--paper);border:1px solid rgba(16,32,51,.08);border-radius:28px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.title{font-size:27px;line-height:1.05;margin:0 0 9px;font-weight:950;letter-spacing:-.048em}.sub{margin:0;color:var(--muted);font-size:15.8px;line-height:1.43;font-weight:610}.progress{display:flex;gap:6px;margin:4px 0 18px}.dot{height:7px;flex:1;border-radius:99px;background:#d8e1eb}.dot.on{background:linear-gradient(90deg,#13969a,#50d9d1)}.field{margin:16px 0}.field label{display:block;text-align:left;font-size:13px;font-weight:900;color:#39485b;margin:0 0 8px}.field input,.field textarea{width:100%;border-radius:20px;border:1px solid rgba(16,32,51,.16);background:#fff;padding:0 16px;color:#102033;outline:none;box-shadow:inset 0 1px 2px rgba(16,32,51,.04);font-weight:800}.field input{height:60px;font-size:22px}.field textarea{min-height:112px;padding-top:14px;font-size:17px;line-height:1.35;resize:none}.field input:focus,.field textarea:focus{border-color:#1aaea8;box-shadow:0 0 0 4px rgba(50,212,200,.18)}.btn{width:100%;min-height:58px;border:0;border-radius:21px;background:linear-gradient(135deg,#0e677e,#0b405e);color:#fff;font-size:17px;font-weight:950;box-shadow:0 14px 28px rgba(12,66,95,.25);padding:0 16px}.btn.orange{background:linear-gradient(135deg,#ff9b38,#f47b20);box-shadow:0 14px 28px rgba(244,123,32,.28)}.btn.alt{background:#fff;color:#17324b;border:1px solid rgba(16,32,51,.12);box-shadow:none}.btn:active{transform:translateY(1px)}.row{display:flex;gap:10px}.notice{border-radius:22px;padding:14px 15px;background:#eaf7f5;border:1px solid rgba(19,133,111,.18);color:#105847;font-size:14px;line-height:1.35;font-weight:760;margin-top:12px}.warn{background:#fff4dd;border-color:rgba(244,123,32,.28);color:#835112}.errorText{color:#a92131;font-weight:900;margin:12px 0 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile,.person,.service{border:0;text-align:left;background:#fff;border-radius:24px;padding:15px;min-height:120px;box-shadow:0 12px 26px rgba(31,49,69,.08);border:1px solid rgba(16,32,51,.07);position:relative;color:#102033}.tile b,.service b{display:block;font-size:16.5px;margin-top:10px;line-height:1.05}.tile small,.service small,.person small{display:block;color:#6b7b8e;margin-top:5px;font-weight:680;line-height:1.28}.service.on{outline:3px solid rgba(50,212,200,.36);border-color:#1fb7ae}.ico,.avatar,.miniLogo{background:radial-gradient(circle at 32% 24%,#fff 0,#eefcff 15%,#6fe1d9 36%,#168f93 65%,#083e5d 100%);box-shadow:0 15px 30px rgba(25,93,111,.25),inset 0 2px 3px rgba(255,255,255,.78),inset 0 -12px 18px rgba(0,39,60,.28)}.miniLogo{width:56px;height:56px;border-radius:20px;display:grid;place-items:center;flex:none;box-shadow:0 16px 28px rgba(75,38,9,.24),0 0 0 8px rgba(255,255,255,.14),inset 0 2px 3px rgba(255,255,255,.78),inset 0 -12px 18px rgba(0,39,60,.26)}.miniLogo svg{width:37px}.ico{width:48px;height:48px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#edf8fb);box-shadow:inset 0 1px #fff,0 8px 18px rgba(32,55,78,.1)}.ico svg{width:31px;height:31px;stroke:#0c6680}.avatar{width:62px;height:62px;border-radius:24px;display:grid;place-items:center;flex:none}.person{display:flex;align-items:center;gap:12px;min-height:82px;width:100%;margin-bottom:10px}.person b{font-size:16px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.mini{border-radius:19px;background:white;border:1px solid rgba(16,32,51,.07);padding:12px}.mini span{display:block;color:#708196;font-size:12px;font-weight:850}.mini b{display:block;color:#102033;font-size:15px;margin-top:3px}.foot{font-size:12px;color:#7a8b9d;line-height:1.35;text-align:center;margin:14px 6px 0}.panel{position:fixed;inset:0;z-index:7;background:rgba(4,12,22,.38);backdrop-filter:blur(8px);display:none;align-items:flex-end}.panel.on{display:flex}.drawer{width:100%;max-height:88svh;overflow:auto;background:#f7fafc;border-radius:34px 34px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);box-shadow:0 -20px 55px rgba(5,17,31,.28)}.drawerHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.drawerHead h3{font-size:24px;line-height:1.04;margin:0;font-weight:950;letter-spacing:-.04em}.x{width:46px;height:46px;border-radius:18px;border:0;background:white;font-size:24px;color:#17324b}.item{background:white;border-radius:22px;padding:14px;margin:10px 0;border:1px solid rgba(16,32,51,.07);box-shadow:0 8px 18px rgba(31,49,69,.06)}.item b{display:block}.item small{display:block;margin-top:4px;color:#64768a;line-height:1.32;font-weight:650}.status{display:inline-flex;border-radius:999px;padding:6px 10px;background:#e8f7f4;color:#116a59;font-size:12px;font-weight:900;margin-top:9px}.splash{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 34%,rgba(255,255,255,.22),transparent 20%),linear-gradient(160deg,#ffad48 0%,#f47b20 43%,#e46017 100%);display:grid;grid-template-rows:1fr auto;align-items:center;justify-items:center;padding:calc(env(safe-area-inset-top) + 28px) 22px calc(env(safe-area-inset-bottom) + 28px);transition:opacity .46s ease,visibility .46s ease}.splash.off{opacity:0;visibility:hidden}.orbit{position:relative;width:min(82vw,370px);height:min(82vw,370px);display:grid;place-items:center}.ring{position:absolute;width:80%;height:80%;border-radius:50%;border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 0 44px rgba(255,255,255,.18),0 0 60px rgba(107,58,20,.24);animation:pulse 2.8s ease-in-out infinite}.halo{position:absolute;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,255,255,.10) 48%,transparent 72%);filter:blur(.2px)}.logo3d{width:144px;height:144px;border-radius:48px;background:radial-gradient(circle at 31% 22%,#fff 0,#eefcff 15%,#72e3db 35%,#168d93 61%,#083d5c 100%);display:grid;place-items:center;box-shadow:0 32px 62px rgba(70,33,6,.34),0 0 0 18px rgba(255,255,255,.12),0 0 56px rgba(255,255,255,.36),inset 0 5px 10px rgba(255,255,255,.66),inset 0 -18px 28px rgba(0,39,60,.34)}.logo3d svg{width:91px;height:91px;filter:drop-shadow(0 8px 10px rgba(0,36,60,.28))}.orb{position:absolute;width:72px;height:72px;border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(255,237,214,.86));display:grid;place-items:center;box-shadow:0 18px 36px rgba(84,42,8,.24),inset 0 1px 1px rgba(255,255,255,.8);filter:saturate(.92)}.orb svg{width:42px;height:42px;stroke:#0b506b}.o1{top:14px;left:50%;transform:translateX(-50%)}.o2{right:8px;top:45%;transform:translateY(-50%)}.o3{bottom:20px;left:50%;transform:translateX(-50%)}.o4{left:8px;top:45%;transform:translateY(-50%)}.splashText{width:min(100%,430px);text-align:center;color:white;text-shadow:0 3px 14px rgba(92,38,0,.32)}.splashText h1{font-size:31px;line-height:1.02;margin:0 0 12px;font-weight:950;letter-spacing:-.045em}.splashText p{font-size:16px;line-height:1.42;margin:0;color:rgba(255,255,255,.93);font-weight:720}.loader{margin:22px auto 0;width:180px;height:7px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}.loader span{display:block;width:42%;height:100%;border-radius:99px;background:#fff;animation:load 1.1s ease-in-out infinite}@keyframes load{0%{transform:translateX(-115%)}100%{transform:translateX(250%)}}@keyframes pulse{50%{transform:scale(1.035);opacity:.86}}@media(max-width:370px){.title{font-size:24px}.sheet{padding-left:10px;padding-right:10px}.grid{gap:9px}.tile{padding:13px}.splashText h1{font-size:27px}.orb{width:62px;height:62px}.logo3d{width:128px;height:128px}}
</style>
</head>
<body>
<div class="splash" id="splash" aria-label="Abertura do aplicativo">
  <div class="orbit"><div class="ring"></div><div class="halo"></div><div class="orb o1" data-glyph="steth"></div><div class="orb o2" data-glyph="pro"></div><div class="orb o3" data-glyph="unit"></div><div class="orb o4" data-glyph="leaf"></div><div class="logo3d" data-logo></div></div>
  <div class="splashText"><h1>Conecta Saúde Comunitária</h1><p>Canal digital entre moradores, TACS e Unidade de Saúde para organizar avisos, campanhas, agendas, solicitações e acompanhamento da comunidade.</p><div class="loader"><span></span></div></div>
</div>
<main class="app">
<header class="header"><div class="topline"><div class="brand"><div class="miniLogo" data-logo></div><div><h2>Conecta Saúde</h2><small>Comunidade • TACS • Unidade</small></div></div><button class="bell" id="bell" aria-label="Notificações"><svg viewBox="0 0 64 64" fill="none"><path d="M22 50h20M25 54c2 4 12 4 14 0M18 45h28c-5-5-5-13-5-19a9 9 0 0 0-18 0c0 6 0 14-5 19Z" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="badge">2</span></button></div></header>
<section class="sheet" id="view"></section>
</main>
<div class="panel" id="panel"><div class="drawer"><div class="drawerHead"><h3 id="panelTitle"></h3><button class="x" id="closePanel">×</button></div><div id="panelBody"></div></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s);const view=$('#view');
const state={cpf:'',dob:'',pin:'',person:null,member:null,pending:false,service:null};
const people=[{name:'Maria de Souza',cpf:'52998224725',dob:'12/05/1988',family:'F1',area:'Sítio Japaranduba'},{name:'João de Souza',cpf:'',dob:'20/08/1986',family:'F1',area:'Sítio Japaranduba'},{name:'Ana de Souza',cpf:'',dob:'14/09/2014',family:'F1',area:'Sítio Japaranduba'}];
const services=[['Consulta médica','Agenda da unidade, conforme vagas publicadas.'],['Atendimento com enfermeira','Acompanhamento, orientações e procedimentos da unidade.'],['Consulta com nutricionista','Sem vaga de emergência. Apenas agenda programada.'],['Dentista — vaga comum','Atendimento odontológico de rotina.'],['Dentista — urgência','Dor, inchaço ou situação odontológica prioritária.'],['Visita domiciliar do TACS','Solicitação para acompanhamento comunitário.'],['Bolsa Família','Peso, altura e acompanhamento obrigatório.']];
function logo(){return '<svg viewBox="0 0 120 120" fill="none"><path d="M39 34c10-12 34-14 47 1" stroke="white" stroke-width="9" stroke-linecap="round"/><path d="M82 86c-10 11-35 12-49-2" stroke="white" stroke-width="9" stroke-linecap="round"/><path d="M41 61h15l7-15 12 31 8-16h16" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="61" r="6" fill="white"/><circle cx="101" cy="61" r="6" fill="white"/></svg>'}
function glyph(t){const s='stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"';if(t==='steth')return '<svg viewBox="0 0 64 64"><path '+s+' d="M18 12v15a13 13 0 0 0 26 0V12M14 12h8M40 12h8M31 40v5a9 9 0 0 0 18 0v-6"/><circle cx="49" cy="35" r="6" '+s+'/></svg>';if(t==='pro')return '<svg viewBox="0 0 64 64"><path '+s+' d="M22 26a10 10 0 0 1 20 0c0 10-5 14-10 14S22 36 22 26Z"/><path '+s+' d="M16 56c3-10 29-10 32 0M20 17c5-7 19-7 24 0M25 45l7 6 7-6"/></svg>';if(t==='unit')return '<svg viewBox="0 0 64 64"><path '+s+' d="M16 56V21l16-9 16 9v35M24 56V38h16v18M24 28h2M38 28h2M30 28h4"/><path '+s+' d="M28 38h8"/></svg>';if(t==='leaf')return '<svg viewBox="0 0 64 64"><path '+s+' d="M15 47c18 1 32-9 35-31-20 2-33 12-35 31Z"/><path '+s+' d="M18 46c10-10 19-17 29-25M16 51c8 5 23 5 33-1"/></svg>';if(t==='family')return '<svg viewBox="0 0 64 64"><path '+s+' d="M24 28a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm-12 25c3-12 21-12 24 0M46 30a7 7 0 1 0 0-14 7 7 0 0 0 0 14Zm-5 20c2-7 12-8 16 0M33 32l8 7M32 18h7"/></svg>';if(t==='calendar')return '<svg viewBox="0 0 64 64"><path '+s+' d="M15 17h34v34H15zM15 27h34M23 12v10M41 12v10M24 37h3M36 37h3M24 45h3M36 45h3"/></svg>';if(t==='msg')return '<svg viewBox="0 0 64 64"><path '+s+' d="M14 18h36v25H26L16 51V18Z"/><path '+s+' d="M23 28h18M23 36h11"/></svg>';if(t==='campaign')return '<svg viewBox="0 0 64 64"><path '+s+' d="M17 35h10l20 10V19L27 29H17v6ZM27 36l4 14H21l-4-14"/></svg>';if(t==='user')return '<svg viewBox="0 0 64 64"><path '+s+' d="M22 25a10 10 0 1 0 20 0 10 10 0 0 0-20 0ZM14 54c5-15 31-15 36 0"/></svg>';return glyph('steth')}
document.querySelectorAll('[data-logo]').forEach(el=>el.innerHTML=logo());document.querySelectorAll('[data-glyph]').forEach(el=>el.innerHTML=glyph(el.dataset.glyph));
setTimeout(()=>$('#splash').classList.add('off'),2300);$('#splash').addEventListener('click',()=>$('#splash').classList.add('off'));
function dots(n){return '<div class="progress">'+[1,2,3].map(i=>'<span class="dot '+(i<=n?'on':'')+'"></span>').join('')+'</div>'}
function cpfMask(v){let d=String(v||'').replace(/\D/g,'').slice(0,11);return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}
function dateMask(v){let d=String(v||'').replace(/\D/g,'').slice(0,8);return d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d}
function validCpf(v){let d=String(v||'').replace(/\D/g,'');if(d.length!==11||/^(\d)\1+$/.test(d))return false;let calc=l=>{let s=0;for(let i=0;i<l;i++)s+=+d[i]*(l+1-i);let r=(s*10)%11;return r===10?0:r};return calc(9)===+d[9]&&calc(10)===+d[10]}
function shell(html){view.innerHTML=html+'<p class="foot">Homologação visual. Não grava CPF, não envia SMS e não vincula aparelho a morador real.</p>'}
function showErr(t){let e=$('#err');if(e)e.textContent=t}
function renderCpf(){shell('<div class="card">'+dots(1)+'<h1 class="title">Acesso do morador</h1><p class="sub">Digite o CPF somente quando estiver correto. A busca não é automática ao completar 11 números.</p><div class="field"><label for="cpf">CPF</label><input id="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" maxlength="14" value="'+cpfMask(state.cpf)+'"></div><button class="btn orange" id="next">Confirmar CPF e continuar</button><p id="err" class="errorText"></p><div class="notice warn">Para testar sem dado real, use CPF fictício: 529.982.247-25.</div></div>');$('#cpf').oninput=e=>{state.cpf=e.target.value.replace(/\D/g,'').slice(0,11);e.target.value=cpfMask(state.cpf)};$('#next').onclick=()=>{if(!validCpf(state.cpf)){showErr('Confira os 11 números do CPF.');return}let p=people.find(x=>x.cpf===state.cpf);if(p){state.person=p;renderPin()}else renderDob()}}
function renderDob(){shell('<div class="card">'+dots(2)+'<h1 class="title">Confirmar nascimento</h1><p class="sub">CPF não localizado no teste. Isso não bloqueia a solicitação. Informe a data para buscar cadastro antigo por CNS/SUS.</p><div class="field"><label for="dob">Data de nascimento</label><input id="dob" inputmode="numeric" autocomplete="off" placeholder="DD/MM/AAAA" maxlength="10" value="'+state.dob+'"></div><div class="row"><button class="btn alt" id="back">Corrigir CPF</button><button class="btn orange" id="next">Continuar</button></div><p id="err" class="errorText"></p><div class="notice">Se houver vários moradores com a mesma data, a próxima etapa será confirmar o nome completo.</div></div>');$('#dob').oninput=e=>{state.dob=dateMask(e.target.value);e.target.value=state.dob};$('#back').onclick=renderCpf;$('#next').onclick=()=>{if(!/^\d{2}\/\d{2}\/\d{4}$/.test(state.dob)){showErr('Digite a data completa.');return}let m=people.filter(x=>x.dob===state.dob);if(m.length){state.person=m[0];state.person.cpf=state.cpf}else{state.pending=true;state.person={name:'Morador em identificação',cpf:state.cpf,dob:state.dob,family:'',area:'Sítio Japaranduba'}}renderPin()}}
function renderPin(){shell('<div class="card">'+dots(3)+'<h1 class="title">Criar PIN</h1><p class="sub">Crie 4 números para acessar o aplicativo sem receber código por SMS ou WhatsApp.</p><div class="field"><label for="p1">PIN</label><input id="p1" inputmode="numeric" type="password" maxlength="4"></div><div class="field"><label for="p2">Confirmar PIN</label><input id="p2" inputmode="numeric" type="password" maxlength="4"></div><button class="btn orange" id="next">Criar PIN</button><p id="err" class="errorText"></p><div class="notice warn">Fluxo sem OTP: não há envio de código nesta homologação.</div></div>');$('#next').onclick=()=>{let a=$('#p1').value.replace(/\D/g,''),b=$('#p2').value.replace(/\D/g,'');if(a.length!==4){showErr('O PIN precisa ter 4 números.');return}if(a!==b){showErr('Os dois PINs precisam ser iguais.');return}state.pin=a;renderNotify()}}
function renderNotify(){shell('<div class="card">'+dots(3)+'<h1 class="title">Notificações</h1><p class="sub">No app real, esta etapa habilitará avisos da unidade, campanhas e recados com confirmação de recebimento.</p><button class="btn orange" id="next">Simular ativação e continuar</button><div class="notice">No teste atual, a permissão é simulada para evitar falha no navegador interno do WhatsApp.</div></div>');$('#next').onclick=renderFamily}
function renderFamily(){let members=state.person.family==='F1'?people.filter(x=>x.family==='F1'):[state.person];shell('<div class="card"><h1 class="title">'+(state.person.family?'Minha família':'Meu acesso')+'</h1><p class="sub">Escolha para quem deseja solicitar ou acompanhar serviços.</p>'+(state.pending?'<div class="notice warn">Há pendência cadastral para revisão administrativa, sem bloqueio para solicitação.</div>':'')+'</div>'+members.map((p,i)=>'<button class="person" data-i="'+i+'"><span class="avatar">'+glyph('user')+'</span><span><b>'+p.name+'</b><small>'+p.dob+' • '+p.area+'</small></span></button>').join(''));document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{state.member=members[+b.dataset.i];renderHome()})}
function current(){return state.member||state.person||people[0]}
function renderHome(){let p=current();shell('<div class="card"><div class="profile"><span class="avatar">'+glyph('user')+'</span><div><h1 class="title" style="margin-bottom:4px">Olá, '+p.name.split(' ')[0]+'</h1><p class="sub">Portal do morador • '+p.area+'</p></div></div><div class="kv"><div class="mini"><span>CPF</span><b>'+(p.cpf?cpfMask(p.cpf):'não informado')+'</b></div><div class="mini"><span>Situação</span><b>'+(state.pending?'revisão':'ativo')+'</b></div></div></div><div class="grid"><button class="tile" id="serv"><span class="ico">'+glyph('steth')+'</span><b>Solicitar atendimento</b><small>Serviços da unidade e TACS</small></button><button class="tile" data-panel="agendas"><span class="ico">'+glyph('calendar')+'</span><b>Agendas</b><small>Dias e vagas publicadas</small></button><button class="tile" data-panel="prof"><span class="ico">'+glyph('pro')+'</span><b>Profissionais</b><small>Equipe da unidade</small></button><button class="tile" data-panel="camp"><span class="ico">'+glyph('campaign')+'</span><b>Campanhas</b><small>Avisos de saúde pública</small></button><button class="tile" data-panel="rec"><span class="ico">'+glyph('msg')+'</span><b>Recados</b><small>Mensagens recebidas <span class="badge">2</span></small></button><button class="tile" id="fam"><span class="ico">'+glyph('family')+'</span><b>Minha família</b><small>Trocar integrante</small></button></div>');$('#serv').onclick=renderServices;$('#fam').onclick=renderFamily;document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>openPanel(b.dataset.panel))}
function renderServices(){let p=current();shell('<div class="card"><h1 class="title">Solicitar atendimento</h1><p class="sub">Dados identificados. Escolha o serviço em cartões. Não há seletor nativo nem vaga automática.</p><div class="notice">Morador: <b>'+p.name+'</b><br>'+p.area+'</div></div><div class="grid" id="services">'+services.map((s,i)=>'<button class="service" data-s="'+i+'"><span class="ico">'+glyph(i===2?'leaf':i>4?'family':'steth')+'</span><b>'+s[0]+'</b><small>'+s[1]+'</small></button>').join('')+'</div><div class="card"><div class="field"><label for="desc">Descrição</label><textarea id="desc" placeholder="Explique seu pedido"></textarea></div><div class="row"><button class="btn alt" id="back">Voltar</button><button class="btn orange" id="send">Enviar teste</button></div><p id="err" class="errorText"></p></div>');$('#back').onclick=renderHome;document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{state.service=+b.dataset.s;document.querySelectorAll('[data-s]').forEach(x=>x.classList.remove('on'));b.classList.add('on')});$('#send').onclick=()=>{if(state.service===null){showErr('Escolha um serviço.');return}openPanel('ok')}}
function openPanel(type){let title='';let body='';if(type==='ok'){title='Solicitação registrada no teste';body='<div class="item"><b>'+services[state.service][0]+'</b><small>Registro visual concluído. Nenhuma vaga real foi consumida.</small><span class="status">homologação</span></div><button class="btn orange" onclick="closePanel();renderHome()">Voltar ao início</button>'}else if(type==='agendas'){title='Agendas';body='<div class="item"><b>Médica</b><small>Agenda semanal exibida conforme publicação da unidade.</small></div><div class="item"><b>Nutricionista</b><small>Atendimento programado. Sem emergência.</small></div><div class="item"><b>Dentista</b><small>Vagas comuns e urgência odontológica separadas.</small></div>'}else if(type==='prof'){title='Profissionais';body='<div class="item"><b>Equipe da unidade</b><small>Médica, enfermeira, técnica, nutricionista, dentista e TACS.</small></div>'}else if(type==='camp'){title='Campanhas';body='<div class="item"><b>Campanha ativa</b><small>Acompanhamento de saúde pública com confirmação de recebimento no app real.</small><span class="status">pendente</span></div>'}else{title='Recados';body='<div class="item"><b>Aviso da unidade</b><small>Recado recebido pelo morador. No app real haverá confirmação de recebimento.</small><span class="status">não confirmado</span></div>'}$('#panelTitle').textContent=title;$('#panelBody').innerHTML=body;$('#panel').classList.add('on')}
function closePanel(){$('#panel').classList.remove('on')}$('#closePanel').onclick=closePanel;$('#bell').onclick=()=>openPanel('rec');renderCpf();
</script>
</body>
</html>
