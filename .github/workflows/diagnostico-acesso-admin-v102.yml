name: Diagnóstico acesso admin v102

on:
  push:
    branches: [corrigir-acesso-admin-v102]
    paths:
      - '.github/workflows/diagnostico-acesso-admin-v102.yml'

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Medir GET e POST administrativos sem escrita
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://script.google.com/macros/s/AKfycbwOyG9yZqYly736ZsGta1q6Jd4Irkc-iRWURfypKcpBkyCCmO3hMNE4oOsXECTMCpSxYw/exec'
          RID="diag_login_$(date +%s)_${RANDOM}"
          echo '--- admin_status GET ---'
          curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/status.out -w 'http=%{http_code} tempo=%{time_total}s\n' "$BASE?action=admin_status&_=$(date +%s)"
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' /tmp/status.out

          echo '--- admin_login POST com PIN deliberadamente inválido ---'
          curl -L -sS --connect-timeout 5 --max-time 25 \
            -o /tmp/login.out -w 'http=%{http_code} tempo=%{time_total}s\n' \
            -X POST \
            --data-urlencode 'action=admin_login' \
            --data-urlencode "requestId=$RID" \
            --data-urlencode 'pin=00000000' \
            --data-urlencode 'dispositivo=diagnostico-v102' \
            "$BASE?_=$(date +%s)"
          test -s /tmp/login.out
          printf 'resposta_post=%s\n' "$(tr '\n' ' ' </tmp/login.out | head -c 600)"

          echo '--- admin_result GET do mesmo requestId ---'
          for i in 1 2 3 4 5; do
            sleep 1
            curl -L -sS --connect-timeout 5 --max-time 15 \
              -o /tmp/result.out -w "tentativa=$i http=%{http_code} tempo=%{time_total}s\n" \
              "$BASE?action=admin_result&requestId=$RID&_=$(date +%s%N)" || true
            printf 'resultado=%s\n' "$(tr '\n' ' ' </tmp/result.out 2>/dev/null | head -c 500)"
            if grep -Eq '"pendente"[[:space:]]*:[[:space:]]*false' /tmp/result.out 2>/dev/null; then
              echo 'RESULTADO_CONSULTAVEL=SIM'
              exit 0
            fi
          done
          echo 'RESULTADO_CONSULTAVEL=NAO'
          exit 1
