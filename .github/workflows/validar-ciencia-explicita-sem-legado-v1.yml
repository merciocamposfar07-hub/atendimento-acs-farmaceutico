name: Validar ciencia explicita sem legado v1

on:
  push:
    branches:
      - fix/ciencia-explicita-sem-legado-v1
    paths:
      - '.github/workflows/validar-ciencia-explicita-sem-legado-v1.yml'
      - 'scripts/aplicar_ciencia_explicita_sem_legado_v1.py'

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Aplicar proteção
        run: python3 scripts/aplicar_ciencia_explicita_sem_legado_v1.py
      - name: Testar contrato específico
        run: |
          node --check teste-v1/mensagem-relatorio-entrega-v1.js
          node scripts/test_comprovacao_ciencia_mensagens_v1.js
      - name: Regressão completa
        run: npm test
      - name: Restaurar gerados pelo pretest
        run: git checkout -- scripts/test_dom_flows.js scripts/test_territorio_dom.js || true
      - name: Validar escopo
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          extras="$(git diff --name-only | grep -Ev '^(apps-script/ZZZZ_42_ComprovacaoMensagensV1\.gs|teste-v1/mensagem-relatorio-entrega-v1\.js|scripts/test_comprovacao_ciencia_mensagens_v1\.js|scripts/aplicar_ciencia_explicita_sem_legado_v1\.py|\.github/workflows/validar-ciencia-explicita-sem-legado-v1\.yml)$' || true)"
          test -z "$extras" || { echo "$extras"; exit 1; }
      - name: Limpar temporários e publicar branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/aplicar_ciencia_explicita_sem_legado_v1.py .github/workflows/validar-ciencia-explicita-sem-legado-v1.yml
          git config user.name 'Portal TACS'
          git config user.email 'actions@users.noreply.github.com'
          git add -- apps-script/ZZZZ_42_ComprovacaoMensagensV1.gs teste-v1/mensagem-relatorio-entrega-v1.js scripts/test_comprovacao_ciencia_mensagens_v1.js scripts/aplicar_ciencia_explicita_sem_legado_v1.py .github/workflows/validar-ciencia-explicita-sem-legado-v1.yml
          git commit -m 'Separa ciência explícita de confirmações legadas'
          git push origin HEAD:fix/ciencia-explicita-sem-legado-v1
