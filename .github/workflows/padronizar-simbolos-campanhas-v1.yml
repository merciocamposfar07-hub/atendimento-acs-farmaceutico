name: Padronizar símbolos das campanhas V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/padronizar-simbolos-campanhas-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  padronizar:
    if: "!contains(github.event.head_commit.message, '[simbolos-campanhas-v1]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar SVGs vetoriais e vincular aos cards
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('assets/campanhas')
          root.mkdir(parents=True, exist_ok=True)

          campaigns = {
            'JAN_ROXO': ('janeiro-roxo.svg','#6331a8','#c0a0ef','#442176','person'),
            'FEV_LARANJA': ('fevereiro-laranja.svg','#b85d00','#ffc574','#7d3b00','drop'),
            'MAR_ROXO': ('marco-roxo.svg','#6331a8','#c0a0ef','#442176','brain'),
            'MAR_AZUL_MARINHO': ('marco-azul-marinho.svg','#12365f','#8eb8e2','#0d2748','colon'),
            'ABR_VERDE': ('abril-verde.svg','#17723a','#9adbb0','#0e4c27','helmet'),
            'ABR_AZUL': ('abril-azul.svg','#17618f','#9bd7f5','#0d4262','infinity'),
            'MAI_AMARELO': ('maio-amarelo.svg','#9b7900','#ffeb86','#6f5700','traffic'),
            'JUN_VERMELHO': ('junho-vermelho.svg','#9e2f2f','#f1a1a1','#6e1d1d','blood'),
            'JUL_AMARELO': ('julho-amarelo.svg','#9b7900','#ffeb86','#6f5700','liver'),
            'JUL_VERDE': ('julho-verde.svg','#17723a','#9adbb0','#0e4c27','head'),
            'SET_AMARELO': ('setembro-amarelo.svg','#9b7900','#ffeb86','#6f5700','heart'),
            'SET_VERDE': ('setembro-verde.svg','#17723a','#9adbb0','#0e4c27','donation'),
            'OUT_ROSA': ('outubro-rosa.svg','#a53e68','#f6bbd2','#752b4a','female'),
            'NOV_AZUL': ('novembro-azul.svg','#17618f','#9bd7f5','#0d4262','shield'),
            'DEZ_VERMELHO': ('dezembro-vermelho.svg','#9e2f2f','#f1a1a1','#6e1d1d','ribbon'),
            'DEZ_LARANJA': ('dezembro-laranja.svg','#b85d00','#ffc574','#7d3b00','sun'),
          }

          shapes = {
            'person': '<circle cx="60" cy="39" r="11" fill="url(#g)"/><path d="M42 78c5-18 11-29 18-33 8 4 14 15 19 33" fill="none" stroke="url(#g)" stroke-width="10"/><path d="M29 91h62M60 19v13M53 25h14" class="line"/>',
            'drop': '<path d="M60 13C44 37 31 54 31 73a29 29 0 0 0 58 0c0-19-13-36-29-60Z" fill="url(#g)"/><circle cx="50" cy="66" r="9" fill="#fff" opacity=".78"/><circle cx="71" cy="80" r="8" fill="url(#light)"/><path d="M46 93c9 6 20 6 29 0" class="line"/>',
            'brain': '<path d="M44 25c-14 2-22 14-19 27-10 8-10 25 1 33 4 13 21 17 31 8 10 9 27 5 31-8 11-8 11-25 1-33 3-13-5-25-19-27-6-9-20-9-26 0Z" fill="url(#light)"/><path d="M60 27v65M44 42c10 4 13 11 16 18M76 42c-10 4-13 11-16 18M41 72c10-5 16-2 19 5M79 72c-10-5-16-2-19 5" class="line"/>',
            'colon': '<path d="M38 22c-12 4-17 17-12 29 4 9 10 11 10 21 0 18 10 29 24 29s24-11 24-29c0-10 6-12 10-21 5-12 0-25-12-29-9-3-16 2-22 9-6-7-13-12-22-9Z" fill="url(#light)"/><path d="M42 42c9 7 11 15 8 24-3 11 1 20 10 20s13-9 10-20c-3-9-1-17 8-24" class="line"/>',
            'helmet': '<path d="M25 65c1-25 15-42 35-42s34 17 35 42" fill="url(#light)"/><path d="M20 64h80v15H20z" fill="url(#g)"/><path d="M42 64V45M78 64V45M40 91l12 11 27-30" class="line"/>',
            'infinity': '<path d="M17 60c13-27 28-31 43-6 15-25 30-21 43 6-13 27-28 31-43 6-15 25-30 21-43-6Z" fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="round"/><circle cx="32" cy="60" r="5" fill="url(#light)"/><circle cx="88" cy="60" r="5" fill="url(#light)"/>',
            'traffic': '<rect x="37" y="11" width="46" height="96" rx="21" fill="url(#light)" stroke="url(#g)" stroke-width="5"/><circle cx="60" cy="36" r="10" fill="#d84436"/><circle cx="60" cy="60" r="10" fill="#f2c94c"/><circle cx="60" cy="84" r="10" fill="#2f9e58"/><path d="M23 108h74" class="line"/>',
            'blood': '<path d="M60 10C42 37 28 55 28 76a32 32 0 0 0 64 0c0-21-14-39-32-66Z" fill="url(#g)"/><path d="M60 88s-20-11-20-26c0-14 17-19 20-6 3-13 20-8 20 6 0 15-20 26-20 26Z" fill="#fff" opacity=".92"/>',
            'liver': '<path d="M22 61c8-27 27-39 50-35 17 3 26 15 27 30 1 17-9 29-26 32-16 2-29 12-40 24-9-14-16-31-11-51Z" fill="url(#light)"/><path d="M41 42c13 9 28 13 45 11M41 82c13-6 27-6 41-2" class="line"/>',
            'head': '<circle cx="60" cy="34" r="21" fill="url(#light)"/><path d="M36 105c3-26 11-39 24-39s21 13 24 39" fill="url(#g)"/><path d="M46 55c5 9 5 18-1 26M74 55c-5 9-5 18 1 26" class="line"/>',
            'heart': '<circle cx="60" cy="60" r="43" fill="url(#light)" opacity=".78"/><path d="M60 89S30 72 30 50c0-20 24-25 30-8 6-17 30-12 30 8 0 22-30 39-30 39Z" fill="url(#g)"/><path d="M60 8v10M60 102v10M8 60h10M102 60h10" class="line"/>',
            'donation': '<path d="M60 77S36 63 36 45c0-17 20-22 24-8 4-14 24-9 24 8 0 18-24 32-24 32Z" fill="url(#g)"/><path d="M18 84c14-9 25-10 42 3M102 84c-14-9-25-10-42 3M22 93c14 9 27 14 38 15M98 93c-14 9-27 14-38 15" class="line"/>',
            'female': '<circle cx="60" cy="45" r="31" fill="url(#light)" opacity=".78"/><path d="M47 37c9-10 17-10 26 0M41 54c12 11 25 15 38 0" class="line"/><path d="M60 76v29M47 91h26" class="line"/>',
            'shield': '<path d="M60 12 94 24v28c0 26-13 44-34 58-21-14-34-32-34-58V24Z" fill="url(#light)"/><circle cx="54" cy="55" r="16" fill="none" stroke="url(#g)" stroke-width="7"/><path d="M66 43l21-21M76 22h11v11M54 72v20M44 82h20" class="line"/>',
            'ribbon': '<path d="M44 18c-13 18-13 35 0 53l34 42M76 18c13 18 13 35 0 53l-34 42" fill="none" stroke="url(#g)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M47 24c-6 10-7 19-3 28M73 24c6 10 7 19 3 28" fill="none" stroke="#fff" stroke-width="4" opacity=".3" stroke-linecap="round"/>',
            'sun': '<circle cx="60" cy="55" r="25" fill="url(#g)"/><path d="M60 9v14M60 87v14M14 55h14M92 55h14M27 22l10 10M83 78l10 10M93 22 83 32M37 78 27 88" class="line"/><path d="M38 108c11-9 33-9 44 0" class="line"/>',
          }

          def make_svg(a,b,d,shape):
            body=shapes[shape]
            return f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" shape-rendering="geometricPrecision">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{b}"/><stop offset=".42" stop-color="{a}"/><stop offset="1" stop-color="{d}"/></linearGradient>
            <linearGradient id="light" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".72"/><stop offset=".32" stop-color="{b}"/><stop offset="1" stop-color="{a}"/></linearGradient>
            <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="{d}" flood-opacity=".30"/></filter>
          </defs>
          <g filter="url(#shadow)" class="art"><style>.line{{fill:none;stroke:{d};stroke-width:6;stroke-linecap:round;stroke-linejoin:round}}</style>{body}</g>
          </svg>'''

          for key,(filename,a,b,d,shape) in campaigns.items():
            (root/filename).write_text(make_svg(a,b,d,shape), encoding='utf-8')

          target=Path('campanhas-periodo-v2.js')
          text=target.read_text(encoding='utf-8')
          start=text.index('function campaignSpecificIconSvg(key,theme){')
          end=text.index('\nfunction decorateCampaignSummary', start)
          filemap=',\n    '.join([f"'{k}':'{v[0]}'" for k,v in campaigns.items()])
          replacement=f'''function campaignSpecificIconSvg(key,theme){{
            var files={{
              {filemap}
            }};
            var file=files[key];
            if(!file)return campaignIconSvg(theme);
            return '<img src="assets/campanhas/'+file+'?v=1" alt="" aria-hidden="true" draggable="false" style="display:block;width:80px;height:80px;max-width:100%;max-height:100%;object-fit:contain;image-rendering:auto">';
          }}
          '''
          target.write_text(text[:start]+replacement+text[end:], encoding='utf-8')

      - name: Validar escopo
        run: |
          test -f assets/campanhas/janeiro-roxo.svg
          test -f assets/campanhas/dezembro-laranja.svg
          grep -q "assets/campanhas/" campanhas-periodo-v2.js
          git diff --name-only | grep -Ev '^(campanhas-periodo-v2\.js|assets/campanhas/.*\.svg)$' && exit 1 || true
      - name: Publicar somente símbolos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campanhas-periodo-v2.js assets/campanhas/*.svg
          git commit -m "[simbolos-campanhas-v1] Padroniza símbolos vetoriais mês a mês" || exit 0
          git push
