name: Corrigir categoria odontológica única v114

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corrigir-categoria-odontologia-unica-v114.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correção restrita
        run: python3 scripts/corrigir_categoria_odontologia_unica_v114.py
      - name: Validar escopo e contratos
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'category.value = REGULAR;' portal-odontologia-segunda-sexta.js
          grep -Fq 'var category = REGULAR;' portal-odontologia-segunda-sexta.js
          grep -Fq '20260818-odontologia-unica-v114' index.html
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' index.html portal-odontologia-segunda-sexta.js | sort)
          test "$changed" = "$expected"
      - name: Publicar no main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html portal-odontologia-segunda-sexta.js
          git commit -m 'Mantém serviço odontológico único ao escolher vaga emergencial'
          git pull --rebase origin main
          git push origin main
