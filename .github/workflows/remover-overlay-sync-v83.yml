name: Remover overlay de sincronização v83

on:
  push:
    paths:
      - '.github/workflows/remover-overlay-sync-v83.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar versões e bloquear overlay antigo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = '20260801-83'

          painel = Path('admin-painel.html')
          text = painel.read_text(encoding='utf-8')
          text = re.sub(r'20260801-82', version, text)
          if '#adminSyncOverlay{display:none!important}' not in text:
              text = text.replace('</style>', '#adminSyncOverlay{display:none!important}\n</style>', 1)
          painel.write_text(text, encoding='utf-8')

          login = Path('admin-login.html')
          text = login.read_text(encoding='utf-8')
          text = re.sub(r'20260801-82', version, text)
          login.write_text(text, encoding='utf-8')

          portal = Path('portal-unificado.js')
          text = portal.read_text(encoding='utf-8')
          text = re.sub(r'20260801-82', version, text)
          portal.write_text(text, encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = re.sub(
              r'portal-unificado\.js\?v=[^"\']+',
              f'portal-unificado.js?v={version}',
              text
          )
          index.write_text(text, encoding='utf-8')
          PY

      - name: Validar
        run: |
          grep -q 'admin-post-bridge.js?v=20260801-83' admin-painel.html
          grep -q '#adminSyncOverlay{display:none!important}' admin-painel.html
          grep -q 'admin-painel.html?v=20260801-83' admin-login.html
          grep -q 'portal-unificado.js?v=20260801-83' index.html

      - name: Publicar
        run: |
          if git diff --quiet; then
            echo 'Versão 83 já publicada.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-painel.html admin-login.html portal-unificado.js index.html
          git commit -m 'Publicar painel sem overlay de sincronização'
          git push
