name: Validar controle Minha área do Portal TACS

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_public_area_resolver_client.py'
      - 'scripts/fix_public_area_resolver_navigation.py'
      - '.github/workflows/public-area-resolver-client.yml'

permissions:
  contents: write

concurrency:
  group: portal-tacs-minha-area
  cancel-in-progress: false

jobs:
  aplicar-testar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Gerar cliente e corrigir navegação
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_public_area_resolver_client.py
          python3 scripts/fix_public_area_resolver_navigation.py

      - name: Validar sintaxe
        shell: bash
        run: |
          set -euo pipefail
          node --check portal-area-resolver.js
          node --check scripts/test_public_area_resolver.js

      - name: Executar bateria completa
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Validar escopo e publicar
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain=v1 | cut -c4-)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev '^(portal-area-resolver\.js|scripts/test_public_area_resolver\.js|package\.json|index\.html)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Alteração fora do escopo:'
            echo "$bad"
            exit 1
          fi
          test -n "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/apply_public_area_resolver_client.py scripts/fix_public_area_resolver_navigation.py
          git add portal-area-resolver.js scripts/test_public_area_resolver.js package.json index.html scripts/apply_public_area_resolver_client.py scripts/fix_public_area_resolver_navigation.py
          git commit -m 'Adiciona confirmação opcional da área no portal público'
          git push origin HEAD:main
