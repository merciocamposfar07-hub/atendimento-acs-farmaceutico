name: Corrigir superfícies dos painéis

on:
  push:
    branches: [main]
    paths:
      - 'scripts/aplicar_correcao_superficies_paineis_20260917.py'
      - 'scripts/test_superficies_paineis_20260917.js'
      - '.github/workflows/corrigir-superficies-paineis-20260917.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir-e-validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validar script do patch
        run: python3 -m py_compile scripts/aplicar_correcao_superficies_paineis_20260917.py

      - name: Aplicar bloco cirúrgico
        run: python3 scripts/aplicar_correcao_superficies_paineis_20260917.py

      - name: Validar sintaxe JavaScript
        run: node --check central-administrativa-tacs.js

      - name: Validar isolamento das superfícies
        run: node scripts/test_superficies_paineis_20260917.js

      - name: Executar gate Safari de Agendas
        run: node scripts/test_pin_agendas_safari_20260916.js

      - name: Executar gate de resposta imediata
        run: node scripts/test_resposta_imediata_conecta_v1.js

      - name: Verificar diff e escopo
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed={
              'central-administrativa-tacs.html',
              'central-administrativa-tacs.js',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit('Alteração fora do escopo: '+', '.join(sorted(unexpected)))
          if not changed:
              print('Nenhuma alteração funcional pendente.')
          else:
              print('ESCOPO_CIRURGICO_OK:', ', '.join(sorted(changed)))
          PY

      - name: Publicar somente se todos os gates passaram
        run: |
          if git diff --quiet; then
            echo 'Nada a publicar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add central-administrativa-tacs.html central-administrativa-tacs.js
          git commit -m 'fix: isolar superfícies de UBS, espera e Agendas'
          git push origin HEAD:main
