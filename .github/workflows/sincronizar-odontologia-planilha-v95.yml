name: Sincronizar odontologia com a planilha v95

on:
  push:
    paths:
      - '.github/workflows/sincronizar-odontologia-planilha-v95.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remover dias e vagas inventados pelo portal
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text, count_defaults = re.subn(
              r"function ensureDentalDefaults\(slots\)\{.*?\}(?=\n    function scheduleConfigured)",
              "function ensureDentalDefaults(slots){return (Array.isArray(slots)?slots.slice():[]).filter(function(slot){return slot&&DENTAL_ALLOWED_DAYS.indexOf(String(slot.dia||'').trim())!==-1&&normalizeDate(slot.data)&&dentalCurrent(slot.data)}).sort(function(a,b){return dateStamp(a.data)-dateStamp(b.data)})}",
              text,
              count=1,
              flags=re.S
          )
          if count_defaults != 1:
              raise SystemExit('Função ensureDentalDefaults não localizada.')

          text, count_fail = re.subn(
              r"function failAgenda\(\)\{.*?\}(?=\n    function loadDental)",
              "function failAgenda(){dentalSlots=[];selectedDentalSlot=null;selectedDentalType='';dentalState='error';renderDental();updateForm()}",
              text,
              count=1,
              flags=re.S
          )
          if count_fail != 1:
              raise SystemExit('Função failAgenda não localizada.')

          text, count_src = re.subn(
              r'portal-odontologia-segunda-sexta\.js\?v=[^"\']+',
              'portal-odontologia-segunda-sexta.js?v=20260801-95',
              text,
              count=1
          )
          if count_src != 1:
              raise SystemExit('Referência do script odontológico não localizada.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar
        run: |
          grep -q "function ensureDentalDefaults(slots){return" index.html
          grep -q "dentalState='error'" index.html
          grep -q "portal-odontologia-segunda-sexta.js?v=20260801-95" index.html
          ! grep -q "_padraoFrontend:true" index.html

      - name: Publicar
        run: |
          if git diff --quiet; then
            echo 'Versão 95 já publicada.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Usar somente os dias publicados na planilha odontológica'
          git push
