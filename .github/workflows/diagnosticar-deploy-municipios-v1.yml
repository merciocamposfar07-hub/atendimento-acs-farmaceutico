name: Diagnosticar deploy municipal v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnosticar-deploy-municipios-v1.yml'

permissions:
  actions: read
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ler último workflow de deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT=.github/diagnostico-deploy-municipios
          data=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-apps-script-moradores.yml/runs?branch=main&per_page=10")
          printf '%s' "$data" | node - <<'NODE' > "$OUT"
          let s='';
          process.stdin.on('data',d=>s+=d);
          process.stdin.on('end',()=>{
            const j=JSON.parse(s);
            const runs=Array.isArray(j.workflow_runs)?j.workflow_runs:[];
            const target=runs.find(r=>String(r.head_sha||'').startsWith('f23e667')) || runs[0] || null;
            if(!target){console.log('status=SEM_RUN');return;}
            console.log('status='+String(target.status||''));
            console.log('conclusion='+String(target.conclusion||''));
            console.log('run_id='+String(target.id||''));
            console.log('head_sha='+String(target.head_sha||''));
            console.log('event='+String(target.event||''));
            console.log('created_at='+String(target.created_at||''));
            console.log('updated_at='+String(target.updated_at||''));
          });
          NODE
      - name: Registrar diagnóstico
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/diagnostico-deploy-municipios
          git commit -m 'Registra diagnóstico do deploy municipal' || exit 0
          git pull --rebase origin main
          git push origin main
