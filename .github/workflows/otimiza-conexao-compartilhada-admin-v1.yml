name: Otimiza conexao compartilhada Admin V1

on:
  push:
    paths:
      - 'scripts/otimiza_conexao_compartilhada_admin_v1.py'
      - '.github/workflows/otimiza-conexao-compartilhada-admin-v1.yml'

permissions:
  contents: write

jobs:
  aplicar-validar-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar somente a otimizacao de conexao compartilhada
        run: python3 scripts/otimiza_conexao_compartilhada_admin_v1.py

      - name: Validar escopo e protecoes
        run: |
          grep -q "SHARED_WARM_KEY='portalTacsAppsScriptWarmAtV1'" central-administrativa-tacs.js
          grep -q "function marcarConexaoRecente" central-administrativa-tacs.js
          grep -q "marcarConexaoRecente();cb(r)" central-administrativa-tacs.js
          grep -q "marcarConexaoRecente();op.cb(finalResult)" central-administrativa-tacs.js
          grep -q '20260818-shared-warm-v1' central-administrativa-tacs.html
          grep -q 'Atualizando dados em segundo plano' painel-oficial-agendas-vagas.html
          grep -q "function salvarAgenda(c)" painel-oficial-agendas-vagas.html
          grep -q "function restaurar()" painel-oficial-agendas-vagas.html
          grep -q "function carregarDados" painel-oficial-agendas-vagas.html
          grep -q "setInterval(sincronizarVagasOdontologia,5000)" painel-oficial-agendas-vagas.html
          CHANGED=$(git diff --name-only | sort)
          EXPECTED=$(printf '%s\n' central-administrativa-tacs.html central-administrativa-tacs.js painel-oficial-agendas-vagas.html | sort)
          test "$CHANGED" = "$EXPECTED"

      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add central-administrativa-tacs.js central-administrativa-tacs.html painel-oficial-agendas-vagas.html
          git commit -m 'Compartilha estado recente de conexao entre Central e paineis'
          git pull --rebase origin main
          git push origin main

      - name: Validar arquivos publicados
        run: |
          git pull --ff-only origin main
          grep -q "SHARED_WARM_KEY='portalTacsAppsScriptWarmAtV1'" central-administrativa-tacs.js
          grep -q '20260818-shared-warm-v1' central-administrativa-tacs.html
          grep -q 'Atualizando dados em segundo plano' painel-oficial-agendas-vagas.html
          echo 'CONEXAO_COMPARTILHADA_ADMIN_V1_PUBLICADA_OK'
