name: Corrigir reserva odontologica GET v111
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corrigir-reserva-odontologia-get-v111.yml'
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Aplicar correcao
        run: python3 scripts/corrigir_reserva_odontologia_v111.py
      - name: Validar
        shell: bash
        run: |
          set -euo pipefail
          node --check portal-odontologia-segunda-sexta.js
          grep -q "params.set('action', 'reservar_get')" portal-odontologia-segunda-sexta.js
          grep -q "params.set('callback', callbackName)" portal-odontologia-segunda-sexta.js
          grep -q "reserva-get-v111" index.html
          npm ci
          node scripts/test_admin_transport.js
          node scripts/test_agendas_profissionais_territoriais.js
          node scripts/test_multiagent_isolation_50.js
      - name: Publicar correcao
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Portal TACS'
          git config user.email 'actions@users.noreply.github.com'
          git add portal-odontologia-segunda-sexta.js index.html
          git commit -m 'Corrige baixa automatica de vaga odontologica via GET idempotente v111'
          git push origin HEAD:main
