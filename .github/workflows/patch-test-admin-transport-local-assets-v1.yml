name: Patch teste admin transport assets locais V1

on:
  push:
    branches: [stabilizacao-auditoria-20260825]
    paths:
      - 'scripts/patch_test_admin_transport_local_assets_v1.py'
      - '.github/workflows/patch-test-admin-transport-local-assets-v1.yml'

permissions:
  contents: write

jobs:
  corrigir-validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Aplicar patch do harness
        run: python3 scripts/patch_test_admin_transport_local_assets_v1.py
      - name: Validar transporte administrativo
        run: node scripts/test_admin_transport.js
      - name: Persistir somente o harness corrigido
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/test_admin_transport.js; then echo 'Harness já estava corrigido.'; exit 0; fi
          git diff --check -- scripts/test_admin_transport.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test_admin_transport.js
          git commit -m 'Corrige harness de transporte para assets locais'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
