name: Homologar estabilização de reparos V9

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: reparos-v9-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  simular-testar-e-preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar branch da correção
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Aplicar patch idempotente
        run: python3 scripts/aplicar_estabilizacao_reparos_v9.py

      - name: Validar sintaxe da camada crítica
        run: |
          node --check --input-type=commonjs < apps-script/ZZZZ_47_EstabilizacaoReparosV9.gs
          node --check portal-notification-repair-v9.js
          node --check scripts/test_estabilizacao_reparos_v9.js

      - name: Instalar dependências
        run: npm ci

      - name: Simular ciclo travado, OneSignal, Push e baixa
        run: node scripts/test_estabilizacao_reparos_v9.js

      - name: Rodar bateria completa do Portal TACS
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/npm-test.log"

      - name: Conferir integridade do diff
        run: git diff --check

      - name: Gravar arquivos somente após todos os testes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Arquivos V9 já estão homologados nesta branch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/build_apps_script_release.js \
            package.json \
            index.html \
            portal-version.json
          git diff --cached --check
          git commit -m 'Integrar estabilização de reparos V9'
          git push origin HEAD:${{ github.head_ref }}
