name: Ativar expiração horária odontológica V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ativar-expiracao-horario-odontologia-v1.py'
      - '.github/workflows/ativar-expiracao-horario-odontologia-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expiracao-horario-odontologia-v1
  cancel-in-progress: false

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aplicar correção restrita ao Portal odontológico
        run: python3 scripts/ativar-expiracao-horario-odontologia-v1.py

      - name: Validar sintaxe, expiração e escopo
        shell: bash
        run: |
          set -euo pipefail
          node --check portal-odontologia-segunda-sexta.js
          grep -q 'PORTAL_TACS_ODONTO_EXPIRACAO_HORARIO_V1' portal-odontologia-segunda-sexta.js
          grep -q 'raw.encerrada' portal-odontologia-segunda-sexta.js
          grep -q 'raw.expiraAs' portal-odontologia-segunda-sexta.js
          grep -q 'closedOrExpiredSlot(raw, date)' portal-odontologia-segunda-sexta.js
          grep -q 'setInterval(pruneExpiredSlots, 10000)' portal-odontologia-segunda-sexta.js
          grep -q 'portal-odontologia-segunda-sexta.js?v=20260818-expiracao-horario-v112' index.html
          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf '%s\n' index.html portal-odontologia-segunda-sexta.js | sort)"
          test "$CHANGED" = "$EXPECTED"

      - name: Publicar na main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html portal-odontologia-segunda-sexta.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Respeita expiração horária da agenda odontológica no Portal'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Validar publicação no GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://merciocamposfar07-hub.github.io/atendimento-acs-farmaceutico'
          OK=0
          for i in $(seq 1 18); do
            INDEX=$(curl -L --silent --show-error --connect-timeout 5 --max-time 20 "$BASE/index.html?exp-horario-v112=$i" || true)
            JS=$(curl -L --silent --show-error --connect-timeout 5 --max-time 20 "$BASE/portal-odontologia-segunda-sexta.js?exp-horario-v112=$i" || true)
            if printf '%s' "$INDEX" | grep -q '20260818-expiracao-horario-v112' \
              && printf '%s' "$JS" | grep -q 'PORTAL_TACS_ODONTO_EXPIRACAO_HORARIO_V1' \
              && printf '%s' "$JS" | grep -q 'raw.encerrada'; then
              OK=1
              echo 'PAGES_EXPIRACAO_HORARIO_OK'
              break
            fi
            sleep 10
          done
          test "$OK" = '1'
