name: Atualizar versao do Portal TACS

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'abrir.html'
      - 'central-administrativa-tacs.html'
      - 'central-*.js'
      - 'portal-*.js'
      - 'agenda-*.js'
      - 'moradores-autofill.js'
      - 'admin-*.js'
      - 'admin-*.css'
      - 'painel-oficial-*.html'
      - 'teste-v1/**'
      - 'manifest*.webmanifest'
      - 'icons/**'
      - 'assets/**'
      - '.github/workflows/atualizar-versao-portal-tacs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-versao-portal-tacs
  cancel-in-progress: false

jobs:
  versionar:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Registrar versão única e carimbar arquivos públicos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, datetime, re
          from pathlib import Path

          sha=(os.environ.get('GITHUB_SHA','')[:12] or 'manual')
          now=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          entries=[
              Path('index.html'),
              Path('abrir.html'),
              Path('central-administrativa-tacs.html'),
              Path('painel-oficial-recados-campanhas.html'),
          ]
          allowed=('.js','.css','.webmanifest','.json','.svg','.png')
          asset=re.compile(r'(?P<attr>\b(?:src|href))=(?P<quote>["\'])(?P<url>[^"\']+)(?P=quote)',re.I)

          def stamp(path):
              text=path.read_text(encoding='utf-8')
              def replace(match):
                  url=match.group('url')
                  if re.match(r'^(?:https?:)?//',url,re.I) or url.startswith(('#','data:')):
                      return match.group(0)
                  base=url.split('?',1)[0]
                  if not base.lower().endswith(allowed):
                      return match.group(0)
                  quote=match.group('quote')
                  return f"{match.group('attr')}={quote}{base}?v={sha}{quote}"
              text=asset.sub(replace,text)
              text=re.sub(
                  r'(<meta\s+name=["\']portal-release["\']\s+content=["\'])[^"\']*(["\']\s*/?>)',
                  lambda m:m.group(1)+sha+m.group(2),
                  text,
                  flags=re.I
              )
              path.write_text(text,encoding='utf-8')

          for entry in entries:
              stamp(entry)

          data={'version':sha,'releasedAt':now,'scope':'Portal TACS e painéis administrativos'}
          Path('portal-version.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'Portal TACS'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html abrir.html central-administrativa-tacs.html painel-oficial-recados-campanhas.html portal-version.json
          git diff --cached --quiet && exit 0
          git commit -m 'Atualiza versão integral do Portal TACS'
          for tentativa in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((tentativa*2))
          done
          exit 1
