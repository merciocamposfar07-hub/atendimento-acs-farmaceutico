name: Corrigir login administrativo v103

on:
  push:
    branches: [corrigir-login-admin-v103]
    paths:
      - '.github/workflows/corrigir-login-admin-v103.yml'

permissions:
  contents: write

jobs:
  corrigir-validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: corrigir-login-admin-v103
          fetch-depth: 0

      - name: Aplicar correção de transporte Safari
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          def must_replace(text, old, new, path, count=None):
              found=text.count(old)
              if found == 0:
                  raise SystemExit(f'{path}: padrão não encontrado: {old[:90]}')
              if count is not None and found != count:
                  raise SystemExit(f'{path}: esperado {count}, encontrado {found}: {old[:90]}')
              return text.replace(old,new)
          def remove_fetch_helper(text,path):
              novo,n=re.subn(r'\nfunction enviarPostRapidoV102\(campos\)\{.*?\n\}\nfunction post', '\nfunction post', text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'{path}: helper fetch v102 não localizado exatamente uma vez')
              return novo

          # Profissionais e serviços: formulário/iframe persistente volta a ser o transporte principal.
          p='teste-v1/painel-profissionais-servicos-v1.html'
          t=read(p)
          t=must_replace(t,"},5500);function limpar()","},12000);function limpar()",p,1)
          t=remove_fetch_helper(t,p)
          t=must_replace(t,"var duracao=acesso?20000:55000;","var duracao=acesso?30000:60000;",p,1)
          t=must_replace(t,"proximaEspera:350","proximaEspera:450",p,1)
          t=must_replace(t,"if(enviarPostRapidoV102(campos)){agendarConsultaResultado();return}\n  ","",p,1)
          t=must_replace(t,"Math.min(1600,Math.max(550,ativa.proximaEspera+150))","Math.min(1800,Math.max(600,ativa.proximaEspera+150))",p,1)
          write(p,t)

          # Agenda oficial + cópia de homologação: mesmo transporte por iframe persistente.
          for p in ['painel-oficial-agendas-vagas.html','teste-v1/painel-agendas-v1.html']:
              t=read(p)
              t=must_replace(t,"},5500);function limpar()","},12000);function limpar()",p,1)
              t=remove_fetch_helper(t,p)
              t=must_replace(t,"var duracao=acesso?20000:55000;","var duracao=acesso?30000:60000;",p,1)
              t=must_replace(t,"proximaEspera:350","proximaEspera:450",p,1)
              t=must_replace(t,"if(enviarPostRapidoV102(campos)){agendarConsultaResultado(350);return}\n  ","",p,1)
              t=must_replace(t,"agendarConsultaResultado(350)\n}","agendarConsultaResultado(450)\n}",p,1)
              write(p,t)

          # Recados/campanhas: restaura o registro seguro do iframe usado pelo Safari.
          p='teste-v1/painel-recados-campanhas-v1.html'
          t=read(p)
          t=must_replace(t,"},5500);function limpar()","},12000);function limpar()",p,1)
          t=remove_fetch_helper(t,p)
          t=must_replace(t,"var duracao=acesso?20000:55000;","var duracao=acesso?30000:60000;",p,1)
          t=must_replace(t,"proximaEspera:350","proximaEspera:450",p,1)
          t=must_replace(t,"if(enviarPostRapidoV102(campos)){agendarConsulta();return}\n  ","",p,1)
          old="""  var enviado=false;
  function enviarUmaVez(){
    if(enviado)return;
    enviado=true;
    try{f.submit()}catch(erro){finalizar({ok:false,message:'O navegador não conseguiu iniciar a comunicação com o servidor. Tente novamente.'})}
  }
  if(window.requestAnimationFrame){window.requestAnimationFrame(function(){window.requestAnimationFrame(enviarUmaVez)})}
  ativa.submitTimer=setTimeout(enviarUmaVez,180);
  agendarConsulta();
"""
          new="""  var enviado=false;
  function enviarUmaVez(){
    if(enviado||!ativa||ativa.id!==id)return;
    enviado=true;
    clearTimeout(ativa.submitTimer);ativa.submitTimer=null;
    try{f.submit()}catch(erro){finalizar({ok:false,message:'O navegador não conseguiu iniciar a comunicação com o servidor. Tente novamente.'});return}
    agendarConsulta();
  }
  function enviarDepoisDoRegistro(){
    if(typeof window.requestAnimationFrame==='function'){
      window.requestAnimationFrame(function(){window.requestAnimationFrame(enviarUmaVez)});
      return;
    }
    setTimeout(enviarUmaVez,60);
  }
  frame.addEventListener('load',enviarDepoisDoRegistro,{once:true});
  enviarDepoisDoRegistro();
  ativa.submitTimer=setTimeout(enviarUmaVez,180);
"""
          t=must_replace(t,old,new,p,1)
          write(p,t)

          # Moradores: restaura o registro seguro do iframe usado pelo Safari.
          p='teste-v1/painel-moradores-transport-v2.js'
          t=read(p)
          t=must_replace(t,"},5500);","},12000);",p,1)
          t=remove_fetch_helper(t,p)
          t=must_replace(t,"var duration=escrita?55000:20000;","var duration=escrita?60000:30000;",p,1)
          t=must_replace(t,"nextWait:350","nextWait:450",p,1)
          t=must_replace(t,"if(enviarPostRapidoV102(fields)){schedulePoll();return}\n  ","",p,1)
          old="""  var enviado=false;
  function enviarUmaVez(){
    if(enviado)return;
    enviado=true;
    try{form.submit()}catch(erro){finish({ok:false,message:'O navegador não conseguiu iniciar a comunicação com o servidor. Tente novamente.'})}
  }
  if(window.requestAnimationFrame){window.requestAnimationFrame(function(){window.requestAnimationFrame(enviarUmaVez)})}
  active.submitTimer=setTimeout(enviarUmaVez,180);
  schedulePoll();
"""
          new="""  var enviado=false;
  function enviarUmaVez(){
    if(enviado||!active||active.id!==rid)return;
    enviado=true;
    clearTimeout(active.submitTimer);active.submitTimer=null;
    try{form.submit()}catch(erro){finish({ok:false,message:'O navegador não conseguiu iniciar a comunicação com o servidor. Tente novamente.'});return}
    schedulePoll();
  }
  function enviarDepoisDoRegistro(){
    if(typeof window.requestAnimationFrame==='function'){
      window.requestAnimationFrame(function(){window.requestAnimationFrame(enviarUmaVez)});
      return;
    }
    setTimeout(enviarUmaVez,60);
  }
  frame.addEventListener('load',enviarDepoisDoRegistro,{once:true});
  enviarDepoisDoRegistro();
  active.submitTimer=setTimeout(enviarUmaVez,180);
"""
          t=must_replace(t,old,new,p,1)
          write(p,t)

          # Cachebusters administrativos. Nenhum arquivo do Portal TACS público é alterado.
          for p in ['painel-oficial-profissionais-servicos.html','painel-oficial-recados-campanhas.html','teste-v1/painel-moradores-v2.html']:
              t=read(p)
              t=must_replace(t,'20260813-admin-v102','20260813-admin-v103',p)
              write(p,t)
          p='painel-oficial-agendas-vagas.html'
          t=read(p)
          t=must_replace(t,'admin-warmup.js?v=20260812-auto-v101','admin-warmup.js?v=20260813-admin-v103',p,1)
          write(p,t)

          # Teste que antes aprovava o fetch passa a rejeitá-lo explicitamente.
          p='scripts/test_admin_fast_v102.js'
          write(p,"""'use strict';
const assert=require('node:assert/strict');
const fs=require('node:fs');
const path=require('node:path');
const ROOT=path.resolve(__dirname,'..');
const read=p=>fs.readFileSync(path.join(ROOT,p),'utf8');
const transports=[
  ['teste-v1/painel-profissionais-servicos-v1.html','proximaEspera:450',false],
  ['teste-v1/painel-recados-campanhas-v1.html','proximaEspera:450',true],
  ['painel-oficial-agendas-vagas.html','proximaEspera:450',false],
  ['teste-v1/painel-moradores-transport-v2.js','nextWait:450',true]
];
for(const [file,wait,dynamicFrame] of transports){
  const t=read(file);
  assert.doesNotMatch(t,/mode:'no-cors'/,file+' não pode usar fetch no-cors para autenticação');
  assert.doesNotMatch(t,/enviarPostRapidoV102/,file+' ainda contém o transporte que falhou no Safari real');
  assert.match(t,new RegExp(wait.replace(/[.*+?^${}()|[\\]\\]/g,'\\\\$&')),file+' sem polling inicial rápido');
  assert.match(t,/12000/,file+' deve tolerar resposta lenta do Apps Script sem matar JSONP cedo');
  assert.doesNotMatch(t,/74000|75000/,file+' ainda contém espera administrativa de 75 segundos');
  assert.equal((t.match(/\\.submit\\(\\)/g)||[]).length,1,file+' deve enviar cada operação uma única vez');
  assert.match(t,/\.method='POST'/,file+' deve manter POST por formulário compatível com Safari');
  if(dynamicFrame)assert.match(t,/addEventListener\('load',enviarDepoisDoRegistro,\{once:true\}\)/,file+' sem registro seguro do iframe dinâmico');
}
const moradores=read('teste-v1/painel-moradores-v2.html');
assert.doesNotMatch(moradores,/portal-auto-update\\.js/,'Moradores não deve carregar a UI de atualização do Portal TACS');
assert.match(moradores,/painel-moradores-transport-v2\\.js\\?v=20260813-admin-v103/);
const warm=read('admin-warmup.js');
assert.doesNotMatch(warm,/portal-auto-update\\.js/,'Warmup administrativo não deve injetar a rotina do Portal TACS');
for(const file of ['painel-oficial-profissionais-servicos.html','painel-oficial-recados-campanhas.html']){
  const t=read(file);
  assert.match(t,/cache:'default'/,file+' deve permitir cache do HTML versionado');
  assert.doesNotMatch(t,/cache:'no-store'/,file+' não deve forçar download integral a cada abertura');
  assert.match(t,/20260813-admin-v103/);
}
assert.match(read('painel-oficial-agendas-vagas.html'),/admin-warmup\\.js\\?v=20260813-admin-v103/);
console.log('ADMIN_LOGIN_V103_TRANSPORT_TESTS_OK');
""")

          # Corrige o teste de transporte para não esconder novamente o problema real.
          p='scripts/test_admin_transport.js'
          t=read(p)
          t=must_replace(t,"    assert.match(base, /mode:'no-cors'/);\n    assert.match(base, /if\\(enviarPostRapidoV102\\(campos\\)\\)\\{agendarConsulta\\(\\);return\\}/);",
                         "    assert.doesNotMatch(base, /mode:'no-cors'/);\n    assert.doesNotMatch(base, /enviarPostRapidoV102/);\n    assert.match(base, /frame\\.addEventListener\\('load',enviarDepoisDoRegistro,\\{once:true\\}\\)/);",p,1)
          old="""  assert.match(base, /mode:'no-cors'/, `${config.file} não possui POST rápido sem iframe no caminho principal.`);
  assert.match(base, /proximaEspera:350/, `${config.file} não inicia a confirmação rapidamente.`);
  assert.match(base, /credentials:'omit'/, `${config.file} não preserva o POST administrativo sem credenciais Google.`);
"""
          new="""  assert.doesNotMatch(base, /mode:'no-cors'/, `${config.file} não pode usar fetch no-cors no caminho administrativo.`);
  assert.doesNotMatch(base, /enviarPostRapidoV102/, `${config.file} ainda contém o transporte v102 que falhou no Safari real.`);
  assert.match(base, /proximaEspera:450/, `${config.file} não inicia a confirmação rapidamente.`);
  assert.match(base, /form\.method='POST'|f\.method='POST'/, `${config.file} não preserva POST por formulário compatível com Safari.`);
"""
          t=must_replace(t,old,new,p,1)
          t=must_replace(t,"/admin-warmup\\.js\\?v=202608(?:06-desempenho-v5|08-profissionais-duplicidade-v1|12-auto-v101|13-admin-v102)/",
                         "/admin-warmup\\.js\\?v=202608(?:06-desempenho-v5|08-profissionais-duplicidade-v1|12-auto-v101|13-admin-v103)/",p,1)
          t=must_replace(t,"      window.PortalTacsAdminPreload = {ok: true};\n      window.HTMLFormElement.prototype.submit",
                         "      window.PortalTacsAdminPreload = {ok: true};\n      window.fetch = function(){ errors.push('O fluxo administrativo tentou usar fetch em vez do formulário Safari.'); return Promise.reject(new Error('fetch administrativo bloqueado pelo teste')); };\n      window.HTMLFormElement.prototype.submit",p,1)
          write(p,t)

          # Gate: aponta para a revisão administrativa atual, sem tocar no portal público.
          p='scripts/test_quality_gate_v101.js'
          t=read(p)
          old="contem(agenda, 'admin-warmup.js?v=20260812-auto-v101') && contem(profissionais, 'admin-warmup.js?v=20260813-admin-v102') && contem(recados, 'admin-warmup.js?v=20260813-admin-v102')"
          new="contem(agenda, 'admin-warmup.js?v=20260813-admin-v103') && contem(profissionais, 'admin-warmup.js?v=20260813-admin-v103') && contem(recados, 'admin-warmup.js?v=20260813-admin-v103')"
          t=must_replace(t,old,new,p,1)
          write(p,t)
          PY

      - name: Instalar dependências
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Regressão completa
        run: npm test

      - name: Comprovar roundtrip real do Apps Script sem usar PIN verdadeiro
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://script.google.com/macros/s/AKfycbwOyG9yZqYly736ZsGta1q6Jd4Irkc-iRWURfypKcpBkyCCmO3hMNE4oOsXECTMCpSxYw/exec'
          STATUS=$(curl -L -sS --connect-timeout 5 --max-time 25 "$BASE?action=admin_status")
          echo "$STATUS" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
          RID="v103_login_${GITHUB_RUN_ID}_${RANDOM}"
          curl -L -sS --connect-timeout 5 --max-time 30 \
            -X POST \
            --data-urlencode 'action=admin_login' \
            --data-urlencode "requestId=$RID" \
            --data-urlencode 'pin=0000000000000000' \
            --data-urlencode 'dispositivo=github-v103-validacao' \
            "$BASE?_=$(date +%s)" >/tmp/v103-post.html
          confirmado=0
          for i in $(seq 1 20); do
            R=$(curl -L -sS --connect-timeout 5 --max-time 20 "$BASE?action=admin_result&requestId=$RID&_=$(date +%s%N)")
            if printf '%s' "$R" | grep -Eq '"pendente"[[:space:]]*:[[:space:]]*false'; then
              printf '%s' "$R" | grep -Eq '"result"[[:space:]]*:'
              confirmado=1
              echo "ROUNDTRIP_ADMIN_RESULT_CONFIRMADO tentativa=$i"
              break
            fi
            sleep 0.6
          done
          test "$confirmado" -eq 1

      - name: Auditar escopo e impedir alteração do Portal TACS público
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD | sort | tee /tmp/alterados.txt
          permitido='^(painel-oficial-agendas-vagas.html|painel-oficial-profissionais-servicos.html|painel-oficial-recados-campanhas.html|teste-v1/painel-agendas-v1.html|teste-v1/painel-profissionais-servicos-v1.html|teste-v1/painel-recados-campanhas-v1.html|teste-v1/painel-moradores-v2.html|teste-v1/painel-moradores-transport-v2.js|scripts/test_admin_fast_v102.js|scripts/test_admin_transport.js|scripts/test_quality_gate_v101.js)$'
          invalidos=$(grep -Ev "$permitido" /tmp/alterados.txt || true)
          if [ -n "$invalidos" ]; then echo "Arquivos fora do escopo:"; echo "$invalidos"; exit 1; fi
          git diff --exit-code HEAD -- index.html portal-odontologia-segunda-sexta.js agenda-config.js agenda-enfermeira.js portal-manutencao.js portal-public-data.js
          for f in teste-v1/painel-profissionais-servicos-v1.html teste-v1/painel-recados-campanhas-v1.html painel-oficial-agendas-vagas.html teste-v1/painel-moradores-transport-v2.js; do
            if grep -Fq "mode:'no-cors'" "$f" || grep -Fq 'enviarPostRapidoV102' "$f"; then echo "Transporte v102 ainda presente: $f"; exit 1; fi
            test "$(grep -o '\.submit()' "$f" | wc -l | tr -d ' ')" = '1'
          done

      - name: Gravar somente após aprovação
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Portal TACS'
          git config user.email 'actions@users.noreply.github.com'
          git add painel-oficial-agendas-vagas.html painel-oficial-profissionais-servicos.html painel-oficial-recados-campanhas.html \
            teste-v1/painel-agendas-v1.html teste-v1/painel-profissionais-servicos-v1.html teste-v1/painel-recados-campanhas-v1.html \
            teste-v1/painel-moradores-v2.html teste-v1/painel-moradores-transport-v2.js \
            scripts/test_admin_fast_v102.js scripts/test_admin_transport.js scripts/test_quality_gate_v101.js
          git commit -m 'Corrigir autenticação dos quatro painéis administrativos v103'
          git push origin HEAD:corrigir-login-admin-v103
