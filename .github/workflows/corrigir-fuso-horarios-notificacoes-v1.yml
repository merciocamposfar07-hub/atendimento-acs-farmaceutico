name: Corrigir fuso dos horários de notificações V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corrigir-fuso-horarios-notificacoes-v1.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Aplicar correção cirúrgica, testar e publicar código
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          backend = Path('apps-script/ZZZZ_40_MensagensIndividuaisMoradorV1.gs')
          s = backend.read_text()

          if "FUSO:'America/Recife'" not in s:
              old = "  RESULT_SECONDS:300,\n  TIPOS:Object.freeze"
              new = "  RESULT_SECONDS:300,\n  FUSO:'America/Recife',\n  TIPOS:Object.freeze"
              if old not in s:
                  raise SystemExit('ponto de configuração do fuso não localizado')
              s = s.replace(old, new, 1)

          helper = """function mensagemIndividualV1HorarioLocal_(valor){
  if(valor===null||typeof valor==='undefined'||valor==='')return '';
  if(Object.prototype.toString.call(valor)==='[object Date]'&&!isNaN(valor.getTime())){
    try{return Utilities.formatDate(valor,TACS_MENSAGEM_INDIVIDUAL_V1.FUSO,'dd/MM/yyyy HH:mm:ss');}catch(e){}
  }
  return mensagemIndividualV1Texto_(valor);
}

"""
          marker = "function mensagemIndividualV1Status_(p,contexto){"
          if 'function mensagemIndividualV1HorarioLocal_' not in s:
              if marker not in s:
                  raise SystemExit('função de status não localizada')
              s = s.replace(marker, helper + marker, 1)

          s = s.replace(
              "rec.getRange(2,1,rec.getLastRow()-1,TACS_NOTIFICACOES_AREA_V1.RECEIPT_HEADERS.length).getDisplayValues().forEach(function(row){",
              "rec.getRange(2,1,rec.getLastRow()-1,TACS_NOTIFICACOES_AREA_V1.RECEIPT_HEADERS.length).getValues().forEach(function(row){",
              1
          )
          s = s.replace(
              "total++;if(row[13]){encaminhadas++;ultimoEnc=row[13];}if(row[14]){exibidas++;ultimoExib=row[14];}if(row[15]){confirmadas++;ultimoConf=row[15];}",
              "total++;if(row[13]){encaminhadas++;ultimoEnc=mensagemIndividualV1HorarioLocal_(row[13]);}if(row[14]){exibidas++;ultimoExib=mensagemIndividualV1HorarioLocal_(row[14]);}if(row[15]){confirmadas++;ultimoConf=mensagemIndividualV1HorarioLocal_(row[15]);}",
              1
          )
          s = s.replace(
              "open.getRange(2,1,open.getLastRow()-1,TACS_NOTIFICACOES_AREA_V1.OPEN_HEADERS.length).getDisplayValues().forEach(function(row){",
              "open.getRange(2,1,open.getLastRow()-1,TACS_NOTIFICACOES_AREA_V1.OPEN_HEADERS.length).getValues().forEach(function(row){",
              1
          )
          s = s.replace(
              "abertas++;ultimoAberto=row[7]||ultimoAberto;",
              "abertas++;ultimoAberto=mensagemIndividualV1HorarioLocal_(row[7])||ultimoAberto;",
              1
          )

          required = [
              "FUSO:'America/Recife'",
              "Utilities.formatDate(valor,TACS_MENSAGEM_INDIVIDUAL_V1.FUSO,'dd/MM/yyyy HH:mm:ss')",
              "ultimoEnc=mensagemIndividualV1HorarioLocal_(row[13])",
              "ultimoExib=mensagemIndividualV1HorarioLocal_(row[14])",
              "ultimoConf=mensagemIndividualV1HorarioLocal_(row[15])",
              "ultimoAberto=mensagemIndividualV1HorarioLocal_(row[7])"
          ]
          for item in required:
              if item not in s:
                  raise SystemExit('correção incompleta: '+item)
          backend.write_text(s)

          # Corrige apenas o bloqueio pré-existente do gate: a Central deve usar
          # a leitura rápida local de notificações no carregamento, como o próprio
          # teste de regressão já exige. Não altera a tela nem os dados.
          central = Path('central-administrativa-tacs.js')
          c = central.read_text()
          old = "post('admin_notificacoes_saude',session(),'admin_notificacoes_saude_result'"
          new = "post('admin_notificacoes_saude_rapida',session(),'admin_notificacoes_saude_result'"
          if old in c:
              c = c.replace(old, new, 1)
              central.write_text(c)
          if "post('admin_notificacoes_saude_rapida',session(),'admin_notificacoes_saude_result'" not in c:
              raise SystemExit('consulta rápida de notificações da Central não confirmada')

          test = Path('scripts/test_mensagem_individual_morador_v1.js')
          t = test.read_text()
          anchor = "assert.match(backend,/OPEN_SHEET/);"
          additions = """
assert.match(backend,/FUSO:'America\\/Recife'/,'Horários administrativos devem usar o fuso de Pernambuco.');
assert.match(backend,/Utilities\\.formatDate\\(valor,TACS_MENSAGEM_INDIVIDUAL_V1\\.FUSO,'dd\\/MM\\/yyyy HH:mm:ss'\\)/,'Datas reais devem ser formatadas explicitamente em America/Recife.');
assert.match(backend,/ultimoEnc=mensagemIndividualV1HorarioLocal_\\(row\\[13\\]\\)/,'Encaminhamento deve retornar horário local correto.');
assert.match(backend,/ultimoExib=mensagemIndividualV1HorarioLocal_\\(row\\[14\\]\\)/,'Exibição deve retornar horário local correto.');
assert.match(backend,/ultimoConf=mensagemIndividualV1HorarioLocal_\\(row\\[15\\]\\)/,'Confirmação deve retornar horário local correto.');
assert.match(backend,/ultimoAberto=mensagemIndividualV1HorarioLocal_\\(row\\[7\\]\\)/,'Abertura deve retornar horário local correto.');
"""
          if "Horários administrativos devem usar o fuso de Pernambuco" not in t:
              if anchor not in t:
                  raise SystemExit('âncora do teste de mensagem individual não localizada')
              t = t.replace(anchor, anchor + additions, 1)
              test.write_text(t)
          PY

          npm ci
          npm test

          printf '%s\n' 'CORRECAO_FUSO_NOTIFICACOES_AMERICA_RECIFE_V1_20260826' > .github/apps-script-release-request
          git rm -f .github/workflows/corrigir-fuso-horarios-notificacoes-v1.yml

          git config user.name 'Portal TACS Release'
          git config user.email 'actions@users.noreply.github.com'
          git add apps-script/ZZZZ_40_MensagensIndividuaisMoradorV1.gs central-administrativa-tacs.js scripts/test_mensagem_individual_morador_v1.js .github/apps-script-release-request
          git commit -m 'Corrigir horário das confirmações para America Recife'
          git pull --rebase origin main
          git push origin HEAD:main
