name: Adicionar voltar a Central V5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-central-back-button-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar botão de retorno nos painéis administrativos
        shell: python
        run: |
          from pathlib import Path
          import re

          tag = '<script src="/atendimento-acs-farmaceutico/central-back-button-v1.js?v=20260825-v5"></script>'
          targets = [
              # Painéis abertos diretamente pela Central
              Path('teste-v1/painel-moradores-v2.html'),
              Path('painel-suporte-moradores-v2.html'),
              Path('painel-oficial-recados-campanhas.html'),
              Path('painel-oficial-agendas-vagas.html'),
              Path('painel-oficial-profissionais-servicos.html'),
              Path('painel-oficial-tacs-areas.html'),
              Path('painel-oficial-organizacoes-municipios.html'),
              # Documentos reais usados pelos wrappers com document.write().
              Path('teste-v1/painel-profissionais-servicos-v1.html'),
              Path('teste-v1/painel-tacs-areas-v1.html'),
              # Portal público: o script só exibe o retorno quando veio da Central.
              Path('index.html'),
          ]

          for path in targets:
              if not path.exists():
                  print(f'AVISO: arquivo não encontrado: {path}')
                  continue
              text = path.read_text(encoding='utf-8')
              if 'central-back-button-v1.js' in text:
                  novo = re.sub(r'<script src="/atendimento-acs-farmaceutico/central-back-button-v1\.js\?v=[^"]+"></script>', tag, text)
                  if novo != text:
                      path.write_text(novo, encoding='utf-8')
                      print(f'ATUALIZADO: {path}')
                  else:
                      print(f'OK já na versão atual: {path}')
                  continue
              if '</body>' not in text:
                  raise SystemExit(f'ERRO: </body> não encontrado em {path}')
              text = text.replace('</body>', tag + '\n</body>', 1)
              path.write_text(text, encoding='utf-8')
              print(f'INSERIDO: {path}')

      - name: Gravar alterações
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'Portal TACS'
          git config user.email 'actions@users.noreply.github.com'
          git add teste-v1/painel-moradores-v2.html painel-suporte-moradores-v2.html painel-oficial-recados-campanhas.html painel-oficial-agendas-vagas.html painel-oficial-profissionais-servicos.html painel-oficial-tacs-areas.html painel-oficial-organizacoes-municipios.html teste-v1/painel-profissionais-servicos-v1.html teste-v1/painel-tacs-areas-v1.html index.html
          git commit -m 'Aplicar Voltar à Central V5 em todos os painéis'
          git push
