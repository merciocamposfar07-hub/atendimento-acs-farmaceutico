name: Admin v102.1 remover warmup duplicado

on:
  push:
    branches: [admin-v1021-remover-warmup-duplicado]
    paths:
      - '.github/workflows/admin-v1021-remover-warmup-duplicado.yml'

permissions:
  contents: write

jobs:
  corrigir-testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin-v1021-remover-warmup-duplicado
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Remover somente a segunda execução do warmup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ['painel-oficial-profissionais-servicos.html','painel-oficial-recados-campanhas.html']:
              p=Path(name)
              t=p.read_text(encoding='utf-8')
              old='<scr\'+'+'\'ipt src="../admin-warmup.js?v=20260813-admin-v102"></scr\'+'+'\'ipt>'
              if t.count(old)!=1:
                  raise SystemExit(f'{name}: esperado exatamente 1 warmup interno, encontrado {t.count(old)}')
              t=t.replace(old,'',1)
              p.write_text(t,encoding='utf-8')
          PY
      - name: Instalar e testar tudo
        run: |
          npm ci
          npm test
      - name: Auditar escopo e condição final
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --name-only | grep -Fx 'painel-oficial-profissionais-servicos.html'
          git diff --name-only | grep -Fx 'painel-oficial-recados-campanhas.html'
          test "$(grep -Fo 'admin-warmup.js?v=20260813-admin-v102' painel-oficial-profissionais-servicos.html | wc -l)" -eq 1
          test "$(grep -Fo 'admin-warmup.js?v=20260813-admin-v102' painel-oficial-recados-campanhas.html | wc -l)" -eq 1
          grep -Fq "fetch(origem,{cache:'default'})" painel-oficial-profissionais-servicos.html
          grep -Fq "fetch(origem,{cache:'default'})" painel-oficial-recados-campanhas.html
      - name: Gravar após aprovação
        shell: bash
        run: |
          git config user.name 'Portal TACS'
          git config user.email 'actions@users.noreply.github.com'
          git add painel-oficial-profissionais-servicos.html painel-oficial-recados-campanhas.html
          git commit -m 'Remover warmup duplicado de dois painéis administrativos'
          git push origin HEAD:admin-v1021-remover-warmup-duplicado
