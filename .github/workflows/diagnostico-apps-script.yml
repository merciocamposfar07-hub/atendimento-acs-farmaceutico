name: Diagnostico Apps Script

on:
  push:
    paths:
      - '.github/workflows/diagnostico-apps-script.yml'

permissions:
  contents: write

jobs:
  preparar-e-testar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar página funcional e apontar para implantação separada
        shell: bash
        run: |
          set -euo pipefail
          git show 9924aa9898b35092866b47e26e5c5d71755610a6:teste-v1/admin-escrita-controlada.html > teste-v1/admin-escrita-controlada.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('teste-v1/admin-escrita-controlada.html')
          text = p.read_text(encoding='utf-8')
          old_url = 'https://script.google.com/macros/s/AKfycbwTmO0Iv-0tWxxygHOrAJ5q0CAXFivu0oYubcfRC6lbpdFFZs9hPV0RkIEWwhtCKrFiLw/dev'
          new_url = 'https://script.google.com/macros/s/AKfycbwOyG9yZqYly736ZsGta1q6Jd4Irkc-iRWURfypKcpBkyCCmO3hMNE4oOsXECTMCpSxYw/exec'
          if old_url not in text:
              raise SystemExit('URL antiga não encontrada na página restaurada')
          text = text.replace(old_url, new_url)
          text = text.replace(
              'Esta tela usa a versão de desenvolvimento do Apps Script. A implantação pública e o Portal do Morador permanecem inalterados.',
              'Esta tela usa uma implantação separada de teste. A implantação pública e o Portal do Morador permanecem inalterados.'
          )
          text = text.replace(
              'O módulo de escrita ainda não respondeu pela URL de desenvolvimento.',
              'A implantação separada de teste ainda não respondeu ao módulo de escrita.'
          )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Testar implantação separada de escrita
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://script.google.com/macros/s/AKfycbwOyG9yZqYly736ZsGta1q6Jd4Irkc-iRWURfypKcpBkyCCmO3hMNE4oOsXECTMCpSxYw/exec'
          STATUS_ESCRITA=$(curl -L --fail --silent --show-error --max-time 30 "$BASE?action=admin_escrita_status&_=$(date +%s)")
          STATUS_ADMIN=$(curl -L --fail --silent --show-error --max-time 30 "$BASE?action=admin_status&_=$(date +%s)")
          grep -q '"ok":true' <<< "$STATUS_ESCRITA"
          grep -q '"versao":"1.0.0"' <<< "$STATUS_ESCRITA"
          grep -q '"pinConfigurado":true' <<< "$STATUS_ADMIN"
          {
            echo "executado_em_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "base=$BASE"
            echo "admin_escrita_status=$STATUS_ESCRITA"
            echo "admin_status=$STATUS_ADMIN"
            echo "pagina_api_configurada=$BASE"
          } > diagnostico-escrita-controlada.txt

      - name: Gravar página e diagnóstico
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add teste-v1/admin-escrita-controlada.html diagnostico-escrita-controlada.txt
          git commit -m 'Prepara teste funcional da escrita controlada' || exit 0
          git push
