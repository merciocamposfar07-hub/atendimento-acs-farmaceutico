name: Diagnostico Apps Script

on:
  push:
    paths:
      - '.github/workflows/diagnostico-apps-script.yml'

permissions:
  contents: write

jobs:
  testar-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Testar implantação separada de escrita
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://script.google.com/macros/s/AKfycbwOyG9yZqYly736ZsGta1q6Jd4Irkc-iRWURfypKcpBkyCCmO3hMNE4oOsXECTMCpSxYw/exec'
          STATUS_ESCRITA=$(curl -L --fail --silent --show-error --max-time 30 "$BASE?action=admin_escrita_status&_=$(date +%s)")
          STATUS_ADMIN=$(curl -L --fail --silent --show-error --max-time 30 "$BASE?action=admin_status&_=$(date +%s)")
          {
            echo "executado_em_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "base=$BASE"
            echo "admin_escrita_status=$STATUS_ESCRITA"
            echo "admin_status=$STATUS_ADMIN"
          } > diagnostico-escrita-controlada.txt

      - name: Gravar resultado
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostico-escrita-controlada.txt
          git commit -m 'Registra diagnóstico externo da escrita controlada' || exit 0
          git push
