name: Cache bust símbolos campanhas v3

on:
  push:
    paths:
      - '.github/workflows/cache-bust-simbolos-campanhas-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Atualizar somente versão dos símbolos
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('campanhas-periodo-v2.js')
          s=p.read_text(encoding='utf-8')
          old="assets/campanhas/'+file+'?v=1"
          new="assets/campanhas/'+file+'?v=padrao-agosto-20260817"
          if old not in s:
              raise SystemExit('Referência de cache dos símbolos não encontrada; nenhuma alteração feita.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campanhas-periodo-v2.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Atualiza cache apenas dos símbolos das campanhas'
          git push
