name: Corrigir Portal Geral v74

on:
  push:
    paths:
      - '.github/workflows/corrigir-portal-geral-v74.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corrigir PIN, cinco dias e cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js = Path('admin-controle-integral.js')
          text = js.read_text(encoding='utf-8')

          text = text.replace(
              "return clean(localStorage.getItem(KEY) || sessionStorage.getItem(KEY));",
              "return clean(sessionStorage.getItem(KEY) || localStorage.getItem(KEY));"
          )

          text = text.replace(
              "'<div class=\"day-title\"><strong>' + esc(item.day) + '</strong>' +",
              "'<div class=\"day-title\"><strong>' + esc(item.day + (module === 'odontologia' && item.day === 'Sexta-feira' ? ' • DIA EXTRA' : '')) + '</strong>' +"
          )

          text = text.replace(
              "vagasEmergenciais: item.active ? Number(item.emergency || 0) : 0\n        };",
              "vagasEmergenciais: item.active ? Number(item.emergency || 0) : 0,\n          diaExtra: item.day === 'Sexta-feira'\n        };"
          )

          text = text.replace(
              "Informe ao menos uma data de segunda, terça ou quinta-feira.",
              "Informe ao menos uma data entre segunda e sexta-feira."
          )

          old_load = """      state.odontologia = rows
        .filter(function (item) {
          return DENTAL_DAYS.indexOf(clean(item.dia)) >= 0;
        })
        .map(function (item) {
          var common = Number(item.vagasComuns || 0);
          var emergency = Number(item.vagasEmergenciais || 0);
          return {
            day: clean(item.dia),
            active: common > 0 || emergency > 0,
            date: clean(item.data),
            common: common,
            emergency: emergency
          };
        });
      if (!state.odontologia.length) state.odontologia = defaultDental();"""

          new_load = """      state.odontologia = DENTAL_DAYS.map(function (day) {
        var item = rows.find(function (candidate) {
          return clean(candidate.dia) === day;
        });
        if (!item) {
          return {
            day: day,
            active: false,
            date: '',
            common: 0,
            emergency: 0
          };
        }
        var common = Number(item.vagasComuns || 0);
        var emergency = Number(item.vagasEmergenciais || 0);
        return {
          day: day,
          active: common > 0 || emergency > 0,
          date: clean(item.data),
          common: common,
          emergency: emergency
        };
      });"""

          if old_load in text:
              text = text.replace(old_load, new_load)

          text = text.replace(
              "index.html?v=20260730-51&espelho=",
              "index.html?v=20260731-74&espelho="
          )

          js.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(
              r'<script src="portal-unificado\.js\?v=[^"]+"></script>',
              '<script src="portal-unificado.js?v=20260731-74"></script>',
              html
          )
          index.write_text(html, encoding='utf-8')
          PY

      - name: Validar
        run: |
          grep -q 'sessionStorage.getItem(KEY) || localStorage.getItem(KEY)' admin-controle-integral.js
          grep -q 'DENTAL_DAYS.map' admin-controle-integral.js
          grep -q 'DIA EXTRA' admin-controle-integral.js
          grep -q 'portal-unificado.js?v=20260731-74' index.html

      - name: Publicar
        run: |
          if git diff --quiet; then
            echo 'Correções já publicadas.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-controle-integral.js index.html
          git commit -m 'Corrigir PIN, cinco dias e tela do Portal Geral'
          git push
