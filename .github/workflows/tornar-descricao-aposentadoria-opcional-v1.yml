name: Tornar descricao aposentadoria opcional V1

on:
  push:
    paths:
      - 'scripts/tornar-descricao-aposentadoria-opcional-v1.py'
      - '.github/workflows/tornar-descricao-aposentadoria-opcional-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar ajuste
        run: python scripts/tornar-descricao-aposentadoria-opcional-v1.py
      - name: Validar escopo
        run: |
          grep -q "retirementOptional=category==='Solicitar ficha de cadastro para Aposentadoria'" index.html
          grep -q "subject||attachmentOptional||retirementOptional" index.html
          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="index.html"
          test "$CHANGED" = "$EXPECTED"
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Torna descricao opcional na ficha de aposentadoria'
          git pull --rebase origin main
          git push origin main
