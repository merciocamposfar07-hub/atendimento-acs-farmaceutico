name: Bloco 3 Local First V1

on:
  push:
    branches:
      - central-bloco3-local-first-v1
    paths:
      - 'scripts/aplicar_bloco3_local_first_v1.py'
      - '.github/workflows/bloco3-local-first-v1.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/aplicar_bloco3_local_first_v1.py'
      - '.github/workflows/bloco3-local-first-v1.yml'

permissions:
  contents: write

jobs:
  aplicar-testar-commit:
    if: github.event_name == 'push' || github.head_ref == 'central-bloco3-local-first-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch do Bloco 3
        uses: actions/checkout@v4
        with:
          ref: central-bloco3-local-first-v1
          fetch-depth: 0

      - name: Aplicar somente o Bloco 3
        run: python3 scripts/aplicar_bloco3_local_first_v1.py

      - name: Validar sintaxe do teste e contrato local-first
        run: |
          node --check scripts/test_admin_local_first_v1.js
          node scripts/test_admin_local_first_v1.js

      - name: Instalar dependencias
        run: npm ci

      - name: Executar regressao completa
        run: npm test

      - name: Garantir escopo fechado
        run: |
          ALLOWED='painel-oficial-agendas-vagas.html|painel-oficial-recados-campanhas.html|teste-v1/painel-profissionais-servicos-v1.html|scripts/test_admin_local_first_v1.js|package.json|scripts/aplicar_bloco3_local_first_v1.py|.github/workflows/bloco3-local-first-v1.yml'
          EXTRA=$(git diff --name-only | grep -Ev "^($ALLOWED)$" || true)
          if [ -n "$EXTRA" ]; then
            echo 'Arquivos fora do escopo:'
            echo "$EXTRA"
            exit 1
          fi
          grep -q 'portalTacsAdminSnapshotV1:agendas:' painel-oficial-agendas-vagas.html
          grep -q 'portalTacsAdminSnapshotV1:recados:' painel-oficial-recados-campanhas.html
          grep -q 'portalTacsAdminSnapshotV1:profissionais:' teste-v1/painel-profissionais-servicos-v1.html
          ! grep -q 'portalTacsAdminSnapshotV1:moradores:' teste-v1/painel-moradores-v2.html

      - name: Remover ferramentas temporarias e gravar somente resultado validado
        run: |
          rm -f scripts/aplicar_bloco3_local_first_v1.py .github/workflows/bloco3-local-first-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Bloco 3: dados local-first seguros nos paineis administrativos'
          git pull --rebase origin central-bloco3-local-first-v1
          git push origin central-bloco3-local-first-v1
