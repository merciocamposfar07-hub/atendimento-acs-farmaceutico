name: Corrigir estabilidade do painel Recados no iPhone

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recados-iphone-desbloquear-v1.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correção cirúrgica
        run: python3 scripts/fix_recados_estabilidade_v2.py

      - name: Validar sintaxe e escopo
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check central-back-button-v1.js
          node --check /tmp/recados-inline.js
          git diff -- painel-oficial-recados-campanhas.html central-back-button-v1.js

      - name: Publicar somente a correção validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Portal TACS'
          git config user.email 'actions@users.noreply.github.com'
          git add painel-oficial-recados-campanhas.html central-back-button-v1.js
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'Estabilizar Recados sem bloquear pelo OneSignal'
          git pull --rebase origin main
          git push origin HEAD:main
