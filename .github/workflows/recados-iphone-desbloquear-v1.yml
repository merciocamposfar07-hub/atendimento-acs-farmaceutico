name: Reverter correcao instavel do painel Recados

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recados-iphone-desbloquear-v1.yml'

permissions:
  contents: write

jobs:
  reverter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar estado anterior conhecido
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          painel = Path('painel-oficial-recados-campanhas.html')
          text = painel.read_text(encoding='utf-8')

          inicio = 'var saudeRemotaAtiva=null;'
          original = "function atualizarSaudeNotificacoesRemota(){if(!(token||territorioToken)||ativa)return;document.getElementById('saudeNotificacoes').classList.remove('oculto');status('saudeNotificacoesStatus','Conferindo o estado atual no OneSignal…','aviso');post('admin_notificacoes_saude_remota',sessao(),function(remoto){if(remoto&&remoto.ok===true){renderSaudeNotificacoes(remoto);return}status('saudeNotificacoesStatus','A conferência do OneSignal não terminou agora. Os últimos dados continuam visíveis.','aviso')},'admin_notificacoes_saude_result')}\n"

          if inicio in text:
              pattern = r"var saudeRemotaAtiva=null;.*?(?=function solicitarReparoNotificacoesArea)"
              text, n = re.subn(pattern, original, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit('Falha ao localizar exatamente o bloco instavel do OneSignal.')

          text = text.replace(
              'central-back-button-v1.js?v=20260826-recados-estabilidade-v2',
              'central-back-button-v1.js?v=0db398050474',
              1
          )
          painel.write_text(text, encoding='utf-8')

          render = Path('central-back-button-v1.js')
          rtext = render.read_text(encoding='utf-8')
          instavel = "'html{height:auto!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:visible!important;scroll-behavior:auto!important;}',"
          estavel = "'html{height:auto!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important;scroll-behavior:auto!important;}',"
          if instavel in rtext:
              rtext = rtext.replace(instavel, estavel, 1)
          elif estavel not in rtext:
              raise SystemExit('Regra de rolagem esperada nao foi encontrada.')
          render.write_text(rtext, encoding='utf-8')
          PY

      - name: Validar antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check central-back-button-v1.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('painel-oficial-recados-campanhas.html').read_text(encoding='utf-8')
          scripts=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',html,flags=re.S|re.I):
              if 'src=' not in attrs.lower(): scripts.append(body)
          Path('/tmp/recados-inline.js').write_text('\n;\n'.join(scripts),encoding='utf-8')
          assert 'var saudeRemotaAtiva=null;' not in html
          assert "function atualizarSaudeNotificacoesRemota(){if(!(token||territorioToken)||ativa)return;" in html
          assert 'central-back-button-v1.js?v=0db398050474' in html
          render=Path('central-back-button-v1.js').read_text(encoding='utf-8')
          assert 'overflow-y:auto!important;scroll-behavior:auto!important' in render
          PY
          node --check /tmp/recados-inline.js

      - name: Publicar reversao
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Portal TACS'
          git config user.email 'actions@users.noreply.github.com'
          git add painel-oficial-recados-campanhas.html central-back-button-v1.js
          if git diff --cached --quiet; then
            echo 'Estado anterior ja restaurado.'
            exit 0
          fi
          git commit -m 'Reverter correcao instavel do painel Recados'
          git pull --rebase origin main
          git push origin HEAD:main

