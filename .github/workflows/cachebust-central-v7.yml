name: Cache bust Central V7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cachebust-central-v7.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar versões dos scripts da Central
        shell: python
        run: |
          from pathlib import Path

          path = Path('central-administrativa-tacs.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '/atendimento-acs-farmaceutico/central-administrativa-tacs.js?v=20260917-isolamento-superficies-v1':
              '/atendimento-acs-farmaceutico/central-administrativa-tacs.js?v=20260917-shell-estavel-v2',
              '/atendimento-acs-farmaceutico/conecta-morador-pin-local-v2.js?v=5b56e3dda8cb':
              '/atendimento-acs-farmaceutico/conecta-morador-pin-local-v2.js?v=20260917-cache-first-passivo-v7',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'ERRO: referência esperada não encontrada: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          print('OK: referências da Central atualizadas sem alterar lógica.')

      - name: Gravar alteração e remover workflow temporário
        shell: bash
        run: |
          rm -f .github/workflows/cachebust-central-v7.yml
          git config user.name 'Portal TACS'
          git config user.email 'actions@users.noreply.github.com'
          git add central-administrativa-tacs.html .github/workflows/cachebust-central-v7.yml
          git commit -m 'fix(central): forçar carregamento do shell estável e V7 passiva'
          git push
