# executar v99 corrigido
name: Otimizar painel agendas e vagas v99

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/otimizar-painel-agendas-vagas-v99.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: otimizar-painel-agendas-vagas-v99
  cancel-in-progress: false

jobs:
  otimizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transformar somente o painel oficial de agendas e vagas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          fonte = Path('teste-v1/painel-agendas-v1.html')
          destino = Path('painel-oficial-agendas-vagas.html')
          s = fonte.read_text(encoding='utf-8')

          viewport = '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
          head_extra = viewport + '\n' + '\n'.join([
              '<meta name="theme-color" content="#073A55">',
              '<link rel="icon" type="image/svg+xml" href="/atendimento-acs-farmaceutico/icons/painel-agendas.svg">',
              '<link rel="apple-touch-icon" href="/atendimento-acs-farmaceutico/icons/painel-agendas.svg">',
              '<link rel="manifest" href="/atendimento-acs-farmaceutico/manifest-agendas.webmanifest">',
              '<link rel="preconnect" href="https://script.google.com">',
              '<link rel="preconnect" href="https://script.googleusercontent.com">',
              '<link rel="dns-prefetch" href="//script.google.com">',
              '<script src="/atendimento-acs-farmaceutico/admin-warmup.js?v=20260812-agendas-direto-v99"></script>'
          ])
          if viewport not in s:
              raise SystemExit('Viewport não encontrado.')
          s = s.replace(viewport, head_extra, 1)

          trocas = [
              ('<title>Painel de agendas V1.1 • Portal TACS</title>', '<title>Painel oficial de agendas e vagas • Portal TACS</title>'),
              ('AMBIENTE ISOLADO • FASE 3', 'PAINEL ADMINISTRATIVO OFICIAL'),
              ('<h1>Painel de agendas V1.1</h1>', '<h1>Agendas e vagas</h1>'),
              ('A tela usa a implantação separada de teste, mas qualquer salvamento confirmado altera a planilha real. A confirmação só aparece depois de uma releitura independente de todos os campos.', 'Painel administrativo oficial conectado à planilha do Portal TACS. Toda alteração só é confirmada depois da releitura independente dos campos.'),
              ('Verificando a implantação separada de teste…', 'Digite o PIN para carregar as agendas. A conexão está sendo preparada em segundo plano.'),
              ('Portal TACS • Painel administrativo isolado', 'Portal TACS • Painel administrativo oficial'),
              ('Portal do Morador não foi modificado', 'Alterações confirmadas são aplicadas ao Portal do Morador')
          ]
          for antigo, novo in trocas:
              if antigo not in s:
                  raise SystemExit('Texto base não encontrado: ' + antigo[:50])
              s = s.replace(antigo, novo, 1)

          old_jsonp = "function jsonp(action,parametros,receber){contador++;var nome='__agv3_'+Date.now()+'_'+contador,s=document.createElement('script'),p=parametros||{},fim=false,timer=setTimeout(function(){encerrar({ok:false,temporario:true,message:'Consulta temporariamente indisponível.'})},25000);function limpar(){clearTimeout(timer);if(s.parentNode)s.parentNode.removeChild(s);try{delete window[nome]}catch(e){window[nome]=undefined}}function encerrar(r){if(fim)return;fim=true;limpar();receber(r)}window[nome]=function(r){encerrar(r)};var q=['action='+encodeURIComponent(action),'callback='+encodeURIComponent(nome),'_='+Date.now()];Object.keys(p).forEach(function(k){q.push(encodeURIComponent(k)+'='+encodeURIComponent(txt(p[k])))});s.src=API+'?'+q.join('&');s.onerror=function(){encerrar({ok:false,temporario:true,message:'Falha de rede ao consultar o servidor.'})};document.head.appendChild(s)}"
          new_jsonp = old_jsonp.replace("__agv3_", "__ag_fast_").replace("},25000)", "},7000)")
          if old_jsonp not in s:
              raise SystemExit('JSONP antigo não encontrado.')
          s = s.replace(old_jsonp, new_jsonp, 1)

          old_sched = "function agendarConsultaResultado(){if(!ativa)return;clearTimeout(ativa.pollTimer);ativa.pollTimer=setTimeout(consultarResultado,ativa.proximaEspera)}"
          new_sched = "function agendarConsultaResultado(espera){if(!ativa)return;clearTimeout(ativa.pollTimer);ativa.pollTimer=setTimeout(consultarResultado,Number(espera||ativa.proximaEspera||700))}"
          if old_sched not in s:
              raise SystemExit('Agendamento antigo não encontrado.')
          s = s.replace(old_sched, new_sched, 1)

          old_poll = "function consultarResultado(){if(!ativa)return;jsonp('admin_result',{requestId:ativa.id},function(r){if(!ativa)return;if(r&&r.ok===true&&r.pendente===false){finalizar(r.result);return}if(Date.now()>=ativa.limite){finalizar({ok:false,message:'A confirmação do servidor ainda está em processamento. A operação não será reenviada automaticamente.'});return}ativa.proximaEspera=Math.min(8000,ativa.proximaEspera+1000);agendarConsultaResultado()})}"
          new_poll = "function consultarResultado(){if(!ativa)return;jsonp('admin_result',{requestId:ativa.id},function(r){if(!ativa)return;if(r&&r.ok===true&&r.pendente===false){finalizar(r.result);return}if(Date.now()>=ativa.limite){finalizar({ok:false,temporario:true,message:'A conexão demorou mais que o esperado. Toque novamente em Entrar e carregar agendas.'});return}if(r&&r.ok===true&&r.pendente===true){ativa.falhas=0;ativa.proximaEspera=Math.min(1600,Math.max(700,ativa.proximaEspera+150))}else{ativa.falhas=(ativa.falhas||0)+1;ativa.proximaEspera=Math.min(2200,900+ativa.falhas*250)}agendarConsultaResultado()})}"
          if old_poll not in s:
              raise SystemExit('Polling antigo não encontrado.')
          s = s.replace(old_poll, new_poll, 1)

          old_post = "function post(action,payload,receber){if(ativa){receber({ok:false,message:'Aguarde a operação anterior terminar.'});return}var id=requestId(action),campos={};Object.keys(payload||{}).forEach(function(k){campos[k]=payload[k]});campos.action=action;campos.requestId=id;ativa={id:id,action:action,callback:receber,pollTimer:null,proximaEspera:2500,limite:Date.now()+74000,timeout:setTimeout(function(){finalizar({ok:false,message:'A confirmação do servidor ainda está em processamento. A operação não será reenviada automaticamente.'})},75000)};entrar.disabled=true;sair.disabled=true;var form=document.createElement('form');form.method='POST';form.action=API+'?_='+Date.now();form.target='ponteAgendaV1';form.className='ponte';Object.keys(campos).forEach(function(k){var input=document.createElement('input');input.type='hidden';input.name=k;input.value=txt(campos[k]);form.appendChild(input)});document.body.appendChild(form);form.submit();setTimeout(function(){if(form.parentNode)form.parentNode.removeChild(form)},5000);agendarConsultaResultado()}"
          new_post = "function post(action,payload,receber){if(ativa){receber({ok:false,message:'Aguarde a operação anterior terminar.'});return}var id=requestId(action),campos={};Object.keys(payload||{}).forEach(function(k){campos[k]=payload[k]});campos.action=action;campos.requestId=id;var acesso=action==='admin_login'||action==='admin_dados'||action==='admin_logout',duracao=acesso?30000:60000;ativa={id:id,action:action,callback:receber,pollTimer:null,proximaEspera:650,falhas:0,limite:Date.now()+duracao,timeout:setTimeout(function(){finalizar({ok:false,temporario:true,message:acesso?'A conexão demorou mais que o esperado. Toque novamente em Entrar e carregar agendas.':'O servidor está demorando para confirmar a alteração. Aguarde alguns segundos antes de tentar novamente.'})},duracao+1000)};entrar.disabled=true;sair.disabled=true;var form=document.createElement('form');form.method='POST';form.action=API+'?_='+Date.now();form.target='ponteAgendaV1';form.className='ponte';Object.keys(campos).forEach(function(k){var input=document.createElement('input');input.type='hidden';input.name=k;input.value=txt(campos[k]);form.appendChild(input)});document.body.appendChild(form);form.submit();setTimeout(function(){if(form.parentNode)form.parentNode.removeChild(form)},4000);agendarConsultaResultado(650)}"
          if old_post not in s:
              raise SystemExit('POST antigo não encontrado.')
          s = s.replace(old_post, new_post, 1)

          old_load = "function carregarDados(mensagem,depois,silencioso){post('admin_dados',sessao(),function(r){if(!r||r.ok!==true){token='';sessionStorage.removeItem(TOKEN_KEY);document.getElementById('conteudo').classList.add('oculto');document.getElementById('resumo').classList.add('oculto');sair.disabled=true;status('loginStatus',silencioso?'Conexão preparada. A sessão anterior não pôde ser reutilizada; digite o PIN.':txt(r&&r.message||'Sessão inválida.'),silencioso?'ok':'erro');if(depois)depois(false,r);return}aplicarDados(r);status('loginStatus',mensagem||'Sessão validada e agendas carregadas.','ok');if(depois)depois(true,r)})}"
          new_load = "function carregarDados(mensagem,depois,silencioso){post('admin_dados',sessao(),function(r){if(!r||r.ok!==true){if(r&&r.temporario===true){status('loginStatus',txt(r.message||'A conexão demorou mais que o esperado. Tente novamente.'),'erro');if(depois)depois(false,r);return}token='';sessionStorage.removeItem(TOKEN_KEY);document.getElementById('conteudo').classList.add('oculto');document.getElementById('resumo').classList.add('oculto');sair.disabled=true;status('loginStatus',silencioso?'Conexão preparada. A sessão anterior não pôde ser reutilizada; digite o PIN.':txt(r&&r.message||'Sessão inválida.'),silencioso?'ok':'erro');if(depois)depois(false,r);return}aplicarDados(r);status('loginStatus',mensagem||'Sessão validada e agendas carregadas.','ok');if(depois)depois(true,r)})}"
          if old_load not in s:
              raise SystemExit('carregarDados antigo não encontrado.')
          s = s.replace(old_load, new_load, 1)

          old_login = "token=r.token;sessionStorage.setItem(TOKEN_KEY,token);carregarDados('Sessão validada e agendas carregadas.')"
          new_login = "token=r.token;sessionStorage.setItem(TOKEN_KEY,token);status('loginStatus','PIN confirmado. Carregando agendas…','aviso');carregarDados('Sessão validada e agendas carregadas.')"
          if old_login not in s:
              raise SystemExit('Trecho de login não encontrado.')
          s = s.replace(old_login, new_login, 1)

          for trecho in ['teste-v1/painel-agendas-v1.html','fetch(origem','document.write(html)','A confirmação do servidor ainda está em processamento. A operação não será reenviada automaticamente.']:
              if trecho in s:
                  raise SystemExit('Trecho antigo ainda presente: ' + trecho)
          for trecho in ['PAINEL ADMINISTRATIVO OFICIAL','<h1>Agendas e vagas</h1>','duracao=acesso?30000:60000','agendarConsultaResultado(650)','admin-warmup.js?v=20260812-agendas-direto-v99']:
              if trecho not in s:
                  raise SystemExit('Validação ausente: ' + trecho)

          destino.write_text(s, encoding='utf-8')
          PY

          ! grep -Fq 'teste-v1/painel-agendas-v1.html' painel-oficial-agendas-vagas.html
          ! grep -Fq 'fetch(origem' painel-oficial-agendas-vagas.html
          ! grep -Fq 'document.write(html)' painel-oficial-agendas-vagas.html
          grep -Fq 'PAINEL ADMINISTRATIVO OFICIAL' painel-oficial-agendas-vagas.html
          grep -Fq 'duracao=acesso?30000:60000' painel-oficial-agendas-vagas.html

      - name: Publicar somente o painel de Agendas e Vagas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Portal TACS'
          git config user.email 'actions@users.noreply.github.com'
          git add painel-oficial-agendas-vagas.html
          git diff --cached --quiet && exit 0
          git commit -m 'Acelera acesso ao painel oficial de agendas e vagas'
          git push
