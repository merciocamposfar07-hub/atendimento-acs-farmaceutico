name: Ajuste publicacoes horarios validade V9

on:
  push:
    paths:
      - 'scripts/ajuste_publicacoes_horarios_validade_v9.py'
      - 'scripts/normalize_recados_standalone_test_v9.py'
      - '.github/workflows/ajuste-publicacoes-horarios-validade-v9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar-validar-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Aplicar correcoes autorizadas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/ajuste_publicacoes_horarios_validade_v9.py')
          s=p.read_text()
          old="    if n!=1: raise SystemExit(f'{label}: esperado 1, encontrado {n}')\n    return s.replace(old,new,1)"
          new="    if n<1: raise SystemExit(f'{label}: esperado ao menos 1, encontrado {n}')\n    if n!=1 and label not in {'novo recado horario','nova campanha horario'}: raise SystemExit(f'{label}: esperado 1, encontrado {n}')\n    return s.replace(old,new,1)"
          if old not in s: raise SystemExit('Não foi possível preparar o aplicador V9.')
          s=s.replace(old,new,1)
          old2="s=once(s,'@media(max-width:640px){.resumo{grid-template-columns:1fr 1fr}','input[type=\"date\"].campo,input[type=\"time\"].campo{display:block;width:100%!important;min-width:0!important;max-width:100%!important;inline-size:100%!important;min-inline-size:0!important;max-inline-size:100%!important;box-sizing:border-box!important}.corpo,.corpo>*{min-width:0}\\n@media(max-width:640px){.resumo{grid-template-columns:1fr 1fr}','css datas agenda')"
          new2="s=once(s,'@media(min-width:650px){.acoes.duas{grid-template-columns:1fr 1fr}','input[type=\"date\"].campo,input[type=\"time\"].campo{display:block;width:100%!important;min-width:0!important;max-width:100%!important;inline-size:100%!important;min-inline-size:0!important;max-inline-size:100%!important;box-sizing:border-box!important}.corpo,.corpo>*{min-width:0}\\n@media(min-width:650px){.acoes.duas{grid-template-columns:1fr 1fr}','css datas agenda')"
          if old2 not in s: raise SystemExit('Não foi possível ajustar a âncora de datas da agenda.')
          s=s.replace(old2,new2,1)
          old3="out,n=re.subn(pattern,repl,s,count=1,flags=flags)"
          new3="out,n=re.subn(pattern,(lambda m: repl) if label=='func encerramento variável' else repl,s,count=1,flags=flags)"
          if old3 not in s: raise SystemExit('Não foi possível ajustar a substituição da função de encerramento.')
          p.write_text(s.replace(old3,new3,1))
          PY
          python scripts/ajuste_publicacoes_horarios_validade_v9.py
          git checkout -- scripts/ajuste_publicacoes_horarios_validade_v9.py
          python scripts/normalize_recados_standalone_test_v9.py

      - name: Validar escopo e sintaxe
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(painel-oficial-recados-campanhas.html|campanhas-periodo-v2.js|painel-oficial-agendas-vagas.html|apps-script/ZZZZ_20_PublicacoesTerritoriaisV1.gs|apps-script/ZZZZ_34_CampanhasPeriodoV1.gs|apps-script/ZZ_11_PublicoConteudoPortalV1.gs|apps-script/ZZ_12_PublicoAgendasPortalV1.gs|apps-script/ZZZZ_28_AgendasProfissionaisTerritoriaisV1.gs|portal-controle-integral.js|central-administrativa-tacs.js|scripts/test_admin_transport.js|\.github/apps-script-release-request)$'
          bad=$(git diff --name-only | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then echo "Arquivo fora do escopo: $bad"; exit 1; fi
          grep -q 'admin-warmup.js?v=20260813-admin-v103' painel-oficial-recados-campanhas.html
          grep -q 'preconnect" href="https://script.google.com' painel-oficial-recados-campanhas.html
          grep -q 'recados-campanhas-whatsapp-card-v9.js' painel-oficial-recados-campanhas.html
          grep -q 'name="horario"' painel-oficial-recados-campanhas.html
          grep -q 'name="encerraHorario"' painel-oficial-agendas-vagas.html
          grep -q 'ENCERRA_HORARIO' apps-script/ZZZZ_28_AgendasProfissionaisTerritoriaisV1.gs
          grep -q "validade && validade < hoje" apps-script/ZZ_11_PublicoConteudoPortalV1.gs
          grep -q 'HORARIO' apps-script/ZZZZ_20_PublicacoesTerritoriaisV1.gs
          grep -q 'HORARIO' apps-script/ZZZZ_34_CampanhasPeriodoV1.gs
          grep -q '20260816-publicacoes-horarios-v9' central-administrativa-tacs.js
          grep -q '20260816-agendas-horarios-v9' central-administrativa-tacs.js
          node --check campanhas-periodo-v2.js
          node --check portal-controle-integral.js
          node --check recados-campanhas-whatsapp-card-v9.js
          for f in apps-script/ZZ_11_PublicoConteudoPortalV1.gs apps-script/ZZ_12_PublicoAgendasPortalV1.gs apps-script/ZZZZ_20_PublicacoesTerritoriaisV1.gs apps-script/ZZZZ_28_AgendasProfissionaisTerritoriaisV1.gs apps-script/ZZZZ_34_CampanhasPeriodoV1.gs; do node --check --input-type=commonjs < "$f" >/dev/null; done

      - name: Testes direcionados
        shell: bash
        run: |
          set -euo pipefail
          npm ci --silent
          node scripts/test_admin_transport.js
          python - <<'PY'
          from pathlib import Path
          p=Path('apps-script/ZZ_11_PublicoConteudoPortalV1.gs').read_text()
          assert "Campanha vencida" in p
          assert p.count("if (validade && validade < hoje) return;") >= 2
          a=Path('painel-oficial-agendas-vagas.html').read_text()
          assert 'Encerrar automaticamente às' in a and 'type="time"' in a
          c=Path('campanhas-periodo-v2.js').read_text()
          assert 'min-inline-size:0' in c
          r=Path('painel-oficial-recados-campanhas.html').read_text()
          assert r.count('name="horario"') >= 4
          assert 'recados-campanhas-whatsapp-card-v9.js' in r
          print('validacao-direcionada-ok')
          PY

      - name: Publicar alteracoes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then echo 'Nenhuma alteração pendente.'; exit 0; fi
          git config user.name 'merciocamposfar07-hub'
          git config user.email 'merciocamposfar07@icloud.com'
          git add painel-oficial-recados-campanhas.html campanhas-periodo-v2.js painel-oficial-agendas-vagas.html \
            apps-script/ZZZZ_20_PublicacoesTerritoriaisV1.gs apps-script/ZZZZ_34_CampanhasPeriodoV1.gs \
            apps-script/ZZ_11_PublicoConteudoPortalV1.gs apps-script/ZZ_12_PublicoAgendasPortalV1.gs \
            apps-script/ZZZZ_28_AgendasProfissionaisTerritoriaisV1.gs portal-controle-integral.js \
            central-administrativa-tacs.js scripts/test_admin_transport.js .github/apps-script-release-request
          git commit -m 'Corrige validade horarios e card WhatsApp das publicacoes'
          git push

      - name: Validar GitHub Pages publicado
        shell: bash
        run: |
          set -euo pipefail
          base='https://merciocamposfar07-hub.github.io/atendimento-acs-farmaceutico'
          ok=0
          for i in $(seq 1 36); do
            rec=$(curl -fsSL --max-time 20 "$base/painel-oficial-recados-campanhas.html?v=20260816-publicacoes-horarios-v9&_=$RANDOM" || true)
            ag=$(curl -fsSL --max-time 20 "$base/painel-oficial-agendas-vagas.html?v=20260816-agendas-horarios-v9&_=$RANDOM" || true)
            wa=$(curl -fsSL --max-time 20 "$base/recados-campanhas-whatsapp-card-v9.js?_=$RANDOM" || true)
            if printf '%s' "$rec" | grep -q 'name="horario"' \
              && printf '%s' "$rec" | grep -q 'admin-warmup.js?v=20260813-admin-v103' \
              && printf '%s' "$rec" | grep -q 'recados-campanhas-whatsapp-card-v9.js' \
              && printf '%s' "$ag" | grep -q 'Encerrar automaticamente às' \
              && printf '%s' "$wa" | grep -q 'PortalTacsPublicacoesWhatsAppV9'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
