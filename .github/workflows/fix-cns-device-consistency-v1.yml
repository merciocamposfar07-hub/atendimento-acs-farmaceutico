name: Fix CNS device consistency V1

on:
  push:
    branches:
      - fix-cns-device-consistency-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Executa correção CNS entre dispositivos'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-cns-device-consistency-v1
          fetch-depth: 0

      - name: Finish focused CNS fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          autofill = Path('moradores-autofill.js')
          index = Path('index.html')
          version_file = Path('portal-version.json')

          source = autofill.read_text(encoding='utf-8')
          required = [
              'var negativeRequestId = 0;',
              'var negativeProofs = {};',
              'Object.keys(negativeProofs).length < 2',
              "'jsonp:' + callback",
              "'bridge:' + message.nonce"
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit('Autofill corrigido incompleto: ' + ', '.join(missing))

          html = index.read_text(encoding='utf-8')
          old = 'moradores-autofill.js?v=20260821-tacs-device-v3'
          new = 'moradores-autofill.js?v=20260823-cns-device-v1'
          if old in html:
              html = html.replace(old, new, 1)
          elif new not in html:
              raise SystemExit('Referência do moradores-autofill não encontrada no index.')
          index.write_text(html, encoding='utf-8')

          version = {
              'version': 'cns-device-20260823-v1',
              'releasedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'scope': 'Correção de consistência CPF/CNS entre dispositivos no Portal TACS'
          }
          version_file.write_text(json.dumps(version, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          node scripts/test_autofill_adaptativo_v1.js
          node scripts/test_cns_consistencia_dispositivo_v1.js
          git diff --check

      - name: Commit result
        shell: bash
        run: |
          git config user.name "Portal TACS Homologação"
          git config user.email "actions@users.noreply.github.com"
          git add index.html portal-version.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git commit -m "Corrige falso SUS não encontrado entre dispositivos"
          git push origin HEAD:fix-cns-device-consistency-v1
