name: Fix CNS device consistency V1

on:
  push:
    branches:
      - fix-cns-device-consistency-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Bootstrap CNS device consistency patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-cns-device-consistency-v1
          fetch-depth: 0

      - name: Apply focused CNS consistency patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          root = Path('.')
          autofill_path = root / 'moradores-autofill.js'
          index_path = root / 'index.html'
          version_path = root / 'portal-version.json'

          text = autofill_path.read_text(encoding='utf-8')

          old = "  var completedRequestId = 0;\n  var HEDGE_DELAY_MS = 1250;"
          new = "  var completedRequestId = 0;\n  var negativeRequestId = 0;\n  var negativeProofs = {};\n  var HEDGE_DELAY_MS = 1250;"
          if old not in text:
              raise SystemExit('Ponto de inserção do controle negativo não encontrado.')
          text = text.replace(old, new, 1)

          old = """    function complete(payload, token) {
              if (token !== requestId || token === completedRequestId) return;
              completedRequestId = token;
              cleanupTransport();

              if (payload && payload.ok === true && payload.encontrado === true) {
          """
          new = """    function complete(payload, token, proofKey, jsonpAttempt) {
              if (token !== requestId || token === completedRequestId) return;

              if (payload && payload.ok === true && payload.encontrado === false) {
                if (negativeRequestId !== token) {
                  negativeRequestId = token;
                  negativeProofs = {};
                }
                var negativeKey = String(proofKey || ('proof-' + Date.now() + '-' + Math.random()));
                negativeProofs[negativeKey] = true;

                if (negativeKey.indexOf('bridge:') === 0) finishBridgeOnly();
                else if (negativeKey.indexOf('jsonp:') === 0) finishJsonpOnly();

                if (Object.keys(negativeProofs).length < 2) {
                  setLoadingStatus(status);
                  var retryDoc = onlyDigits(input.value);
                  if (!activeFrame && !activeScript && (validCpf(retryDoc) || validCns(retryDoc))) {
                    var nextAttempt = Math.min(2, Number(jsonpAttempt || 0) + 1);
                    setTimeout(function () {
                      if (token === requestId && token !== completedRequestId && !activeFrame && !activeScript) {
                        startJsonp(retryDoc, token, nextAttempt, false);
                      }
                    }, 250);
                  }
                  return;
                }
              }

              completedRequestId = token;
              cleanupTransport();

              if (payload && payload.ok === true && payload.encontrado === true) {
          """
          if old not in text:
              raise SystemExit('Bloco complete original não encontrado.')
          text = text.replace(old, new, 1)

          old = """      window[callback] = function (data) {
                complete(data, token);
              };
          """
          new = """      window[callback] = function (data) {
                complete(data, token, 'jsonp:' + callback, attempt);
              };
          """
          if old not in text:
              raise SystemExit('Callback JSONP original não encontrado.')
          text = text.replace(old, new, 1)

          old = """      complete(message.payload, requestId);
          """
          new = """      complete(message.payload, requestId, 'bridge:' + message.nonce, 0);
          """
          if old not in text:
              raise SystemExit('Callback bridge original não encontrado.')
          text = text.replace(old, new, 1)

          old = """      var token = ++requestId;
              completedRequestId = 0;
              cleanupTransport();
          """
          new = """      var token = ++requestId;
              completedRequestId = 0;
              negativeRequestId = token;
              negativeProofs = {};
              cleanupTransport();
          """
          if old not in text:
              raise SystemExit('Reset da consulta original não encontrado.')
          text = text.replace(old, new, 1)

          autofill_path.write_text(text, encoding='utf-8')

          index = index_path.read_text(encoding='utf-8')
          old_version = 'moradores-autofill.js?v=20260821-tacs-device-v3'
          new_version = 'moradores-autofill.js?v=20260823-cns-device-v1'
          if old_version not in index:
              raise SystemExit('Versão antiga do moradores-autofill não encontrada no index.')
          index = index.replace(old_version, new_version, 1)
          index_path.write_text(index, encoding='utf-8')

          version = {
              'version': 'cns-device-20260823-v1',
              'releasedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'scope': 'Correção de consistência CPF/CNS entre dispositivos no Portal TACS'
          }
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate focused change
        shell: bash
        run: |
          node scripts/test_autofill_adaptativo_v1.js
          node scripts/test_cns_consistencia_dispositivo_v1.js
          git diff --check
          git diff -- moradores-autofill.js index.html portal-version.json

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Portal TACS Homologação"
          git config user.email "actions@users.noreply.github.com"
          git add moradores-autofill.js index.html portal-version.json
          git commit -m "Corrige falso SUS não encontrado entre dispositivos"
          git push origin HEAD:fix-cns-device-consistency-v1
