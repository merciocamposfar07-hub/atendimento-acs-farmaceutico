name: Homologação arquitetural institucional v1

on:
  push:
    branches: [homologacao-arquitetural-v1]
  pull_request:
    branches: [main, homologacao-arquitetural-v1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homologacao-arquitetural-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  aplicar-bloco4-na-pr:
    if: github.event_name == 'pull_request' && github.base_ref == 'homologacao-arquitetural-v1' && github.head_ref == 'central-bloco4-request-manager-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar branch do Bloco 4
        uses: actions/checkout@v7
        with:
          ref: central-bloco4-request-manager-v1
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Aplicar, testar e gravar Bloco 4
        run: |
          test -f scripts/aplicar_bloco4_request_manager_v1.py
          python3 scripts/aplicar_bloco4_request_manager_v1.py
          node --check scripts/test_admin_request_dedup_v1.js
          node scripts/test_admin_request_dedup_v1.js
          npm ci
          npm test
          git checkout -- scripts/test_dom_flows.js scripts/test_territorio_dom.js
          ALLOWED='central-administrativa-tacs.js|central-admin-performance-v1.js|painel-oficial-agendas-vagas.html|teste-v1/painel-profissionais-servicos-v1.html|scripts/test_admin_request_dedup_v1.js|package.json|scripts/aplicar_bloco4_request_manager_v1.py'
          TRACKED=$(git status --short | sed -E 's/^.. //')
          echo "$TRACKED"
          EXTRA=$(printf '%s\n' "$TRACKED" | grep -Ev "^($ALLOWED)$" || true)
          if [ -n "$EXTRA" ]; then
            echo 'Arquivos fora do escopo do Bloco 4:'
            echo "$EXTRA"
            exit 1
          fi
          grep -q 'admin_notificacoes_saude_rapida' central-administrativa-tacs.js
          grep -q 'publico_conteudo_status' central-administrativa-tacs.js
          ! grep -q "jsonp('publico_conteudo',{areaId:context.areaId}" central-administrativa-tacs.js
          grep -q 'profissionais:2400' central-admin-performance-v1.js
          grep -q 'portalTacsAdminSharedReadV1:admin_dados:v1:' painel-oficial-agendas-vagas.html
          grep -q 'portalTacsAdminSharedReadV1:admin_dados:v1:' teste-v1/painel-profissionais-servicos-v1.html
          git rm scripts/aplicar_bloco4_request_manager_v1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add central-administrativa-tacs.js central-admin-performance-v1.js painel-oficial-agendas-vagas.html teste-v1/painel-profissionais-servicos-v1.html scripts/test_admin_request_dedup_v1.js package.json
          git commit -m 'Bloco 4: reduzir chamadas redundantes ao Apps Script'
          git pull --rebase origin central-bloco4-request-manager-v1
          git push origin central-bloco4-request-manager-v1

  qualidade-estatica:
    if: github.event_name != 'pull_request' || github.base_ref != 'homologacao-arquitetural-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Comprovar ambiente Node
        run: |
          node --version
          npm --version
          node -e "const major=Number(process.versions.node.split('.')[0]); if(major<24) process.exit(1)"
      - name: Instalar dependências
        run: npm ci
      - name: Auditar dependências permanentes
        run: npm audit --audit-level=high
      - name: Executar gate completo do projeto
        run: npm test

  navegadores-reais:
    if: github.event_name != 'pull_request' || github.base_ref != 'homologacao-arquitetural-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Comprovar ambiente Node
        run: |
          node --version
          npm --version
          node -e "const major=Number(process.versions.node.split('.')[0]); if(major<24) process.exit(1)"
      - name: Instalar base do projeto
        run: npm ci
      - name: Instalar e auditar Playwright de homologação
        run: |
          npm install --no-save @playwright/test@1.62.1
          npm ls @playwright/test --depth=0
          npm audit --audit-level=high
          npx playwright install --with-deps chromium firefox webkit
      - name: Iniciar servidor local isolado
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .. > /tmp/portal-tacs-http.log 2>&1 &
          echo $! > /tmp/portal-tacs-http.pid
          sleep 2
          curl -fsS http://127.0.0.1:4173/atendimento-acs-farmaceutico/index.html >/dev/null
      - name: Executar matriz Blink Gecko WebKit
        run: |
          rm -f homologacao-cross-engine.ndjson
          npx playwright test -c playwright.homologacao.config.js
      - name: Consolidar métricas quantitativas
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='homologacao-cross-engine.ndjson';
          if(!fs.existsSync(p)){console.log('Sem relatório cross-engine.');process.exit(0)}
          const rows=fs.readFileSync(p,'utf8').trim().split(/\n+/).filter(Boolean).map(JSON.parse);
          const byBrowser={};
          for(const r of rows){(byBrowser[r.browserName]||(byBrowser[r.browserName]=[])).push(r)}
          const elapsed=rows.map(r=>Number(r.elapsedMs)).filter(Number.isFinite).sort((a,b)=>a-b);
          const pctl=q=>elapsed.length?elapsed[Math.min(elapsed.length-1,Math.floor((elapsed.length-1)*q))]:null;
          const summary={cenarios:rows.length,browsers:Object.fromEntries(Object.entries(byBrowser).map(([k,v])=>[k,v.length])),overflowMaxPx:Math.max(0,...rows.map(r=>Number(r.overflowPx)||0)),elapsedMs:{min:elapsed[0]||null,p50:pctl(.5),p95:pctl(.95),max:elapsed.at(-1)||null}};
          fs.writeFileSync('homologacao-cross-engine-summary.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          NODE
      - name: Guardar evidências da homologação
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: homologacao-arquitetural-cross-engine
          path: |
            homologacao-cross-engine.ndjson
            homologacao-cross-engine-summary.json
          if-no-files-found: warn
