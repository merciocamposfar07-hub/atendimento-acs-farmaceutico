name: Corrigir agenda medica data civil

on:
  push:
    branches:
      - main
    paths:
      - .github/agenda-medica-run-trigger

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Aplicar correcao
        run: python3 scripts/corrigir_agenda_medica_data_civil_v1.py

      - name: Testar correcao
        run: |
          npm ci
          git diff --check
          node scripts/test_agenda_data_civil_v1.js
          node scripts/test_public_agendas_apps_script.js
          node scripts/test_agendas_profissionais_territoriais.js
          node scripts/test_build_apps_script_release.js

      - name: Registrar correcao
        run: |
          git config user.name 'Portal TACS Release'
          git config user.email 'actions@users.noreply.github.com'
          git add apps-script/ZZ_12_PublicoAgendasPortalV1.gs
          git add apps-script/ZZZZ_28_AgendasProfissionaisTerritoriaisV1.gs
          git add scripts/test_agenda_data_civil_v1.js
          git add package.json
          git add .github/apps-script-release-request
          git commit -m 'Corrigir data civil e liberar agenda médica'
          git pull --rebase origin main
          git push origin HEAD:main
