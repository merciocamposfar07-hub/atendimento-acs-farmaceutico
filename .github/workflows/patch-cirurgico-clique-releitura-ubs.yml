name: Patch cirurgico UBS
on:
  push:
    branches:
      - 'fix/cirurgico-clique-releitura-ubs'
    paths:
      - '.github/workflows/patch-cirurgico-clique-releitura-ubs.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'fix/cirurgico-clique-releitura-ubs'
          fetch-depth: 0
      - run: python3 scripts/patch_cirurgico_clique_releitura_ubs.py
      - run: node --check central-administrativa-tacs.js
      - run: node --check teste-v1/painel-tacs-areas-v1.js
      - run: node scripts/test_primeiro_toque_paineis_v1.js
      - run: node scripts/test_tarefa1_perfil_ubs.js
      - run: node scripts/test_territorio_dom.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add central-administrativa-tacs.js teste-v1/painel-tacs-areas-v1.js scripts/test_primeiro_toque_paineis_v1.js
          git commit -m 'Corrige resposta do botao e confirmacao do cadastro UBS'
          git push origin HEAD:fix/cirurgico-clique-releitura-ubs
