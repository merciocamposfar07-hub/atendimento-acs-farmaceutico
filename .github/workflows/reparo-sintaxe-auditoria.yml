name: Reparo determinístico da auditoria
on:
  push:
    branches:
      - audit-estabilizacao-20260825
permissions:
  contents: write
jobs:
  reparar:
    if: github.event.head_commit.message != 'Aplicar reparo determinístico da sintaxe detectada'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit-estabilizacao-20260825
      - name: Corrigir somente a interpolação inválida no regex gerado
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/repair_ui_recados_card_v2.js')
          s=p.read_text(encoding='utf-8')
          marker='const helpers = `  function escapeRegExp(value) {'
          start=s.find(marker)
          if start < 0:
              raise SystemExit('Bloco helper esperado não encontrado; reparo abortado.')
          end=s.find('function corporateRequest(data)', start)
          if end < 0:
              raise SystemExit('Limite do bloco helper não encontrado; reparo abortado.')
          block=s[start:end]
          if '${}' not in block:
              raise SystemExit('Interpolação inválida ${} não encontrada no bloco esperado; reparo abortado.')
          fixed=block.replace('${}', r'\${}', 1)
          s2=s[:start]+fixed+s[end:]
          p.write_text(s2,encoding='utf-8')
          print('Interpolação literal escapada somente no helper escapeRegExp.')
          PY
          node --check scripts/repair_ui_recados_card_v2.js
      - name: Commit do reparo
        run: |
          git config user.name "Portal TACS Audit"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/repair_ui_recados_card_v2.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git commit -m "Aplicar reparo determinístico da sintaxe detectada"
          git push origin HEAD:audit-estabilizacao-20260825
