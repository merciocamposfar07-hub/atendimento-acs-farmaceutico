name: Aplicar Bloco 6 Push onboarding v1

on:
  push:
    branches:
      - central-bloco6-push-onboarding-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  aplicar-testar-gravar:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[bloco6-aplicado]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: central-bloco6-push-onboarding-v1
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Registrar hashes dos workers protegidos
        run: |
          sha256sum service-worker.js push/OneSignalSDKWorker.js > /tmp/workers-antes.sha
      - name: Aplicar onboarding sem tocar no OneSignal
        run: python3 scripts/aplicar_bloco6_push_onboarding_v1.py
      - name: Contrato específico do Bloco 6
        run: node scripts/test_push_onboarding_v1.js
      - name: Regressão completa
        run: npm test
      - name: Restaurar somente arquivos regenerados pelo pretest
        run: |
          git checkout -- scripts/test_dom_flows.js scripts/test_territorio_dom.js
      - name: Garantir workers e escopo fechado
        run: |
          sha256sum -c /tmp/workers-antes.sha
          python3 - <<'PY'
          import subprocess
          permitidos={'portal-ajustes-finais.js'}
          nomes=set(filter(None,subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()))
          extras=nomes-permitidos
          if extras:
              raise SystemExit('Arquivos funcionais fora do escopo alterados: '+', '.join(sorted(extras)))
          if 'portal-ajustes-finais.js' not in nomes:
              raise SystemExit('Runtime do onboarding não foi alterado')
          print('ESCOPO_BLOCO6_OK')
          PY
      - name: Gravar somente após testes verdes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal-ajustes-finais.js
          git rm .github/workflows/aplicar-bloco6-push-onboarding-v1.yml scripts/aplicar_bloco6_push_onboarding_v1.py
          git commit -m 'Bloco 6: onboarding inicial de notificações [bloco6-aplicado] [skip ci]'
          git push origin HEAD:central-bloco6-push-onboarding-v1
