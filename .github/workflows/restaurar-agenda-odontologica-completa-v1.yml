name: Restaurar agenda odontológica completa v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restaurar-agenda-odontologica-completa-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restaurar-agenda-odontologica-completa-v1
  cancel-in-progress: false

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Restaurar semana completa e hora de expiração
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from datetime import datetime, timezone

          portal_path = Path('portal-odontologia-segunda-sexta.js')
          admin_path = Path('painel-oficial-agendas-vagas.html')
          index_path = Path('index.html')
          release_path = Path('.github/apps-script-release-request')

          portal = portal_path.read_text(encoding='utf-8')
          admin = admin_path.read_text(encoding='utf-8')
          index = index_path.read_text(encoding='utf-8')

          old_cache = "var CACHE_KEY = 'portalTacsDentalAgendaV102:' + AREA_ID;"
          new_cache = "var CACHE_KEY = 'portalTacsDentalAgendaV103FullWeek:' + AREA_ID;"
          if old_cache not in portal and new_cache not in portal:
              raise SystemExit('Chave do cache odontológico não encontrada.')
          portal = portal.replace(old_cache, new_cache, 1)

          old_filter = "if (ALLOWED_DAYS.indexOf(day) === -1 || !date || !currentDate(date)) return null;"
          new_filter = "if (ALLOWED_DAYS.indexOf(day) === -1) return null;"
          if old_filter not in portal and new_filter not in portal:
              raise SystemExit('Filtro dos dias odontológicos não encontrado.')
          portal = portal.replace(old_filter, new_filter, 1)

          old_sort = "normalized.sort(function (a, b) { return dateStamp(a.date) - dateStamp(b.date); });"
          new_sort = "normalized.sort(function (a, b) { var da = ALLOWED_DAYS.indexOf(a.day), db = ALLOWED_DAYS.indexOf(b.day); if (da !== db) return da - db; var aa = dateStamp(a.date), bb = dateStamp(b.date); if (!Number.isFinite(aa)) aa = Number.MAX_SAFE_INTEGER; if (!Number.isFinite(bb)) bb = Number.MAX_SAFE_INTEGER; return aa - bb; });"
          if old_sort not in portal and new_sort not in portal:
              raise SystemExit('Ordenação da agenda odontológica não encontrada.')
          portal = portal.replace(old_sort, new_sort, 1)
          portal_path.write_text(portal, encoding='utf-8')

          old_label = 'Encerrar automaticamente às'
          new_label = 'Hora de expiração da agenda'
          if old_label not in admin and new_label not in admin:
              raise SystemExit('Campo de expiração não encontrado no painel.')
          admin = admin.replace(old_label, new_label, 1)
          admin = admin.replace('Deixe vazio para não encerrar automaticamente.', 'Ao chegar neste horário, as vagas desse dia são encerradas automaticamente. Deixe vazio para não expirar.', 1)
          admin_path.write_text(admin, encoding='utf-8')

          index, count = re.subn(r'portal-odontologia-segunda-sexta\.js\?v=[^"\']+', 'portal-odontologia-segunda-sexta.js?v=20260817-agenda-completa-expiracao-v1', index, count=1)
          if count != 1:
              raise SystemExit('Referência do script odontológico no portal não encontrada.')
          index_path.write_text(index, encoding='utf-8')

          release_path.write_text('agenda-odontologica-completa-expiracao-v1 ' + datetime.now(timezone.utc).isoformat() + '\n', encoding='utf-8')
          PY

      - name: Validar arquivos alterados
        shell: bash
        run: |
          set -euo pipefail
          grep -q "portalTacsDentalAgendaV103FullWeek" portal-odontologia-segunda-sexta.js
          grep -q "ALLOWED_DAYS.indexOf(day) === -1) return null" portal-odontologia-segunda-sexta.js
          grep -q "Hora de expiração da agenda" painel-oficial-agendas-vagas.html
          grep -q "agenda-completa-expiracao-v1" index.html
          grep -q "TACS_CORRECAO_DATA_ODONTOLOGIA_V1" scripts/build_apps_script_release.js
          grep -q "VERSAO:'2.0.0'" apps-script/ZZZZ_36_CorrecaoDataOdontologiaV1.gs
          node --check portal-odontologia-segunda-sexta.js
          node --check --input-type=commonjs < apps-script/ZZZZ_36_CorrecaoDataOdontologiaV1.gs

      - name: Publicar restauração no repositório
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Restauração já aplicada.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal-odontologia-segunda-sexta.js painel-oficial-agendas-vagas.html index.html .github/apps-script-release-request
          git commit -m 'Restaura agenda odontológica de segunda a sexta e expiração'
          git push
