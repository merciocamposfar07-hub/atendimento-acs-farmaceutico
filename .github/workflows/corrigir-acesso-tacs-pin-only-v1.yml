name: Corrigir acesso TACS apenas por PIN v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corrigir-acesso-tacs-pin-only-v1.yml'

permissions:
  contents: write

concurrency:
  group: corrigir-acesso-tacs-pin-only-v1
  cancel-in-progress: false

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correção PIN-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/corrigir_acesso_tacs_pin_only_v1.py')
          s=p.read_text(encoding='utf-8')
          old='out,n=re.subn(pattern,repl,s,count=1,flags=flags)'
          new='out,n=re.subn(pattern,lambda _m: repl,s,count=1,flags=flags)'
          if old not in s:
              raise SystemExit('Helper do patch não localizado.')
          s=s.replace(old,new,1)
          s=s.replace("assert.match(quickBackend,/tacs\\.pinHash,tacsTerritorioV1HashPin_\\(pin,tacs\\.pinSalt\\)/,\n  'O PIN deve ser validado apenas contra o hash armazenado no servidor.');",
                      "assert.match(quickBackend,/item\\.pinHash,tacsTerritorioV1HashPin_\\(pin,item\\.pinSalt\\)/,\n  'O PIN deve ser validado apenas contra o hash armazenado no servidor.');",1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 scripts/corrigir_acesso_tacs_pin_only_v1.py

      - name: Validar JavaScript do frontend
        shell: bash
        run: |
          set -euo pipefail
          node --check central-administrativa-tacs.js
          node --check central-tacs-login-rapido-v1.js
          node --check teste-v1/painel-moradores-transport-v2.js

      - name: Preparar dependências dos testes
        run: npm ci

      - name: Validar somente o escopo do login TACS
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test_multiagent_quick_login.js
          node scripts/test_tacs_admin_visibility.js
          node scripts/test_central_admin_territorial.js

      - name: Solicitar publicação do Apps Script e gravar correção
        shell: bash
        run: |
          set -euo pipefail
          printf 'PIN_ONLY_TACS_V1 %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/apps-script-release-request
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps-script/ZZZZ_31_LoginRapidoTacsV1.gs \
            central-administrativa-tacs.html \
            central-administrativa-tacs.js \
            central-tacs-login-rapido-v1.js \
            painel-oficial-recados-campanhas.html \
            teste-v1/painel-moradores-v2.html \
            teste-v1/painel-moradores-transport-v2.js \
            scripts/test_multiagent_quick_login.js \
            .github/apps-script-release-request
          git commit -m 'Retira CNS do acesso TACS e mantém somente PIN'
          git push
