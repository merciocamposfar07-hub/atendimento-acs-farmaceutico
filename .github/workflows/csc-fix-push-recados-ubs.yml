name: CSC - Corrigir autorizacao Push de recados UBS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/csc-fix-push-recados-ubs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apps-script-producao
  cancel-in-progress: false
jobs:
  publicar-permissao-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar permissao exata do Push sem afetar outras rotas
        shell: bash
        run: |
          set -euo pipefail
          node --check --input-type=commonjs < apps-script/ZZZZ_19_NotificacoesSegmentadasV1.gs
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const source=fs.readFileSync('apps-script/ZZZZ_19_NotificacoesSegmentadasV1.gs','utf8');
          const found=source.match(/^function notificacoesAreaV1ExigirPublicacao_\(acesso\)\{[\s\S]*?^\}/gm)||[];
          if(found.length!==1)throw Error('Funcao de autorizacao duplicada ou ausente');
          const admin=a=>{if(!a||!['ADMIN_GERAL','ADMIN_MUNICIPAL'].includes(a.perfil))throw Error('Acesso de administrador necessario')};
          const fn=new Function('tacsTerritorioV1ExigirAdmin_',found[0]+';return notificacoesAreaV1ExigirPublicacao_;')(admin);
          for(const [perfil,permissoes,permitido] of [
            ['UBS',['PUBLICACOES_GERENCIAR'],true],['TACS',['PUBLICACOES_GERENCIAR'],true],
            ['ADMIN_GERAL',['*'],true],['ADMIN_MUNICIPAL',['*'],true],
            ['UBS',[],false],['TACS',[],false],['MORADOR',['PUBLICACOES_GERENCIAR'],false]
          ]){
            let real;try{fn({perfil,permissoes});real=true}catch(e){real=false}
            if(real!==permitido)throw Error('Permissao incorreta: '+perfil+' '+permissoes);
          }
          console.log('PUSH_UBS_AUTORIZACAO_TESTES_OK');
          NODE
      - name: Conferir credenciais de producao
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        shell: bash
        run: |
          test -n "$CLASPRC_JSON" && test -n "$CLASP_JSON" && test -n "$DEPLOYMENT_ID"
      - name: Ler Apps Script real, sem usar copia antiga do repositorio
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/csc-push-ubs"
          mkdir -p "$DIR"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          CLASP_JSON="$CLASP_JSON" DIR="$DIR" node - <<'NODE'
          const fs=require('fs'),path=require('path'),cfg=JSON.parse(process.env.CLASP_JSON);
          if(!cfg.scriptId||!/^[A-Za-z0-9_-]{20,200}$/.test(cfg.scriptId))throw Error('ScriptId invalido');
          cfg.rootDir='.';
          fs.writeFileSync(path.join(process.env.DIR,'.clasp.json'),JSON.stringify(cfg,null,2)+'\n');
          NODE
          cd "$DIR"
          npx --yes @google/clasp@3.3.0 pull
          test -f appsscript.json
      - name: Alterar somente uma funcao de autorizacao no backend real
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/csc-push-ubs" node - <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const dir=process.env.DIR,files=fs.readdirSync(dir).filter(n=>/\.(?:js|gs)$/.test(n));
          const hash=s=>crypto.createHash('sha256').update(s).digest('hex');
          const original=Object.fromEntries(files.map(n=>[n,hash(fs.readFileSync(path.join(dir,n)))]));
          const found=files.filter(n=>fs.readFileSync(path.join(dir,n),'utf8').includes('var TACS_NOTIFICACOES_AREA_V1 = Object.freeze'));
          if(found.length!==1)throw Error('Modulo de notificacoes ausente ou ambiguo');
          const pathLive=path.join(dir,found[0]);
          const source=fs.readFileSync('apps-script/ZZZZ_19_NotificacoesSegmentadasV1.gs','utf8');
          let live=fs.readFileSync(pathLive,'utf8');
          function getFn(code){
            const found=code.match(/^function notificacoesAreaV1ExigirPublicacao_\(acesso\)\{[\s\S]*?^\}/gm)||[];
            if(found.length!==1)throw Error('Funcao de permissao ausente ou duplicada');
            return found[0];
          }
          const before=getFn(live),after=getFn(source);
          if(before!==after){
            if(!before.includes("acesso.perfil==='TACS'")||!before.includes("PUBLICACOES_GERENCIAR")||
               !before.includes("tacsTerritorioV1ExigirAdmin_(acesso)")||before.includes("acesso.perfil==='UBS'"))
              throw Error('Permissoes em producao divergentes: alteracao segura interrompida');
            live=live.replace(before,after);
            fs.writeFileSync(pathLive,live);
          }
          const changed=files.filter(n=>hash(fs.readFileSync(path.join(dir,n)))!==original[n]);
          if(changed.length>1||(changed.length===1&&changed[0]!==found[0]))
            throw Error('Arquivos indevidos alterados: '+changed);
          new Function(live);
          console.log('SOMENTE_PERMISSAO_PUSH_UBS_ALTERADA',changed.length?'1 arquivo':'ja atualizada');
          NODE
          while IFS= read -r -d '' file; do
            node --check --input-type=commonjs < "$file" >/dev/null
          done < <(find "$RUNNER_TEMP/csc-push-ubs" -type f \( -name '*.gs' -o -name '*.js' \) -print0)
      - name: Publicar atualizacao isolada mantendo deployment em uso
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/csc-push-ubs"
          OLD=$(npx --yes @google/clasp@3.3.0 deployments)
          PREV=$(printf '%s\n' "$OLD" | awk -v id="$DEPLOYMENT_ID" 'index($0,id) {for(i=1;i<=NF;i++) if($i~/^@[0-9]+$/){gsub(/^@/,"",$i);print $i;exit}}')
          test -n "$PREV"
          DEPLOYED=0
          rollback(){
            code=$?;trap - ERR
            if [ "$DEPLOYED" = 1 ]; then
              npx --yes @google/clasp@3.3.0 redeploy --versionNumber "$PREV" --description "Rollback autorizacao Push UBS" "$DEPLOYMENT_ID" || true
            fi
            exit "$code"
          }
          trap rollback ERR
          npx --yes @google/clasp@3.3.0 push --force
          VERSION_OUTPUT=$(npx --yes @google/clasp@3.3.0 version "CSC recados UBS permissao Push alinhada")
          VERSION=$(printf '%s\n' "$VERSION_OUTPUT" | grep -Eo '[0-9]+' | tail -n 1)
          test -n "$VERSION"
          npx --yes @google/clasp@3.3.0 redeploy --versionNumber "$VERSION" --description "Autorizar Push UBS com PUBLICACOES_GERENCIAR" "$DEPLOYMENT_ID"
          DEPLOYED=1
          echo "PUSH_UBS_AUTORIZACAO_PUBLICADA versao=$VERSION"
      - name: Limpar credenciais temporarias
        if: always()
        run: |
          rm -f "$HOME/.clasprc.json"
          rm -f "$RUNNER_TEMP/csc-push-ubs/.clasp.json"
