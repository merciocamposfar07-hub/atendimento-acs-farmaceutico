name: Corrigir campanhas admin V4.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corrigir-campanhas-admin-v41.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corrigir-campanhas-admin-v41
  cancel-in-progress: false

jobs:
  validar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Aplicar ajuste final
        run: python3 scripts/corrigir_campanhas_admin_v41.py
      - name: Dependências
        run: npm ci
      - name: Regressão completa
        run: npm test
      - name: Validar escopo
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CAMPANHAS_ADMIN_V41' campanhas-periodo-v2.js
          grep -q 'dateBrIsoV41' campanhas-periodo-v2.js
          grep -q 'metaHydratedV41' campanhas-periodo-v2.js
          grep -q 'item\[hidden\]+.publicacao-campanha-status' recados-campanhas-whatsapp-card-v9.js
          grep -q 'Postar no status do WhatsApp' recados-campanhas-whatsapp-card-v9.js
          grep -q 'CAMPANHAS_ADMIN_FIX_V4' campanhas-periodo-v2.js
          grep -q 'CAMPANHAS_PUBLICAS_CARDS_V4' portal-controle-integral.js
          grep -q '20260817-campanhas-admin-ui-v4-1' painel-oficial-recados-campanhas.html
          grep -q '20260817-publicacoes-v10-1' painel-oficial-recados-campanhas.html
          grep -q '20260817-campanhas-reparos-v4-1' central-administrativa-tacs.js
          grep -q '20260816-campanhas-reparos-v4-1' central-administrativa-tacs.html
          git diff --check
      - name: Publicar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Portal TACS'
          git config user.email 'actions@users.noreply.github.com'
          git add campanhas-periodo-v2.js recados-campanhas-whatsapp-card-v9.js painel-oficial-recados-campanhas.html central-administrativa-tacs.js central-administrativa-tacs.html
          git diff --cached --quiet && exit 0
          git commit -m 'Estabiliza validade e botões das campanhas no painel'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Validar no GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://merciocamposfar07-hub.github.io/atendimento-acs-farmaceutico'
          for i in $(seq 1 70); do
            q="?v=admin-v41-$i-$(date +%s)"
            painel="$(curl -fsSL "$BASE/painel-oficial-recados-campanhas.html$q" || true)"
            camp="$(curl -fsSL "$BASE/campanhas-periodo-v2.js$q" || true)"
            wa="$(curl -fsSL "$BASE/recados-campanhas-whatsapp-card-v9.js$q" || true)"
            if printf '%s' "$painel" | grep -q '20260817-publicacoes-v10-1' && \
               printf '%s' "$camp" | grep -q 'CAMPANHAS_ADMIN_V41' && \
               printf '%s' "$camp" | grep -q 'metaHydratedV41' && \
               printf '%s' "$wa" | grep -q 'item\[hidden\]+.publicacao-campanha-status'; then
              echo 'PAGES_CAMPANHAS_ADMIN_V41_OK'
              exit 0
            fi
            sleep 5
          done
          exit 1
