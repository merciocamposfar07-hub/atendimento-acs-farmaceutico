name: Corrigir link base para Japaranduba V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corrigir-link-base-japaranduba-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corrigir-link-base-japaranduba-v1
  cancel-in-progress: false

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir resolução territorial do link base
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          agenda = Path('agenda-config.js')
          text = agenda.read_text(encoding='utf-8')
          old = """    if (fromUrl) {\n      try { localStorage.setItem(PORTAL_AREA_STORAGE_KEY, fromUrl); } catch (error) {}\n      return fromUrl;\n    }\n\n    var saved = '';\n    try { saved = normalizePortalAreaId(localStorage.getItem(PORTAL_AREA_STORAGE_KEY)); }\n    catch (error) {}\n    return saved || PORTAL_DEFAULT_AREA_ID;\n"""
          new = """    if (fromUrl) {\n      try { localStorage.setItem(PORTAL_AREA_STORAGE_KEY, fromUrl); } catch (error) {}\n      return fromUrl;\n    }\n\n    // BASE_URL_TERRITORIO_CANONICO_V1: sem parâmetro de área, o link histórico é sempre Japaranduba.\n    // O localStorage pode guardar a última área acessada, mas nunca pode transformar o link base em outra área.\n    try { localStorage.setItem(PORTAL_AREA_STORAGE_KEY, PORTAL_DEFAULT_AREA_ID); } catch (error) {}\n    return PORTAL_DEFAULT_AREA_ID;\n"""
          if 'BASE_URL_TERRITORIO_CANONICO_V1' not in text:
              if old not in text:
                  raise SystemExit('Bloco esperado de resolvePortalAreaId não encontrado; abortando sem alterar.')
              text = text.replace(old, new, 1)
              agenda.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old_head = """      var p=new URLSearchParams(location.search||''),area=String(p.get('areaId')||p.get('area')||localStorage.getItem('portalTacsAreaIdV1')||'').toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,64);\n      if(area&&area!=='JAPARANDUBA')document.documentElement.classList.add('territory-pending');\n"""
          new_head = """      var p=new URLSearchParams(location.search||''),explicit=String(p.get('areaId')||p.get('area')||p.get('territorio')||'').toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,64),area=explicit||'JAPARANDUBA';\n      // BASE_URL_TERRITORIO_CANONICO_V1: o endereço sem ?area= pertence permanentemente a Japaranduba.\n      try{localStorage.setItem('portalTacsAreaIdV1',area);}catch(ignore){}\n      if(area!=='JAPARANDUBA')document.documentElement.classList.add('territory-pending');\n"""
          if 'BASE_URL_TERRITORIO_CANONICO_V1' not in html:
              if old_head not in html:
                  raise SystemExit('Bootstrap territorial esperado no index não encontrado; abortando sem alterar.')
              html = html.replace(old_head, new_head, 1)
              index.write_text(html, encoding='utf-8')

          test = Path('scripts/test_base_url_canonical_area.js')
          test.write_text(dedent(r'''
          'use strict';
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const {JSDOM}=require('jsdom');
          const ROOT=path.resolve(__dirname,'..');
          const source=fs.readFileSync(path.join(ROOT,'agenda-config.js'),'utf8');
          const index=fs.readFileSync(path.join(ROOT,'index.html'),'utf8');

          function resolved(url,saved){
            const dom=new JSDOM('<!doctype html><html><head></head><body></body></html>',{url,runScripts:'outside-only'});
            if(saved)dom.window.localStorage.setItem('portalTacsAreaIdV1',saved);
            dom.window.eval(source);
            const result={area:dom.window.TACS_AREA_ID,stored:dom.window.localStorage.getItem('portalTacsAreaIdV1')};
            dom.window.close();
            return result;
          }

          let r=resolved('https://example.test/atendimento-acs-farmaceutico/','SITIO_MATIAS');
          assert.equal(r.area,'JAPARANDUBA','O link base não pode herdar Sítio Matias do localStorage.');
          assert.equal(r.stored,'JAPARANDUBA','O link base deve limpar a área territorial antiga do navegador.');

          r=resolved('https://example.test/atendimento-acs-farmaceutico/?area=SITIO_MATIAS','JAPARANDUBA');
          assert.equal(r.area,'SITIO_MATIAS','O link explícito de Sítio Matias precisa continuar funcionando.');
          assert.equal(r.stored,'SITIO_MATIAS');

          r=resolved('https://example.test/atendimento-acs-farmaceutico/?area=JAPARANDUBA','SITIO_MATIAS');
          assert.equal(r.area,'JAPARANDUBA');
          assert.equal(r.stored,'JAPARANDUBA');

          const bootstrap=index.match(/<script>\s*\(function\(\)\{[\s\S]*?<\/script>/);
          assert.ok(bootstrap,'Bootstrap territorial inicial do index precisa existir.');
          assert.match(bootstrap[0],/BASE_URL_TERRITORIO_CANONICO_V1/);
          assert.doesNotMatch(bootstrap[0],/localStorage\.getItem\(['\"]portalTacsAreaIdV1['\"]\)/,'O bootstrap do link base não pode ler a última área salva.');
          console.log('Link base canônico: Japaranduba fixa sem herdar área anterior; links explícitos continuam isolados.');
          ''').lstrip(), encoding='utf-8')

          package = Path('package.json')
          pkg = package.read_text(encoding='utf-8')
          needle = 'node scripts/test_public_area_resolver.js && '
          replacement = 'node scripts/test_public_area_resolver.js && node scripts/test_base_url_canonical_area.js && '
          if replacement not in pkg:
              if needle not in pkg:
                  raise SystemExit('Ponto de inclusão do teste não encontrado em package.json.')
              package.write_text(pkg.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Validar correção territorial específica
        run: node scripts/test_base_url_canonical_area.js

      - name: Executar regressão completa
        run: npm test

      - name: Publicar correção validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Portal TACS'
          git config user.email 'actions@users.noreply.github.com'
          git add agenda-config.js index.html scripts/test_base_url_canonical_area.js package.json
          git diff --cached --quiet && exit 0
          git commit -m 'Fixar link base do Portal TACS em Japaranduba'
          for tentativa in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((tentativa*2))
          done
          exit 1
