name: Validar identificação pública de área

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_public_area_lookup.py'
      - '.github/workflows/public-area-identification.yml'

permissions:
  contents: write

concurrency:
  group: portal-tacs-identificacao-area
  cancel-in-progress: false

jobs:
  aplicar-testar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Aplicar identificação pública
        run: python3 scripts/apply_public_area_lookup.py

      - name: Validar sintaxe
        shell: bash
        run: |
          set -euo pipefail
          node --check --input-type=commonjs < apps-script/ZZZZ_17_TacsAreasAdminV1.gs
          node --check scripts/test_public_area_identification.js

      - name: Executar bateria completa
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Validar escopo e publicar
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain=v1 | cut -c4-)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev '^(apps-script/ZZZZ_17_TacsAreasAdminV1\.gs|scripts/test_public_area_identification\.js|package\.json)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Alteração fora do escopo:'
            echo "$bad"
            exit 1
          fi
          test -n "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/apply_public_area_lookup.py
          git add apps-script/ZZZZ_17_TacsAreasAdminV1.gs scripts/test_public_area_identification.js package.json scripts/apply_public_area_lookup.py
          git commit -m 'Adiciona identificação pública de área por CPF ou CNS'
          git push origin HEAD:main
