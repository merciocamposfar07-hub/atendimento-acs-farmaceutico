name: Ajustar teste painel direto v101
on:
  push:
    branches: [desempenho-v101]
    paths:
      - 'scripts/patch_test_admin_direct_v101.js'
      - '.github/workflows/patch-test-admin-direct-v101.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desempenho-v101
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/patch_test_admin_direct_v101.js
      - run: node --check scripts/test_admin_transport.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Atualizar teste para painel de agendas direto v101'
          git push origin HEAD:desempenho-v101
