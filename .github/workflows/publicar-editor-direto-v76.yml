name: Publicar editor direto v76

on:
  push:
    paths:
      - '.github/workflows/publicar-editor-direto-v76.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Retirar redirecionamento antigo e acelerar dados
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = '20260731-76'

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = re.sub(
              r'portal-unificado\.js\?v=[^"\']+',
              f'portal-unificado.js?v={version}',
              text
          )
          text = re.sub(
              r'\s*<script src="portal-admin-fast\.js\?v=[^"]+"></script>',
              '',
              text
          )
          index.write_text(text, encoding='utf-8')

          js = Path('admin-controle-integral.js')
          text = js.read_text(encoding='utf-8')
          text = text.replace(
              "return clean(localStorage.getItem(KEY) || sessionStorage.getItem(KEY));",
              "return clean(sessionStorage.getItem(KEY) || localStorage.getItem(KEY));"
          )
          text = text.replace(
              "finish(new Error('O servidor demorou para responder.'));\n      }, 16000);",
              "finish(new Error('O servidor demorou para responder.'));\n      }, 7000);"
          )
          text = text.replace(
              "if (frame) frame.src = 'index.html?v=20260730-51&espelho=' + Date.now();",
              "if (frame) frame.src = 'index.html?v=20260731-76&espelho=' + Date.now();"
          )
          text = text.replace(
              "Informe ao menos uma data de segunda, terça ou quinta-feira.",
              "Informe ao menos uma data entre segunda e sexta-feira."
          )

          old_init = """    tab('recados');
    refreshAll();
  }"""
          new_init = """    tab('recados');
    setTimeout(function () {
      Promise.allSettled([loadPublic(), loadNurse(), loadDental()]).then(function () {
        var button = id('refreshAll');
        if (button && !refreshing) {
          button.textContent = '↻ Atualizar dados do servidor';
        }
      });
    }, 120);
  }"""
          if old_init not in text:
              raise SystemExit('Inicialização antiga não localizada.')
          text = text.replace(old_init, new_init)
          js.write_text(text, encoding='utf-8')
          PY

      - name: Validar
        run: |
          grep -q 'portal-unificado.js?v=20260731-76' index.html
          ! grep -q 'portal-admin-fast.js' index.html
          grep -q 'setTimeout(function ()' admin-controle-integral.js
          grep -q '}, 7000);' admin-controle-integral.js
          grep -q 'index.html?v=20260731-76&espelho=' admin-controle-integral.js

      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin-controle-integral.js
          git commit -m 'Abrir editor diretamente e carregar dados sem bloquear a página'
          git push

