name: Verificar deploy mensagem individual UX V2

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Localizar e aguardar deploy oficial
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ad6281cf4c18d326efd2573e13250928a13ad980
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO/actions/workflows/deploy-apps-script-moradores.yml/runs?branch=main&event=push&per_page=30"
          run_id=''
          for tentativa in $(seq 1 20); do
            json=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api")
            run_id=$(printf '%s' "$json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const j=JSON.parse(s);const r=(j.workflow_runs||[]).find(x=>x.head_sha===process.env.TARGET_SHA);if(r)process.stdout.write(String(r.id));})')
            [ -n "$run_id" ] && break
            sleep 3
          done
          test -n "$run_id"
          echo "DEPLOY_RUN_ID=$run_id"

          for tentativa in $(seq 1 80); do
            run=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/actions/runs/$run_id")
            status=$(printf '%s' "$run" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).status||""))')
            conclusion=$(printf '%s' "$run" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).conclusion||""))')
            echo "DEPLOY_STATUS=$status conclusion=${conclusion:-pending}"
            if [ "$status" = 'completed' ]; then
              [ "$conclusion" = 'success' ] || exit 1
              break
            fi
            sleep 5
          done
          [ "$status" = 'completed' ]

          jobs=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/actions/runs/$run_id/jobs?per_page=20")
          job_id=$(printf '%s' "$jobs" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const j=JSON.parse(s);const r=(j.jobs||[]).find(x=>x.name==="testar-e-implantar")||(j.jobs||[])[0];if(r)process.stdout.write(String(r.id));})')
          test -n "$job_id"
          echo "DEPLOY_JOB_ID=$job_id"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/actions/jobs/$job_id/logs" -o /tmp/deploy.log
          grep -F 'Implantação validada: versão ' /tmp/deploy.log | tail -n 1
          grep -F 'Health 1:' /tmp/deploy.log | tail -n 1 || grep -F 'Health 2:' /tmp/deploy.log | tail -n 1 || grep -F 'Health 3:' /tmp/deploy.log | tail -n 1
          grep -F 'Mensagem individual + busca/envio familiar V1:' /tmp/deploy.log | tail -n 1
          echo 'DEPLOY_MENSAGEM_INDIVIDUAL_UX_V2_OK'
