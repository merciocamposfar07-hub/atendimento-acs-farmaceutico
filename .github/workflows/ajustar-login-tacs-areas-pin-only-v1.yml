name: Ajustar login TACS e áreas somente PIN v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ajustar_login_tacs_areas_pin_only_v1.py'
      - '.github/workflows/ajustar-login-tacs-areas-pin-only-v1.yml'

permissions:
  contents: write

concurrency:
  group: ajustar-login-tacs-areas-pin-only-v1
  cancel-in-progress: false

jobs:
  ajustar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar ajuste estritamente no login do painel TACS e áreas
        run: |
          set -euo pipefail
          python3 scripts/ajustar_login_tacs_areas_pin_only_v1.py
          node --check teste-v1/painel-tacs-areas-v1.js

      - name: Validar escopo e contratos preservados
        run: |
          set -euo pipefail
          ! grep -q 'tacsCnsLogin' teste-v1/painel-tacs-areas-v1.html
          ! grep -q 'tacsCnsLogin' teste-v1/painel-tacs-areas-v1.js
          grep -q 'admin_territorio_login_pin' teste-v1/painel-tacs-areas-v1.js
          grep -q 'id="tacsPinLogin"' teste-v1/painel-tacs-areas-v1.html
          grep -q 'id="adminPin"' teste-v1/painel-tacs-areas-v1.html
          grep -q 'id="tacsCns"' teste-v1/painel-tacs-areas-v1.html
          grep -q 'admin_login' teste-v1/painel-tacs-areas-v1.js
          grep -q '20260818-pin-only-v1' teste-v1/painel-tacs-areas-v1.html
          grep -q '20260818-pin-only-v1' painel-oficial-tacs-areas.html
          git diff --name-only | sort > /tmp/changed
          printf '%s\n' 'painel-oficial-tacs-areas.html' 'teste-v1/painel-tacs-areas-v1.html' 'teste-v1/painel-tacs-areas-v1.js' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed

      - name: Publicar alteração no main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add painel-oficial-tacs-areas.html teste-v1/painel-tacs-areas-v1.html teste-v1/painel-tacs-areas-v1.js
          git commit -m 'Retira CNS do login TACS e mantém acesso por PIN'
          git pull --rebase origin main
          git push origin HEAD:main
