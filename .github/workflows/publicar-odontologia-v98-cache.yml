name: Publicar odontologia v98 cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-odontologia-v98-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odontologia-v98-cache
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forçar carregamento da odontologia v98
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='portal-odontologia-segunda-sexta.js?v=20260811-reserva-clique-v96'
          new='portal-odontologia-segunda-sexta.js?v=20260812-odontologia-imediata-v98'
          if old not in s and new not in s:
              raise SystemExit('Referência odontológica não encontrada.')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq 'portal-odontologia-segunda-sexta.js?v=20260812-odontologia-imediata-v98' index.html
          grep -Fq 'Vaga selecionada. A quantidade foi reduzida no portal e o envio pelo WhatsApp já está liberado.' portal-odontologia-segunda-sexta.js
          grep -Fq 'validCpf(value) || validCns(value)' portal-odontologia-segunda-sexta.js
      - name: Publicar somente cache-buster odontológico
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publicar-odontologia-v98-cache.yml
          git config user.name 'Portal TACS'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/publicar-odontologia-v98-cache.yml
          git commit -m 'Força carregamento da odontologia v98 no portal'
          git push
