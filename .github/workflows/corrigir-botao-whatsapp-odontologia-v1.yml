name: Corrigir redução persistente de vagas odontológicas v5

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/corrigir-botao-whatsapp-odontologia-v1.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Aplicar correção somente no ambiente de teste
        run: python scripts/corrigir_botao_whatsapp_odontologia_v1.py
      - name: Instalar dependências
        run: npm ci
      - name: Testar regressão completa e simular 1 vaga emergencial virando 0 no iPhone
        run: npm test
      - name: Validar sintaxe dos arquivos alterados
        run: |
          set -euo pipefail
          node --check portal-odontologia-segunda-sexta.js
          node --check portal-ajustes-finais.js
          node --check agenda-config.js
          node --check scripts/test_dom_flows.js
          node --check scripts/test_dental_confirmation_gate_v103.js
      - name: Publicar somente se todos os testes anteriores passarem
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal-odontologia-segunda-sexta.js index.html scripts/test_dom_flows.js scripts/test_dental_confirmation_gate_v103.js portal-version.json
          git commit -m "Restaura redução automática da vaga odontológica sem bloquear envio"
          git push origin HEAD:main
# gate-v5-uma-vaga-para-zero-com-persistencia-e-saida-imediata
