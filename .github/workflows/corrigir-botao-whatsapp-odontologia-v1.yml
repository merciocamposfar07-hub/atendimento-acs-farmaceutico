name: Corrigir envio odontologia não bloqueante v4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/corrigir-botao-whatsapp-odontologia-v1.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Aplicar correção em ambiente de teste
        run: python scripts/corrigir_botao_whatsapp_odontologia_v1.py
      - name: Instalar dependências
        run: npm ci
      - name: Testar integração completa e simulação de confirmação atrasada
        run: npm test
      - name: Validar sintaxe dos arquivos alterados
        run: |
          set -euo pipefail
          node --check portal-odontologia-segunda-sexta.js
          node --check portal-ajustes-finais.js
          node --check agenda-config.js
          node --check scripts/test_dom_flows.js
          node --check scripts/test_dental_confirmation_gate_v103.js
      - name: Publicar somente após todos os testes aprovados
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal-odontologia-segunda-sexta.js portal-ajustes-finais.js portal-orientacao-morador.js agenda-config.js index.html scripts/test_dom_flows.js scripts/test_dental_confirmation_gate_v103.js portal-version.json
          git commit -m "Restaura envio odontológico imediato com reserva em segundo plano"
          git push origin HEAD:main
# gate-v4-nao-bloqueante-com-simulacao
