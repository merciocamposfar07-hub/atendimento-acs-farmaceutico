name: Corrigir botão de envio odontologia v1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/corrigir-botao-whatsapp-odontologia-v1.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Aplicar correção
        run: python scripts/corrigir_botao_whatsapp_odontologia_v1.py
      - name: Instalar dependências
        run: npm ci
      - name: Testar integração completa
        run: npm test
      - name: Publicar correção
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal-odontologia-segunda-sexta.js portal-ajustes-finais.js index.html scripts/test_dental_confirmation_gate_v103.js portal-version.json
          git commit -m "Corrige envio após reserva odontológica confirmada"
          git push origin HEAD:main
