name: Corrigir reserva odontológica GET v106

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/corrigir-botao-whatsapp-odontologia-v1.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Aplicar correção isolada no ambiente de teste
        run: python scripts/corrigir_reserva_odontologia_get_v1.py
      - name: Instalar dependências
        run: npm ci
      - name: Simular regressão completa incluindo GET keepalive
        run: npm test
      - name: Validar sintaxe dos arquivos alterados
        run: |
          set -euo pipefail
          node --check portal-odontologia-segunda-sexta.js
          node --check scripts/test_dom_flows.js
          node --check scripts/test_dental_confirmation_gate_v103.js
          node --check --input-type=commonjs < apps-script/ZZZZ_36_CorrecaoDataOdontologiaV1.gs
      - name: Publicar somente se todos os testes anteriores passarem
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/ZZZZ_36_CorrecaoDataOdontologiaV1.gs portal-odontologia-segunda-sexta.js index.html scripts/test_dom_flows.js scripts/test_dental_confirmation_gate_v103.js portal-version.json .github/apps-script-release-request
          git commit -m "Corrige reserva odontológica pelo canal GET idempotente"
          git push origin HEAD:main
# gate-v106-get-idempotente-com-post-fallback
