name: Ajustar layout agendas por profissional v1
on:
  push:
    branches: [main]
    paths:
      - 'scripts/ajustar_layout_agendas_profissionais_v1.py'
      - '.github/workflows/ajustar-layout-agendas-profissionais-v1.yml'
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar somente o ajuste visual
        run: |
          set -euo pipefail
          python3 scripts/ajustar_layout_agendas_profissionais_v1.py painel-oficial-agendas-vagas.html
          grep -q 'AJUSTE_LAYOUT_AGENDAS_PROFISSIONAIS_V1' painel-oficial-agendas-vagas.html
          grep -q 'function agruparAgendasPorProfissional' painel-oficial-agendas-vagas.html
          grep -q -- '-webkit-appearance:none!important' painel-oficial-agendas-vagas.html
      - name: Validar JavaScript inline
        run: |
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('painel-oficial-agendas-vagas.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          inline='\n'.join(b for b in blocks if b.strip())
          pathlib.Path('/tmp/painel-inline.js').write_text(inline)
          PY
          node --check /tmp/painel-inline.js
      - name: Gravar apenas o painel alterado
        run: |
          set -euo pipefail
          git config user.name 'merciocamposfar07-hub'
          git config user.email 'merciocamposfar07@icloud.com'
          git add painel-oficial-agendas-vagas.html
          git commit -m 'Corrige layout e agrupa agendas por profissional'
          git pull --rebase origin main
          git push origin HEAD:main
