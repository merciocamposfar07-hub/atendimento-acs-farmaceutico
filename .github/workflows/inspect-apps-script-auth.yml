name: Inspecionar autenticação Apps Script

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-apps-script-auth.yml'
      - '.github/inspect-apps-script-auth-request'

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Baixar projeto Apps Script sem alterar
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON"
          LIVE="$RUNNER_TEMP/apps-script-auth"
          mkdir -p "$LIVE"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          CLASP_JSON="$CLASP_JSON" LIVE="$LIVE" node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const cfg=JSON.parse(process.env.CLASP_JSON);
          if(!cfg.scriptId) throw new Error('scriptId ausente');
          cfg.rootDir='.';
          fs.writeFileSync(path.join(process.env.LIVE,'.clasp.json'),JSON.stringify(cfg,null,2));
          NODE
          cd "$LIVE"
          npx --yes @google/clasp@3.3.0 pull >/dev/null
      - name: Mostrar somente contrato de autenticação
        shell: bash
        run: |
          set -euo pipefail
          LIVE="$RUNNER_TEMP/apps-script-auth"
          LIVE="$LIVE" node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=process.env.LIVE;
          const files=[];
          function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory())walk(p);else if(/\.(?:gs|js)$/.test(e.name))files.push(p);}}
          walk(root);
          for(const f of files){
            const s=fs.readFileSync(f,'utf8');
            if(!/admin_login|admin_result|PIN_ADMIN|ADMIN_PIN|CHAVE_ADMIN/i.test(s))continue;
            console.log('=== FILE',path.basename(f),'===');
            const lines=s.split(/\r?\n/);
            lines.forEach((line,i)=>{
              if(/admin_login|PIN_ADMIN|ADMIN_PIN|CHAVE_ADMIN|getProperty\([^)]*(?:PIN|ADMIN)|setProperty\([^)]*(?:PIN|ADMIN)/i.test(line)){
                const a=Math.max(0,i-8),b=Math.min(lines.length,i+18);
                console.log(lines.slice(a,b).join('\n').replace(/[A-Za-z0-9_-]{40,}/g,'[LONG_LITERAL]'));
              }
            });
          }
          NODE
      - name: Limpar credenciais
        if: always()
        run: rm -f "$HOME/.clasprc.json" "$RUNNER_TEMP/apps-script-auth/.clasp.json"
