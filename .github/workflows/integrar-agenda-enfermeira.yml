name: Integrar agenda da enfermeira

on:
  push:
    paths:
      - '.github/workflows/integrar-agenda-enfermeira.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inserir script da agenda da enfermeira
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<script src="agenda-config.js?v=20260726-02"></script>'
          nurse = '<script src="agenda-enfermeira.js?v=20260727-01"></script>'
          if nurse not in text:
              if marker not in text:
                  raise SystemExit('Marcador agenda-config.js não encontrado no index.html')
              text = text.replace(marker, marker + '\n  ' + nurse, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Publicar alteração
        run: |
          if git diff --quiet; then
            echo "Integração já aplicada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Carrega agenda da Enfermeira Chefe no portal"
          git push
