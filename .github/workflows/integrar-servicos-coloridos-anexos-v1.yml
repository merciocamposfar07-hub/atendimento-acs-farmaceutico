name: Integrar servicos coloridos e anexos V1

on:
  push:
    paths:
      - 'scripts/integrar-servicos-coloridos-anexos-v1.py'
      - '.github/workflows/integrar-servicos-coloridos-anexos-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar integracao
        run: python scripts/integrar-servicos-coloridos-anexos-v1.py
      - name: Validar escopo
        run: |
          grep -q 'portal-servicos-coloridos-anexos-v1.js?v=20260818-servicos-anexos-v1' index.html
          grep -q 'portal-auto-update.js?v=20260812-v101' index.html
          grep -q 'portal-odontologia-segunda-sexta.js?v=20260817-reserva-get-v111' index.html
          CHANGED="$(git diff --name-only)"
          test "$CHANGED" = "index.html"
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Integra servicos coloridos e anexos no Portal TACS'
          git pull --rebase origin main
          git push origin main
