name: Incluir card WhatsApp agendas v1
on:
  push:
    branches: [main]
    paths:
      - 'agenda-whatsapp-card-v1.js'
      - '.github/workflows/incluir-card-whatsapp-agendas-v1.yml'
permissions:
  contents: write
jobs:
  incluir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Manter somente o gerador institucional no painel de agendas
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('painel-oficial-agendas-vagas.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script src="/atendimento-acs-farmaceutico/agenda-whatsapp-card-v1\.js\?v=[^"]+"></script>', '', s)
          tag='<script src="/atendimento-acs-farmaceutico/agenda-whatsapp-card-v1.js?v=20260823-card-institucional-v1"></script>'
          if '</body>' not in s:
              raise SystemExit('body final não encontrado')
          s=s.replace('</body>',tag+'\n</body>',1)
          if s.count('agenda-whatsapp-card-v1.js?v=20260823-card-institucional-v1') != 1:
              raise SystemExit('Referência institucional do card não ficou única')
          p.write_text(s,encoding='utf-8')
          print('CARD_WHATSAPP_AGENDAS_INSTITUCIONAL_OK')
          PY
          grep -Fq 'agenda-whatsapp-card-v1.js?v=20260823-card-institucional-v1' painel-oficial-agendas-vagas.html
      - name: Validar JavaScript do card
        run: node --check agenda-whatsapp-card-v1.js
      - name: Gravar alteração isolada
        run: |
          set -euo pipefail
          if git diff --quiet -- painel-oficial-agendas-vagas.html; then
            echo 'Painel já usa somente o gerador institucional.'
            exit 0
          fi
          git config user.name 'merciocamposfar07-hub'
          git config user.email 'merciocamposfar07@icloud.com'
          git add painel-oficial-agendas-vagas.html
          git commit -m 'Mantém modelo institucional nos cards de agendas'
          for tentativa in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((tentativa*2))
          done
          exit 1
