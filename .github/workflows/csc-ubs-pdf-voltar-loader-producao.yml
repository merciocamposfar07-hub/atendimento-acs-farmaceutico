name: CSC UBS - Botao voltar PDF em producao

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/csc-ubs-pdf-voltar-loader-producao.yml'

permissions:
  contents: read

concurrency:
  group: apps-script-producao
  cancel-in-progress: false

jobs:
  publicar-botao-voltar-ubs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar sintaxe e escopo
        shell: bash
        run: |
          set -euo pipefail
          node --check --input-type=commonjs < apps-script/ZZZZ_54_AnexosSolicitacoesUbsV1.gs
          node --check central-administrativa-tacs.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('apps-script/ZZZZ_54_AnexosSolicitacoesUbsV1.gs','utf8');
          const p=fs.readFileSync('painel-solicitacoes-moradores-v1.html','utf8');
          if(!s.includes('id="voltarUbs"')||!p.includes('form.target=popupName')||!p.includes('AGUARDE, CARREGANDO PDF'))throw Error('Botao voltar ou abertura direta ausente');
          console.log('UBS_PDF_DIRETO_COM_VOLTA_VALIDADO');
          NODE
      - name: Validar credenciais privadas
        env:
          CLASPRC_JSON: '${{ secrets.CLASPRC_JSON }}'
          CLASP_JSON: '${{ secrets.CLASP_JSON }}'
          DEPLOYMENT_ID: '${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}'
        run: |
          test -n "$CLASPRC_JSON" && test -n "$CLASP_JSON" && test -n "$DEPLOYMENT_ID"
      - name: Baixar versao real do servidor
        shell: bash
        env:
          CLASPRC_JSON: '${{ secrets.CLASPRC_JSON }}'
          CLASP_JSON: '${{ secrets.CLASP_JSON }}'
        run: |
          set -euo pipefail
          LIVE="$RUNNER_TEMP/csc-ubs-pdf-back"
          mkdir -p "$LIVE"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          CLASP_JSON="$CLASP_JSON" LIVE="$LIVE" node - <<'NODE'
          const fs=require('fs'),path=require('path'),cfg=JSON.parse(process.env.CLASP_JSON);
          if(!cfg.scriptId||!/^[a-zA-Z0-9_-]{20,200}$/.test(cfg.scriptId))throw Error('Projeto Apps Script nao validado');
          cfg.rootDir='.';
          fs.writeFileSync(path.join(process.env.LIVE,'.clasp.json'),JSON.stringify(cfg,null,2)+'\n');
          NODE
          cd "$LIVE"
          npx --yes @google/clasp@3.3.0 pull
          test -f appsscript.json
      - name: Alterar somente HTML do PDF em duas funcoes
        shell: bash
        run: |
          set -euo pipefail
          LIVE="$RUNNER_TEMP/csc-ubs-pdf-back" node - <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const liveDir=process.env.LIVE,source=fs.readFileSync('apps-script/ZZZZ_54_AnexosSolicitacoesUbsV1.gs','utf8');
          const names=fs.readdirSync(liveDir).filter(x=>/\.(?:js|gs)$/.test(x));
          const digest=s=>crypto.createHash('sha256').update(s).digest('hex');
          const original=Object.fromEntries(names.map(n=>[n,digest(fs.readFileSync(path.join(liveDir,n)))]));
          const matches=names.filter(n=>fs.readFileSync(path.join(liveDir,n),'utf8').includes('var CSC_ANEXOS_UBS_V1='));
          if(matches.length!==1)throw Error('Arquivo de PDF privado ambiguo; interrompendo');
          const name=matches[0],file=path.join(liveDir,name);
          let deployed=fs.readFileSync(file,'utf8');
          for(const n of ['cscAnexosUbsRender_','cscAnexosUbsErroHtml_']){
            const regex=new RegExp('function '+n+'\\([^)]*\\)\\{[\\s\\S]*?\\n\\}','g');
            const matchLive=deployed.match(regex)||[],matchSource=source.match(regex)||[];
            if(matchLive.length!==1||matchSource.length!==1)throw Error('Funcao PDF nao localizada de modo unico: '+n);
            const old=matchLive[0],up=matchSource[0];
            if(old===up)continue;
            if(n==='cscAnexosUbsRender_'&&(!old.includes('AGUARDE… carregando todas as páginas do documento.')||!up.includes('id="voltarUbs"')))throw Error('PDF em producao diverge da configuracao anterior');
            if(n==='cscAnexosUbsErroHtml_'&&(!old.includes('Volte à Central para tentar novamente.')||!up.includes('Voltar às solicitações')))throw Error('Mensagem de erro em producao diverge');
            deployed=deployed.replace(old,up);
          }
          if(!deployed.includes('id="voltarUbs"'))throw Error('Botao de retorno nao incluido');
          fs.writeFileSync(file,deployed,'utf8');
          const changed=names.filter(n=>digest(fs.readFileSync(path.join(liveDir,n)))!==original[n]);
          if(changed.length!==1||changed[0]!==name)throw Error('Outros arquivos afetados: '+changed.join(','));
          new Function(deployed);
          console.log('UBS_PDF_BOTAO_VOLTA_ISOLADO_OK '+name);
          NODE
          while IFS= read -r -d '' file; do
            node --check --input-type=commonjs < "$file" >/dev/null
          done < <(find "$RUNNER_TEMP/csc-ubs-pdf-back" -type f \( -name '*.js' -o -name '*.gs' \) -print0)
      - name: Publicar no Apps Script
        shell: bash
        env:
          DEPLOYMENT_ID: '${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/csc-ubs-pdf-back"
          DEPLOYMENTS=$(npx --yes @google/clasp@3.3.0 deployments)
          PREVIOUS=$(printf '%s\n' "$DEPLOYMENTS" | awk -v id="$DEPLOYMENT_ID" 'index($0,id) {for(i=1;i<=NF;i++)if($i~/^@[0-9]+$/){gsub(/^@/,"",$i);print i==0?"":$i;exit}}')
          test -n "$PREVIOUS"
          DEPLOYED=0
          rollback(){
            code=$?
            trap - ERR
            if [ "$DEPLOYED" = '1' ]; then
              npx --yes @google/clasp@3.3.0 redeploy --versionNumber "$PREVIOUS" --description "Rollback botao voltar UBS" "$DEPLOYMENT_ID" || true
            fi
            exit "$code"
          }
          trap rollback ERR
          npx --yes @google/clasp@3.3.0 push --force
          OUTPUT=$(npx --yes @google/clasp@3.3.0 version "UBS PDF direto e botao voltar")
          VERSION=$(printf '%s\n' "$OUTPUT" | grep -Eo '[0-9]+' | tail -n 1)
          test -n "$VERSION"
          npx --yes @google/clasp@3.3.0 redeploy --versionNumber "$VERSION" --description "UBS PDF: voltar sem alterar outras funcoes" "$DEPLOYMENT_ID"
          DEPLOYED=1
          URL="https://script.google.com/macros/s/$DEPLOYMENT_ID/exec"
          OK=0
          for i in 1 2 3 4; do
            RESULT=$(curl -L --fail --silent --show-error --connect-timeout 6 --max-time 25 "$URL?action=csc_ubs_anexos_status") || true
            if RESULT="$RESULT" node - <<'NODE'
          const r=JSON.parse(process.env.RESULT||'{}');
          if(r.ok!==true||r.pdfPrivado!==true||r.visualizadorPaginas!==true)process.exit(1);
          console.log('UBS_PDF_PRODUCAO_ENDPOINT_OK');
          NODE
            then OK=1;break;fi
            sleep 6
          done
          test "$OK" = '1'
          trap - ERR
          echo "UBS_PDF_VOLTA_PRODUCAO_OK versao=$VERSION"
      - name: Limpar credenciais
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.clasprc.json"
          rm -f "$RUNNER_TEMP/csc-ubs-pdf-back/.clasp.json"
