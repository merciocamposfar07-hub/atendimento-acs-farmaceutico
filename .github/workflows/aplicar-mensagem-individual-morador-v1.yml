name: Aplicar mensagem individual por morador V1
on:
  push:
    branches:
      - feature/mensagem-individual-morador-v1
    paths:
      - .github/workflows/aplicar-mensagem-individual-morador-v1.yml
permissions:
  contents: write
jobs:
  aplicar-e-testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mensagem-individual-morador-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Aplicar somente os encaixes autorizados
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html=Path('teste-v1/painel-moradores-v2.html')
          s=html.read_text()
          old='<div id="searchArea"><h2>Buscar morador</h2><p class="muted">Busque por nome, CPF, CNS, ID Portal, endereço ou telefone.</p><label for="query">Busca</label><input id="query" class="field" placeholder="Ex.: Maria Adriana">'
          new='<div id="searchArea"><h2>Buscar morador</h2><p class="muted">Busque por nome, CPF, CNS, número do cadastro familiar (ex.: 002, 072), ID Portal, endereço ou telefone.</p><label for="query">Busca</label><input id="query" class="field" placeholder="Ex.: Maria Adriana ou 072">'
          if s.count(old)!=1:
              raise SystemExit('ABORTADO: texto/entrada da busca não está no estado esperado.')
          s=s.replace(old,new,1)
          old_script='<script src="painel-moradores-transport-v2.js?v=20260817-pin-only-v1"></script>\n</body>'
          new_script='<script src="painel-moradores-transport-v2.js?v=20260820-msg-individual-v1"></script>\n<script src="mensagem-individual-morador-v1.js?v=20260820-v1"></script>\n</body>'
          if s.count(old_script)!=1:
              raise SystemExit('ABORTADO: scripts do painel não estão no estado esperado.')
          s=s.replace(old_script,new_script,1)
          html.write_text(s)

          js=Path('teste-v1/painel-moradores-transport-v2.js')
          s=js.read_text()
          old_card="""function ordinaryCard(item,flag){
            var card=document.createElement('div');card.className='card';
            var button=document.createElement('button');button.type='button';button.innerHTML=residentSummary(item);button.addEventListener('click',function(){loadResident(item,flag)});card.appendChild(button);
            if(flag==='POSSIVEL'){
              var warning=document.createElement('div');warning.className='status warn';warning.style.marginTop='10px';
              warning.textContent='Possível duplicidade: mesmo nome e nascimento, mas sem documento coincidente suficiente para consolidação automática.';
              card.appendChild(warning);
            }
            return card;
          }"""
          new_card="""function ordinaryCard(item,flag){
            var card=document.createElement('div');card.className='card';
            var button=document.createElement('button');button.type='button';button.innerHTML=residentSummary(item);button.addEventListener('click',function(){loadResident(item,flag)});card.appendChild(button);
            if(!flag){
              var messageButton=document.createElement('button');
              messageButton.type='button';messageButton.className='msg-ind-card-button';messageButton.textContent='🔔 Enviar mensagem';
              messageButton.addEventListener('click',function(event){
                event.preventDefault();event.stopPropagation();
                if(window.PortalTacsMensagemIndividual&&typeof window.PortalTacsMensagemIndividual.abrir==='function')window.PortalTacsMensagemIndividual.abrir(item);
                else setStatus('operationStatus','A função de mensagem individual ainda não foi carregada. Atualize o painel.','err');
              });
              card.appendChild(messageButton);
            }
            if(flag==='POSSIVEL'){
              var warning=document.createElement('div');warning.className='status warn';warning.style.marginTop='10px';
              warning.textContent='Possível duplicidade: mesmo nome e nascimento, mas sem documento coincidente suficiente para consolidação automática.';
              card.appendChild(warning);
            }
            return card;
          }"""
          if s.count(old_card)!=1:
              raise SystemExit('ABORTADO: cartão individual não está no estado esperado.')
          s=s.replace(old_card,new_card,1)
          old_search="post('admin_moradores_buscar',cloneSession({q:q}),'admin_moradores_result',function(r){"
          new_search="var familySearch=/^\\d{1,4}[A-Za-z]?$/.test(q.replace(/\\s+/g,''));\n  var searchAction=familySearch?'admin_mensagem_individual_buscar':'admin_moradores_buscar';\n  var resultAction=familySearch?'admin_mensagem_individual_result':'admin_moradores_result';\n  post(searchAction,cloneSession({q:q}),resultAction,function(r){"
          if s.count(old_search)!=1:
              raise SystemExit('ABORTADO: busca de moradores não está no estado esperado.')
          s=s.replace(old_search,new_search,1)
          js.write_text(s)
          PY
      - name: Validar contrato da nova função
        run: node scripts/test_mensagem_individual_morador_v1.js
      - name: Rodar toda a suíte existente
        run: npm test
      - name: Confirmar escopo e gravar somente a branch
        run: |
          set -e
          git diff --check
          git status --short
          python3 - <<'PY'
          import subprocess
          allowed={
            'teste-v1/painel-moradores-v2.html',
            'teste-v1/painel-moradores-transport-v2.js',
            '.github/workflows/aplicar-mensagem-individual-morador-v1.yml'
          }
          out=subprocess.check_output(['git','status','--porcelain'],text=True)
          changed=set()
          for line in out.splitlines():
              if not line: continue
              path=line[3:]
              if ' -> ' in path: path=path.split(' -> ',1)[1]
              changed.add(path)
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit('ABORTADO: arquivo fora do escopo alterado: '+', '.join(sorted(unexpected)))
          PY
          rm .github/workflows/aplicar-mensagem-individual-morador-v1.yml
          git config user.name 'Portal TACS Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add teste-v1/painel-moradores-v2.html teste-v1/painel-moradores-transport-v2.js .github/workflows/aplicar-mensagem-individual-morador-v1.yml
          git commit -m 'Integrar mensagem individual ao painel de moradores'
          git push origin HEAD:feature/mensagem-individual-morador-v1
