name: Corrigir horario real do encaminhamento V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corrigir-horario-encaminhamento-real-v3.yml'

permissions:
  contents: write

concurrency:
  group: apps-script-producao
  cancel-in-progress: false

jobs:
  corrigir-testar-implantar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NO_COLOR: '1'
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Aplicar correcao cirurgica
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/corrigir_horario_encaminhamento_real_v3.py

      - name: Testar antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --check --input-type=commonjs < apps-script/ZZZZ_19_NotificacoesSegmentadasV1.gs
          node --check --input-type=commonjs < apps-script/ZZZZ_40_MensagensIndividuaisMoradorV1.gs
          node --check --input-type=commonjs < apps-script/ZZZZ_42_ComprovacaoMensagensV1.gs
          node scripts/test_mensagem_individual_morador_v1.js
          node scripts/test_notification_receipt_confirmation.js
          grep -q "notificacoesAreaV1AuditoriaPorEvento_(contexto.areaId,evento)" apps-script/ZZZZ_40_MensagensIndividuaisMoradorV1.gs
          grep -q "encaminhadoAuditoria" apps-script/ZZZZ_42_ComprovacaoMensagensV1.gs

      - name: Validar credenciais sem exibir
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON"
          test -n "$DEPLOYMENT_ID"

      - name: Baixar Apps Script atual
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          set -euo pipefail
          LIVE_DIR="$RUNNER_TEMP/apps-script-live"
          mkdir -p "$LIVE_DIR"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          CLASP_JSON="$CLASP_JSON" LIVE_DIR="$LIVE_DIR" node - <<'NODE'
          const fs=require('fs');const path=require('path');
          const config=JSON.parse(process.env.CLASP_JSON);
          if(!config.scriptId||!/^[A-Za-z0-9_-]{20,200}$/.test(config.scriptId))throw new Error('scriptId invalido');
          config.rootDir='.';
          fs.writeFileSync(path.join(process.env.LIVE_DIR,'.clasp.json'),JSON.stringify(config,null,2)+'\n');
          NODE
          cd "$LIVE_DIR"
          npx --yes @google/clasp@3.3.0 pull
          test -f appsscript.json

      - name: Substituir somente os tres modulos
        shell: bash
        run: |
          set -euo pipefail
          LIVE_DIR="$RUNNER_TEMP/apps-script-live"
          LIVE_DIR="$LIVE_DIR" node - <<'NODE'
          const fs=require('fs');const path=require('path');
          const live=process.env.LIVE_DIR;
          const files=fs.readdirSync(live).filter(n=>/\.(?:gs|js)$/.test(n));
          const mods=[
            ['TACS_NOTIFICACOES_AREA_V1','apps-script/ZZZZ_19_NotificacoesSegmentadasV1.gs'],
            ['TACS_MENSAGEM_INDIVIDUAL_V1','apps-script/ZZZZ_40_MensagensIndividuaisMoradorV1.gs'],
            ['TACS_COMPROVACAO_MENSAGENS_V1','apps-script/ZZZZ_42_ComprovacaoMensagensV1.gs']
          ];
          for(const [marker,sourcePath] of mods){
            const found=files.filter(n=>fs.readFileSync(path.join(live,n),'utf8').includes(marker));
            if(found.length!==1)throw new Error('Modulo '+marker+' nao localizado exatamente uma vez.');
            fs.writeFileSync(path.join(live,found[0]),fs.readFileSync(sourcePath,'utf8'),'utf8');
            console.log('Modulo substituido:',found[0]);
          }
          NODE

      - name: Publicar mesma implantacao e validar
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          LIVE_DIR="$RUNNER_TEMP/apps-script-live"
          cd "$LIVE_DIR"
          DEPLOYMENTS=$(npx --yes @google/clasp@3.3.0 deployments)
          PREVIOUS_VERSION=$(printf '%s\n' "$DEPLOYMENTS" | awk -v id="$DEPLOYMENT_ID" 'index($0,id) {for(i=1;i<=NF;i++) if($i ~ /^@[0-9]+$/) {gsub(/^@/,"",$i); print $i; exit}}')
          test -n "$PREVIOUS_VERSION"
          npx --yes @google/clasp@3.3.0 version "Backup antes do horario real de encaminhamento - ${GITHUB_SHA::7}"
          npx --yes @google/clasp@3.3.0 push --force
          VERSION_OUTPUT=$(npx --yes @google/clasp@3.3.0 version "Horario real de encaminhamento V3 - ${GITHUB_SHA::7}")
          NEW_VERSION=$(printf '%s\n' "$VERSION_OUTPUT" | grep -Eo '[0-9]+' | tail -n 1)
          test -n "$NEW_VERSION"
          DEPLOYED=0
          rollback(){ code=$?; trap - ERR; if [ "$DEPLOYED" = '1' ]; then npx --yes @google/clasp@3.3.0 redeploy --versionNumber "$PREVIOUS_VERSION" --description "Rollback automatico horario encaminhamento" "$DEPLOYMENT_ID" || true; fi; exit "$code"; }
          trap rollback ERR
          npx --yes @google/clasp@3.3.0 redeploy --versionNumber "$NEW_VERSION" --description "Correcao do horario real de encaminhamento" "$DEPLOYMENT_ID"
          DEPLOYED=1
          BASE="https://script.google.com/macros/s/$DEPLOYMENT_ID/exec"
          ok=0
          for tentativa in 1 2 3; do
            resposta=$(curl -L --fail --silent --show-error --connect-timeout 5 --max-time 15 "$BASE?action=portal_manutencao_status&areaId=JAPARANDUBA") || true
            if printf '%s' "$resposta" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'; then ok=1; break; fi
            sleep 8
          done
          test "$ok" = '1'
          trap - ERR
          printf 'Implantacao validada na versao %s\n' "$NEW_VERSION"

      - name: Registrar fontes corrigidas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Portal TACS Release'
          git config user.email 'actions@users.noreply.github.com'
          git add apps-script/ZZZZ_19_NotificacoesSegmentadasV1.gs apps-script/ZZZZ_40_MensagensIndividuaisMoradorV1.gs apps-script/ZZZZ_42_ComprovacaoMensagensV1.gs
          git commit -m 'Corrigir horario real do encaminhamento [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Remover credenciais temporarias
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.clasprc.json"
          rm -f "$RUNNER_TEMP/apps-script-live/.clasp.json"

# retry-v4
