name: Publicar correção visual do Safari v93

on:
  push:
    paths:
      - '.github/workflows/publicar-correcao-safari-v93.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar versão do script odontológico
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'portal-odontologia-segunda-sexta\.js\?v=[^"\']+',
              'portal-odontologia-segunda-sexta.js?v=20260801-93',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Referência do script odontológico não encontrada.')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Publicar no portal
        run: |
          if git diff --quiet; then
            echo 'Versão 93 já publicada.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Aplicar correção visual do Safari no Portal TACS'
          git push

