name: Verificar pages ciencia mensagens v1

on:
  push:
    branches:
      - verify/deploy-ciencia-mensagens-v1
    paths:
      - '.github/workflows/verificar-pages-ciencia-mensagens-v1.yml'

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verificar arquivos realmente servidos pelo Pages
        shell: bash
        run: |
          set -euo pipefail
          base='https://merciocamposfar07-hub.github.io/atendimento-acs-farmaceutico'
          ok=0
          for tentativa in $(seq 1 24); do
            curl -fsSL --connect-timeout 5 --max-time 20 "$base/confirmar-ciencia.html?_=$RANDOM$RANDOM" -o /tmp/ciencia.html || true
            curl -fsSL --connect-timeout 5 --max-time 20 "$base/teste-v1/mensagem-relatorio-entrega-v1.js?_=$RANDOM$RANDOM" -o /tmp/relatorio.js || true
            curl -fsSL --connect-timeout 5 --max-time 20 "$base/teste-v1/painel-moradores-v2.html?_=$RANDOM$RANDOM" -o /tmp/moradores.html || true
            if grep -q 'Li e estou ciente' /tmp/ciencia.html 2>/dev/null && grep -q 'Relatório de entrega' /tmp/relatorio.js 2>/dev/null && grep -q 'mensagem-relatorio-entrega-v1.js?v=20260820-ciencia-v1' /tmp/moradores.html 2>/dev/null; then ok=1; break; fi
            sleep 8
          done
          test "$ok" = '1'
          cat > verificacao-pages-ciencia-v1.txt <<'EOF'
          PAGES_CIENCIA_MENSAGENS_V1_OK
          confirmar-ciencia.html=Li e estou ciente
          mensagem-relatorio-entrega-v1.js=Relatório de entrega
          painel-moradores-v2.html=carrega ciencia-v1
          EOF
          rm -f .github/workflows/verificar-pages-ciencia-mensagens-v1.yml
          git config user.name 'Portal TACS'
          git config user.email 'actions@users.noreply.github.com'
          git add -- verificacao-pages-ciencia-v1.txt .github/workflows/verificar-pages-ciencia-mensagens-v1.yml
          git commit -m 'Registrar verificação pública do relatório de ciência'
          git push origin HEAD:verify/deploy-ciencia-mensagens-v1
