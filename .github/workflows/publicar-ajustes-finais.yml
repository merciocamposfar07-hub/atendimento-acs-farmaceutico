name: Publicar ajustes finais do Portal TACS

on:
  push:
    paths:
      - '.github/workflows/publicar-ajustes-finais.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Carregar correções finais no portal
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="portal-ajustes-finais.js?v=20260731-61"></script>'

          text = re.sub(
              r'<script src="portal-ajustes-finais\.js\?v=[^"\']+"></script>',
              tag,
              text,
          )

          if tag not in text:
              text = text.replace('</body>', '  ' + tag + '\n</body>', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Publicar no GitHub Pages
        run: |
          if git diff --quiet; then
            echo "Correções já publicadas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publicar correções finais do Portal TACS"
          git push
