name: Validar UI App4 canônica dos painéis administrativos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-admin-ui-app4-main.yml'
      - 'admin-ui-standard.inline.css'
      - 'admin-ui-behavior.inline.js'
      - 'scripts/injetar_admin_ui_standard_v1.py'
      - 'scripts/test_admin_ui_app4_canonical.py'
      - 'recados-campanhas-whatsapp-mensal-v12.js'
      - 'painel-oficial-recados-campanhas.html'
      - 'teste-v1/painel-moradores-v2.html'
      - 'teste-v1/painel-moradores-transport-v2.js'
      - 'painel-oficial-organizacoes-municipios.html'
      - 'painel-oficial-tacs-areas.html'
      - 'painel-oficial-profissionais-servicos.html'
      - 'painel-suporte-moradores.html'
      - 'painel-suporte-moradores-v2.html'
      - 'painel-oficial-agendas-vagas.html'
      - 'central-administrativa-tacs.html'
      - 'central-suporte-moradores-v1.js'
      - 'teste-v1/painel-profissionais-servicos-v1.html'

permissions:
  contents: read

concurrency:
  group: admin-ui-app4-main
  cancel-in-progress: false

jobs:
  aplicar-e-validar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validar contrato App4 R6, sessão única e isolamento do Portal público
        run: python3 scripts/test_admin_ui_app4_canonical.py

      - name: Validar integridade textual
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          for f in \
            central-administrativa-tacs.html \
            painel-oficial-organizacoes-municipios.html \
            painel-oficial-agendas-vagas.html \
            painel-oficial-profissionais-servicos.html \
            painel-oficial-recados-campanhas.html \
            painel-oficial-tacs-areas.html \
            painel-suporte-moradores-v2.html \
            painel-suporte-moradores.html \
            teste-v1/painel-moradores-v2.html \
            teste-v1/painel-profissionais-servicos-v1.html \
            teste-v1/painel-tacs-areas-v1.html; do
              grep -q 'CSC-CENTRAL-ADMIN-UI-APP4-2026-09-10-R6' "$f"
              grep -q 'portalTacsAdminUiBehaviorR6' "$f"
          done

      - name: Confirmar que a validação não alterou o código
        run: git diff --exit-code
