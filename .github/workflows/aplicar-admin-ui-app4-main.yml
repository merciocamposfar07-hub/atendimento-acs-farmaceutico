name: Aplicar UI App4 canônica aos painéis administrativos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-admin-ui-app4-main.yml'
      - 'admin-ui-standard.inline.css'
      - 'admin-ui-behavior.inline.js'
      - 'scripts/injetar_admin_ui_standard_v1.py'
      - 'scripts/test_admin_ui_app4_canonical.py'

permissions:
  contents: write

concurrency:
  group: admin-ui-app4-main
  cancel-in-progress: false

jobs:
  aplicar-e-validar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Injetar skin e comportamento App4 R5 somente nos painéis administrativos
        run: python3 scripts/injetar_admin_ui_standard_v1.py

      - name: Validar contrato App4 R5, sessão única e isolamento do Portal público
        run: python3 scripts/test_admin_ui_app4_canonical.py

      - name: Validar integridade textual
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          for f in \
            central-administrativa-tacs.html \
            painel-oficial-organizacoes-municipios.html \
            painel-oficial-agendas-vagas.html \
            painel-oficial-profissionais-servicos.html \
            painel-oficial-recados-campanhas.html \
            painel-oficial-tacs-areas.html \
            painel-suporte-moradores-v2.html \
            painel-suporte-moradores.html \
            teste-v1/painel-moradores-v2.html \
            teste-v1/painel-profissionais-servicos-v1.html \
            teste-v1/painel-tacs-areas-v1.html; do
              grep -q 'CSC-CENTRAL-ADMIN-UI-APP4-2026-09-10-R5' "$f"
              grep -q 'portalTacsAdminUiBehaviorR5' "$f"
          done

      - name: Registrar HTMLs normalizados se houver diferença
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Todos os painéis já estão no padrão App4 R5.'
            exit 0
          fi
          git config user.name 'Conecta Saúde UI Release'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            central-administrativa-tacs.html \
            painel-oficial-organizacoes-municipios.html \
            painel-oficial-agendas-vagas.html \
            painel-oficial-profissionais-servicos.html \
            painel-oficial-recados-campanhas.html \
            painel-oficial-tacs-areas.html \
            painel-suporte-moradores-v2.html \
            painel-suporte-moradores.html \
            teste-v1/painel-moradores-v2.html \
            teste-v1/painel-profissionais-servicos-v1.html \
            teste-v1/painel-tacs-areas-v1.html
          git commit -m 'UI: aplicar App institucional canônico R5 aos painéis administrativos [skip ci]'
          git push origin HEAD:main
