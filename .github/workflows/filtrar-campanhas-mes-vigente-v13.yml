name: Validar separação do filtro mensal V14

on:
  push:
    branches: [main]
    paths:
      - 'scripts/filtrar_campanhas_mes_vigente_v13.py'
      - '.github/workflows/filtrar-campanhas-mes-vigente-v13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-sem-interferir-no-painel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Aplicar rotina em modo idempotente
        run: python3 scripts/filtrar_campanhas_mes_vigente_v13.py

      - name: Validar sintaxe, escopo e não interferência
        shell: bash
        run: |
          set -euo pipefail
          node --check recados-campanhas-whatsapp-mensal-v12.js
          grep -q 'function currentMonthKey()' recados-campanhas-whatsapp-mensal-v12.js
          grep -q "monthKey(card)===vigente" recados-campanhas-whatsapp-mensal-v12.js
          ! grep -q "card.hidden=!mostrar" recados-campanhas-whatsapp-mensal-v12.js
          grep -q 'campanhas-periodo-v2.js?v=20260825-campanhas-estavel-v14' painel-oficial-recados-campanhas.html
          grep -q 'recados-campanhas-whatsapp-mensal-v12.js?v=20260825-campanhas-estavel-v14' painel-oficial-recados-campanhas.html
          grep -q "lilas:\['#ead9ff'" recados-campanhas-whatsapp-mensal-v12.js
          grep -q "dourado:\['#ffe7a3'" recados-campanhas-whatsapp-mensal-v12.js
          allowed='^(recados-campanhas-whatsapp-mensal-v12.js|painel-oficial-recados-campanhas.html)$'
          bad=$(git diff --name-only | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then echo "Arquivo fora do escopo: $bad"; exit 1; fi

      - name: Simular administração por período e WhatsApp mensal independentes
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          function monthKey(v){const m=String(v).match(/^(\d{4})-(\d{2})-/);return m?m[1]+'-'+m[2]:''}
          const cards=[
            {inicio:'2026-01-01',ativo:true,titulo:'Janeiro'},
            {inicio:'2026-08-01',ativo:true,titulo:'Agosto Lilás'},
            {inicio:'2026-08-01',ativo:true,titulo:'Agosto Dourado'},
            {inicio:'2026-09-01',ativo:true,titulo:'Setembro'}
          ];
          const admin=(periodo)=>cards.filter(c=>c.ativo&&monthKey(c.inicio)===periodo);
          const whatsapp=cards.filter(c=>c.ativo&&monthKey(c.inicio)==='2026-08');
          if(admin('2026-01').length!==1) process.exit(2);
          if(admin('2026-08').length!==2) process.exit(3);
          if(admin('2026-09').length!==1) process.exit(4);
          if(whatsapp.length!==2) process.exit(5);
          if(admin('2026-01')[0].titulo!=='Janeiro') process.exit(6);
          console.log('FILTRO_ADMIN_E_WHATSAPP_INDEPENDENTES_OK');
          NODE

      - name: Garantir que a rotina não tenta reescrever produção
        run: git diff --exit-code
