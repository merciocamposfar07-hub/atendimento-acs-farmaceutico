name: Diagnosticar recado Portal TACS v105

on:
  push:
    branches: [diagnostico-recado-v105]
    paths:
      - '.github/workflows/diagnostico-recado-v105.yml'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comparar leituras públicas reais sem gravar
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://script.google.com/macros/s/AKfycbwOyG9yZqYly736ZsGta1q6Jd4Irkc-iRWURfypKcpBkyCCmO3hMNE4oOsXECTMCpSxYw/exec'
          TS=$(date +%s)
          curl -L -sS --connect-timeout 8 --max-time 35 "$BASE?action=painel_publico&areaId=JAPARANDUBA&_=$TS" -o /tmp/painel.json
          curl -L -sS --connect-timeout 8 --max-time 35 "$BASE?action=publico_conteudo&areaId=JAPARANDUBA&_=$TS" -o /tmp/conteudo.json
          python3 - <<'PY'
          import json
          for nome,path in [('PAINEL','/tmp/painel.json'),('CONTEUDO','/tmp/conteudo.json')]:
              raw=open(path,encoding='utf-8').read()
              data=json.loads(raw)
              recados=data.get('recados') or []
              print(nome+'_OK=',data.get('ok'))
              print(nome+'_AREA=',data.get('areaId'))
              print(nome+'_VERSAO=',data.get('versao'))
              print(nome+'_RECADOS_TOTAL=',len(recados))
              for i,r in enumerate(recados):
                  print(nome+'_RECADO',i,json.dumps(r,ensure_ascii=False))
          PY
