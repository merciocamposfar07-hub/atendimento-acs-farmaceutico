name: Diagnosticar recado Portal TACS v105

on:
  push:
    branches: [diagnostico-recado-v105]
    paths:
      - '.github/workflows/diagnostico-recado-v105.yml'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ler conteúdo público real sem gravar
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://script.google.com/macros/s/AKfycbwOyG9yZqYly736ZsGta1q6Jd4Irkc-iRWURfypKcpBkyCCmO3hMNE4oOsXECTMCpSxYw/exec'
          URL="$BASE?action=painel_publico&areaId=JAPARANDUBA&_=$(date +%s)"
          curl -L -sS --connect-timeout 8 --max-time 35 "$URL" -o /tmp/publico.json
          python3 - <<'PY'
          import json
          p='/tmp/publico.json'
          raw=open(p,encoding='utf-8').read()
          print('HTTP_PAYLOAD_BYTES=',len(raw))
          try:
              data=json.loads(raw)
          except Exception as e:
              print('JSON_ERROR=',e)
              print(raw[:2000])
              raise
          print('OK=',data.get('ok'))
          print('AREA=',data.get('areaId'))
          recados=data.get('recados') or []
          print('RECADOS_TOTAL=',len(recados))
          for i,r in enumerate(recados):
              print('RECADO',i,json.dumps({
                  'id':r.get('id'),
                  'title':r.get('title') or r.get('titulo'),
                  'message':r.get('message') or r.get('mensagem'),
                  'validity':r.get('validity') or r.get('validade'),
                  'active':r.get('active') if 'active' in r else r.get('ativo')
              },ensure_ascii=False))
          PY
