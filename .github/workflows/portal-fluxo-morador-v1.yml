name: Portal morador - fluxo guiado e limpeza segura v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portal-fluxo-morador-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar-testar-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Aplicar limpeza e mensagens do morador
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('moradores-autofill.js')
          s = p.read_text(encoding='utf-8')
          reps = [
              ("input.placeholder = 'CPF ou CNS';", "input.placeholder = 'CPF ou Cartão SUS (CNS)';"),
              ("label.firstChild.textContent = 'CPF ou CNS ';", "label.firstChild.textContent = 'CPF ou Cartão SUS (CNS) ';"),
              ("setStatus(status, 'Informe o CPF ou o Cartão Nacional de Saúde (CNS).', '');", "setStatus(status, 'Digite seu CPF ou Cartão SUS (CNS). Seus dados serão carregados automaticamente para conferência.', '');"),
              ("setStatus(status, (validCns(input.value) ? 'CNS' : 'CPF') + ' encontrado ✓ Dados preenchidos automaticamente.', 'valid');", "setStatus(status, (validCns(input.value) ? 'Cartão SUS encontrado ✓ ' : 'CPF encontrado ✓ ') + 'Dados carregados automaticamente. Confira nome, nascimento e localidade; se algo estiver errado, corrija antes de continuar.', 'valid');"),
              ("setStatus(status, 'Cadastro não encontrado. Confira o documento.', 'invalid');", "setStatus(status, validCns(input.value) ? 'Cartão SUS não localizado nesta área. Confira os 15 números ou procure seu TACS.' : 'CPF não localizado nesta área. Tente informar o Cartão SUS (CNS).', 'invalid');"),
              ("setStatus(status, 'Digite um CPF válido ou os 15 números do CNS.', 'invalid');", "setStatus(status, 'Digite um CPF válido ou os 15 números do Cartão SUS (CNS).', 'invalid');")
          ]
          for old, new in reps:
              if old not in s:
                  raise SystemExit('Trecho não encontrado: ' + old[:90])
              s = s.replace(old, new, 1)

          old = "oldInput.parentNode.replaceChild(input, oldInput);\n\n    var label = input.closest('label');"
          new = "oldInput.parentNode.replaceChild(input, oldInput);\n    // Limpa qualquer dado pessoal restaurado pelo navegador antes de consultar a área atual.\n    clearResidentFields();\n\n    var label = input.closest('label');"
          if old not in s:
              raise SystemExit('Ponto de limpeza inicial não encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script src="moradores-autofill.js?v=20260815-territorial-v2"></script>'
          new = '<script src="moradores-autofill.js?v=20260816-fluxo-morador-v1"></script>'
          if old not in s:
              raise SystemExit('Versão antiga do autofill não encontrada em index.html')
          s = s.replace(old, new, 1)

          anchor = '<script src="portal-odontologia-segunda-sexta.js?v=20260816-reserva-confirmada-v103"></script>'
          addition = anchor + '\n  <script src="portal-orientacao-morador.js?v=20260816-fluxo-guiado-v1"></script>'
          if anchor not in s:
              raise SystemExit('Âncora odontológica v103 não encontrada')
          if 'portal-orientacao-morador.js' not in s:
              s = s.replace(anchor, addition, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validar contratos e regressão
        shell: bash
        run: |
          set -euo pipefail
          node --check moradores-autofill.js
          node --check portal-orientacao-morador.js
          grep -q 'CPF não localizado nesta área. Tente informar o Cartão SUS (CNS).' moradores-autofill.js
          grep -q 'Dados carregados automaticamente. Confira nome, nascimento e localidade' moradores-autofill.js
          grep -q 'portal-orientacao-morador.js?v=20260816-fluxo-guiado-v1' index.html
          grep -q 'portal-odontologia-segunda-sexta.js?v=20260816-reserva-confirmada-v103' index.html
          grep -q 'buscar_morador.*areaId' moradores-autofill.js
          npm test

      - name: Garantir escopo
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(index\.html|moradores-autofill\.js)$' || true)"
          test -z "$unexpected"

      - name: Publicar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Portal TACS'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html moradores-autofill.js
          git commit -m 'Limpa dados entre atendimentos e orienta CPF ou Cartão SUS'
          git push origin HEAD:main
