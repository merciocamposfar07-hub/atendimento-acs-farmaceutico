name: Publicar restauração do Portal TACS

on:
  push:
    paths:
      - '.github/workflows/bump-restored-features.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar versões dos arquivos restaurados
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = '20260731-60'

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = re.sub(r'agenda-enfermeira\.js\?v=[^"\']+', f'agenda-enfermeira.js?v={version}', text)
          index.write_text(text, encoding='utf-8')

          admin = Path('admin.html')
          text = admin.read_text(encoding='utf-8')
          text = re.sub(r'admin-post-bridge\.js\?v=[^"\']+', f'admin-post-bridge.js?v={version}', text)
          text = re.sub(r'admin-controle-integral\.js\?v=[^"\']+', f'admin-controle-integral.js?v={version}', text)
          admin.write_text(text, encoding='utf-8')
          PY

      - name: Publicar
        run: |
          if git diff --quiet; then
            echo "Versões já atualizadas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html
          git commit -m "Publicar restauração de agendas, cards e notificações"
          git push
