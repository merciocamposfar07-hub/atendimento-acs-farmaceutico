name: Diagnosticar ícones oficiais v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnosticar-icones-oficiais-v1.yml'

permissions:
  actions: read
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consultar última execução dos ícones
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_JSON=$(gh run list --workflow aplicar-icones-oficiais-tacs-v1.yml --branch main --limit 1 --json databaseId,status,conclusion,headSha,url,createdAt)
          echo "$RUN_JSON" > /tmp/run.json
          python3 - <<'PY'
          import json, subprocess
          data=json.load(open('/tmp/run.json'))
          out=[]
          if not data:
              out.append('status=not_found')
          else:
              r=data[0]
              out += [f"run_id={r.get('databaseId')}", f"status={r.get('status')}", f"conclusion={r.get('conclusion')}", f"head_sha={r.get('headSha')}", f"created_at={r.get('createdAt')}"]
              if r.get('databaseId'):
                  cp=subprocess.run(['gh','run','view',str(r['databaseId']),'--log-failed'],text=True,capture_output=True)
                  log=(cp.stdout or cp.stderr or '').strip()
                  if log:
                      out.append('--- failed log ---')
                      out.extend(log.splitlines()[-120:])
          open('.github/icones-oficiais-status.txt','w').write('\n'.join(out)+'\n')
          PY
      - name: Registrar diagnóstico
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/icones-oficiais-status.txt
          git commit -m 'Registra diagnóstico dos ícones oficiais'
          git pull --rebase origin main
          git push origin main
