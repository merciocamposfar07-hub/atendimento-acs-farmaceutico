name: Homologar estabilização de notificações V8

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: notificacoes-v8-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  simular-e-testar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar branch da correção
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Aplicar patch idempotente
        run: python3 scripts/aplicar_estabilizacao_notificacoes_v8.py

      - name: Validar sintaxe da camada crítica
        run: |
          node --check --input-type=commonjs < apps-script/ZZZZ_46_EstabilizacaoNotificacoesV8.gs
          node --check scripts/test_estabilizacao_notificacoes_v8.js

      - name: Simular paciente, Push, vínculo e envio individual
        run: node scripts/test_estabilizacao_notificacoes_v8.js

      - name: Rodar bateria completa do Portal TACS
        shell: bash
        run: |
          set -o pipefail
          npm ci
          npm test 2>&1 | tee "$RUNNER_TEMP/npm-test.log"

      - name: Conferir integridade do diff
        run: git diff --check

      - name: Confirmar que arquivos de produção já estão na branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            apps-script/ZZZZ_46_EstabilizacaoNotificacoesV8.gs \
            scripts/build_apps_script_release.js \
            package.json \
            painel-oficial-recados-campanhas.html \
            portal-version.json \
            scripts/test_estabilizacao_notificacoes_v8.js \
            scripts/test_identificacao_familiar_publica_v1.js \
            scripts/test_quality_gate_v101.js
          echo 'Arquivos de produção e testes homologados já estão versionados.'
