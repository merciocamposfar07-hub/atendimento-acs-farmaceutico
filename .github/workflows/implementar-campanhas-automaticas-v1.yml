function textoComparavel''',s,count=1,flags=re.S)
          s=s.replace("function render(){document.getElementById('qRecados').textContent=dados.recados.length;document.getElementById('qRecadosAtivos').textContent=dados.recados.filter(function(x){return bool(x.ATIVO)}).length;document.getElementById('qCampanhas').textContent=dados.campanhas.length;document.getElementById('qCampanhasAtivas').textContent=dados.campanhas.filter(function(x){return bool(x.ATIVO)}).length;renderRecados();renderCampanhas();atualizarBloqueioMutacoes()}","function hojeRecifeIso(){var partes=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Recife',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),v={};partes.forEach(function(p){v[p.type]=p.value});return v.year+'-'+v.month+'-'+v.day}\nfunction estadoCampanha(x){if(!bool(x&&x.ATIVO))return'Inativa';var h=hojeRecifeIso(),i=dataInput(x&&x.INICIO),v=dataInput(x&&x.VALIDADE);if(i&&i>h)return'Programada';if(v&&v<h)return'Expirada';return'Ativa'}\nfunction render(){document.getElementById('qRecados').textContent=dados.recados.length;document.getElementById('qRecadosAtivos').textContent=dados.recados.filter(function(x){return bool(x.ATIVO)}).length;document.getElementById('qCampanhas').textContent=dados.campanhas.length;document.getElementById('qCampanhasAtivas').textContent=dados.campanhas.filter(function(x){return estadoCampanha(x)==='Ativa'}).length;renderRecados();renderCampanhas();atualizarBloqueioMutacoes()}",1)
          s=re.sub(r"function renderCampanhas\(\)\{.*?\}\nfunction deveNotificarPublicacao",'''function renderCampanhas(){var e=document.getElementById('listaCampanhas');if(!dados.campanhas.length){e.innerHTML='<div class="vazio">Nenhuma campanha cadastrada.</div>';return}e.innerHTML=dados.campanhas.map(function(x){var at=bool(x.ATIVO),estado=estadoCampanha(x),ativaAgora=estado==='Ativa';return'<details class="item" data-id="'+esc(x.ID)+'"><summary><div><h3>'+esc(x.TITULO)+'</h3><div class="sub">'+(x.INICIO?'Início: <span class="dataResumo">'+esc(dataExibicao(x.INICIO))+'</span>':'Sem data de início')+(x.VALIDADE?' • até <span class="dataResumo">'+esc(dataExibicao(x.VALIDADE))+'</span>':'')+(x.DIAS?' • '+esc(x.DIAS):'')+'</div></div><span class="sinal '+(ativaAgora?'ativo':'inativo')+'">'+estado+'</span></summary><div class="corpo"><label>ID</label><input class="campo" value="'+esc(x.ID)+'" readonly><label>Título</label><input class="campo" name="titulo" value="'+esc(x.TITULO)+'"><label>Mensagem</label><textarea class="campo" name="mensagem">'+esc(x.MENSAGEM)+'</textarea><label>Horário</label><input class="campo" name="horario" value="'+esc(x.HORARIO||'')+'" placeholder="Ex.: 08:00 às 16:00"><label>Data de início</label><input class="campo" name="inicio" type="date" value="'+esc(dataInput(x.INICIO))+'"><label>Dias de exibição</label><input class="campo" name="dias" value="'+esc(x.DIAS)+'"><label class="check"><input name="ativo" type="checkbox" '+(at?'checked':'')+'> Campanha ativa</label><div class="acoes duas"><button class="botao verde salvarCampanha" type="button">Salvar campanha</button><button class="botao vermelho removerCampanha" type="button">Remover campanha</button></div></div></details>'}).join('')}
function deveNotificarPublicacao''',s,count=1,flags=re.S)
