function enviarPushConfirmado(tipo,id,p,anterior,mensagemBase,evento,cb){''',s,count=1,flags=re.S)
          s=s.replace("if(!deveNotificarPublicacao(p)){concluir(mensagemBase+' Como a publicação está inativa, nenhuma notificação foi enviada.','ok');return}","if(!deveNotificarPublicacao(p)){var motivo=!bool(p&&p.ativo)?'Como a publicação está inativa, nenhuma notificação foi enviada.':'A publicação foi salva fora do período atual. O envio automático ocorrerá quando ela entrar em vigência.';concluir(mensagemBase+' '+motivo,'ok');return}",1)
          s=s.replace("var meta=tipo==='recado'?'prioridade='+txt(p.prioridade)+';horario='+txt(p.horario)+';validade='+txt(p.validade):'inicio='+txt(p.inicio)+';horario='+txt(p.horario)+';dias='+txt(p.dias);","var meta=tipo==='recado'?'prioridade='+txt(p.prioridade)+';horario='+txt(p.horario)+';validade='+txt(p.validade):'inicio='+txt(p.inicio)+';validade='+txt(p.validade)+';horario='+txt(p.horario)+';dias='+txt(p.dias);",1)
          s=s.replace("Object.assign(sessao(),{id:r.ID,titulo:txt(r.TITULO),mensagem:txt(r.MENSAGEM),inicio:dataInput(r.INICIO),dias:txt(r.DIAS),ativo:bool(r.ATIVO)?'true':'false'})","Object.assign(sessao(),{id:r.ID,titulo:txt(r.TITULO),subtitulo:txt(r.SUBTITULO),mensagem:txt(r.MENSAGEM),horario:txt(r.HORARIO),inicio:dataInput(r.INICIO),dias:txt(r.DIAS),ano:txt(r.ANO),mes:txt(r.MES),validade:dataInput(r.VALIDADE),ativo:bool(r.ATIVO)?'true':'false'})",1)
          s=s.replace("campanhas-periodo-v2.js?v=20260816-recados-stable-v7",f"campanhas-periodo-v2.js?v={REV}",1)
          write(p,s)

