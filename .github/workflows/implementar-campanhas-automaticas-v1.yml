name: Implementar campanhas automáticas V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implementar-campanhas-automaticas-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: implementar-campanhas-automaticas-v1
  cancel-in-progress: false

jobs:
  implementar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar implementação controlada
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re,datetime

          REV='20260816-campanhas-auto-v1'
          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')
          def replace_once(p,old,new):
              s=read(p)
              if old not in s: raise SystemExit(f'Bloco esperado não encontrado em {p}: {old[:80]!r}')
              write(p,s.replace(old,new,1))
          def sub_once(p,pattern,repl,flags=re.S):
              s=read(p); out,n=re.subn(pattern,repl,s,count=1,flags=flags)
              if n!=1: raise SystemExit(f'Padrão não encontrado exatamente uma vez em {p}: {pattern[:80]}')
              write(p,out)

          # 1. Backend: período inclui subtítulo editável e restauração limpa tombstone.
          p='apps-script/ZZZZ_34_CampanhasPeriodoV1.gs'; s=read(p)
          s=s.replace("VERSAO:'1.0.0'","VERSAO:'1.1.0'",1)
          s=s.replace("'ORGANIZACAO_ID','ORGANIZACAO_NOME']","'ORGANIZACAO_ID','ORGANIZACAO_NOME','SUBTITULO']",1)
          s=s.replace("      MENSAGEM:mensagem,\n      INICIO:inicio,","      MENSAGEM:mensagem,\n      SUBTITULO:publicacoesTerritoriaisV1Texto_(p.subtitulo).slice(0,320),\n      INICIO:inicio,",1)
          s=s.replace("    publicacoesTerritoriaisV1Auditar_(ss,'SALVAR_CAMPANHA',contexto,acesso,anterior,depois);","    publicacoesTerritoriaisV1Auditar_(ss,'SALVAR_CAMPANHA',contexto,acesso,anterior,depois);\n    if(typeof campanhasAutomaticasV1RegistrarRestauracao_==='function')campanhasAutomaticasV1RegistrarRestauracao_(contexto.areaId,id);",1)
          write(p,s)

          # 2. Remoção manual de campanha automática não pode ser recriada pelo sincronizador.
          p='apps-script/ZZZZ_20_PublicacoesTerritoriaisV1.gs'; s=read(p)
          old="    var anterior=publicacoesTerritoriaisV1Objeto_(tabela.headers,linha.values);\n    tabela.sheet.deleteRow(linha.row);"
          new="    var anterior=publicacoesTerritoriaisV1Objeto_(tabela.headers,linha.values);\n    if(tipo==='campanha'&&typeof campanhasAutomaticasV1RegistrarRemocao_==='function')campanhasAutomaticasV1RegistrarRemocao_(contexto.areaId,anterior);\n    tabela.sheet.deleteRow(linha.row);"
          if old not in s: raise SystemExit('Ponto de tombstone não encontrado em ZZZZ_20')
          write(p,s.replace(old,new,1))

          # 3. A rota pública principal passa a ler campanhas e obedecer início/validade.
          p='apps-script/ZZ_12_PublicoAgendasPortalV1.gs'; s=read(p)
          s=s.replace("VERSAO: '1.2.0'","VERSAO: '1.3.0'",1)
          old="function publicoAgendasV1Resposta_(modulos, aba, areaId, planilha) {\n  areaId = publicoAgendasV1AreaId_(areaId) || PUBLICO_AGENDAS_PORTAL_V1.AREA_PADRAO;\n  return {"
          new="function publicoAgendasV1Resposta_(modulos, aba, areaId, planilha) {\n  areaId = publicoAgendasV1AreaId_(areaId) || PUBLICO_AGENDAS_PORTAL_V1.AREA_PADRAO;\n  try { if (typeof campanhasAutomaticasV1GarantirAnoAtualArea_ === 'function') campanhasAutomaticasV1GarantirAnoAtualArea_(areaId); } catch (erroCampanhaAutomatica) {}\n  var campanhas = publicoAgendasV1LerCampanhas_(planilha, areaId);\n  return {"
          if old not in s: raise SystemExit('Resposta pública esperada não encontrada')
          s=s.replace(old,new,1).replace("    campanhas: []","    campanhas: campanhas",1)
          marker="function publicoAgendasV1LocalizarAba_(planilha) {"
          if marker not in s: raise SystemExit('Marcador para leitor de campanhas não encontrado')
          reader=r'''function publicoAgendasV1LerCampanhas_(planilha, areaId) {
  areaId = publicoAgendasV1AreaId_(areaId) || PUBLICO_AGENDAS_PORTAL_V1.AREA_PADRAO;
  if (!planilha || typeof planilha.getSheetByName !== 'function') return [];
  var aba = planilha.getSheetByName('CAMPANHAS_PORTAL');
  if (!aba || aba.getLastRow() < 2 || aba.getLastColumn() < 1) return [];
  var valores = aba.getRange(1, 1, aba.getLastRow(), aba.getLastColumn()).getDisplayValues();
  var cabecalhos = valores[0].map(publicoAgendasV1Normalizar_);
  function indice(nomes) { for (var i=0;i<nomes.length;i++){var x=cabecalhos.indexOf(publicoAgendasV1Normalizar_(nomes[i]));if(x>=0)return x;} return -1; }
  var idx={
    id:indice(['ID','CAMPANHA_ID']),area:indice(['AREA_ID','AREA','TERRITORIO']),titulo:indice(['TITULO','NOME']),
    subtitulo:indice(['SUBTITULO','CHAMADA']),mensagem:indice(['MENSAGEM','TEXTO','CONTEUDO']),inicio:indice(['INICIO','DATA_INICIO']),
    validade:indice(['VALIDADE','FIM','DATA_FIM']),horario:indice(['HORARIO','HORARIO_EXIBICAO']),ativo:indice(['ATIVO','PUBLICAR']),
    tema:indice(['COR_TEMA','TEMA']),corNome:indice(['COR_NOME']),chave:indice(['CAMPANHA_CHAVE']),origem:indice(['ORIGEM']),
    ano:indice(['ANO']),mes:indice(['MES'])
  };
  if(idx.mensagem<0||idx.ativo<0)return [];
  var hoje=Utilities.formatDate(new Date(),PUBLICO_AGENDAS_PORTAL_V1.FUSO,'yyyy-MM-dd'),out=[];
  for(var linha=1;linha<valores.length;linha++){
    var r=valores[linha],areaLinha=idx.area>=0?publicoAgendasV1AreaId_(r[idx.area]):'';
    areaLinha=areaLinha||PUBLICO_AGENDAS_PORTAL_V1.AREA_PADRAO;
    if(areaLinha!==areaId||!publicoAgendasV1Booleano_(r[idx.ativo]))continue;
    var inicio=idx.inicio>=0?publicoAgendasV1DataIso_(r[idx.inicio]):'',validade=idx.validade>=0?publicoAgendasV1DataIso_(r[idx.validade]):'';
    if(inicio&&inicio>hoje)continue;if(validade&&validade<hoje)continue;
    var mensagem=String(r[idx.mensagem]||'').trim();if(!mensagem)continue;
