      id:idx.id>=0?String(r[idx.id]||'').trim():'',title:idx.titulo>=0?String(r[idx.titulo]||'').trim():'Campanha da Unidade',
      subtitle:idx.subtitulo>=0?String(r[idx.subtitulo]||'').trim():'',message:mensagem,start:inicio,validity:validade,
      time:idx.horario>=0?String(r[idx.horario]||'').trim():'',active:true,theme:idx.tema>=0?String(r[idx.tema]||'').trim():'',
      colorName:idx.corNome>=0?String(r[idx.corNome]||'').trim():'',campaignKey:idx.chave>=0?String(r[idx.chave]||'').trim():'',
      source:idx.origem>=0?String(r[idx.origem]||'').trim():'',year:idx.ano>=0?String(r[idx.ano]||'').trim():'',month:idx.mes>=0?String(r[idx.mes]||'').trim():''
    });
  }
  return out;
}

'''
          s=s.replace(marker,reader+marker,1); write(p,s)

          # 4. Build da produção inclui o novo módulo.
