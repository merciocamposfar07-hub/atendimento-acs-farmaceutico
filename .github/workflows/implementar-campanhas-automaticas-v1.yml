name: Implementar campanhas automáticas V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implementar-campanhas-automaticas-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: implementar-campanhas-automaticas-v1
  cancel-in-progress: false

jobs:
  implementar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar implementação controlada
        run: python scripts/implementar_campanhas_automaticas_v1.py

      - name: Normalizar teste gerado
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_campanhas_automaticas_v1.js')
          s=p.read_text(encoding='utf-8')
          lines=s.splitlines()
          if not lines:
              raise SystemExit('Teste específico ficou vazio.')
          lines[0]="'use strict';"
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Instalar dependências
        run: npm ci

      - name: Executar regressão completa
        run: npm test

      - name: Validar alterações
        run: git diff --check

      - name: Publicar implementação validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Portal TACS'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            apps-script/ZZZZ_34_CampanhasPeriodoV1.gs \
            apps-script/ZZZZ_20_PublicacoesTerritoriaisV1.gs \
            apps-script/ZZ_12_PublicoAgendasPortalV1.gs \
            scripts/build_apps_script_release.js \
            painel-oficial-recados-campanhas.html \
            campanhas-periodo-v2.js \
            portal-controle-integral.js \
            portal-ajustes-finais.js \
            index.html \
            central-administrativa-tacs.js \
            central-administrativa-tacs.html \
            scripts/test_campanhas_automaticas_v1.js \
            package.json \
            .github/workflows/deploy-apps-script-moradores.yml \
            portal-version.json \
            .github/apps-script-release-request
          git diff --cached --quiet && exit 0
          git commit -m 'Implantar campanhas mensais automáticas com cores oficiais'
          for tentativa in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((tentativa * 2))
          done
          exit 1
