name: Estabilizar Recados no iPhone V4

on:
  push:
    branches:
      - main
    paths:
      - .github/recados-viewport-v4-trigger

permissions:
  contents: write

jobs:
  estabilizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correção isolada
        run: python3 scripts/patch_recados_viewport_safe_v4.py

      - name: Validar estabilização de Recados
        run: node scripts/test_recados_safari_render_v1.js

      - name: Conferir escopo
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' central-back-button-v1.js painel-oficial-recados-campanhas.html scripts/test_recados_safari_render_v1.js | sort)"
          test "$changed" = "$expected"

      - name: Publicar correção
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add central-back-button-v1.js painel-oficial-recados-campanhas.html scripts/test_recados_safari_render_v1.js
          git commit -m "Estabilizar viewport de Recados no iPhone"
          git push origin HEAD:main
