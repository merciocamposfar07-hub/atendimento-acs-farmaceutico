name: Corrigir fluxo odontologia e sincronizar painel v108

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corrigir-fluxo-odontologia-sync-v108.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odontologia-sync-v108
  cancel-in-progress: false

jobs:
  corrigir-testar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Confirmar backend odontológico live sem reservar vaga
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_ID"
          BASE="https://script.google.com/macros/s/$DEPLOYMENT_ID/exec"
          PROBE=$(curl -L --fail --silent --show-error --connect-timeout 5 --max-time 20 "$BASE?action=reservar_get&probe=1")
          printf '%s' "$PROBE" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const j=JSON.parse(s);if(!j.ok||!j.probe||j.versao!=="2.2.0")process.exit(4);console.log("BACKEND_ODONTOLOGIA_V220_OK");})'

      - name: Aplicar correção integrada no runner
        run: python3 scripts/corrigir_fluxo_odontologia_sync_v108.py

      - name: Testar regressões e integração completa
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Validar contrato específico v108
        shell: bash
        run: |
          set -euo pipefail
          grep -q "var shouldDisable = !formReady();" portal-odontologia-segunda-sexta.js
          grep -q "saveSlotsCache();" portal-odontologia-segunda-sexta.js
          grep -q "queueDurableReservation(item);" portal-odontologia-segunda-sexta.js
          grep -q "function sincronizarVagasOdontologia()" painel-oficial-agendas-vagas.html
          grep -q "setInterval(sincronizarVagasOdontologia,5000)" painel-oficial-agendas-vagas.html
          grep -q "dental-sync-admin-v108" index.html
          node scripts/test_dental_confirmation_gate_v103.js

      - name: Publicar somente se tudo passar
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Nenhuma mudança necessária.'
            exit 0
          fi
          git config user.name 'merciocamposfar07-hub'
          git config user.email 'merciocamposfar07@icloud.com'
          git add portal-odontologia-segunda-sexta.js painel-oficial-agendas-vagas.html index.html scripts/test_dental_confirmation_gate_v103.js scripts/test_dom_flows.js portal-version.json
          git commit -m 'Restaura WhatsApp e sincroniza vagas odontológicas v108'
          git pull --rebase origin main
          git push origin HEAD:main
