name: Integrar somente anexos PDF da UBS V1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/csc-integracao-anexos-ubs-v1.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apps-script-producao
  cancel-in-progress: false
jobs:
  anexos-ubs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preparar credenciais e copiar versão atual
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          mkdir -p "$RUNNER_TEMP/csc-pin-live"
          node - <<'JS'
          const fs=require('fs');const c=JSON.parse(process.env.CLASP_JSON);c.rootDir='.';fs.writeFileSync(process.env.RUNNER_TEMP+'/csc-pin-live/.clasp.json',JSON.stringify(c));
          JS
          cd "$RUNNER_TEMP/csc-pin-live"
          npx --yes @google/clasp@3.3.0 pull
      - name: Adicionar somente o módulo de anexos da UBS
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          const text=fs.readFileSync('apps-script/ZZZZ_54_AnexosSolicitacoesUbsV1.gs','utf8');
          const path=require('path');
          function walk(p){return fs.readdirSync(p,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(p,e.name)):[path.join(p,e.name)]);}
          const candidates=walk(process.env.RUNNER_TEMP+'/csc-pin-live').filter(p=>/\.(js|gs)$/.test(p)&&fs.readFileSync(p,'utf8').includes('function solicitacoesUbsV1CriarPublica_('));
          if(candidates.length!==1)throw Error('Módulo de solicitações não localizado de forma única.');
          let live=fs.readFileSync(candidates[0],'utf8');
          if(live.includes('function solicitacoesUbsV1CriarPublica_(p){'))live=live.replace('function solicitacoesUbsV1CriarPublica_(p){','function solicitacoesUbsV1CriarPublica_(p,aposRegistro){');
          if(!live.includes("if(typeof aposRegistro==='function')aposRegistro();")){
            const anchor='  var push=solicitacoesUbsV1EnviarPush_(contexto,row[0]);';
            if(!live.includes(anchor))throw Error('Ponto de confirmação não localizado.');
            live=live.replace(anchor,"  if(typeof aposRegistro==='function')aposRegistro();\n"+anchor);
          }
          const oldData="data:{tipo:'SOLICITACAO_UBS',areaId:contexto.areaId,solicitacaoId:solicitacaoId}";
          const newData="data:{tipo:'SOLICITACAO_UBS',areaId:contexto.areaId,solicitacaoId:solicitacaoId,naoVistas:solicitacoesUbsV1Rows_(solicitacoesUbsV1Sheet_()).filter(function(row){return String(row[1])===String(contexto.areaId)&&String(row[17])==='NOVA'&&!row[23]}).length}";
          if(live.includes(oldData))live=live.replace(oldData,newData);
          if(!live.includes(newData)||!live.includes('function solicitacoesUbsV1CriarPublica_(p,aposRegistro){'))throw Error('Hooks esperados não confirmados.');
          new vm.Script(live);fs.writeFileSync(candidates[0],live);
          new vm.Script(text);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/csc-pin-live/ZZZZ_54_AnexosSolicitacoesUbsV1.js',text);
          console.log('Somente o novo módulo de anexos da UBS adicionado ao projeto atual.');
          JS
      - name: Publicar na mesma implantação
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_ID"
          cd "$RUNNER_TEMP/csc-pin-live"
          npx --yes @google/clasp@3.3.0 push --force
          OUTPUT=$(npx --yes @google/clasp@3.3.0 version "CSC anexos UBS V1 ${GITHUB_SHA::7}")
          VERSION=$(printf '%s' "$OUTPUT" | grep -Eo '[0-9]+' | tail -n 1)
          test -n "$VERSION"
          npx --yes @google/clasp@3.3.0 redeploy --versionNumber "$VERSION" --description 'Anexos PDF privados da UBS V1' "$DEPLOYMENT_ID"
      - name: Limpar credenciais
        if: always()
        shell: bash
        run: rm -f "$HOME/.clasprc.json" "$RUNNER_TEMP/csc-pin-live/.clasp.json"

# CSC_UBS_CONFIRMACAO_V4: recibo antes do Push e PDF privado com autorização de uso único.
