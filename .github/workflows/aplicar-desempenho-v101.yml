name: Aplicar desempenho v101

on:
  push:
    branches: [desempenho-v101]
    paths:
      - 'scripts/apply_performance_v101.js'
      - 'scripts/apply_performance_v101_versions.js'
      - '.github/workflows/aplicar-desempenho-v101.yml'

permissions:
  contents: write

concurrency:
  group: desempenho-v101-aplicar
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar branch isolada
        uses: actions/checkout@v4
        with:
          ref: desempenho-v101
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aplicar somente mudanças de desempenho
        run: |
          set -euo pipefail
          node scripts/apply_performance_v101.js
          node scripts/apply_performance_v101_versions.js

      - name: Validar sintaxe dos arquivos alterados
        run: |
          set -euo pipefail
          node --check admin-warmup.js
          node --check portal-auto-update.js
          node --check portal-odontologia-segunda-sexta.js
          node --check --input-type=commonjs < apps-script/ZZZZ_21_PerformanceCacheV101.gs
          node --check scripts/build_apps_script_release.js

      - name: Confirmar escopo antes do commit
        run: |
          set -euo pipefail
          git diff --name-only
          test -z "$(git diff --name-only | grep -Ev '^(admin-warmup.js|portal-auto-update.js|portal-odontologia-segunda-sexta.js|painel-oficial-agendas-vagas.html|painel-oficial-profissionais-servicos.html|painel-oficial-recados-campanhas.html|index.html|scripts/build_apps_script_release.js|scripts/apply_performance_v101.js|scripts/apply_performance_v101_versions.js|.github/workflows/aplicar-desempenho-v101.yml)$' || true)"

      - name: Gravar resultado na branch isolada
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Aplicar desempenho v101 automaticamente'
          git push origin HEAD:desempenho-v101
