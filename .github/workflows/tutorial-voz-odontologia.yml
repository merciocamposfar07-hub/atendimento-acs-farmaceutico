name: Exportar arquivos do tutorial CSC
on:
  push:
    branches:
      - material-educativo-voz-csc
    paths:
      - .github/workflows/tutorial-voz-odontologia.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: material-educativo-voz-csc
      - name: Conferir arquivos
        run: |
          ls -lah materiais/odontologia/
          file materiais/odontologia/PORTAL_CSC_DENTISTA_VOZ_FEMININA.mp4
          file materiais/odontologia/PORTAL_CSC_DENTISTA_VOZ_FEMININA.mp3
      - name: Publicar anexos para download
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-csc-dentista-mp4-mp3
          path: |
            materiais/odontologia/PORTAL_CSC_DENTISTA_VOZ_FEMININA.mp4
            materiais/odontologia/PORTAL_CSC_DENTISTA_VOZ_FEMININA.mp3
          if-no-files-found: error
