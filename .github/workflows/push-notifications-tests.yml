name: Portal TACS - Push Notifications Tests

on:
  push:
    branches:
      - stabilization/push-notifications-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test push subsystem
        run: node scripts/test_push_notifications_v1.js
