name: Verificar identificação pública de área em produção

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-area-live.yml'

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar áreas públicas e transporte sem documento real
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://script.google.com/macros/s/AKfycbwOyG9yZqYly736ZsGta1q6Jd4Irkc-iRWURfypKcpBkyCCmO3hMNE4oOsXECTMCpSxYw/exec'
          AREAS=$(curl -L --fail --silent --show-error --connect-timeout 5 --max-time 20 "$BASE?action=publico_areas_ativas")
          printf '%s' "$AREAS" | node -e '
            let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{
              const j=JSON.parse(s); if(j.ok!==true)throw new Error("areas_not_ok");
              if(!Array.isArray(j.areas)||!j.areas.some(a=>a.areaId==="JAPARANDUBA"))throw new Error("japa_missing");
              for(const a of j.areas){const keys=Object.keys(a).sort().join(",");if(keys!=="areaId,areaNome")throw new Error("unsafe_keys:"+keys);}
              console.log("Áreas públicas: OK; Japaranduba presente; somente identificador e nome expostos.");
            });'

          RID="healthAreaLookup$(date +%s)"
          curl -L --fail --silent --show-error --connect-timeout 5 --max-time 20 \
            -X POST \
            --data-urlencode 'action=publico_identificar_area' \
            --data-urlencode "requestId=$RID" \
            --data-urlencode 'documento=000' \
            --data-urlencode 'dispositivo=health-check-public-area' \
            "$BASE" >/dev/null
          sleep 2
          RESULT=$(curl -L --fail --silent --show-error --connect-timeout 5 --max-time 20 "$BASE?action=publico_area_result&requestId=$RID")
          printf '%s' "$RESULT" | node -e '
            let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{
              const j=JSON.parse(s);if(j.ok!==true||j.pendente!==false||!j.result)throw new Error("public_result_missing");
              if(j.result.ok!==false)throw new Error("invalid_document_should_be_rejected");
              const raw=JSON.stringify(j);if(/CPF|CNS|nomeCompleto|telefone|planilhaId/i.test(raw))throw new Error("private_field_leak");
              console.log("POST público e leitura do resultado: OK; documento inválido rejeitado sem dados pessoais.");
            });'
