name: Confirmacao individual de reparo push V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/confirmacao-reparo-push-v1.yml'

permissions:
  contents: write

concurrency:
  group: confirmacao-reparo-push-v1
  cancel-in-progress: false

jobs:
  testar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Aplicar alteracao controlada
        run: python3 scripts/run_apply_confirmacao_reparo_push_v1.py

      - name: Validar sintaxe e bateria completa
        shell: bash
        run: |
          set -euo pipefail
          node --check agenda-enfermeira.js
          node --check scripts/test_notification_repair_button.js
          node --check scripts/test_notification_repair_confirmation.js
          node --check --input-type=commonjs < apps-script/ZZZZ_19_NotificacoesSegmentadasV1.gs
          npm ci
          npm test

      - name: Validar escopo
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain | sed -E 's/^.. //' | sort > /tmp/changed.txt
          printf '%s\n' \
            'agenda-enfermeira.js' \
            'apps-script/ZZZZ_19_NotificacoesSegmentadasV1.gs' \
            'index.html' \
            'package.json' \
            'scripts/test_notification_repair_button.js' \
            'scripts/test_notification_repair_confirmation.js' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Publicar alteracao testada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agenda-enfermeira.js apps-script/ZZZZ_19_NotificacoesSegmentadasV1.gs index.html package.json scripts/test_notification_repair_button.js scripts/test_notification_repair_confirmation.js
          git commit -m 'Confirma reparo de notificacoes no proprio aparelho'
          git push origin HEAD:main
