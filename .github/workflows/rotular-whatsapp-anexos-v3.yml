name: Rotular WhatsApp anexos V3

on:
  push:
    paths:
      - 'scripts/rotular-whatsapp-anexos-v3.py'
      - '.github/workflows/rotular-whatsapp-anexos-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/rotular-whatsapp-anexos-v3.py
      - name: Validar
        run: |
          grep -q 'Enviar pelo WhatsApp com arquivo' portal-servicos-coloridos-anexos-v1.js
          grep -q 'servicos-anexos-v3' index.html
          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf '%s\n' index.html portal-servicos-coloridos-anexos-v1.js | sort)"
          test "$CHANGED" = "$EXPECTED"
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html portal-servicos-coloridos-anexos-v1.js
          git commit -m 'Libera envio WhatsApp apos selecionar anexo'
          git pull --rebase origin main
          git push origin main
