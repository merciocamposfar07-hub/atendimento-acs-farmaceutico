name: Recolher abas do painel multi-município v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recolher-abas-multimunicipio-v1.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar alteração restrita
        run: python3 scripts/recolher_abas_multimunicipio_v1.py
      - name: Validar sintaxe e escopo
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('painel-oficial-organizacoes-municipios.html','utf8');
          const script=(s.match(/<script>([\s\S]*?)<\/script>/)||[])[1];
          if(!script) throw new Error('Script principal não localizado');
          new Function(script);
          if(!s.includes('ABAS_RECOLHIDAS_MULTIMUNICIPIO_V1')) throw new Error('Marker ausente');
          if(!s.includes('id="viewOrg" hidden')) throw new Error('Organizações ainda abre por padrão');
          if(s.includes('class="tab active" data-tab="org"')) throw new Error('Aba ativa por padrão ainda existe');
          if(!s.includes('white-space:nowrap')) throw new Error('Proteção de uma linha ausente');
          NODE
          changed=$(git diff --name-only)
          test "$changed" = 'painel-oficial-organizacoes-municipios.html'
      - name: Publicar alteração validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add painel-oficial-organizacoes-municipios.html
          git commit -m 'Recolhe conteúdo das abas de municípios e organizações'
          git pull --rebase origin main
          git push origin main
