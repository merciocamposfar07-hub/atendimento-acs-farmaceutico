name: Publicar modo administrador estável v80

on:
  push:
    paths:
      - '.github/workflows/publicar-modo-admin-estavel-v80.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar link administrativo no portal
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'portal-unificado\.js\?v=[^"\']+', 'portal-unificado.js?v=20260731-80', text)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Validar
        run: grep -q 'portal-unificado.js?v=20260731-80' index.html
      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Usar modo administrador estável no Portal Geral'
          git push
