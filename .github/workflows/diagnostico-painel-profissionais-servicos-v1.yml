name: Diagnostico Painel Profissionais e Servicos V1

on:
  push:
    paths:
      - '.github/workflows/diagnostico-painel-profissionais-servicos-v1.yml'
      - 'teste-v1/painel-profissionais-servicos-v1.html'

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aguardar e validar GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://merciocamposfar07-hub.github.io/atendimento-acs-farmaceutico/teste-v1/painel-profissionais-servicos-v1.html?v=a6621b10'
          API='https://script.google.com/macros/s/AKfycbwOyG9yZqYly736ZsGta1q6Jd4Irkc-iRWURfypKcpBkyCCmO3hMNE4oOsXECTMCpSxYw/exec'
          ok=0
          for tentativa in $(seq 1 18); do
            codigo=$(curl -L --silent --show-error --max-time 30 -o /tmp/painel.html -w '%{http_code}' "$PAGE" || true)
            if [ "$codigo" = '200' ] && grep -q 'Painel administrativo V1' /tmp/painel.html; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" != '1' ]; then
            echo 'GitHub Pages não publicou a página dentro do tempo de diagnóstico.' >&2
            exit 1
          fi
          grep -q "$API" /tmp/painel.html
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/painel.html').read_text(encoding='utf-8')
          blocos = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not blocos:
              raise SystemExit('JavaScript não encontrado')
          Path('/tmp/painel.js').write_text('\n'.join(blocos), encoding='utf-8')
          PY
          node --check /tmp/painel.js
          STATUS=$(curl -L --fail --silent --show-error --max-time 30 "$API?action=admin_status&_=$(date +%s)")
          printf '%s' "$STATUS" | grep -q '"ok":true'
          {
            echo "executado_em_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "pagina_http=200"
            echo "pagina_titulo=Painel administrativo V1"
            echo "javascript_sintaxe=ok"
            echo "api_configurada=$API"
            echo "admin_status=$STATUS"
          } > diagnostico-painel-profissionais-servicos-v1.txt

      - name: Gravar resultado
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostico-painel-profissionais-servicos-v1.txt
          git commit -m 'Registra diagnóstico do painel de profissionais e serviços' || exit 0
          git push
