name: Laboratório — diagnosticar acesso web app

on:
  push:
    branches: [laboratorio-ia-autorreparo]
    paths:
      - '.github/workflows/laboratorio-diagnostico-webapp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    if: github.ref == 'refs/heads/laboratorio-ia-autorreparo'
    runs-on: ubuntu-latest
    steps:
      - name: Identificar somente a conta Google do clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          CLASPRC_JSON="$CLASPRC_JSON" node - <<'NODE'
          const cfg=JSON.parse(process.env.CLASPRC_JSON);
          const candidates=[];
          function walk(x){
            if(!x||typeof x!=='object')return;
            for(const [k,v] of Object.entries(x)){
              if(k==='id_token'&&typeof v==='string') candidates.push(v);
              else walk(v);
            }
          }
          walk(cfg);
          let email='';
          for(const tok of candidates){
            try{
              const parts=tok.split('.');
              if(parts.length<2)continue;
              const payload=JSON.parse(Buffer.from(parts[1].replace(/-/g,'+').replace(/_/g,'/'),'base64').toString('utf8'));
              if(payload.email){email=String(payload.email);break}
            }catch(e){}
          }
          console.log('clasp_email_id_token='+(email||'NAO_DISPONIVEL_NO_ID_TOKEN'));
          NODE
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          AUTH_INFO=$(npx --yes @google/clasp@3.3.0 show-authorized-user --json)
          AUTH_INFO="$AUTH_INFO" node - <<'NODE'
          const x=JSON.parse(process.env.AUTH_INFO||'{}');
          console.log('clasp_email_confirmado='+(x.email||'NAO_IDENTIFICADO'));
          NODE
          rm -f "$HOME/.clasprc.json"

      - name: Inspecionar resposta pública sem autenticação
        shell: bash
        env:
          LAB_URL: 'https://script.google.com/macros/s/AKfycbyvkv9N9IGuxHUfZaw8bAkZEJEo-BCTSLrgilsG72uM8EkeGB1ExS874oVfDUADnrDhsA/exec?action=status'
        run: |
          set -euo pipefail
          BASE="${LAB_URL%%\?*}"
          for QUERY in \
            'action=status' \
            'action=agenda&areaId=JAPARANDUBA' \
            'action=agenda&areaId=SITIO_MATIAS'
          do
            echo "--- $QUERY ---"
            curl -L --silent --show-error --connect-timeout 8 --max-time 30 \
              -D /tmp/headers.txt -o /tmp/body.txt \
              -w 'http=%{http_code}\nfinal_url=%{url_effective}\n' \
              "$BASE?$QUERY"
            BODY=$(cat /tmp/body.txt)
            printf '%s\n' "$BODY" | head -c 4500
            echo
            printf '%s' "$BODY" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
          done

# teste apos atualizacao manual v1
