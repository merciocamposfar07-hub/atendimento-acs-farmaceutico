name: Diagnosticar publicações e push multiárea

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnostico-publicacoes-multiarea.yml'

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Procurar integração OneSignal no portal versionado
        shell: bash
        run: |
          set -euo pipefail
          echo '=== REFERÊNCIAS ONESIGNAL/TAG NO PORTAL ==='
          grep -RInE 'OneSignal|addTag|addTags|area_tacs|Notifications\.requestPermission|User\.addTag' \
            --exclude-dir=.git --exclude-dir=node_modules \
            --exclude='ZZZZ_19_NotificacoesSegmentadasV1.gs' . \
            | sed -E 's#^\./##' | head -n 120 || true

      - name: Baixar Apps Script real sem exibir credenciais
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON"
          LIVE_DIR="$RUNNER_TEMP/apps-script-live-diagnostico"
          mkdir -p "$LIVE_DIR"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          CLASP_JSON="$CLASP_JSON" LIVE_DIR="$LIVE_DIR" node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const config=JSON.parse(process.env.CLASP_JSON);
          if(!config.scriptId)throw new Error('scriptId ausente');
          config.rootDir='.';
          fs.writeFileSync(path.join(process.env.LIVE_DIR,'.clasp.json'),JSON.stringify(config,null,2)+'\n');
          NODE
          cd "$LIVE_DIR"
          npx --yes @google/clasp@3.3.0 pull >/dev/null

      - name: Resumir somente estrutura do módulo de conteúdo
        shell: bash
        run: |
          set -euo pipefail
          LIVE_DIR="$RUNNER_TEMP/apps-script-live-diagnostico"
          TARGET=$(find "$LIVE_DIR" -maxdepth 1 -type f \( -iname '*AdminConteudoPortalV1*.js' -o -iname '*AdminConteudoPortalV1*.gs' \) | head -n 1)
          test -n "$TARGET"
          TARGET="$TARGET" node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync(process.env.TARGET,'utf8');
          console.log('=== MODULO CONTEUDO REAL ===');
          console.log('arquivo='+require('path').basename(process.env.TARGET));
          const checks={
            areaId:/areaId|AREA_ID/.test(src),
            territorio:/tacsTerritorioV1ValidarAcesso_|moradoresAdminV1ResolverContexto_/.test(src),
            tokenTerritorial:/territorioToken/.test(src),
            adminLogin:/admin_login/.test(src),
            adminDados:/admin_dados/.test(src),
            salvarRecado:/admin_salvar_recado/.test(src),
            salvarCampanha:/admin_salvar_campanha/.test(src),
            removerRecado:/admin_remover_recado/.test(src),
            removerCampanha:/admin_remover_campanha/.test(src)
          };
          Object.entries(checks).forEach(([k,v])=>console.log(k+'='+v));
          const funcs=[...src.matchAll(/function\s+([A-Za-z0-9_]+)\s*\(/g)].map(m=>m[1]);
          console.log('funcoes_relevantes='+funcs.filter(x=>/conteudo|recado|campanha|admin|sess|acesso|area/i.test(x)).slice(0,80).join(','));
          console.log('=== LINHAS ESTRUTURAIS SEGURAS ===');
          src.split(/\r?\n/).forEach((line,i)=>{
            if(/admin_(dados|salvar_recado|salvar_campanha|remover_recado|remover_campanha)|areaId|AREA_ID|validarSessao|ValidarAcesso|ResolverContexto|HEADERS|CABECALH/i.test(line)){
              let safe=line.replace(/(['"])(?:[A-Za-z0-9_\-]{35,})\1/g,'$1[oculto]$1');
              if(!/getProperty\([^)]*(KEY|SECRET|TOKEN)|api[_ -]?key/i.test(safe))console.log(String(i+1).padStart(4,'0')+': '+safe.slice(0,360));
            }
          });
          NODE

      - name: Limpar credenciais temporárias
        if: always()
        run: rm -rf "$HOME/.clasprc.json" "$RUNNER_TEMP/apps-script-live-diagnostico"
