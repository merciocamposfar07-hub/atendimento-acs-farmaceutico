name: Diagnosticar publicações e push multiárea

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnostico-publicacoes-multiarea.yml'

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Baixar Apps Script real sem exibir credenciais
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON"
          LIVE_DIR="$RUNNER_TEMP/apps-script-live-diagnostico"
          mkdir -p "$LIVE_DIR"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          CLASP_JSON="$CLASP_JSON" LIVE_DIR="$LIVE_DIR" node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const config=JSON.parse(process.env.CLASP_JSON); if(!config.scriptId)throw new Error('scriptId ausente');
          config.rootDir='.'; fs.writeFileSync(path.join(process.env.LIVE_DIR,'.clasp.json'),JSON.stringify(config,null,2)+'\n');
          NODE
          cd "$LIVE_DIR"
          npx --yes @google/clasp@3.3.0 pull >/dev/null

      - name: Localizar rotina-base de recados e campanhas
        shell: bash
        run: |
          set -euo pipefail
          LIVE_DIR="$RUNNER_TEMP/apps-script-live-diagnostico"
          LIVE_DIR="$LIVE_DIR" node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const dir=process.env.LIVE_DIR;
          const files=fs.readdirSync(dir).filter(f=>/\.(js|gs)$/i.test(f));
          const matches=[];
          for(const file of files){
            const src=fs.readFileSync(path.join(dir,file),'utf8');
            if(/function\s+adminTacsV1Post\s*\(/.test(src)||/admin_salvar_recado|admin_salvar_campanha|admin_dados/.test(src))matches.push({file,src});
          }
          console.log('=== ROTINAS-BASE ENCONTRADAS ===');
          for(const {file,src} of matches){
            console.log('arquivo='+file);
            const checks={
              definePost:/function\s+adminTacsV1Post\s*\(/.test(src),
              areaId:/areaId|AREA_ID/.test(src),
              territorio:/tacsTerritorioV1ValidarAcesso_|moradoresAdminV1ResolverContexto_/.test(src),
              territorioToken:/territorioToken/.test(src),
              salvarRecado:/admin_salvar_recado/.test(src),
              salvarCampanha:/admin_salvar_campanha/.test(src),
              adminDados:/admin_dados/.test(src)
            };
            Object.entries(checks).forEach(([k,v])=>console.log(k+'='+v));
            console.log('--- linhas estruturais ---');
            src.split(/\r?\n/).forEach((line,i)=>{
              if(/function\s+adminTacsV1Post|admin_(dados|salvar_recado|salvar_campanha)|RECADO|CAMPANHA|areaId|AREA_ID|validarSessao|ValidarAcesso|ResolverContexto|cabecalh|headers/i.test(line)){
                let safe=line.replace(/(['"])(?:[A-Za-z0-9_\-]{35,})\1/g,'$1[oculto]$1');
                if(!/getProperty\([^)]*(KEY|SECRET|TOKEN)|api[_ -]?key/i.test(safe))console.log(String(i+1).padStart(4,'0')+': '+safe.slice(0,420));
              }
            });
          }
          if(!matches.length)throw new Error('Rotina-base não localizada');
          NODE

      - name: Limpar credenciais temporárias
        if: always()
        run: rm -rf "$HOME/.clasprc.json" "$RUNNER_TEMP/apps-script-live-diagnostico"
