name: Diagnóstico Recados direto V5

on:
  push:
    paths:
      - 'scripts/diagnose_live_recados_direct_v5.js'
      - '.github/workflows/diagnose-recados-direct-v5.yml'

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/diagnose_live_recados_direct_v5.js
