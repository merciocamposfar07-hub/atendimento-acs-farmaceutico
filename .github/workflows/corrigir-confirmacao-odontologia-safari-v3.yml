name: Corrigir confirmação odontológica Safari v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corrigir-confirmacao-odontologia-safari-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Aplicar estabilização da confirmação odontológica
        run: python scripts/corrigir_confirmacao_odontologia_safari_v3.py

      - name: Instalar dependências
        run: npm ci

      - name: Testar integração completa
        run: npm test

      - name: Publicar correção e solicitar implantação do Apps Script
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Correção já aplicada.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/ZZZZ_36_CorrecaoDataOdontologiaV1.gs portal-odontologia-segunda-sexta.js portal-ajustes-finais.js index.html scripts/test_dental_confirmation_gate_v103.js portal-version.json .github/apps-script-release-request
          git commit -m 'Estabiliza confirmação da reserva odontológica no Safari'
          git push origin HEAD:main
