name: Finalizar saneamento histórico TACS V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-saneamento-historico-tests-v1.yml'

permissions:
  contents: write

jobs:
  finalizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Ajustar testes, cache e validar tudo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          test = Path('scripts/test_admin_transport.js')
          s = test.read_text()
          old = "  assert.match(official, /v=202608/);"
          new = "  assert.match(official, /\\?v=(?:202608[A-Za-z0-9._-]*|[0-9a-f]{12})/);"
          if old not in s:
              raise SystemExit('assert antigo de cache-bust não localizado')
          test.write_text(s.replace(old, new, 1))
          Path('/tmp/test_admin_transport.intended.js').write_text(test.read_text())

          health = Path('scripts/test_notification_health_registry.js')
          h = health.read_text()
          old_health = 'assert(front.includes("if(validDocument(doc))payload.documento=doc"));'
          new_health = '''assert(front.includes("TEST_DEVICE_KEY='portalTacsDispositivoV1'"));\nassert(front.includes("payload.dispositivo=testDevice"));\nassert(front.includes("payload.chaveTacsTeste=testToken"));\nassert(front.includes("if(!testMode&&validDocument(doc))payload.documento=doc"));'''
          if old_health not in h:
              raise SystemExit('assert antigo do check-in do morador não localizado')
          health.write_text(h.replace(old_health, new_health, 1))

          aparelho = Path('scripts/test_aparelho_tacs_teste_v1.js')
          a = aparelho.read_text()
          old_loader = r'admin-aparelho-tacs-teste-v1\.js\?v=20260821-tacs-device-v7'
          new_loader = r'admin-aparelho-tacs-teste-v1\.js\?v=20260826-saneamento-historico-v1'
          if a.count(old_loader) != 2:
              raise SystemExit('referências antigas do loader TACS não foram localizadas exatamente duas vezes')
          aparelho.write_text(a.replace(old_loader, new_loader))

          runtime = Path('recados-campanhas-whatsapp-mensal-v12.js')
          r = runtime.read_text()
          old_runtime = "admin-aparelho-tacs-teste-v1.js?v=20260821-tacs-device-v7"
          new_runtime = "admin-aparelho-tacs-teste-v1.js?v=20260826-saneamento-historico-v1"
          if old_runtime not in r:
              raise SystemExit('cache-bust antigo do aparelho TACS não localizado')
          runtime.write_text(r.replace(old_runtime, new_runtime, 1))
          PY

          npm ci
          npm test

          # O pretest adapta alguns testes apenas no workspace de CI. Restaura a versão
          # intencional do teste antes de registrar o commit definitivo.
          cp /tmp/test_admin_transport.intended.js scripts/test_admin_transport.js

          printf '%s\n' 'SANEAMENTO_HISTORICO_APARELHO_TACS_V1_20260826_DEPLOY2' > .github/apps-script-release-request

          rm -f .github/debug-saneamento-test-log.txt
          git rm -f .github/workflows/debug-saneamento-historico-tests-v1.yml

          git config user.name 'Portal TACS Release'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/test_admin_transport.js scripts/test_notification_health_registry.js scripts/test_aparelho_tacs_teste_v1.js recados-campanhas-whatsapp-mensal-v12.js .github/apps-script-release-request
          git add -u .github/debug-saneamento-test-log.txt .github/workflows/debug-saneamento-historico-tests-v1.yml || true
          git commit -m 'Finalizar saneamento histórico do aparelho TACS'
          git pull --rebase origin main
          git push origin HEAD:main
# finalizacao 20260826-v9
