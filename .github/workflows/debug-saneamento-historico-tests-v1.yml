name: Debug saneamento histórico tests V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-saneamento-historico-tests-v1.yml'

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Executar teste DOM com pilha detalhada
        shell: bash
        run: |
          set +e
          npm ci > /tmp/tacs-test.log 2>&1
          ci_code=$?
          if [ "$ci_code" -eq 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_dom_flows.js')
          s=p.read_text()
          old="this.errors.push(error.message);"
          new="this.errors.push((error && error.stack) ? error.stack : error.message);"
          if old not in s:
              raise SystemExit('gancho jsdomError não localizado')
          p.write_text(s.replace(old,new,1))
          PY
            node scripts/test_dom_flows.js >> /tmp/tacs-test.log 2>&1
            code=$?
          else
            code=$ci_code
          fi
          set -e
          {
            echo "exit_code=$code"
            echo "head_sha=$GITHUB_SHA"
            echo "--- diagnostico DOM detalhado ---"
            tail -n 260 /tmp/tacs-test.log
          } > .github/debug-saneamento-test-log.txt
          git checkout -- scripts/test_dom_flows.js
          git config user.name 'Portal TACS Tests'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/debug-saneamento-test-log.txt
          git commit -m 'Registrar diagnóstico detalhado do DOM' || exit 0
          git push
