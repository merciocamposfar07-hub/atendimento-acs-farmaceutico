name: Estabilizar isolamento territorial V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stabilize-territory-v1.yml'

permissions:
  contents: write

env:
  CI: true

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar correções territoriais
        run: node scripts/stabilize_territory_v1.js

      - name: Rodar testes completos
        run: npm test

      - name: Remover rotina temporária e publicar estabilização
        run: |
          rm -f scripts/stabilize_territory_v1.js .github/workflows/stabilize-territory-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git commit -m "Estabilizar acesso TACS e isolamento territorial de moradores"
          git push origin HEAD:main
