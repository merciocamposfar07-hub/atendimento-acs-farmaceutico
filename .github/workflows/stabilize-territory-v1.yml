name: Estabilizar isolamento territorial V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stabilize-territory-v1.yml'

permissions:
  contents: write

env:
  CI: true

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar correções territoriais
        run: |
          node scripts/stabilize_territory_v1.js
          node scripts/fix_stabilization_test_v1.js

      - name: Rodar testes completos
        run: |
          set +e
          node -e "const p=require('./package.json'); for(const c of p.scripts.test.split(' && ')) console.log(c.replace(/^node /,''));" > tests-list.txt
          while IFS= read -r testfile; do
            echo "Executando $testfile"
            node "$testfile" > test-output.txt 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "FALHOU: $testfile"
              tail -n 18 test-output.txt
              msg=$(printf 'Teste que falhou: %s' "$testfile" | sed 's/%/%25/g')
              echo "::error title=Falha em teste territorial::$msg"
              exit "$code"
            fi
          done < tests-list.txt

      - name: Remover rotina temporária e publicar estabilização
        run: |
          rm -f scripts/stabilize_territory_v1.js scripts/fix_stabilization_test_v1.js .github/workflows/stabilize-territory-v1.yml test-output.txt tests-list.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git commit -m "Estabilizar acesso TACS e isolamento territorial de moradores"
          git push origin HEAD:main
