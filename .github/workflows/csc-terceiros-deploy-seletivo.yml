name: CSC — implantação seletiva do módulo de terceiros

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/csc-terceiros-release-request'

permissions:
  contents: read

concurrency:
  group: apps-script-producao
  cancel-in-progress: false

jobs:
  implantar-terceiros:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testar apenas o novo módulo
        shell: bash
        run: |
          set -euo pipefail
          node --check csc-solicitacao-terceiros-v1.js
          node --check --input-type=commonjs < apps-script/ZZZZ_56_SolicitacaoTerceirosMoradorV1.gs
          node scripts/test_csc_terceiros_v1.js
      - name: Exigir credenciais e obter projeto Apps Script atual
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON"
          test -n "$DEPLOYMENT_ID"
          test "$DEPLOYMENT_ID" = 'AKfycbwOyG9yZqYly736ZsGta1q6Jd4Irkc-iRWURfypKcpBkyCCmO3hMNE4oOsXECTMCpSxYw'
          mkdir -p "$RUNNER_TEMP/csc-terceiros-live"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          CLASP_JSON="$CLASP_JSON" LIVE_DIR="$RUNNER_TEMP/csc-terceiros-live" node - <<'NODE'
          const fs=require('fs'),path=require('path'),config=JSON.parse(process.env.CLASP_JSON);
          if(!config.scriptId || !/^[A-Za-z0-9_-]{20,200}$/.test(config.scriptId))throw Error('scriptId ausente');
          config.rootDir='.';
          fs.writeFileSync(path.join(process.env.LIVE_DIR,'.clasp.json'),JSON.stringify(config,null,2)+'\n');
          NODE
          cd "$RUNNER_TEMP/csc-terceiros-live"
          npx --yes @google/clasp@3.3.0 pull
          test -f appsscript.json
          # Update only this named module. Existing production v1 is allowed,
          # but refuse unexpected content to avoid overwriting an unrelated script.
          for file in ZZZZ_56_SolicitacaoTerceirosMoradorV1.gs ZZZZ_56_SolicitacaoTerceirosMoradorV1.js; do
            if [ -f "$file" ]; then
              grep -Fq 'TACS_CSC_TERCEIROS_V1' "$file"
              grep -Fq 'csc_terceiros_buscar' "$file"
              grep -Fq 'csc_terceiros_enviar' "$file"
            fi
          done
      - name: Acrescentar exclusivamente a nova rota, criar versão e implantar com rollback
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/csc-terceiros-live"
          DEPLOYMENTS=$(npx --yes @google/clasp@3.3.0 deployments)
          PREVIOUS_VERSION=$(printf '%s\n' "$DEPLOYMENTS" | awk -v id="$DEPLOYMENT_ID" 'index($0,id) {for(i=1;i<=NF;i++) if($i ~ /^@[0-9]+$/) {gsub(/^@/,"",$i); print $i; exit}}')
          test -n "$PREVIOUS_VERSION"
          echo "Backup lógico: versão anterior $PREVIOUS_VERSION"
          cp "$GITHUB_WORKSPACE/apps-script/ZZZZ_56_SolicitacaoTerceirosMoradorV1.gs" ZZZZ_56_SolicitacaoTerceirosMoradorV1.js
          node --check ZZZZ_56_SolicitacaoTerceirosMoradorV1.js
          npx --yes @google/clasp@3.3.0 push --force
          VERSION_OUTPUT=$(npx --yes @google/clasp@3.3.0 version "CSC terceiros - commit ${GITHUB_SHA::7}")
          VERSION=$(printf '%s\n' "$VERSION_OUTPUT" | grep -Eo '[0-9]+' | tail -n 1)
          test -n "$VERSION"
          DEPLOYED=0
          rollback() {
            code=$?
            trap - ERR
            if [ "$DEPLOYED" = 1 ]; then
              npx --yes @google/clasp@3.3.0 redeploy --versionNumber "$PREVIOUS_VERSION" --description 'Rollback seletivo de terceiros' "$DEPLOYMENT_ID" || true
            fi
            exit "$code"
          }
          trap rollback ERR
          npx --yes @google/clasp@3.3.0 redeploy --versionNumber "$VERSION" --description 'CSC terceiros - rota aditiva' "$DEPLOYMENT_ID"
          DEPLOYED=1
          BASE="https://script.google.com/macros/s/$DEPLOYMENT_ID/exec"
          OK=0
          for i in 1 2 3; do
            RESULT=$(curl -L --fail --silent --show-error --connect-timeout 5 --max-time 30 "$BASE?action=csc_terceiros_result&requestId=cscHealthCheck01234567890123456789") || true
            LEGACY=$(curl -L --fail --silent --show-error --connect-timeout 5 --max-time 30 "$BASE?action=portal_manutencao_status&areaId=JAPARANDUBA") || true
            if printf '%s' "$RESULT" | grep -Eq '"pendente"[[:space:]]*:[[:space:]]*true' && printf '%s' "$LEGACY" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'; then OK=1; break; fi
            sleep 3
          done
          test "$OK" = 1
          echo 'Rota CSC terceiros e manutenção atual responderam no ambiente publicado.'
          echo "Versão nova $VERSION; anterior $PREVIOUS_VERSION"
      - name: Publicar resumo sem dados de moradores
        if: success()
        run: echo 'Apps Script operacional e rota pública de resultado aprovada. Falta ativar frontend e validar sessão real com cadastro autorizado.' >> "$GITHUB_STEP_SUMMARY"
