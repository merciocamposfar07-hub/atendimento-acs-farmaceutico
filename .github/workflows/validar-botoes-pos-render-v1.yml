name: Validar botoes de mensagem apos renderizacao

on:
  push:
    branches:
      - fix/botoes-mensagem-pos-render-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/botoes-mensagem-pos-render-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Renovar cache e travar regressao do clique bloqueado
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          painel=Path('teste-v1/painel-moradores-v2.html')
          p=painel.read_text(encoding='utf-8')
          old='mensagem-individual-morador-integracao-v1.js?v=20260820-botoes-familia-v2'
          new='mensagem-individual-morador-integracao-v1.js?v=20260820-pos-render-v3'
          if old in p:
              p=p.replace(old,new,1)
          elif new not in p:
              raise SystemExit('Referencia da integracao nao encontrada no painel.')
          painel.write_text(p,encoding='utf-8')

          teste=Path('scripts/test_mensagem_individual_morador_v1.js')
          s=teste.read_text(encoding='utf-8')
          old_assert="assert.match(integration,/admin_mensagem_individual_buscar/,'A confirmação da busca deve ocorrer no servidor.');"
          new_assert="""assert.doesNotMatch(integration,/search\\.addEventListener\\('click'/,'Os botões não podem depender do clique Buscar, pois o transporte principal bloqueia propagação.');\nassert.doesNotMatch(integration,/input\\.addEventListener\\('keydown'/,'Os botões não podem depender do Enter bloqueado pelo transporte principal.');\nassert.match(integration,/originSheet/,'A ação individual deve reaproveitar a origem já carregada pelo painel.');\nassert.match(integration,/originRow/,'A ação individual deve reaproveitar a linha já carregada pelo painel.');\nassert.match(integration,/residentId/,'A ação individual deve reaproveitar o identificador do cadastro selecionado.');\nassert.match(integration,/garantirBotoesCards/,'Os botões individuais devem nascer a partir dos cartões já renderizados.');\nassert.match(integration,/garantirBotaoFormulario/,'O morador selecionado deve ter botão individual também no formulário.');\nassert.match(transport,/function onSearchCapture/,'O teste precisa refletir o manipulador real que captura a busca.');\nassert.match(transport,/stopImmediatePropagation/,'O transporte principal continua bloqueando propagação e não deve ser alterado.');"""
          if old_assert in s:
              s=s.replace(old_assert,new_assert,1)
          elif 'garantirBotoesCards' not in s:
              raise SystemExit('Ponto de teste esperado nao encontrado.')
          teste.write_text(s,encoding='utf-8')
          PY
      - name: Testar toda a integracao
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          git restore -- scripts/test_dom_flows.js scripts/test_territorio_dom.js
          git diff --check
      - name: Confirmar escopo
        shell: bash
        run: |
          set -euo pipefail
          extras=$(git diff --name-only | grep -v -E '^(teste-v1/painel-moradores-v2.html|scripts/test_mensagem_individual_morador_v1.js)$' || true)
          if [ -n "$extras" ]; then echo "$extras"; exit 1; fi
      - name: Gravar cache e teste
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- teste-v1/painel-moradores-v2.html scripts/test_mensagem_individual_morador_v1.js
          git diff --cached --check
          git commit -m 'Validar botoes de mensagem apos renderizacao'
          git push origin HEAD:fix/botoes-mensagem-pos-render-v1
