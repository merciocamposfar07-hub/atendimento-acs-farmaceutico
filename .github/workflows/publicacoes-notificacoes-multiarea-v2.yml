name: Validar publicações multiárea v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_apply_onesignal_helper.py'
      - 'scripts/check_recados_inline.js'
      - '.github/workflows/publicacoes-notificacoes-multiarea-v2.yml'

permissions:
  contents: write

concurrency:
  group: portal-tacs-publicacoes-multiarea-v2
  cancel-in-progress: false

jobs:
  validar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Aplicar alteracoes
        run: |
          python3 scripts/fix_apply_onesignal_helper.py
          python3 scripts/apply_publicacoes_notificacoes_multiarea_v1.py
      - name: Validar sintaxe
        run: |
          node --check --input-type=commonjs < apps-script/ZZZZ_17_TacsAreasAdminV1.gs
          node --check --input-type=commonjs < apps-script/ZZZZ_19_NotificacoesSegmentadasV1.gs
          node --check --input-type=commonjs < apps-script/ZZZZ_20_PublicacoesTerritoriaisV1.gs
          node --check agenda-enfermeira.js
          node --check teste-v1/painel-tacs-areas-v1.js
          node --check scripts/build_apps_script_release.js
          node --check scripts/test_publicacoes_territoriais.js
          node scripts/check_recados_inline.js
      - name: Executar testes completos
        run: |
          npm ci
          npm test
      - name: Validar escopo
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain=v1 | cut -c4-)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev '^(apps-script/ZZZZ_17_TacsAreasAdminV1\.gs|apps-script/ZZZZ_19_NotificacoesSegmentadasV1\.gs|agenda-enfermeira\.js|scripts/build_apps_script_release\.js|teste-v1/painel-tacs-areas-v1\.html|teste-v1/painel-tacs-areas-v1\.js|teste-v1/painel-recados-campanhas-v1\.html|painel-oficial-tacs-areas\.html|painel-oficial-recados-campanhas\.html|painel-recados-campanhas\.html|scripts/test_territorio_dom\.js|package\.json|scripts/apply_publicacoes_notificacoes_multiarea_v1\.py)$' || true)"
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
      - name: Publicar codigo testado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/apply_publicacoes_notificacoes_multiarea_v1.py scripts/fix_apply_onesignal_helper.py scripts/check_recados_inline.js
          git add -A
          git reset .github/workflows/publicacoes-notificacoes-multiarea-v2.yml || true
          git commit -m 'Isola publicacoes e notificacoes por area'
          git push origin HEAD:main
