name: Exibir vagas comuns e emergenciais v88

on:
  push:
    paths:
      - '.github/workflows/exibir-vagas-duplas-v88.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mostrar os dois tipos de vaga em cada dia
        run: |
          python - <<'PY'
          from pathlib import Path

          script_path = Path('portal-odontologia-segunda-sexta.js')
          script = script_path.read_text(encoding='utf-8')

          style_anchor = "      '#dentalSlots .dental-placeholder b{color:#657b86!important}',"
          style_new = style_anchor + "\n      '#dentalSlots .dental-secondary-vacancy{display:block;margin-top:8px;color:#087a3d;font-size:15px;font-weight:900;line-height:1.3}',"
          if 'dental-secondary-vacancy' not in script:
              if style_anchor not in script:
                  raise SystemExit('Ponto de estilo não localizado.')
              script = script.replace(style_anchor, style_new, 1)

          function_anchor = "  function statusIndicatesFailure(text) {"
          dual_function = """  function showDualVacancies() {
    var emergencySelected = dentalType() === 'emergencial';
    var officialCommonDays = ['Segunda-feira', 'Terça-feira', 'Quinta-feira'];

    Array.prototype.slice.call(document.querySelectorAll('#dentalSlots .slot')).forEach(function (button) {
      var day = getDayFromButton(button);
      var count = button.querySelector('b');
      if (!count || !day) return;

      var oldSecondary = button.querySelector('.dental-secondary-vacancy');
      if (oldSecondary) oldSecondary.remove();

      var original = normalize(count.textContent);
      var positive = original.indexOf('1 vaga') !== -1 || original.indexOf('vagas disponiveis') !== -1;
      var secondary = document.createElement('small');
      secondary.className = 'dental-secondary-vacancy';

      if (emergencySelected) {
        count.textContent = positive ? '1 vaga de emergência disponível' : count.textContent;
        if (officialCommonDays.indexOf(day) !== -1) {
          secondary.textContent = '1 vaga comum disponível';
        } else if (day === 'Quarta-feira') {
          secondary.textContent = 'Sem atendimento comum padrão';
        } else {
          secondary.textContent = 'Vaga comum extra quando liberada';
        }
      } else {
        if (positive) count.textContent = '1 vaga comum disponível';
        secondary.textContent = '1 vaga de emergência disponível';
      }

      button.appendChild(secondary);
    });
  }

"""
          if 'function showDualVacancies()' not in script:
              if function_anchor not in script:
                  raise SystemExit('Ponto da função não localizado.')
              script = script.replace(function_anchor, dual_function + function_anchor, 1)

          replace_anchor = '      list.replaceChildren(fragment);'
          replace_new = replace_anchor + '\n      showDualVacancies();'
          if 'list.replaceChildren(fragment);\n      showDualVacancies();' not in script:
              if replace_anchor not in script:
                  raise SystemExit('Ponto de renderização não localizado.')
              script = script.replace(replace_anchor, replace_new, 1)

          script_path.write_text(script, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace(
              'portal-odontologia-segunda-sexta.js?v=20260801-87',
              'portal-odontologia-segunda-sexta.js?v=20260801-88'
          )
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Publicar
        run: |
          if git diff --quiet; then
            echo 'Versão 88 já aplicada.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal-odontologia-segunda-sexta.js index.html
          git commit -m 'Exibir vagas comuns e emergenciais nos dias odontológicos'
          git push
