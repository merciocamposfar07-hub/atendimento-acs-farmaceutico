name: Reservar odontologia no clique e contraste v96

on:
  push:
    paths:
      - '.github/workflows/reservar-odontologia-no-clique-contraste-v96.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar ajuste v96
        run: node scripts/apply_portal_tacs_v96.js

      - name: Validar JavaScript e escopo
        run: |
          node --check portal-odontologia-segunda-sexta.js
          node --check agenda-config.js
          grep -q "var reservationPending = false" portal-odontologia-segunda-sexta.js
          grep -q "Vaga reservada. A quantidade foi atualizada automaticamente" portal-odontologia-segunda-sexta.js
          grep -q "function installPortalContrast" agenda-config.js
          grep -q "#073a55" agenda-config.js
          grep -q "portal-odontologia-segunda-sexta.js?v=20260811-reserva-clique-v96" index.html
          grep -q "agenda-config.js?v=20260811-contraste-petroleo-v1" index.html
          CHANGED="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$CHANGED" = "agenda-config.js index.html portal-odontologia-segunda-sexta.js "

      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agenda-config.js index.html portal-odontologia-segunda-sexta.js
          git commit -m 'Reservar vaga odontológica no clique e adicionar contraste'
          git push