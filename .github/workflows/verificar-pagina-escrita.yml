name: Verificar página de escrita

on:
  push:
    paths:
      - 'teste-v1/admin-escrita-controlada.html'
      - '.github/workflows/verificar-pagina-escrita.yml'

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aguardar GitHub Pages e validar arquivo
        shell: bash
        run: |
          set -u
          URL='https://merciocamposfar07-hub.github.io/atendimento-acs-farmaceutico/teste-v1/admin-escrita-controlada.html'
          OK='false'
          CODIGO=''
          CORPO=''
          for tentativa in $(seq 1 24); do
            ARQUIVO=$(mktemp)
            CODIGO=$(curl -L --silent --show-error --max-time 25 -o "$ARQUIVO" -w '%{http_code}' "$URL?v=fa39a826687252b11c755a6489a04fd61aab5aa6-$tentativa" || true)
            CORPO=$(cat "$ARQUIVO" 2>/dev/null || true)
            rm -f "$ARQUIVO"
            if [ "$CODIGO" = '200' ] && printf '%s' "$CORPO" | grep -q 'DIAGNÓSTICO ISOLADO • MÓDULO 08'; then
              OK='true'
              break
            fi
            sleep 10
          done
          {
            echo "executado_em_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "url=$URL"
            echo "http_status=$CODIGO"
            echo "marcador_encontrado=$OK"
            echo "commit_pagina=fa39a826687252b11c755a6489a04fd61aab5aa6"
          } > diagnostico-pagina-escrita.txt
          test "$OK" = 'true'

      - name: Gravar diagnóstico
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostico-pagina-escrita.txt
          git commit -m 'Registra diagnóstico da página de escrita' || exit 0
          git push
