name: Corrigir painel campanhas UI v3

on:
  push:
    paths:
      - 'scripts/corrigir_painel_campanhas_ui_v3.py'
      - '.github/workflows/corrigir-painel-campanhas-ui-v3.yml'

permissions:
  contents: write

jobs:
  aplicar-validar-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aplicar correção do painel de campanhas
        run: |
          python3 scripts/corrigir_painel_campanhas_ui_v3.py
          sed -i 's/20260817-campanhas-admin-ui-v3/20260816-campanhas-admin-ui-v3/g' painel-oficial-recados-campanhas.html central-administrativa-tacs.js central-administrativa-tacs.html

      - name: Instalar dependencias
        run: npm ci

      - name: Regressao completa
        run: npm test

      - name: Validar escopo visual
        run: |
          grep -q 'CAMPANHAS_ADMIN_UI_V3' campanhas-periodo-v2.js
          grep -q 'camp-validade-wrap' campanhas-periodo-v2.js
          grep -q 'camp-admin-title' campanhas-periodo-v2.js
          grep -q 'camp-admin-symbol' campanhas-periodo-v2.js
          grep -q '20260816-campanhas-admin-ui-v3' painel-oficial-recados-campanhas.html
          grep -q '20260816-campanhas-admin-ui-v3' central-administrativa-tacs.js
          grep -q '20260816-campanhas-admin-ui-v3' central-administrativa-tacs.html

      - name: Publicar
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campanhas-periodo-v2.js painel-oficial-recados-campanhas.html central-administrativa-tacs.js central-administrativa-tacs.html
          git commit -m 'Corrige padronizacao visual do painel de campanhas'
          git pull --rebase origin main
          git push origin main

      - name: Validar no GitHub Pages
        run: |
          URL='https://merciocamposfar07-hub.github.io/atendimento-acs-farmaceutico/painel-oficial-recados-campanhas.html'
          for i in $(seq 1 60); do
            HTML=$(curl -fsSL "$URL?validacao=campanhas-ui-v3-$i-$(date +%s)" || true)
            if echo "$HTML" | grep -q '20260816-campanhas-admin-ui-v3'; then
              JS=$(curl -fsSL "https://merciocamposfar07-hub.github.io/atendimento-acs-farmaceutico/campanhas-periodo-v2.js?validacao=$i-$(date +%s)" || true)
              if echo "$JS" | grep -q 'CAMPANHAS_ADMIN_UI_V3' && echo "$JS" | grep -q 'camp-validade-wrap'; then
                echo 'PAINEL_CAMPANHAS_UI_V3_PUBLICADO_OK'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'A correção do painel de campanhas não apareceu no GitHub Pages no prazo.' >&2
          exit 1
