name: Corrigir painel campanhas UI v3

on:
  push:
    paths:
      - '.github/workflows/corrigir-painel-campanhas-ui-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aplicar padronização visual segura das campanhas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('campanhas-periodo-v2.js')
          js = js_path.read_text(encoding='utf-8')

          marker = '/* CAMPANHAS_ADMIN_UI_V3 */'
          if marker not in js:
              anchor = "  document.head.appendChild(style);"
              css = r'''  style.textContent+=''' + "`" + r'''
/* CAMPANHAS_ADMIN_UI_V3 */
#listaCampanhas .item[class*="camp-theme-"]{
  border:2px solid #69c7e7!important;
  border-radius:24px!important;
  overflow:hidden!important;
  background:#073a55!important;
}
#listaCampanhas .item[class*="camp-theme-"]>summary{
  position:relative!important;
  display:grid!important;
  grid-template-columns:minmax(0,1fr) 82px!important;
  grid-template-areas:"badge status" "copy symbol"!important;
  gap:10px 14px!important;
  align-items:start!important;
  min-height:164px!important;
  padding:16px 16px 18px!important;
  overflow:hidden!important;
  isolation:isolate;
}
#listaCampanhas .camp-admin-badge{
  grid-area:badge;
  justify-self:start;
  align-self:start;
  display:inline-flex;
  align-items:center;
  min-height:34px;
  max-width:100%;
  padding:7px 11px;
  border-radius:999px;
  background:#073a55;
  color:#fff;
  font-size:.76rem;
  font-weight:950;
  line-height:1;
  letter-spacing:.015em;
  white-space:nowrap;
}
#listaCampanhas .item[class*="camp-theme-"]>summary .sinal{
  grid-area:status!important;
  position:static!important;
  justify-self:end!important;
  align-self:start!important;
  min-width:76px!important;
  max-width:100%!important;
  margin:0!important;
  padding:7px 11px!important;
  border-radius:999px!important;
  background:#f5fff8!important;
  color:#08723a!important;
  font-size:.8rem!important;
  font-weight:950!important;
  line-height:1!important;
  white-space:nowrap!important;
}
#listaCampanhas .item[class*="camp-theme-"]>summary .sinal.inativo{
  background:#fff2f2!important;
  color:#922f2f!important;
}
#listaCampanhas .camp-admin-copy{
  grid-area:copy;
  min-width:0;
  align-self:center;
}
#listaCampanhas .camp-admin-title{
  margin:0 0 5px!important;
  color:inherit!important;
  font-size:clamp(1.55rem,5.8vw,1.95rem)!important;
  font-weight:950!important;
  line-height:1.06!important;
  letter-spacing:-.025em!important;
  overflow-wrap:break-word!important;
}
#listaCampanhas .camp-admin-subtitle{
  margin:0 0 6px;
  color:inherit!important;
  font-size:1rem!important;
  font-weight:850!important;
  line-height:1.28!important;
  opacity:1!important;
  overflow-wrap:break-word;
}
#listaCampanhas .camp-admin-period,
body.tema-petroleo #listaCampanhas .item[class*="camp-theme-"]>summary .camp-admin-period{
  margin:0!important;
  color:inherit!important;
  font-size:.92rem!important;
  font-weight:800!important;
  line-height:1.35!important;
  opacity:.94!important;
  overflow-wrap:break-word!important;
}
#listaCampanhas .camp-admin-symbol{
  grid-area:symbol;
  width:82px;
  height:82px;
  align-self:end;
  justify-self:end;
  display:grid;
  place-items:center;
  border-radius:999px;
  background:rgba(255,255,255,.18);
  overflow:visible;
  pointer-events:none;
}
#listaCampanhas .camp-admin-symbol svg{
  display:block;
  width:76px;
  height:76px;
  max-width:100%;
  max-height:100%;
  filter:drop-shadow(0 5px 6px rgba(7,31,47,.20));
}
#listaCampanhas .camp-theme-lilas>summary{
  background:linear-gradient(135deg,#ead9ff 0%,#d9b9f2 100%)!important;
  color:#32105f!important;
}
#listaCampanhas .camp-theme-lilas .camp-admin-badge{background:#56208b!important}
#listaCampanhas .camp-theme-dourado>summary{
  background:linear-gradient(135deg,#ffe8a8 0%,#f6cb61 100%)!important;
  color:#4a3000!important;
}
#listaCampanhas .camp-theme-dourado .camp-admin-badge{background:#8a5b00!important}
#listaCampanhas .camp-theme-roxo>summary{background:linear-gradient(135deg,#e4d4ff,#b995e8)!important;color:#2e1258!important}
#listaCampanhas .camp-theme-laranja>summary{background:linear-gradient(135deg,#ffe0b5,#f2a24d)!important;color:#512700!important}
#listaCampanhas .camp-theme-azul-marinho>summary{background:linear-gradient(135deg,#163a69,#0b2443)!important;color:#fff!important}
#listaCampanhas .camp-theme-verde>summary{background:linear-gradient(135deg,#d8f2df,#79c992)!important;color:#123f23!important}
#listaCampanhas .camp-theme-azul>summary{background:linear-gradient(135deg,#d8efff,#79bce8)!important;color:#0b3654!important}
#listaCampanhas .camp-theme-amarelo>summary{background:linear-gradient(135deg,#fff5b8,#f2d257)!important;color:#4c3d00!important}
#listaCampanhas .camp-theme-vermelho>summary{background:linear-gradient(135deg,#ffd6d6,#e78383)!important;color:#5d1717!important}
#listaCampanhas .camp-theme-rosa>summary{background:linear-gradient(135deg,#ffdbea,#ef9cbd)!important;color:#641d3a!important}

.camp-period-fields .validadeCampo,
#secaoCampanhas .validadeCampo{
  display:block!important;
  width:100%!important;
  min-width:0!important;
  max-width:100%!important;
  inline-size:100%!important;
  min-inline-size:0!important;
  max-inline-size:100%!important;
  overflow:hidden!important;
  contain:inline-size!important;
  border-radius:18px!important;
  box-sizing:border-box!important;
}
.camp-period-fields .validadeControle,
#secaoCampanhas .validadeControle{
  display:block!important;
  width:100%!important;
  min-width:0!important;
  max-width:100%!important;
  inline-size:100%!important;
  min-inline-size:0!important;
  max-inline-size:100%!important;
  box-sizing:border-box!important;
  font-size:1rem!important;
}
@media(max-width:390px){
  #listaCampanhas .item[class*="camp-theme-"]>summary{
    grid-template-columns:minmax(0,1fr) 70px!important;
    gap:9px 10px!important;
    min-height:154px!important;
    padding:14px!important;
  }
  #listaCampanhas .camp-admin-symbol{width:70px;height:70px}
  #listaCampanhas .camp-admin-symbol svg{width:65px;height:65px}
  #listaCampanhas .camp-admin-badge{font-size:.7rem;padding:7px 9px}
  #listaCampanhas .item[class*="camp-theme-"]>summary .sinal{min-width:68px!important;font-size:.74rem!important;padding:7px 8px!important}
  #listaCampanhas .camp-admin-title{font-size:clamp(1.42rem,6.2vw,1.72rem)!important}
  #listaCampanhas .camp-admin-subtitle{font-size:.94rem!important}
  #listaCampanhas .camp-admin-period{font-size:.86rem!important}
}
''' + "`" + r''';'''
              assert anchor in js, 'âncora addStyle não encontrada'
              js = js.replace(anchor, css + "\n" + anchor, 1)

          helper_marker = 'function campaignIconSvg(theme)'
          if helper_marker not in js:
              anchor = "function applyCampaignTheme(box,meta){if(!box)return;Array.prototype.slice.call(box.classList).filter(function(c){return c.indexOf('camp-theme-')===0}).forEach(function(c){box.classList.remove(c)});var h=box.querySelector('h3'),theme=campaignTheme(meta,h&&h.textContent);if(theme)box.classList.add('camp-theme-'+theme)}"
              helper = r'''
function campaignPalette(theme){
  var map={
    lilas:['#6d28d9','#b87cff'],dourado:['#a96b00','#ffd66b'],roxo:['#6331a8','#b892ee'],
    laranja:['#b85d00','#ffb75b'],'azul-marinho':['#12365f','#4c7fb4'],verde:['#17723a','#74c993'],
    azul:['#17618f','#76c7f2'],amarelo:['#9b7900','#f3d95e'],vermelho:['#9e2f2f','#e98686'],rosa:['#a53e68','#f2a3c2']
  };
  return map[theme]||['#17618f','#76c7f2'];
}
function campaignIconSvg(theme){
  var p=campaignPalette(theme),a=p[0],b=p[1];
  if(theme==='dourado'){
    return '<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><defs><linearGradient id="campGoldV3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a5"/><stop offset=".35" stop-color="#f5bf36"/><stop offset="1" stop-color="#9b6100"/></linearGradient></defs><path d="M58 18c11 3 18 13 17 25-1 10-5 17-10 22 7 5 11 12 11 20H31c0-13 5-23 14-29-8-7-12-15-11-23 1-12 11-18 24-15Z" fill="url(#campGoldV3)"/><circle cx="58" cy="37" r="9" fill="#ffe58d"/><circle cx="56" cy="65" r="8" fill="#fff0ad"/><path d="M42 60c8 10 18 16 31 14M39 68c11 12 24 17 38 13" fill="none" stroke="#875500" stroke-width="5" stroke-linecap="round"/><path d="M81 48c4-7 15-2 10 6-3 5-10 9-10 9s-7-4-10-9c-5-8 6-13 10-6Z" fill="#f3b72f" stroke="#9b6100" stroke-width="2"/></svg>';
  }
  return '<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><defs><linearGradient id="campRibbonV3'+theme.replace(/[^a-z0-9]/g,'')+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+b+'"/><stop offset=".55" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient></defs><path d="M38 13c-7 8-9 18-5 29 4 10 11 19 19 28l-13 20 13 7 13-21 13 21 13-7-17-27c8-10 13-19 13-29 0-14-9-24-23-24-11 0-19 5-25 13Zm27 10c7 0 11 5 11 12 0 6-4 13-10 20L49 31c4-5 9-8 16-8Z" fill="url(#campRibbonV3'+theme.replace(/[^a-z0-9]/g,'')+')" stroke="'+a+'" stroke-width="2" stroke-linejoin="round"/></svg>';
}
function decorateCampaignSummary(box,meta){
  if(!box)return;
  var summary=box.querySelector('summary');if(!summary)return;
  var copy=summary.querySelector('div');if(!copy)return;
  copy.classList.add('camp-admin-copy');
  var h=copy.querySelector('h3');if(h)h.classList.add('camp-admin-title');
  var theme=campaignTheme(meta,h&&h.textContent);
  var subtitle=copy.querySelector('.camp-admin-subtitle');
  if(!subtitle){subtitle=document.createElement('div');subtitle.className='camp-admin-subtitle';if(h)h.insertAdjacentElement('afterend',subtitle);else copy.insertBefore(subtitle,copy.firstChild)}
  subtitle.textContent=txt(meta&&meta.SUBTITULO);subtitle.hidden=!subtitle.textContent;
  var period=copy.querySelector('.sub');if(period)period.classList.add('camp-admin-period');
  var badge=summary.querySelector('.camp-admin-badge');
  if(!badge){badge=document.createElement('span');badge.className='camp-admin-badge';badge.textContent='CAMPANHA DO MÊS';summary.insertBefore(badge,summary.firstChild)}
  var symbol=summary.querySelector('.camp-admin-symbol');
  if(!symbol){symbol=document.createElement('span');symbol.className='camp-admin-symbol';symbol.setAttribute('aria-hidden','true');summary.appendChild(symbol)}
  if(symbol.dataset.theme!==theme){symbol.dataset.theme=theme;symbol.innerHTML=campaignIconSvg(theme)}
}
'''
              assert anchor in js, 'âncora applyCampaignTheme não encontrada'
              js = js.replace(anchor, anchor + helper, 1)

          old_fields = '''  div.innerHTML='<label><strong>Subtítulo da campanha</strong></label><input class="campo" name="subtitulo" value="'+esc(meta.SUBTITULO||'')+'" placeholder="Ex.: Incentivo ao aleitamento materno"><div class="period-grid"><div><label><strong>Ano</strong></label><input class="campo" name="ano" type="number" min="2000" max="2200" inputmode="numeric" value="'+esc(meta.ANO)+'"></div><div><label><strong>Mês</strong></label><select class="campo" name="mes">'+monthOptions(meta.MES)+'</select></div></div><label><strong>Validade</strong></label><input class="campo" name="validade" type="date" value="'+esc(meta.VALIDADE)+'">'+(meta.COR_NOME?'<div class="camp-color-chip">Cor da campanha: '+esc(meta.COR_NOME)+'</div>':'')+'<div class="camp-context">'+contextText(meta)+'</div>';'''
          new_fields = '''  div.innerHTML='<label><strong>Subtítulo da campanha</strong></label><input class="campo" name="subtitulo" value="'+esc(meta.SUBTITULO||'')+'" placeholder="Ex.: Incentivo ao aleitamento materno"><div class="period-grid"><div><label><strong>Ano</strong></label><input class="campo" name="ano" type="number" min="2000" max="2200" inputmode="numeric" value="'+esc(meta.ANO)+'"></div><div><label><strong>Mês</strong></label><select class="campo" name="mes">'+monthOptions(meta.MES)+'</select></div></div><label><strong>Validade</strong></label><div class="validadeCampo camp-validade-wrap"><input class="validadeControle camp-validade-input" name="validade" type="date" value="'+esc(meta.VALIDADE)+'"></div>'+(meta.COR_NOME?'<div class="camp-color-chip">Cor da campanha: '+esc(meta.COR_NOME)+'</div>':'')+'<div class="camp-context">'+contextText(meta)+'</div>';'''
          if old_fields in js:
              js = js.replace(old_fields, new_fields, 1)
          elif 'camp-validade-wrap' not in js:
              raise SystemExit('trecho makeFields não encontrado')

          old_decorate = '''function decorateBox(box,meta){
  if(!box)return;applyCampaignTheme(box,meta);
  if(box.querySelector('.camp-period-fields'))return;'''
          new_decorate = '''function decorateBox(box,meta){
  if(!box)return;applyCampaignTheme(box,meta);decorateCampaignSummary(box,meta);
  if(box.querySelector('.camp-period-fields'))return;'''
          if old_decorate in js:
              js = js.replace(old_decorate, new_decorate, 1)
          elif 'applyCampaignTheme(box,meta);decorateCampaignSummary(box,meta);' not in js:
              raise SystemExit('trecho decorateBox não encontrado')

          js_path.write_text(js, encoding='utf-8')

          panel = Path('painel-oficial-recados-campanhas.html')
          html = panel.read_text(encoding='utf-8')
          html = html.replace('campanhas-periodo-v2.js?v=20260816-campanhas-auto-v1','campanhas-periodo-v2.js?v=20260817-campanhas-admin-ui-v3')
          panel.write_text(html, encoding='utf-8')

          central_js = Path('central-administrativa-tacs.js')
          cjs = central_js.read_text(encoding='utf-8')
          cjs = cjs.replace("painel-oficial-recados-campanhas.html?area='+area+access+'&v=20260816-campanhas-auto-v1", "painel-oficial-recados-campanhas.html?area='+area+access+'&v=20260817-campanhas-admin-ui-v3")
          central_js.write_text(cjs, encoding='utf-8')

          central_html = Path('central-administrativa-tacs.html')
          cht = central_html.read_text(encoding='utf-8')
          cht = cht.replace('central-administrativa-tacs.js?v=20260816-campanhas-auto-v1','central-administrativa-tacs.js?v=20260817-campanhas-admin-ui-v3')
          central_html.write_text(cht, encoding='utf-8')

          assert 'CAMPANHAS_ADMIN_UI_V3' in js
          assert 'camp-validade-wrap' in js
          assert 'decorateCampaignSummary' in js
          assert '20260817-campanhas-admin-ui-v3' in panel.read_text(encoding='utf-8')
          assert '20260817-campanhas-admin-ui-v3' in central_js.read_text(encoding='utf-8')
          assert '20260817-campanhas-admin-ui-v3' in central_html.read_text(encoding='utf-8')
          PY

      - name: Instalar dependências
        run: npm ci

      - name: Regressão completa
        run: npm test

      - name: Validar escopo visual
        shell: bash
        run: |
          grep -q 'CAMPANHAS_ADMIN_UI_V3' campanhas-periodo-v2.js
          grep -q 'camp-validade-wrap' campanhas-periodo-v2.js
          grep -q 'camp-admin-title' campanhas-periodo-v2.js
          grep -q 'camp-admin-symbol' campanhas-periodo-v2.js
          grep -q '20260817-campanhas-admin-ui-v3' painel-oficial-recados-campanhas.html
          grep -q '20260817-campanhas-admin-ui-v3' central-administrativa-tacs.js
          grep -q '20260817-campanhas-admin-ui-v3' central-administrativa-tacs.html

      - name: Publicar correção no repositório
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campanhas-periodo-v2.js painel-oficial-recados-campanhas.html central-administrativa-tacs.js central-administrativa-tacs.html
          git commit -m 'Corrige padronização visual do painel de campanhas'
          git push
