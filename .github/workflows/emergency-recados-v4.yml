name: Emergência Recados V4

on:
  push:
    paths:
      - 'scripts/emergency_restore_recados_v4.py'
      - 'scripts/test_live_recados_open_v4.js'
      - '.github/workflows/emergency-recados-v4.yml'

permissions:
  contents: write

jobs:
  restaurar-e-validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Restaurar carregador funcional
        run: python3 scripts/emergency_restore_recados_v4.py
      - name: Validação local mínima
        run: |
          node --check central-administrativa-tacs.js
          grep -q '20260816-recados-emergency-v4' painel-oficial-recados-campanhas.html
          grep -q 'document.open();document.write(html);document.close();' painel-oficial-recados-campanhas.html
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add painel-oficial-recados-campanhas.html central-administrativa-tacs.js central-administrativa-tacs.html
          git commit -m 'Restaura painel Recados ao estado funcional' || true
          git pull --rebase origin main
          git push origin main
      - name: Aguardar Pages
        run: |
          URL='https://merciocamposfar07-hub.github.io/atendimento-acs-farmaceutico/painel-oficial-recados-campanhas.html?probe='
          for i in $(seq 1 40); do
            if curl -fsSL "${URL}${i}-$(date +%s)" | grep -q '20260816-recados-emergency-v4'; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Testar abertura pública real
        run: node scripts/test_live_recados_open_v4.js
