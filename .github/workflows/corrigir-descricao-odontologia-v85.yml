name: Corrigir descrição odontológica v85

on:
  push:
    paths:
      - '.github/workflows/corrigir-descricao-odontologia-v85.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar versão do script odontológico
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = re.sub(
              r'portal-odontologia-segunda-sexta\.js\?v=[^"\']+',
              'portal-odontologia-segunda-sexta.js?v=20260801-85',
              text
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar
        run: grep -q 'portal-odontologia-segunda-sexta.js?v=20260801-85' index.html

      - name: Publicar
        run: |
          if git diff --quiet; then
            echo 'Versão 85 já publicada.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Corrigir descrição de solicitação odontológica'
          git push
