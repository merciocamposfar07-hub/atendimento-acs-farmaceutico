name: Verificar runtime dos botoes Moradores

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Baixar versao realmente publicada no Pages
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://merciocamposfar07-hub.github.io/atendimento-acs-farmaceutico/teste-v1'
          ok=0
          for i in $(seq 1 15); do
            TS=$(date +%s%N)
            if curl -fsSL -H 'Cache-Control: no-cache' "$BASE/painel-moradores-v2.html?runtime=$TS" -o /tmp/painel.html \
              && grep -qF 'mensagem-individual-morador-integracao-v1.js?v=20260820-pos-render-v3' /tmp/painel.html; then
              ok=1
              break
            fi
            sleep 4
          done
          test "$ok" -eq 1
          TS=$(date +%s%N)
          curl -fsSL -H 'Cache-Control: no-cache' "$BASE/mensagem-individual-morador-integracao-v1.js?v=20260820-pos-render-v3&runtime=$TS" -o /tmp/integracao-publica.js
          grep -qF 'garantirBotoesCards' /tmp/integracao-publica.js
          grep -qF 'garantirBotaoFormulario' /tmp/integracao-publica.js
          grep -qF 'Enviar mensagem para toda a família' /tmp/integracao-publica.js
      - name: Preparar dependencias
        run: npm ci
      - name: Executar o JavaScript publico sobre quatro moradores da familia 038
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const assert=require('node:assert/strict');
          const {JSDOM}=require('jsdom');
          const js=fs.readFileSync('/tmp/integracao-publica.js','utf8');
          const dom=new JSDOM(`<!doctype html><html><head></head><body>
            <div id="operationStatus" class="status"></div>
            <div id="searchArea"><h2>Buscar morador</h2><p class="muted"></p><input id="query" value="038"></div>
            <div id="results">
              <div class="card"><button type="button"><strong>FÁBIO FERNANDO DE MELO</strong></button></div>
              <div class="card"><button type="button"><strong>MARIA CRISTINA DOS SANTOS SILVA</strong></button></div>
              <div class="card"><button type="button"><strong>DAVI LUCAS SANTOS DE MELO</strong></button></div>
              <div class="card"><button type="button"><strong>ANA JÚLIA SANTOS DE MELO</strong></button></div>
            </div>
            <div id="formArea" class="hidden"><form id="residentForm"><div class="grid"></div>
              <input id="originSheet"><input id="originRow"><input id="residentId"><input id="name"><input id="birth"><input id="cpf"><input id="cns"><input id="address">
            </form></div>
          </body></html>`,{url:'https://merciocamposfar07-hub.github.io/atendimento-acs-farmaceutico/teste-v1/painel-moradores-v2.html',runScripts:'outside-only'});
          const {window}=dom;
          const {document}=window;
          let familiaAberta=null,individualAberto=null;
          window.PortalTacsMensagemFamilia={abrir:(familia,membros)=>{familiaAberta={familia,membros}}};
          window.PortalTacsMensagemIndividual={abrir:(item)=>{individualAberto=item}};
          const original=document.querySelector('.card button');
          original.addEventListener('click',()=>{
            document.getElementById('originSheet').value='MORADORES';
            document.getElementById('originRow').value='2';
            document.getElementById('residentId').value='TACS-000060';
            document.getElementById('name').value='FÁBIO FERNANDO DE MELO';
            document.getElementById('birth').value='27/04/2000';
            document.getElementById('cns').value='203127264350009';
            document.getElementById('address').value='Sítio JAPARANDUBA, 038. ZONA RURAL, Chã Grande - PE';
            document.getElementById('formArea').classList.remove('hidden');
          });
          window.eval(js);
          document.dispatchEvent(new window.Event('DOMContentLoaded',{bubbles:true}));
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            await wait(180);
            const familyBox=document.getElementById('msgFamiliaAcaoBuscaV1');
            assert.ok(familyBox,'O botão geral da família deve ser inserido após a lista ser renderizada.');
            assert.match(familyBox.textContent,/Família 038/);
            assert.match(familyBox.textContent,/Enviar mensagem para toda a família 038/);
            const individuais=[...document.querySelectorAll('.msg-ind-card-button')];
            assert.equal(individuais.length,4,'Cada um dos quatro moradores deve receber um botão individual.');
            familyBox.querySelector('button').click();
            assert.equal(familiaAberta.familia,'038');
            assert.equal(familiaAberta.membros.length,4);
            individuais[0].click();
            await wait(300);
            assert.ok(individualAberto,'O botão individual deve abrir a mensagem usando o cadastro selecionado.');
            assert.equal(individualAberto.origemAba,'MORADORES');
            assert.equal(individualAberto.origemLinha,2);
            assert.equal(individualAberto.moradorId,'TACS-000060');
            assert.equal(individualAberto.nome,'FÁBIO FERNANDO DE MELO');
            assert.equal(individualAberto.familiaId,'038');
            assert.ok(document.getElementById('msgIndividualFormActionV1'),'O formulário selecionado também deve exibir a ação individual.');
            console.log('RUNTIME_BOTOES_MORADORES_OK: 1 botão familiar + 4 individuais + seleção individual validada.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
