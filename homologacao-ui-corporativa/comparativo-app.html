<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071827"><meta name="robots" content="noindex,nofollow,noarchive"><title>Central TACS — propostas com comportamento de aplicativo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--text);overscroll-behavior:none;transition:background .2s,color .2s}button{font:inherit}.app-4{--bg:#071827;--top:#0b263d;--card:#102d46;--card2:#153b58;--line:#2b5a76;--text:#f7fcff;--muted:#adc4d2;--accent:#83efa9;--accent2:#62c8e8;--primary:#176c94;--nav:#091e30;--shadow:0 16px 35px rgba(0,0,0,.3)}.app-5{--bg:#eef6f8;--top:#07506a;--card:#fff;--card2:#f2fafb;--line:#c2d9e1;--text:#123246;--muted:#587584;--accent:#158957;--accent2:#087fa8;--primary:#087497;--nav:#fff;--shadow:0 13px 28px rgba(6,65,86,.13)}.app-6{--bg:#0e151c;--top:#172630;--card:#1b2b35;--card2:#223844;--line:#3d5968;--text:#f5fafc;--muted:#acbec8;--accent:#7bd69c;--accent2:#64b6d0;--primary:#285f79;--nav:#141f27;--shadow:0 18px 38px rgba(0,0,0,.34)}
.switcher{position:sticky;top:0;z-index:40;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:color-mix(in srgb,var(--top) 96%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.switcher-in{width:min(720px,100%);margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.switch{min-height:43px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font-size:.78rem;font-weight:850;padding:7px 5px}.switch.active{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.shell{width:min(720px,100%);margin:auto;min-height:calc(100svh - 60px);padding-bottom:calc(92px + env(safe-area-inset-bottom))}.appbar{display:flex;align-items:center;gap:13px;padding:18px 17px 14px}.official{width:59px;height:59px;flex:0 0 auto;display:grid;place-items:center;border-radius:20px;background:linear-gradient(145deg,var(--card2),var(--top));border:1px solid var(--accent);box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.2)}.official img{width:48px;height:48px;display:block}.app-title{min-width:0}.app-title small{display:block;color:var(--accent);font-size:.7rem;font-weight:900;letter-spacing:.11em;text-transform:uppercase}.app-title strong{display:block;font-size:1.15rem;line-height:1.15;margin-top:3px}.bell{margin-left:auto;width:48px;height:48px;border:1px solid var(--line);border-radius:17px;background:var(--card);color:var(--text);font-size:1.25rem;box-shadow:var(--shadow);position:relative}.bell::after{content:"2";position:absolute;right:-3px;top:-4px;min-width:20px;height:20px;padding:0 4px;display:grid;place-items:center;border-radius:10px;background:#d84f4c;color:#fff;font-size:.68rem;font-weight:900}
.content{padding:0 16px}.welcome{padding:21px;border:1px solid var(--line);border-radius:27px;background:linear-gradient(145deg,var(--card2),var(--card));box-shadow:var(--shadow);overflow:hidden;position:relative}.welcome::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-70px;top:-75px;background:color-mix(in srgb,var(--accent2) 18%,transparent)}.welcome small{color:var(--muted)}.welcome h1{font-size:1.75rem;line-height:1.06;letter-spacing:-.04em;margin:6px 0 8px}.welcome p{color:var(--muted);margin:0;font-size:.92rem;line-height:1.45}.area{margin-top:14px;display:flex;gap:10px;align-items:center}.area select{width:100%;min-height:49px;border:1px solid var(--line);border-radius:16px;padding:10px 13px;background:var(--bg);color:var(--text);font-size:1rem}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.quick-card{min-height:93px;padding:13px;border:1px solid var(--line);border-radius:21px;background:var(--card);box-shadow:var(--shadow);color:var(--text);text-align:left}.quick-card b{display:block;font-size:1.45rem;color:var(--accent)}.quick-card span{display:block;color:var(--muted);font-size:.72rem;margin-top:5px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 12px}.section-title h2{font-size:1.2rem;margin:0}.section-title button{border:0;background:transparent;color:var(--accent2);font-weight:800}.modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.module{min-height:147px;border:1px solid var(--line);border-radius:25px;padding:15px;background:linear-gradient(145deg,var(--card2),var(--card));color:var(--text);text-align:left;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .12s ease,filter .12s ease}.module:active{transform:scale(.965);filter:brightness(1.08)}.module-icon{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,var(--primary),var(--top));border:1px solid color-mix(in srgb,var(--accent2) 60%,var(--line));box-shadow:inset 0 1px rgba(255,255,255,.22),0 9px 19px rgba(0,0,0,.2);margin-bottom:13px}.module-icon img{width:43px;height:43px}.module-icon .emoji{font-size:2rem}.module strong{display:block;font-size:.96rem;line-height:1.15}.module small{display:block;color:var(--muted);font-size:.72rem;line-height:1.3;margin-top:5px}.chev{position:absolute;right:13px;top:14px;color:var(--accent2);font-size:1.3rem}
.dock{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);padding:9px 13px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:color-mix(in srgb,var(--nav) 95%,transparent);backdrop-filter:blur(22px);border-top:1px solid var(--line);box-shadow:0 -12px 30px rgba(0,0,0,.16)}.navitem{min-height:56px;border:0;border-radius:17px;background:transparent;color:var(--muted);font-size:.68rem;font-weight:800;display:grid;place-items:center;gap:2px}.navitem i{font-style:normal;font-size:1.35rem}.navitem.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
/* Opção 5: linguagem leve de saúde e lista de tarefas, ainda com os mesmos módulos. */
.app-5 .welcome{background:linear-gradient(135deg,#07627d,#078d88);color:#fff;border:0}.app-5 .welcome small,.app-5 .welcome p{color:#dff7f4}.app-5 .modules{grid-template-columns:1fr}.app-5 .module{min-height:96px;display:grid;grid-template-columns:62px 1fr 20px;align-items:center;gap:13px}.app-5 .module-icon{margin:0}.app-5 .module small{font-size:.78rem}.app-5 .chev{position:static}.app-5 .quick-card{background:#fff}.app-5 .official{background:#fff}
/* Opção 6: cockpit executivo, mais denso e premium. */
.app-6 .welcome{border-radius:20px}.app-6 .quick-card,.app-6 .module{border-radius:18px}.app-6 .modules{grid-template-columns:1fr}.app-6 .module{min-height:92px;display:grid;grid-template-columns:58px 1fr 20px;align-items:center;gap:13px}.app-6 .module-icon{width:56px;height:56px;border-radius:17px;margin:0}.app-6 .module-icon img{width:39px;height:39px}.app-6 .chev{position:static}.app-6 .section-title{border-left:3px solid var(--accent);padding-left:10px}.app-6 .dock{width:min(650px,calc(100% - 20px));bottom:10px;border:1px solid var(--line);border-radius:24px;padding-bottom:9px}.app-6 .shell{padding-bottom:112px}
@media(min-width:700px){.shell{border-left:1px solid var(--line);border-right:1px solid var(--line)}}@media(max-width:390px){.quick{grid-template-columns:1fr}.quick-card{min-height:72px;display:flex;align-items:center;gap:12px}.quick-card span{margin:0}.app-title strong{font-size:1rem}.official{width:54px;height:54px}.official img{width:44px;height:44px}.module{min-height:137px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body class="app-4">
<div class="switcher"><div class="switcher-in"><button class="switch active" data-theme="app-4">4 • App institucional</button><button class="switch" data-theme="app-5">5 • App saúde</button><button class="switch" data-theme="app-6">6 • App executivo</button></div></div>
<div class="shell"><header class="appbar"><div class="official"><img id="conectaOfficialIcon" src="" alt="Ícone oficial do Conecta Saúde Comunitária"></div><div class="app-title"><small>Conecta Saúde Comunitária</small><strong>Central Administrativa</strong></div><button class="bell" aria-label="Notificações">🔔</button></header>
<main class="content"><section class="welcome"><small>Olá, administrador</small><h1>Gestão da área</h1><p>Acesse os serviços, acompanhe a situação e administre sua unidade.</p><div class="area"><select aria-label="Área de trabalho"><option>Japaranduba • Posto Matias</option></select></div></section>
<section class="quick" aria-label="Resumo"><button class="quick-card"><b>✓</b><span>Portal disponível</span></button><button class="quick-card"><b>8</b><span>Painéis ativos</span></button><button class="quick-card"><b>2</b><span>Pendências</span></button></section>
<div class="section-title"><h2>Painéis administrativos</h2><button>Atualizar</button></div><section class="modules">
<button class="module"><span class="module-icon"><img src="../icons/painel-moradores.svg" alt=""></span><span><strong>Moradores</strong><small>Buscar, cadastrar e atualizar moradores.</small></span><span class="chev">›</span></button>
<button class="module"><span class="module-icon"><span class="emoji">🛟</span></span><span><strong>Suporte aos moradores</strong><small>Notificações, aparelhos e reparos.</small></span><span class="chev">›</span></button>
<button class="module"><span class="module-icon"><img src="../icons/painel-recados.svg" alt=""></span><span><strong>Recados e campanhas</strong><small>Publicações e avisos da área.</small></span><span class="chev">›</span></button>
<button class="module"><span class="module-icon"><img src="../icons/painel-agendas.svg" alt=""></span><span><strong>Agendas e vagas</strong><small>Dias, horários, vagas e situação.</small></span><span class="chev">›</span></button>
<button class="module"><span class="module-icon"><img src="../icons/painel-profissionais.svg" alt=""></span><span><strong>Profissionais e serviços</strong><small>Cadastro e disponibilidade da equipe.</small></span><span class="chev">›</span></button>
<button class="module"><span class="module-icon"><span class="emoji">🗺️</span></span><span><strong>TACS e áreas</strong><small>Agentes, território e novas áreas.</small></span><span class="chev">›</span></button>
<button class="module"><span class="module-icon"><span class="emoji">🌐</span></span><span><strong>Municípios e organizações</strong><small>Estrutura global e vínculos.</small></span><span class="chev">›</span></button>
<button class="module"><span class="module-icon"><span class="emoji">🏥</span></span><span><strong>Portal do Morador</strong><small>Abrir o portal público selecionado.</small></span><span class="chev">›</span></button>
</section></main></div>
<nav class="dock" aria-label="Navegação do aplicativo"><button class="navitem active"><i>⌂</i>Início</button><button class="navitem"><i>▦</i>Painéis</button><button class="navitem"><i>🔔</i>Avisos</button><button class="navitem"><i>●</i>Perfil</button></nav>

<script>document.getElementById('conectaOfficialIcon').src=(window.CS_ASSETS&&window.CS_ASSETS.central)||'';document.querySelectorAll('.switch').forEach(function(b){b.addEventListener('click',function(){document.body.className=b.dataset.theme;document.querySelectorAll('.switch').forEach(function(x){x.classList.toggle('active',x===b)});window.scrollTo({top:0,behavior:'smooth'})})});document.querySelectorAll('.module,.quick-card,.navitem').forEach(function(b){b.addEventListener('click',function(){if(navigator.vibrate)navigator.vibrate(8)})});</script>
</body></html>
