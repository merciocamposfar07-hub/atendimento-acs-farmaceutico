<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Carregando escrita controlada • Portal TACS</title>
  <style>
    body{margin:0;background:#eaf2f6;color:#102d40;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    main{max-width:680px;margin:0 auto;padding:calc(35px + env(safe-area-inset-top)) 18px 40px}
    div{background:#fff;border:2px solid #9fb7c3;border-radius:22px;padding:20px;font-size:1.15rem;font-weight:800;line-height:1.5}
    .erro{border-color:#d88a8a;background:#fff0f0;color:#a52d2d}
  </style>
</head>
<body>
<main><div id="estado">Carregando a página isolada com a URL correta de desenvolvimento…</div></main>
<script>
(function(){
  'use strict';
  var antiga='https://script.google.com/macros/s/AKfycbwTmO0Iv-0tWxxygHOrAJ5q0CAXFivu0oYubcfRC6lbpdFFZs9hPV0RkIEWwhtCKrFiLw/dev';
  var correta='https://script.google.com/macros/s/AKfycbyYCb8b8GiiB-I6o6toYhI1FYq2j-e5vP6aulhPQmey/dev';
  var estado=document.getElementById('estado');
  fetch('./admin-escrita-controlada.html?v=20260802-1',{cache:'no-store'})
    .then(function(resposta){
      if(!resposta.ok)throw new Error('Não foi possível carregar a página-base.');
      return resposta.text();
    })
    .then(function(html){
      if(html.indexOf(antiga)===-1)throw new Error('A URL antiga não foi localizada na página-base.');
      html=html.split(antiga).join(correta);
      if(html.indexOf(correta)===-1)throw new Error('A URL correta não foi aplicada.');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(erro){
      estado.className='erro';
      estado.textContent=erro&&erro.message?erro.message:String(erro);
    });
}());
</script>
</body>
</html>
