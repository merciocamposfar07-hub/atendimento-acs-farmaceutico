<script>
(function(){
'use strict';

var map={

  suporte:'/atendimento-acs-farmaceutico/painel-suporte-moradores-v2.html',

var source=base+'?area='+encodeURIComponent(area)+'&from=central'+(tacs?'&acesso=tacs':'')+'&v=20260909-warm-v34';
var baseCss='/atendimento-acs-farmaceutico/homologacao-ui-v3/painel-v3.css?v=20260909-2';
var patchCss='/atendimento-acs-farmaceutico/homologacao-ui-v3/painel-v3-3-patch.css?v=20260909-3';

function ensure(doc,tag,id,url){
  if(!doc||!doc.head||doc.getElementById(id))return;
  var n=doc.createElement(tag);n.id=id;
  if(tag==='link'){n.rel='stylesheet';n.href=url}else n.src=url;
  doc.head.appendChild(n);
}
function markSession(doc){try{if(sessionStorage.getItem('portalTacsAdminTokenV1')||sessionStorage.getItem('portalTacsTerritorioTokenV1'))doc.documentElement.classList.add('v3-session-reused')}catch(e){}}
function themeFrame(fr){
  try{
    var d=fr.contentDocument;if(!d||!d.head)return false;markSession(d);
    ensure(d,'link','v33FrameBaseCss',baseCss);ensure(d,'link','v33FramePatchCss',patchCss);ensure(d,'link','v34FramePatchCss',patch34);ensure(d,'script','v33FrameSession',sessionJs);ensure(d,'script','v33FrameRuntime',runtimeJs);ensure(d,'script','v34FrameFix',fix34);
    fr.style.visibility='visible';return true;
  }catch(e){return false}
}

  var fr=document.createElement('iframe');fr.id='v33Frame';fr.title='Profissionais e serviços';fr.src=source;document.body.appendChild(fr);
  fr.addEventListener('load',function(){themeFrame(fr);setTimeout(function(){themeFrame(fr)},60);setTimeout(function(){themeFrame(fr)},220)});
  var tries=0,poll=setInterval(function(){tries++;themeFrame(fr);if(tries>60||fr.style.visibility==='visible')clearInterval(poll)},25);

}
function inject(html){
  var pre='\n<script>(function(){try{if(sessionStorage.getItem("portalTacsAdminTokenV1")||sessionStorage.getItem("portalTacsTerritorioTokenV1"))document.documentElement.classList.add("v3-session-reused")}catch(e){}})();<\/script>\n';
  var head=pre+'<link rel="stylesheet" href="'+baseCss+'">\n<link rel="stylesheet" href="'+patchCss+'">\n<link rel="stylesheet" href="'+patch34+'">\n<script src="'+sessionJs+'"><\/script>\n';
  var tail='\n<script src="'+runtimeJs+'"><\/script>\n<script src="'+fix34+'"><\/script>\n';
  if(/<\/head>/i.test(html))html=html.replace(/<\/head>/i,head+'</head>');else html=head+html;
  if(/<\/body>/i.test(html))html=html.replace(/<\/body>/i,tail+'</body>');else html+=tail;
  document.open();document.write(html);document.close();
}
fetch(source,{credentials:'same-origin',cache:'force-cache'})

}());
