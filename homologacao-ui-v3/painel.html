<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081829">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Painel administrativo • Homologação V3.2</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#081829;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
#fallback{display:none;min-height:100svh;place-items:center;padding:26px;text-align:center;background:linear-gradient(180deg,#0b2238,#061421)}
#fallback div{max-width:520px}#fallback strong{display:block;font-size:1.4rem;margin-bottom:10px}#fallback button{min-height:52px;border:1px solid #69c7e7;border-radius:18px;padding:12px 18px;background:linear-gradient(145deg,#3b7fab,#173a59);color:#fff;font-weight:850}
</style>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
</head>
<body>
<div id="fallback"><div><strong>Não foi possível abrir este painel.</strong><p>A Central em produção não foi alterada.</p><button type="button" onclick="location.href='/atendimento-acs-farmaceutico/homologacao-ui-v3/central-administrativa.html'">Voltar à Central</button></div></div>
<script>
(function(){
'use strict';
var q=new URLSearchParams(location.search||'');
var target=String(q.get('target')||'').toLowerCase();
var area=String(q.get('area')||'JAPARANDUBA').toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,64)||'JAPARANDUBA';
var tacs=String(q.get('acesso')||'').toLowerCase()==='tacs';
var map={
  moradores:'/atendimento-acs-farmaceutico/teste-v1/painel-moradores-v2.html',
  suporte:'/atendimento-acs-farmaceutico/painel-suporte-moradores-v2.html',
  recados:'/atendimento-acs-farmaceutico/painel-oficial-recados-campanhas.html',
  agendas:'/atendimento-acs-farmaceutico/painel-oficial-agendas-vagas.html',
  profissionais:'/atendimento-acs-farmaceutico/painel-oficial-profissionais-servicos.html',
  territorio:'/atendimento-acs-farmaceutico/painel-oficial-tacs-areas.html',
  municipios:'/atendimento-acs-farmaceutico/painel-oficial-organizacoes-municipios.html'
};
var base=map[target];
if(!base){document.getElementById('fallback').style.display='grid';return}
var source=base+'?area='+encodeURIComponent(area)+'&from=central'+(tacs?'&acesso=tacs':'')+'&v=20260909-v3-shell-2';
function inject(html){
  var head='\n<link rel="stylesheet" href="/atendimento-acs-farmaceutico/homologacao-ui-v3/painel-v3.css?v=20260909-2">\n<script src="/atendimento-acs-farmaceutico/homologacao-ui-v3/session-v3.js?v=20260909-2"><\/script>\n';
  var tail='\n<script src="/atendimento-acs-farmaceutico/homologacao-ui-v3/panel-runtime-v3.js?v=20260909-2"><\/script>\n';
  if(/<\/head>/i.test(html))html=html.replace(/<\/head>/i,head+'</head>');else html=head+html;
  if(/<\/body>/i.test(html))html=html.replace(/<\/body>/i,tail+'</body>');else html+=tail;
  document.open();document.write(html);document.close();
}
fetch(source,{credentials:'same-origin',cache:'force-cache'})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
  .then(inject)
  .catch(function(){document.getElementById('fallback').style.display='grid'});
}());
</script>
</body>
</html>
