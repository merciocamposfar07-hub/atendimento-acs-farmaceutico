<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Painel oficial de recados e campanhas • Portal TACS</title>
  <style>
    body{margin:0;background:#eaf2f6;color:#102d40;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .carga{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .caixa{max-width:620px;background:#fff;border:2px solid #a9c0ca;border-radius:24px;padding:24px}
    h1{margin:0 0 12px}.erro{color:#a52d2d}
  </style>
</head>
<body>
  <div class="carga"><div class="caixa"><h1>Painel oficial</h1><p id="mensagem">Carregando recados e campanhas…</p></div></div>
  <script>
  (function(){
    'use strict';
    var origem='/atendimento-acs-farmaceutico/teste-v1/painel-recados-campanhas-v1.html?v=20260803-2318';
    var trocas=[
      ['<title>Recados e campanhas V1 • Portal TACS</title>','<title>Painel oficial de recados e campanhas • Portal TACS</title>'],
      ['AMBIENTE ISOLADO • FASE 4','PAINEL ADMINISTRATIVO OFICIAL'],
      ['Recados e campanhas V1','Recados e campanhas'],
      ['O painel é isolado, mas um salvamento confirmado altera a planilha real. O Portal do Morador continua inalterado nesta etapa.','Painel administrativo oficial conectado à planilha do Portal TACS. Recados e campanhas salvos e confirmados são aplicados ao Portal do Morador.'],
      ['Executando testes internos da página…','Verificando o painel administrativo oficial…'],
      ['Testes internos da página aprovados. Entre para validar o módulo no servidor.','Painel administrativo oficial disponível. Entre para carregar o conteúdo.'],
      ['Portal TACS • Painel administrativo isolado','Portal TACS • Painel administrativo oficial'],
      ['Portal do Morador não foi modificado','Alterações confirmadas são aplicadas ao Portal do Morador']
    ];
    function substituir(t,a,b){return t.split(a).join(b)}
    function complementoStatus(){
      var css='<style id="whatsapp-status-recados-estilo">'+
        '.acoes-status-whatsapp{display:grid;gap:10px;margin-top:12px}'+
        '.botao-status-whatsapp{width:100%;min-height:68px;border:3px solid #69c7e7;border-radius:17px;padding:14px 16px;background:#073a55;color:#fff;font-size:1.08rem;font-weight:950;line-height:1.25;box-shadow:0 7px 16px rgba(7,58,85,.18)}'+
        '.botao-status-whatsapp:active{transform:translateY(1px)}'+
        '.botao-status-whatsapp:disabled{opacity:.6;cursor:wait}'+
        '</style>';
      var codigo="(function(){'use strict';"+
        "function texto(v){return String(v==null?'':v).trim()}"+
        "function campo(item,nome){var e=item.querySelector('[name=\"'+nome+'\"]');return e?texto(e.value):''}"+
        "function dataBr(v){var m=texto(v).match(/^(\\d{4})-(\\d{2})-(\\d{2})/);return m?m[3]+'/'+m[2]+'/'+m[1]:texto(v)}"+
        "function quebrar(ctx,texto,maxWidth){var palavras=texto.split(/\\s+/),linhas=[],linha='';palavras.forEach(function(p){var teste=linha?linha+' '+p:p;if(ctx.measureText(teste).width>maxWidth&&linha){linhas.push(linha);linha=p}else linha=teste});if(linha)linhas.push(linha);return linhas}"+
        "function escrever(ctx,texto,x,y,maxWidth,altura,maxLinhas){var linhas=quebrar(ctx,texto,maxWidth);if(maxLinhas&&linhas.length>maxLinhas){linhas=linhas.slice(0,maxLinhas);linhas[maxLinhas-1]=linhas[maxLinhas-1].replace(/[.,;:!?]*$/,'')+'…'}linhas.forEach(function(l,i){ctx.fillText(l,x,y+i*altura)});return y+linhas.length*altura}"+
        "function criarCard(tipo,item){var titulo=campo(item,'titulo'),mensagem=campo(item,'mensagem');if(!titulo||!mensagem)throw new Error('Preencha o título e a mensagem antes de compartilhar.');var c=document.createElement('canvas');c.width=1080;c.height=1920;var ctx=c.getContext('2d'),g=ctx.createLinearGradient(0,0,1080,1920);g.addColorStop(0,'#062c46');g.addColorStop(1,'#0b5878');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1920);ctx.fillStyle='#83efad';ctx.font='900 42px Arial';ctx.fillText('PORTAL TACS • POSTO MATIAS',74,115);ctx.fillStyle='#fff';ctx.font='900 76px Arial';ctx.fillText(tipo==='recado'?'RECADO DA UNIDADE':'CAMPANHA DA UNIDADE',74,225);ctx.fillStyle='#ffffff';ctx.beginPath();ctx.roundRect(54,310,972,1370,42);ctx.fill();ctx.fillStyle='#073a55';ctx.font='900 62px Arial';var y=420;y=escrever(ctx,titulo,98,y,884,76,5)+52;ctx.fillStyle='#24495d';var tamanho=mensagem.length>520?38:(mensagem.length>300?44:50);ctx.font='700 '+tamanho+'px Arial';y=escrever(ctx,mensagem,98,y,884,tamanho+18,18);ctx.fillStyle='#073a55';ctx.font='800 35px Arial';var detalhe='';if(tipo==='recado'){var p=campo(item,'prioridade')||'INFORMATIVO',v=dataBr(campo(item,'validade'));detalhe=p+(v?' • Válido até '+v:'')}else{var ini=dataBr(campo(item,'inicio')),dias=campo(item,'dias');detalhe=(ini?'Início: '+ini:'')+(dias?(ini?' • ':'')+dias:'')}if(detalhe)ctx.fillText(detalhe,98,1600);ctx.fillStyle='#83efad';ctx.fillRect(54,1730,972,8);ctx.fillStyle='#fff';ctx.font='800 34px Arial';ctx.fillText('Unidade de Saúde Posto Matias',74,1815);ctx.font='600 30px Arial';ctx.fillText('Informação oficial do Portal TACS',74,1870);return{canvas:c,titulo:titulo}}"+
        "function compartilhar(tipo,item,botao){var original=botao.textContent;botao.disabled=true;botao.textContent='Gerando card para o WhatsApp…';try{var card=criarCard(tipo,item);card.canvas.toBlob(function(blob){if(!blob){botao.disabled=false;botao.textContent=original;alert('Não foi possível gerar o card.');return}var nome=(tipo==='recado'?'recado':'campanha')+'-portal-tacs.png',arquivo=new File([blob],nome,{type:'image/png'}),dados={files:[arquivo],title:card.titulo,text:'Portal TACS • Posto Matias'};if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[arquivo]}))){navigator.share(dados).catch(function(erro){if(erro&&erro.name!=='AbortError')alert('Não foi possível abrir o compartilhamento do WhatsApp.')}).finally(function(){botao.disabled=false;botao.textContent=original})}else{var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.click();setTimeout(function(){URL.revokeObjectURL(url)},60000);botao.disabled=false;botao.textContent=original}},'image/png',1)}catch(erro){botao.disabled=false;botao.textContent=original;alert(erro.message||'Não foi possível gerar o card.')}}"+
        "function adicionar(listaId,tipo){document.querySelectorAll('#'+listaId+' .item').forEach(function(item){if(item.querySelector('.botao-status-whatsapp'))return;var corpo=item.querySelector('.corpo');if(!corpo)return;var bloco=document.createElement('div');bloco.className='acoes-status-whatsapp';var b=document.createElement('button');b.type='button';b.className='botao-status-whatsapp';b.textContent=tipo==='recado'?'📱 Postar recado no Status do WhatsApp':'📱 Postar campanha no Status do WhatsApp';b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();compartilhar(tipo,item,b)});bloco.appendChild(b);corpo.appendChild(bloco)})}"+
        "function atualizar(){adicionar('listaRecados','recado');adicionar('listaCampanhas','campanha')}"+
        "['listaRecados','listaCampanhas'].forEach(function(id){var e=document.getElementById(id);if(e)new MutationObserver(atualizar).observe(e,{childList:true,subtree:true})});"+
        "var testes={canvas:Boolean(document.createElement('canvas').getContext),blob:typeof Blob==='function',arquivo:typeof File==='function',listas:Boolean(document.getElementById('listaRecados')&&document.getElementById('listaCampanhas'))};testes.ok=Object.keys(testes).filter(function(k){return k!=='ok'}).every(function(k){return testes[k]===true});if(!testes.ok)console.error('Falha nos testes internos do botão de Status do WhatsApp',testes);else console.info('Botões de Status do WhatsApp: testes internos aprovados',testes);atualizar();"+
        "}());";
      return css+'<scr'+'ipt>'+codigo+'</scr'+'ipt>';
    }
    fetch(origem,{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('Não foi possível carregar o painel.');
      return r.text();
    }).then(function(html){
      html=substituir(html,'<head>','<head><base href="/atendimento-acs-farmaceutico/teste-v1/">');
      trocas.forEach(function(par){html=substituir(html,par[0],par[1])});
      html=substituir(html,'</body>',complementoStatus()+'</body>');
      document.open();document.write(html);document.close();
    }).catch(function(erro){
      var e=document.getElementById('mensagem');
      e.className='erro';e.textContent=erro.message+' Atualize a página.';
    });
  })();
  </script>
</body>
</html>
