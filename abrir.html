<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#062c46">
  <title>Abrindo Portal TACS</title>
  <style>
    html,body{margin:0;min-height:100%;background:#062c46;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{display:grid;place-items:center;padding:24px;text-align:center}
    strong{display:block;font-size:28px;line-height:1.2}.msg{margin-top:12px;font-size:18px;line-height:1.5;color:#d8e7ee}
  </style>
</head>
<body>
  <main><strong>Portal TACS</strong><div class="msg">Limpando a versão antiga e abrindo o portal…</div></main>
  <script>
    (async function(){
      try{
        if('serviceWorker' in navigator){
          var regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function(r){return r.unregister();}));
        }
        if('caches' in window){
          var keys=await caches.keys();
          await Promise.all(keys.map(function(k){return caches.delete(k);}));
        }
      }catch(e){}
      location.replace('./index.html?v=20260730-51');
    }());
  </script>
</body>
</html>
