<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#062c46">
  <meta name="color-scheme" content="light only">
  <meta name="portal-release" content="fa797c220ac9">
  <title>Abrindo Portal TACS</title>
  <style>
    :root{color-scheme:only light}
    html,body{margin:0;min-height:100%;background:#062c46;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{display:grid;place-items:center;padding:24px;text-align:center}
    strong{display:block;font-size:28px;line-height:1.2}.msg{margin-top:12px;font-size:18px;line-height:1.5;color:#d8e7ee}
  </style>
</head>
<body>
  <main><strong>Portal TACS</strong><div class="msg">Carregando a versão atual do Portal…</div></main>
  <script>
    (async function(){
      var APP_SCOPE='/atendimento-acs-farmaceutico/';
      try{
        if('serviceWorker' in navigator&&navigator.serviceWorker.getRegistrations){
          var regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.filter(function(registration){
            try{
              var scopePath=new URL(registration.scope,location.href).pathname;
              return scopePath===APP_SCOPE&&scopePath.indexOf('/push/')===-1;
            }catch(e){return false}
          }).map(function(registration){return registration.unregister()}));
        }
        if('caches' in window&&caches.keys){
          var keys=await caches.keys();
          await Promise.all(keys.filter(function(key){
            var value=String(key||'').toLowerCase();
            return value.indexOf('onesignal')===-1&&/^(?:tacs-|portal-tacs-|atendimento-acs)/.test(value);
          }).map(function(key){return caches.delete(key)}));
        }
      }catch(e){}
      var version=Date.now();
      try{
        var response=await fetch('./portal-version.json?t='+Date.now(),{cache:'no-store',credentials:'same-origin'});
        var data=response.ok?await response.json():null;
        if(data&&data.version)version=String(data.version);
      }catch(e){}
      location.replace('./index.html?ptv='+encodeURIComponent(version)+'&ptrefresh=1');
    }());
  </script>
</body>
</html>
