<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020812">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Conecta Saúde Comunitária</title>
<style>
:root{--bg:#020812;--bg2:#061426;--card:#0b2237;--card2:#0e2c46;--line:#2d6f99;--txt:#fff;--muted:#a9bbcb;--teal:#20e0c0;--blue:#168cff;--danger:#ff4b6e;--gold:#ffc033;--green:#1fd06f;--purple:#7c3cff;--pink:#ef297e;--orange:#ff6a1f;--shadow:0 26px 65px rgba(0,0,0,.42)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100svh;overflow-x:hidden;-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}.hidden{display:none!important}.opening{min-height:100svh;padding:calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 22px);display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 50% 32%,rgba(18,93,156,.27),transparent 34%),linear-gradient(180deg,#020812 0%,#030b18 62%,#020812 100%);overflow:hidden}.stage{position:relative;height:min(53svh,555px);min-height:365px;width:min(100%,560px);margin:0 auto;display:grid;place-items:center}.rings{position:absolute;width:min(88vw,460px);height:min(88vw,460px);border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 62px,rgba(56,120,171,.25) 63px 64px,transparent 65px 125px);opacity:.84}.coreGlow{position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(25,137,241,.33),rgba(15,72,153,.12) 48%,transparent 72%);filter:blur(.4px)}.logo{position:absolute;width:178px;height:178px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 31% 23%,#fff 0,#cdeeff 10%,#123771 35%,#08265f 67%,#030a1a 100%);box-shadow:0 0 0 7px rgba(46,118,255,.16),0 0 0 18px rgba(11,45,98,.25),0 0 46px rgba(39,143,255,.58),inset 0 8px 17px rgba(255,255,255,.56),inset 0 -23px 36px rgba(0,3,20,.74);z-index:3}.logo svg{width:128px;height:128px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}.planet{position:absolute;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 18px 32px rgba(0,0,0,.36),inset 0 3px 7px rgba(255,255,255,.44),inset 0 -13px 22px rgba(0,0,0,.34);z-index:2}.planet svg{width:42px;height:42px}.planet:before{content:"";position:absolute;inset:6px 8px auto 8px;height:20px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.46),transparent)}.p1{top:3%;left:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 24%,#fff,#3fa1ff 18%,#094dd2 66%,#04144a)}.p2{top:14%;right:12%;background:radial-gradient(circle at 35% 24%,#fff,#ffad4a 18%,#ff4f14 66%,#5a1406)}.p3{top:39%;right:0;background:radial-gradient(circle at 35% 24%,#fff,#63fff0 18%,#03aeb8 66%,#034b5c)}.p4{right:8%;bottom:13%;background:radial-gradient(circle at 35% 24%,#fff,#ffe26c 18%,#d69600 66%,#4e3100)}.p5{bottom:4%;left:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 24%,#fff,#63c8ff 18%,#1685d9 66%,#06315f)}.p6{left:9%;bottom:12%;background:radial-gradient(circle at 35% 24%,#fff,#43f18c 18%,#04a649 66%,#033b1b)}.p7{top:39%;left:0;background:radial-gradient(circle at 35% 24%,#fff,#b879ff 18%,#7525dd 66%,#260858)}.p8{top:15%;left:12%;background:radial-gradient(circle at 35% 24%,#fff,#ff75b3 18%,#e51871 66%,#520626)}.copy{width:min(100%,560px);margin:0 auto;text-align:left}.kicker{color:var(--teal);letter-spacing:.31em;font-size:13px;font-weight:950;margin-bottom:18px}.copy h1{font-size:clamp(38px,8.5vw,54px);line-height:1.08;letter-spacing:-.055em;margin:0 0 20px}.concepts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin:0 0 22px;color:#dbe6ee}.concept{text-align:center;border-left:1px solid rgba(112,172,222,.48);font-size:15px;line-height:1.25}.concept:first-child{border-left:0;text-align:left}.concept:last-child{text-align:right}.network{text-align:center;color:#9fe3d0;letter-spacing:.28em;font-size:13px;font-weight:850;margin:0 0 28px}.btn{width:100%;min-height:68px;border:0;border-radius:22px;background:linear-gradient(100deg,#19e0bd,#21c5de 48%,#168cff);color:#06111f;font-size:20px;font-weight:950;box-shadow:0 16px 34px rgba(12,116,211,.32);padding:0 18px}.btn.alt{background:transparent;border:1.5px solid var(--line);color:white;box-shadow:none}.btn:active{transform:translateY(1px)}.screen{min-height:100svh;background:radial-gradient(circle at 50% 0,rgba(19,82,145,.26),transparent 38%),linear-gradient(180deg,#020812,#061426);padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 24px)}.shell{width:min(100%,620px);margin:0 auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}.brand h2{font-size:23px;line-height:1.08;margin:0;font-weight:900;letter-spacing:-.03em}.brand small{display:block;color:var(--muted);font-size:16px;margin-top:3px}.pill{border:1px solid var(--line);border-radius:999px;color:#9fead7;padding:8px 13px;font-size:14px}.notice{background:#0c2c42;border-left:4px solid var(--teal);border-radius:16px;padding:16px 18px;color:#d7e5ef;font-size:18px;line-height:1.35;margin:14px 0 28px}.title{font-size:clamp(40px,8.8vw,58px);line-height:1.02;letter-spacing:-.055em;margin:0 0 16px}.lead{font-size:22px;line-height:1.42;color:#c3d1dc;margin:0 0 24px}.card{border:1.5px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#0d2c44,#07192d);box-shadow:var(--shadow);padding:20px;margin:0 0 18px}.progress{display:flex;gap:8px;margin-bottom:20px}.bar{height:8px;border-radius:999px;background:#1a3c58;flex:1}.bar.on{background:linear-gradient(90deg,var(--teal),var(--blue))}.field{margin:18px 0}.field label{display:block;font-size:20px;font-weight:900;margin:0 0 10px}.field input,.field textarea{width:100%;border:1.6px solid var(--line);border-radius:18px;background:#071d31;color:#fff;padding:0 16px;outline:none}.field input{height:66px;font-size:24px;font-weight:800}.field textarea{min-height:126px;padding-top:14px;font-size:19px;line-height:1.35;resize:none}.field input:focus,.field textarea:focus{box-shadow:0 0 0 4px rgba(32,224,192,.16);border-color:#29d7cd}.warn{color:#ffd371;font-weight:800;font-size:17px;line-height:1.4;margin-top:14px}.err{color:#ff8fa0;font-weight:900;font-size:17px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.module,.person,.service{border:1.5px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#0d2d45,#07192d);color:#fff;text-align:left;box-shadow:0 14px 28px rgba(0,0,0,.22)}.module{min-height:150px;padding:22px 20px}.moduleIcon,.personIcon,.serviceIcon{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;margin-bottom:20px;box-shadow:inset 0 2px 4px rgba(255,255,255,.35),inset 0 -10px 16px rgba(0,0,0,.32),0 10px 22px rgba(0,0,0,.26)}.moduleIcon svg,.personIcon svg,.serviceIcon svg{width:33px;height:33px}.module b,.service b{display:block;font-size:24px;line-height:1.05}.module small,.service small,.person small{display:block;color:var(--muted);font-size:18px;line-height:1.25;margin-top:7px}.person{width:100%;display:flex;align-items:center;gap:14px;padding:15px;margin-bottom:12px}.personIcon{margin-bottom:0;flex:none}.person b{font-size:20px}.service{width:100%;min-height:112px;padding:18px;display:flex;align-items:center;gap:14px}.serviceIcon{margin-bottom:0;flex:none}.service.on{border-color:var(--teal);box-shadow:0 0 0 4px rgba(32,224,192,.15),0 14px 28px rgba(0,0,0,.22)}.footer{color:#8299ad;text-align:center;font-size:13px;margin-top:22px}.row{display:flex;gap:12px}.row .btn{min-height:60px}.panel{position:fixed;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(10px);display:none;align-items:flex-end;z-index:9}.panel.on{display:flex}.drawer{width:100%;max-height:86svh;overflow:auto;background:#071426;border:1px solid #173e5b;border-radius:28px 28px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 22px);box-shadow:0 -24px 50px rgba(0,0,0,.46)}.drawerHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.drawerHead h3{font-size:28px;line-height:1.05;margin:0}.x{width:48px;height:48px;border-radius:16px;border:1px solid var(--line);background:#0b2237;color:#fff;font-size:28px}.item{border:1px solid #2d6f99;border-radius:18px;background:#0b2237;padding:15px;margin:10px 0}.item b{display:block;font-size:18px}.item small{display:block;color:var(--muted);margin-top:5px;font-size:16px;line-height:1.35}.status{display:inline-flex;border-radius:999px;padding:7px 11px;background:rgba(32,224,192,.14);color:#9cebd9;font-size:13px;font-weight:900;margin-top:10px}@media(max-width:380px){.planet{width:60px;height:60px}.planet svg{width:34px;height:34px}.logo{width:152px;height:152px}.logo svg{width:108px;height:108px}.stage{min-height:360px}.copy h1{font-size:35px}.title{font-size:37px}.lead{font-size:20px}.module b{font-size:22px}.module{min-height:136px;padding:18px}.grid{gap:11px}.concept{font-size:13px}.network{font-size:12px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const app=document.getElementById('app');
const S={cpf:'',dob:'',pin:'',person:null,member:null,pending:false,service:null};
const people=[{name:'João de Souza',cpf:'52998224725',dob:'20/08/1986',family:'F1'},{name:'Maria de Souza',cpf:'',dob:'12/05/1988',family:'F1'},{name:'Ana de Souza',cpf:'',dob:'14/09/2014',family:'F1'}];
const icon={logo:`<svg viewBox="0 0 120 120" fill="none"><path d="M77 30a38 38 0 1 0 0 60" stroke="#f3f7ff" stroke-width="19" stroke-linecap="round"/><path d="M67 60h34M84 43v34" stroke="#6cf0dc" stroke-width="15" stroke-linecap="round"/></svg>`,tooth:`<svg viewBox="0 0 64 64" fill="none"><path d="M21 10c5 0 7 4 11 4s6-4 11-4c7 0 11 6 10 14-1 8-5 13-7 22-2 7-4 10-8 10-3 0-4-3-5-9-1-5-1-8-1-8s0 3-1 8c-1 6-2 9-5 9-4 0-6-3-8-10-2-9-6-14-7-22-1-8 3-14 10-14Z" fill="white"/></svg>`,run:`<svg viewBox="0 0 64 64" fill="none"><circle cx="39" cy="12" r="7" fill="white"/><path d="M29 23l11 6-7 10 11 12M30 24l-9 9M34 38l-13 12" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`,brain:`<svg viewBox="0 0 64 64" fill="none"><path d="M20 41c-7-3-9-12-4-19 5-8 18-8 24-2 8-1 13 5 12 13-1 9-10 13-18 10l-6 8-1-9c-3 1-5 0-7-1Z" fill="white"/><path d="M25 25c5-3 11-1 13 3M20 32c4 0 7 2 8 6M39 27c4 1 6 4 6 8" stroke="#02aeb8" stroke-width="3" stroke-linecap="round"/></svg>`,leaf:`<svg viewBox="0 0 64 64" fill="none"><path d="M50 14C27 15 16 27 20 47c20 4 32-7 30-33Z" fill="white"/><path d="M20 47c9-10 17-16 30-33" stroke="#1a8b45" stroke-width="5" stroke-linecap="round"/></svg>`,person:`<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="20" r="11" fill="white"/><path d="M12 55c3-13 12-20 20-20s17 7 20 20" fill="white"/></svg>`,doctor:`<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="18" r="9" fill="white"/><path d="M18 55V40c0-7 6-12 14-12s14 5 14 12v15" fill="white"/><path d="M23 36v9a9 9 0 0 0 18 0v-9" stroke="#0a7e6d" stroke-width="4" stroke-linecap="round"/><circle cx="43" cy="49" r="4" fill="#0a7e6d"/></svg>`,nurse:`<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="23" r="10" fill="white"/><path d="M15 57c3-14 12-22 17-22s14 8 17 22" fill="white"/><path d="M21 9h22v12H21z" fill="white"/><path d="M32 12v6M29 15h6" stroke="#7c3cff" stroke-width="3" stroke-linecap="round"/></svg>`,heart:`<svg viewBox="0 0 64 64" fill="none"><circle cx="28" cy="25" r="13" fill="white"/><path d="M39 39c8-7 16-10 16-19 0-9-10-13-16-5-6-8-16-4-16 5 0 9 8 12 16 19Z" fill="white"/><path d="M39 20v13M32 27h14" stroke="#ef297e" stroke-width="4" stroke-linecap="round"/></svg>`,calendar:`<svg viewBox="0 0 64 64" fill="none"><path d="M12 16h40v38H12z" fill="white"/><path d="M12 25h40" stroke="#ff4b6e" stroke-width="5"/><path d="M21 10v10M43 10v10" stroke="#ff4b6e" stroke-width="5" stroke-linecap="round"/><path d="M22 35h20M22 45h13" stroke="#0b4668" stroke-width="4" stroke-linecap="round"/></svg>`,megaphone:`<svg viewBox="0 0 64 64" fill="none"><path d="M12 36h10l26 11V17L22 28H12v8Z" fill="white"/><path d="M23 37l5 14h9l-6-16" fill="white"/><path d="M50 27c4 2 4 8 0 10" stroke="white" stroke-width="5" stroke-linecap="round"/></svg>`,bell:`<svg viewBox="0 0 64 64" fill="none"><path d="M22 50h20M25 54c2 4 12 4 14 0M18 45h28c-5-5-5-13-5-19a9 9 0 0 0-18 0c0 6 0 14-5 19Z" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,unit:`<svg viewBox="0 0 64 64" fill="none"><path d="M14 56V19l18-9 18 9v37" fill="white"/><path d="M25 55V42h14v13M24 26h16M24 34h16" stroke="#0b4668" stroke-width="4" stroke-linecap="round"/></svg>`,steth:`<svg viewBox="0 0 64 64" fill="none"><path d="M18 11v18c0 8 6 14 14 14s14-6 14-14V11" stroke="white" stroke-width="6" stroke-linecap="round"/><path d="M32 43v5c0 5 4 9 9 9s9-4 9-9v-5" stroke="white" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="40" r="6" fill="white"/></svg>`};
function color(k){return {calendar:'radial-gradient(circle at 35% 24%,#fff,#63c8ff 18%,#1685d9 66%,#06315f)',pro:'radial-gradient(circle at 35% 24%,#fff,#63fff0 18%,#03aeb8 66%,#034b5c)',services:'radial-gradient(circle at 35% 24%,#fff,#3fa1ff 18%,#094dd2 66%,#04144a)',campaign:'radial-gradient(circle at 35% 24%,#fff,#ffad4a 18%,#ff4f14 66%,#5a1406)',recados:'radial-gradient(circle at 35% 24%,#fff,#ffe26c 18%,#d69600 66%,#4e3100)',profile:'radial-gradient(circle at 35% 24%,#fff,#b879ff 18%,#7525dd 66%,#260858)',green:'radial-gradient(circle at 35% 24%,#fff,#43f18c 18%,#04a649 66%,#033b1b)',pink:'radial-gradient(circle at 35% 24%,#fff,#ff75b3 18%,#e51871 66%,#520626)'}[k]||'radial-gradient(circle at 35% 24%,#fff,#63fff0 18%,#168f93 66%,#083e5d)'}
function cpfMask(v){let d=String(v||'').replace(/\D/g,'').slice(0,11);return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}
function dobMask(v){let d=String(v||'').replace(/\D/g,'').slice(0,8);return d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d}
function top(){let p=S.member||S.person;return `<div class="top"><div class="brand"><h2>Conecta Saúde Comunitária</h2><small>${p?p.name+' • Sítio Japaranduba':'Homologação segura'}</small></div><span class="pill">Morador</span></div>`}
function shell(html){app.innerHTML=`<main class="screen"><div class="shell">${top()}${html}<div class="footer">Teste seguro: não grava CPF, não envia SMS e não vincula aparelho.</div></div></main>`}
function opening(){app.innerHTML=`<main class="opening"><section class="stage"><div class="rings"></div><div class="coreGlow"></div><div class="planet p1">${icon.tooth}</div><div class="planet p2">${icon.run}</div><div class="planet p3">${icon.brain}</div><div class="planet p4">${icon.leaf}</div><div class="planet p5">${icon.person}</div><div class="planet p6">${icon.doctor}</div><div class="planet p7">${icon.nurse}</div><div class="planet p8">${icon.heart}</div><div class="logo">${icon.logo}</div></section><section class="copy"><div class="kicker">CONECTA SAÚDE COMUNITÁRIA</div><h1>Saúde, comunidade e cuidado conectados.</h1><div class="concepts"><div class="concept">CONECTA<br>PESSOAS</div><div class="concept">PROMOVE<br>SAÚDE</div><div class="concept">FORTALECE<br>A COMUNIDADE</div></div><div class="network">TACS + COMUNIDADE + UNIDADE</div><button class="btn" id="go">Começar</button></section></main>`;document.getElementById('go').onclick=cpf}
function cpf(msg=''){shell(`<div class="card"><div class="progress"><span class="bar on"></span><span class="bar"></span><span class="bar"></span></div><h1 class="title">Acesso do morador</h1><p class="lead">Digite o CPF e toque em confirmar. A busca não acontece automaticamente.</p><div class="field"><label>CPF</label><input id="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" maxlength="14" value="${cpfMask(S.cpf)}"></div><button class="btn" id="next">Confirmar CPF e continuar</button><div class="warn">Homologação segura: este teste não grava CPF, não envia SMS e não vincula seu aparelho a nenhum morador real.</div>${msg?`<div class="err">${msg}</div>`:''}</div>`);let f=document.getElementById('cpf');f.oninput=()=>{S.cpf=f.value.replace(/\D/g,'').slice(0,11);f.value=cpfMask(S.cpf)};document.getElementById('next').onclick=()=>{if(S.cpf.length!==11)return cpf('Digite os 11 números do CPF.');let found=people.find(p=>p.cpf===S.cpf);if(found){S.person=found;pin()}else dob()}}
function dob(msg=''){shell(`<div class="card"><div class="progress"><span class="bar on"></span><span class="bar on"></span><span class="bar"></span></div><h1 class="title">Confirmar nascimento</h1><p class="lead">CPF não localizado neste teste. Isso não bloqueia o acesso.</p><div class="field"><label>Data de nascimento</label><input id="dob" inputmode="numeric" autocomplete="off" placeholder="DD/MM/AAAA" maxlength="10" value="${S.dob}"></div><button class="btn" id="next">Continuar</button><button class="btn alt" id="back" style="margin-top:12px">Corrigir CPF</button>${msg?`<div class="err">${msg}</div>`:''}</div>`);let f=document.getElementById('dob');f.oninput=()=>{S.dob=dobMask(f.value);f.value=S.dob};document.getElementById('back').onclick=()=>cpf();document.getElementById('next').onclick=()=>{if(!/^\d{2}\/\d{2}\/\d{4}$/.test(S.dob))return dob('Digite a data completa.');let m=people.find(p=>p.dob===S.dob);S.person=m||{name:'Morador em identificação',cpf:S.cpf,dob:S.dob,family:'pendente'};S.pending=!m;pin()}}
function pin(msg=''){shell(`<div class="card"><div class="progress"><span class="bar on"></span><span class="bar on"></span><span class="bar on"></span></div><h1 class="title">Criar PIN</h1><p class="lead">Crie quatro números para simular o acesso do morador.</p><div class="field"><label>PIN</label><input id="p1" type="password" inputmode="numeric" maxlength="4"></div><div class="field"><label>Confirmar PIN</label><input id="p2" type="password" inputmode="numeric" maxlength="4"></div><button class="btn" id="next">Criar PIN</button>${msg?`<div class="err">${msg}</div>`:''}</div>`);document.getElementById('next').onclick=()=>{let a=document.getElementById('p1').value.replace(/\D/g,''),b=document.getElementById('p2').value.replace(/\D/g,'');if(a.length!==4)return pin('O PIN precisa ter 4 números.');if(a!==b)return pin('Os dois PINs precisam ser iguais.');S.pin=a;notify()}}
function notify(){shell(`<h1 class="title">Notificações</h1><p class="lead">Nesta homologação a permissão é simulada. O teste não envia Push real.</p><div class="notice">No app final, esta etapa orienta o morador a ativar notificações no Android ou iPhone.</div><button class="btn" id="next">Continuar</button>`);document.getElementById('next').onclick=family}
function family(){let fam=S.person&&S.person.family==='F1'?people.filter(p=>p.family==='F1'):[S.person];shell(`<h1 class="title">Minha família</h1><p class="lead">Escolha para quem será a solicitação.</p>${S.pending?'<div class="notice">Cadastro com pendência não bloqueia solicitação.</div>':''}${fam.map((p,i)=>`<button class="person" data-i="${i}"><span class="personIcon" style="background:${color(i?'green':'pink')}">${icon.person}</span><span><b>${p.name}</b><small>${p.dob||'Nascimento pendente'} • Sítio Japaranduba</small></span></button>`).join('')}`);document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{S.member=fam[+b.dataset.i];home()})}
function home(){let mods=[['Agendas','Dias e horários','calendar','calendar'],['Profissionais','Equipe da unidade','person','pro'],['Serviços','Solicitações','steth','services'],['Campanhas','Ações de saúde','megaphone','campaign'],['Recados','Avisos da unidade','bell','recados'],['Meu Perfil','Dados e família','person','profile']];shell(`<div class="notice">Ambiente de teste: nenhuma vaga real será consumida e nenhum Push real será enviado.</div><h1 class="title">Como podemos ajudar?</h1><div class="grid">${mods.map(m=>`<button class="module" data-mod="${m[0]}"><span class="moduleIcon" style="background:${color(m[3])}">${icon[m[2]]}</span><b>${m[0]}</b><small>${m[1]}</small></button>`).join('')}</div><button class="btn alt" id="swap" style="margin-top:22px">Trocar integrante da família</button>`);document.querySelectorAll('[data-mod]').forEach(b=>{b.onclick=()=>b.dataset.mod==='Serviços'?services():panel(b.dataset.mod)});document.getElementById('swap').onclick=family}
function services(){let list=[['Atendimento médico','Solicitar avaliação ou consulta na unidade','doctor','green'],['Enfermagem','Curativo, orientação, aferição e procedimentos','nurse','purple'],['Nutricionista','Acompanhamento alimentar','leaf','recados'],['Odontologia','Atendimento comum ou urgência','tooth','calendar'],['Visita domiciliar TACS','Solicitar visita do agente comunitário','person','profile'],['Bolsa Família','Acompanhamento, peso e altura','calendar','campaign']];shell(`<h1 class="title">Serviços</h1><p class="lead">Escolha o serviço necessário.</p>${list.map((s,i)=>`<button class="service" data-s="${i}"><span class="serviceIcon" style="background:${color(s[3])}">${icon[s[2]]}</span><span><b>${s[0]}</b><small>${s[1]}</small></span></button>`).join('')}<div class="field"><label>Descrição do pedido</label><textarea id="desc" placeholder="Explique seu pedido"></textarea></div><button class="btn" id="send">Enviar solicitação de teste</button><button class="btn alt" id="back" style="margin-top:12px">Voltar</button>`);document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.service').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.service=list[+b.dataset.s][0]});document.getElementById('send').onclick=()=>panel('Solicitação enviada',`<div class="item"><b>Fluxo concluído.</b><small>Serviço: ${S.service||'não selecionado'}<br>Registro apenas demonstrativo.</small><span class="status">Homologação</span></div>`);document.getElementById('back').onclick=home}
function panel(title,custom){let p=document.createElement('div');p.className='panel on';p.innerHTML=`<div class="drawer"><div class="drawerHead"><h3>${title}</h3><button class="x">×</button></div>${custom||'<div class="item"><b>Conteúdo de teste.</b><small>Este módulo será ligado aos dados reais depois da aprovação visual.</small><span class="status">Simulado</span></div>'}</div>`;document.body.appendChild(p);p.querySelector('.x').onclick=()=>p.remove();p.onclick=e=>{if(e.target===p)p.remove()}}
opening();
</script>
</body>
</html>
