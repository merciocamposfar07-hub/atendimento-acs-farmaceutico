  <title>Painel oficial de profissionais e serviços • Portal TACS</title>
  <style>
    body{margin:0;background:#eaf2f6;color:#102d40;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .carga{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .caixa{max-width:620px;background:#fff;border:2px solid #a9c0ca;border-radius:24px;padding:24px}
    h1{margin:0 0 12px}.erro{color:#a52d2d}
  </style>
</head>
<body>
  <div class="carga"><div class="caixa"><h1>Painel oficial</h1><p id="mensagem">Carregando profissionais e serviços…</p></div></div>
  <script>
  (function(){
    'use strict';
    var origem='/atendimento-acs-farmaceutico/teste-v1/painel-profissionais-servicos-v1.html?v=20260813-admin-v102';
    var trocas=[
      ['<title>Painel administrativo V1 • Portal TACS</title>','<title>Painel oficial de profissionais e serviços • Portal TACS</title>'],
      ['AMBIENTE ISOLADO • FASE 2','PAINEL ADMINISTRATIVO OFICIAL'],
      ['Painel administrativo V1','Profissionais e serviços'],
      ['A tela é isolada, mas qualquer alteração confirmada é gravada na planilha real. Nesta primeira abertura, apenas confira a leitura. Não salve mudanças ainda.','Painel administrativo oficial conectado à planilha do Portal TACS. Alterações salvas e confirmadas são aplicadas ao Portal do Morador.'],
      ['Verificando a implantação separada de teste…','Verificando o painel administrativo oficial…'],
      ['Implantação de teste disponível. Digite o PIN para carregar os dados.','Painel administrativo oficial disponível. Digite o PIN para carregar os dados.'],
      ['Edite somente após a conferência desta primeira leitura.','Confira os dados antes de salvar qualquer alteração.'],
      ['Portal TACS • Painel administrativo isolado','Portal TACS • Painel administrativo oficial'],
      ['Portal do Morador não foi modificado','Alterações confirmadas são aplicadas ao Portal do Morador']
    ];
    function substituir(t,a,b){return t.split(a).join(b)}
    var painel=fetch(origem,{cache:'default'}).then(function(r){if(!r.ok)throw new Error('Não foi possível carregar o painel.');return r.text()});
    painel.then(function(html){
      var aquecimento=window.PortalTacsAdminWarmup;
      var conexaoSegura=JSON.stringify(aquecimento&&aquecimento.resultado||{ok:false,preparando:true}).replace(/</g,'\\u003c');
      var protecaoDuplicidade="<scr"+"ipt>(function(){function t(v){return String(v==null?'':v).trim()}function id(v){var s=t(v).toUpperCase();if(s.normalize)s=s.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');return s.replace(/[^A-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60)}function existente(chave){if(!chave)return false;var cards=document.querySelectorAll('#listaProfissionais [data-id]');for(var i=0;i<cards.length;i++){if(id(cards[i].getAttribute('data-id'))===chave)return true}return false}function atualizar(){var nome=document.getElementById('novoNome'),titulo=document.getElementById('novoTitulo'),preview=document.getElementById('novoIdPreview');if(!nome||!titulo||!preview)return;var chave=id(nome.value||titulo.value);if(chave&&existente(chave)){preview.textContent='Profissional já cadastrado — use Profissionais > Editar.';preview.style.borderColor='#d88a8a';preview.style.background='#fff0f0';preview.style.color='#a52d2d'}else{preview.style.borderColor='';preview.style.background='';preview.style.color=''}}document.addEventListener('input',function(e){if(e.target&&((e.target.id==='novoNome')||(e.target.id==='novoTitulo')))setTimeout(atualizar,0)},true);document.addEventListener('submit',function(e){if(!e.target||e.target.id!=='novoProfissionalForm')return;var nome=document.getElementById('novoNome'),titulo=document.getElementById('novoTitulo'),chave=id((nome&&nome.value)||(titulo&&titulo.value));if(!chave||!existente(chave))return;e.preventDefault();e.stopImmediatePropagation();var preview=document.getElementById('novoIdPreview'),status=document.getElementById('statusOperacao');if(preview){preview.textContent='Profissional já cadastrado — use Profissionais > Editar.';preview.style.borderColor='#d88a8a';preview.style.background='#fff0f0';preview.style.color='#a52d2d'}if(status){status.textContent='Este profissional já existe. Abra a aba Profissionais e use a edição do cadastro existente.';status.className='status erro'}},true)})();</scr"+"ipt>";
      var bootstrap='<head><base href="/atendimento-acs-farmaceutico/teste-v1/"><scr'+'ipt>window.PortalTacsAdminPreload='+conexaoSegura+';</scr'+'ipt><scr'+'ipt src="../admin-warmup.js?v=20260813-admin-v102"></scr'+'ipt>'+protecaoDuplicidade;
      html=substituir(html,'<head>',bootstrap);
      trocas.forEach(function(par){html=substituir(html,par[0],par[1])});
      document.open();document.write(html);document.close();
    }).catch(function(erro){
      var e=document.getElementById('mensagem');
      e.className='erro';e.textContent=erro.message+' Atualize a página.';
    });
  })();
  </script>
</body>
</html>
