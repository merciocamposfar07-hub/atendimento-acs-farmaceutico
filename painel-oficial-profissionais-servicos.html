<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#073A55">
  <link rel="icon" type="image/svg+xml" href="/atendimento-acs-farmaceutico/icons/painel-profissionais.svg">
  <link rel="apple-touch-icon" href="/atendimento-acs-farmaceutico/icons/painel-profissionais.svg">
  <link rel="manifest" href="/atendimento-acs-farmaceutico/manifest-profissionais.webmanifest">

  <title>Painel oficial de profissionais e serviços • Portal TACS</title>
  <style>
    body{margin:0;background:#eaf2f6;color:#102d40;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .carga{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .caixa{max-width:620px;background:#fff;border:2px solid #a9c0ca;border-radius:24px;padding:24px}
    h1{margin:0 0 12px}.erro{color:#a52d2d}
  </style>
</head>
<body>
  <div class="carga"><div class="caixa"><h1>Painel oficial</h1><p id="mensagem">Carregando profissionais e serviços…</p></div></div>
  <script>
  (function(){
    'use strict';
    var origem='/atendimento-acs-farmaceutico/teste-v1/painel-profissionais-servicos-v1.html?v=20260804-1711';
    var trocas=[
      ['<title>Painel administrativo V1 • Portal TACS</title>','<title>Painel oficial de profissionais e serviços • Portal TACS</title>'],
      ['AMBIENTE ISOLADO • FASE 2','PAINEL ADMINISTRATIVO OFICIAL'],
      ['Painel administrativo V1','Profissionais e serviços'],
      ['A tela é isolada, mas qualquer alteração confirmada é gravada na planilha real. Nesta primeira abertura, apenas confira a leitura. Não salve mudanças ainda.','Painel administrativo oficial conectado à planilha do Portal TACS. Alterações salvas e confirmadas são aplicadas ao Portal do Morador.'],
      ['Verificando a implantação separada de teste…','Verificando o painel administrativo oficial…'],
      ['Implantação de teste disponível. Digite o PIN para carregar os dados.','Painel administrativo oficial disponível. Digite o PIN para carregar os dados.'],
      ['Edite somente após a conferência desta primeira leitura.','Confira os dados antes de salvar qualquer alteração.'],
      ['Portal TACS • Painel administrativo isolado','Portal TACS • Painel administrativo oficial'],
      ['Portal do Morador não foi modificado','Alterações confirmadas são aplicadas ao Portal do Morador']
    ];
    function substituir(t,a,b){return t.split(a).join(b)}
    function aplicarRetryServidor(html){
      var regra=/function jsonp\([^)]*\)\{[\s\S]*?\}\nfunction finalizar/;
      var nova="function jsonp(action,parametros,receber){contador++;var base='__ps_retry_'+Date.now()+'_'+contador,p=parametros||{},tentativa=0,concluido=false;function executar(){tentativa++;var nome=base+'_'+tentativa,s=document.createElement('script'),fim=false,timer=setTimeout(function(){falhar('O servidor não respondeu à consulta.')},20000);function limpar(){clearTimeout(timer);if(s.parentNode)s.parentNode.removeChild(s);try{delete window[nome]}catch(e){window[nome]=undefined}}function falhar(msg){if(fim||concluido)return;fim=true;limpar();if(tentativa<2){setTimeout(executar,900);return}concluido=true;receber({ok:false,message:msg})}window[nome]=function(r){if(fim||concluido)return;fim=true;concluido=true;limpar();receber(r)};var q=['action='+encodeURIComponent(action),'callback='+encodeURIComponent(nome),'_='+Date.now()];Object.keys(p).forEach(function(k){q.push(encodeURIComponent(k)+'='+encodeURIComponent(txt(p[k])))});s.src=API+'?'+q.join('&');s.onerror=function(){falhar('Falha de rede ao consultar o servidor.')};document.head.appendChild(s)}executar()}";
      if(!regra.test(html))throw new Error('A rotina de conexão do painel não foi localizada.');
      return html.replace(regra,nova+'\nfunction finalizar');
    }
    fetch(origem,{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('Não foi possível carregar o painel.');
      return r.text();
    }).then(function(html){
      html=substituir(html,'<head>','<head><base href="/atendimento-acs-farmaceutico/teste-v1/">');
      trocas.forEach(function(par){html=substituir(html,par[0],par[1])});
      html=aplicarRetryServidor(html);
      document.open();document.write(html);document.close();
    }).catch(function(erro){
      var e=document.getElementById('mensagem');
      e.className='erro';e.textContent=erro.message+' Atualize a página.';
    });
  })();
  </script>
</body>
</html>
