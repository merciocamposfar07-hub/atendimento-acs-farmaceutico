      var conexaoSegura=JSON.stringify(aquecimento&&aquecimento.resultado||{ok:false,preparando:true}).replace(/</g,'\\u003c');
      var protecaoDuplicidade="<scr"+"ipt>(function(){function t(v){return String(v==null?'':v).trim()}function id(v){var s=t(v).toUpperCase();if(s.normalize)s=s.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');return s.replace(/[^A-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60)}function existente(chave){if(!chave)return false;var cards=document.querySelectorAll('#listaProfissionais [data-id]');for(var i=0;i<cards.length;i++){if(id(cards[i].getAttribute('data-id'))===chave)return true}return false}function atualizar(){var nome=document.getElementById('novoNome'),titulo=document.getElementById('novoTitulo'),preview=document.getElementById('novoIdPreview');if(!nome||!titulo||!preview)return;var chave=id(nome.value||titulo.value);if(chave&&existente(chave)){preview.textContent='Profissional já cadastrado — use Profissionais > Editar.';preview.style.borderColor='#d88a8a';preview.style.background='#fff0f0';preview.style.color='#a52d2d'}else{preview.style.borderColor='';preview.style.background='';preview.style.color=''}}document.addEventListener('input',function(e){if(e.target&&((e.target.id==='novoNome')||(e.target.id==='novoTitulo')))setTimeout(atualizar,0)},true);document.addEventListener('submit',function(e){if(!e.target||e.target.id!=='novoProfissionalForm')return;var nome=document.getElementById('novoNome'),titulo=document.getElementById('novoTitulo'),chave=id((nome&&nome.value)||(titulo&&titulo.value));if(!chave||!existente(chave))return;e.preventDefault();e.stopImmediatePropagation();var preview=document.getElementById('novoIdPreview'),status=document.getElementById('statusOperacao');if(preview){preview.textContent='Profissional já cadastrado — use Profissionais > Editar.';preview.style.borderColor='#d88a8a';preview.style.background='#fff0f0';preview.style.color='#a52d2d'}if(status){status.textContent='Este profissional já existe. Abra a aba Profissionais e use a edição do cadastro existente.';status.className='status erro'}},true)})();</scr"+"ipt>";
      var protecaoAutonomia="<scr"+"ipt>(function(){function t(v){return String(v==null?'':v).trim()}function n(v){var s=t(v).toUpperCase();if(s.normalize)s=s.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');return s.replace(/[^A-Z0-9]+/g,'_').replace(/^_+|_+$/g,'')}function c(v){var s=n(v);if(!s)return'';if(s.indexOf('PSIC')!==-1)return'PSIC';if(s.indexOf('ODONT')!==-1||s.indexOf('DENT')!==-1)return'ODONT';if(s.indexOf('MEDIC')!==-1)return'MEDIC';if(s.indexOf('ENFERM')!==-1)return'ENFERM';if(s.indexOf('NUTRIC')!==-1)return'NUTRIC';if(s.indexOf('FISIO')!==-1)return'FISIO';if(s.indexOf('FONO')!==-1)return'FONO';if(s.indexOf('FARMAC')!==-1)return'FARMAC';if(s.indexOf('ASSIST')!==-1&&s.indexOf('SOCIAL')!==-1)return'SOCIAL';return s}function cards(seletor){return Array.prototype.slice.call(document.querySelectorAll(seletor))}function achar(seletor,id){var a=cards(seletor);for(var i=0;i<a.length;i++)if(n(a[i].getAttribute('data-id'))===n(id))return a[i];return null}function refs(card){var out=[];if(!card)return out;var did=card.getAttribute('data-id')||'';out.push(did);out.push(did.replace(/^ATENDIMENTO[_-]*/i,''));var h=card.querySelector('summary h3');if(h)out.push(h.textContent||'');var sub=card.querySelector('summary .sub');if(sub)out.push((sub.textContent||'').split('•')[0]);return out.filter(Boolean)}function inferir(select,card){if(!select)return false;if(select.getAttribute('data-tacs-user-changed')==='1')return !!select.value;var r=refs(card),best='',bestScore=0,empates=0;for(var i=0;i<select.options.length;i++){var o=select.options[i],score=0,ov=n(o.value),ot=n(o.textContent),ocv=c(o.value),oct=c(o.textContent);for(var j=0;j<r.length;j++){var rn=n(r[j]),rc=c(r[j]);if(rn&&(ov===rn||ot===rn||ov===rn.replace(/^ATENDIMENTO_/,'')||rn===ov.replace(/^ATENDIMENTO_/,'')))score=Math.max(score,120);else if(rc&&rc.length>=4&&(ocv===rc||oct===rc))score=Math.max(score,90)}if(score>bestScore){best=o.value;bestScore=score;empates=1}else if(score&&score===bestScore){empates++}}if(best&&bestScore>=90&&empates===1){select.value=best;select.setAttribute('data-vinculo-territorial-reparado','1');return true}return !!select.value}function reparar(root){var a=(root||document).querySelectorAll? (root||document).querySelectorAll('#listaServicos details[data-id]'):[];for(var i=0;i<a.length;i++)inferir(a[i].querySelector('[name=\"profissionalId\"]'),a[i])}function campo(card,nome){var e=card&&card.querySelector('[name=\"'+nome+'\"]');return e?e.value:''}function chk(card,nome){var e=card&&card.querySelector('[name=\"'+nome+'\"]');return !!(e&&e.checked)}var ultima=null;function registrar(card,tipo){if(!card)return;if(tipo==='servico'){var sel=card.querySelector('[name=\"profissionalId\"]');inferir(sel,card);ultima={tipo:tipo,id:campo(card,'id'),profissionalId:campo(card,'profissionalId'),nome:t(campo(card,'nome')),descricao:t(campo(card,'descricaoAutomatica')),ordem:Number(campo(card,'ordem')||0),ativo:chk(card,'ativo'),vaga:chk(card,'permiteVagaComum'),emerg:chk(card,'permiteEmergencia')}}else{ultima={tipo:tipo,id:campo(card,'id'),nome:t(campo(card,'nome')),titulo:t(campo(card,'tituloPublico')),icone:t(campo(card,'icone')),ordem:Number(campo(card,'ordem')||0),ativo:chk(card,'ativo')}}}function confere(){if(!ultima)return false;var card=ultima.tipo==='servico'?achar('#listaServicos details[data-id]',ultima.id):achar('#listaProfissionais details[data-id]',ultima.id);if(!card)return false;if(ultima.tipo==='servico'){var sel=card.querySelector('[name=\"profissionalId\"]');inferir(sel,card);return n(campo(card,'profissionalId'))===n(ultima.profissionalId)&&t(campo(card,'nome'))===ultima.nome&&t(campo(card,'descricaoAutomatica'))===ultima.descricao&&Number(campo(card,'ordem')||0)===ultima.ordem&&chk(card,'ativo')===ultima.ativo&&chk(card,'permiteVagaComum')===ultima.vaga&&chk(card,'permiteEmergencia')===ultima.emerg}return t(campo(card,'nome'))===ultima.nome&&t(campo(card,'tituloPublico'))===ultima.titulo&&t(campo(card,'icone'))===ultima.icone&&Number(campo(card,'ordem')||0)===ultima.ordem&&chk(card,'ativo')===ultima.ativo}function validarStatus(tentativa){var st=document.getElementById('statusOperacao');if(!st||st.textContent.indexOf('O servidor respondeu, mas a releitura não coincidiu integralmente')===-1)return;if(confere()){st.textContent=ultima&&ultima.tipo==='servico'?'Serviço gravado e confirmado pela releitura da planilha.':'Profissional gravado e confirmado pela releitura da planilha.';st.className='status ok';return}if(tentativa<10)setTimeout(function(){validarStatus(tentativa+1)},500)}document.addEventListener('change',function(e){if(e.target&&e.target.name==='profissionalId')e.target.setAttribute('data-tacs-user-changed','1')},true);document.addEventListener('click',function(e){var b=e.target&&e.target.closest?e.target.closest('.salvarServ,.salvarProf'):null;if(!b)return;var card=b.closest('.cartao');registrar(card,b.classList.contains('salvarServ')?'servico':'profissional')},true);document.addEventListener('DOMContentLoaded',function(){reparar(document);var alvo=document.getElementById('listaServicos');if(alvo&&window.MutationObserver)new MutationObserver(function(){reparar(alvo)}).observe(alvo,{childList:true,subtree:true});var st=document.getElementById('statusOperacao');if(st&&window.MutationObserver)new MutationObserver(function(){if(st.textContent.indexOf('O servidor respondeu, mas a releitura não coincidiu integralmente')!==-1)validarStatus(0)}).observe(st,{childList:true,subtree:true,characterData:true})});})();</scr"+"ipt>";
