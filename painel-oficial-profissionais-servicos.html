<style id="portalTacsAdminUiStandardV1">
/*
 * Portal TACS — padrão visual administrativo seguro V1.1
 * Fonte única de verdade visual. Este arquivo NÃO é carregado em runtime.
 * O workflow injeta este conteúdo inline nos painéis para não criar requisição HTTP extra.
 * Regra: não renomear/remover IDs, classes funcionais, data-*, inputs ou seletores usados pelo JS.
 * Gate V1.1: revisão visual/cache pode mudar sem acoplar os testes funcionais a um token fixo.
 */
:root{
  --tacs-petroleo:#073a55;
  --tacs-petroleo-2:#0b5878;
  --tacs-petroleo-3:#0e6688;
  --tacs-borda:#69c7e7;
  --tacs-fundo:#e3f0f4;
  --tacs-superficie:#ffffff;
  --tacs-texto:#102d40;
  --tacs-texto-claro:#eaf7fb;
  --tacs-sucesso:#2f7d4b;
  --tacs-alerta:#9a6a00;
  --tacs-perigo:#9f3936;
  --tacs-raio-campo:18px;
  --tacs-raio-botao:22px;
  --tacs-raio-card:28px;

html,body{
  max-width:100%;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}

body{
  color:var(--tacs-texto);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-weight:400;
}

*,*::before,*::after{box-sizing:border-box}

h1,h2,h3,.title,.section-title{
  font-weight:800;
  letter-spacing:-.015em;
  line-height:1.12;
  overflow-wrap:break-word;
}

p,label,.sub,.muted,.meta,small{
  line-height:1.42;
  overflow-wrap:break-word;
}

.panel,.card,.box,.area-row,.maprow,.health-card,.summary-card,.stat,.metric,details,.module{
  min-width:0;
  max-width:100%;
  border-radius:var(--tacs-raio-card)!important;
}

.card summary>div,details summary>div:first-child,
.row>*,.grid>*,.stats>*,.summary>*,.metrics>*{
  min-width:0;
}

input,select,textarea,button,.btn,.botao{
  max-width:100%;
  font:inherit;
}

input,select,textarea{
  min-height:54px;
  border-radius:var(--tacs-raio-campo)!important;
  background:#fff;
  color:var(--tacs-texto);
}

textarea{min-height:110px;resize:vertical}

button,.btn,.botao{
  min-height:56px;
  border-radius:var(--tacs-raio-botao)!important;
  font-weight:800!important;
  line-height:1.18;
  white-space:normal;
  overflow-wrap:break-word;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

/* Ações de salvar/confirmar: mesmo padrão visual, sem alterar classes/IDs funcionais. */
button[type="submit"],
button[id*="salvar"],button[id*="save"],
button[class*="salvar"],button[class*="save"],
.btn-primary,.primary-action{
  background:linear-gradient(145deg,var(--tacs-petroleo),var(--tacs-petroleo-2))!important;
  color:#fff!important;
  border:3px solid var(--tacs-borda)!important;
  box-shadow:var(--tacs-sombra-acao)!important;
}

/* Estados destrutivos continuam semanticamente vermelhos. */
button.danger,button.dangerous,button.delete,button.remove,
.btn-danger,.botao.perigo,.botao.vermelho,.red-action{
  background:var(--tacs-perigo)!important;
  color:#fff!important;
  border:3px solid #d77d76!important;
  box-shadow:0 7px 18px rgba(159,57,54,.18)!important;
}

/* Ação principal azul-petróleo sem depender de renomear classes existentes. */
.btn.green,.botao.verde,.action-primary{
  background:linear-gradient(145deg,var(--tacs-petroleo),var(--tacs-petroleo-2))!important;
  color:#fff!important;
  border-color:var(--tacs-borda)!important;
}

/* Abas: ativo petróleo; inativo claro. */
.tabs button.active,.tab.active,[role="tab"][aria-selected="true"]{
  background:var(--tacs-petroleo)!important;
  color:#fff!important;
  border-color:var(--tacs-petroleo)!important;
}

/* Selos nunca podem extravasar. Cores semânticas existentes são preservadas. */
.signal,.badge,.status-badge,.pill,.chip,.tag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  max-width:100%;
  border-radius:999px!important;
  padding:.45em .8em;
  line-height:1.05;
  font-weight:800;
  white-space:nowrap;
}

/* Foco acessível, sem botão manual de contraste. */
input:focus-visible,select:focus-visible,textarea:focus-visible,
button:focus-visible,.btn:focus-visible,.botao:focus-visible,a:focus-visible{
  outline:4px solid #ffd54f!important;
  outline-offset:2px!important;
}

/* Controles antigos de contraste permanecem removidos por decisão atual do produto. */
#portalTacsContrastToggleV1,#contrastToggle,#alternarContraste,
.contrasteBotao,.preferenciaVisual{
  display:none!important;
}

/* Proteção de conteúdo técnico e nomes longos. */
.card h3,.area-row strong,.area-row .sub,summary strong,
summary span:not(.signal),.technical-id,.long-text{
  overflow-wrap:anywhere;
  word-break:break-word;
}

footer,.footer{
  max-width:100%;
  line-height:1.35;
}

@media(max-width:430px){
  button,.btn,.botao{min-height:58px}
  .card summary{align-items:flex-start!important}
  .signal,.badge,.status-badge,.pill,.chip,.tag{margin-top:2px}
  h1{font-size:clamp(1.75rem,8vw,2.4rem)}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
  }
}
</style>
