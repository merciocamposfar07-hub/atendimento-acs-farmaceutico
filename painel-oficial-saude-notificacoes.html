<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#073A55">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="icon" type="image/svg+xml" href="/atendimento-acs-farmaceutico/icons/painel-recados.svg">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="//script.google.com">
  <script src="/atendimento-acs-farmaceutico/admin-warmup.js?v=20260813-admin-v103"></script>
  <title>Saúde das notificações • Portal TACS</title>
  <style>
    body{margin:0;background:#eaf2f6;color:#102d40;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .carga{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .caixa{max-width:620px;background:#fff;border:2px solid #a9c0ca;border-radius:24px;padding:24px}
    h1{margin:0 0 12px}.erro{color:#a52d2d}
  </style>
</head>
<body>
  <div class="carga"><div class="caixa"><h1>Saúde das notificações</h1><p id="mensagem">Carregando aparelhos e estados técnicos…</p></div></div>
  <script>
  (function(){
    'use strict';
    var origem='/atendimento-acs-farmaceutico/teste-v1/painel-recados-campanhas-v1.html?v=20260813-notif-health-v106';
    var estilo='<style id="modoSaudeNotificacoes">'+
      'body.modo-saude-notificacoes header,'+
      'body.modo-saude-notificacoes main>.preferenciaVisual,'+
      'body.modo-saude-notificacoes main>.nota,'+
      'body.modo-saude-notificacoes main>section.card:not(#saudeNotificacoes),'+
      'body.modo-saude-notificacoes footer{display:none!important}'+
      'body.modo-saude-notificacoes main{padding-top:14px}'+
      'body.modo-saude-notificacoes #saudeNotificacoes{margin-top:0}'+
      '</style>';
    var carregando='<div id="saudeNotificacoesCarregando" class="card"><h2>Saúde das notificações</h2><div class="status aviso">Consultando os aparelhos da área…</div></div>';
    var vigia="(function(){'use strict';var painel=document.getElementById('saudeNotificacoes'),carga=document.getElementById('saudeNotificacoesCarregando');if(!painel)return;function atualizar(){if(!painel.classList.contains('oculto')){if(carga&&carga.parentNode)carga.parentNode.removeChild(carga);window.scrollTo(0,0)}}new MutationObserver(atualizar).observe(painel,{attributes:true,attributeFilter:['class']});atualizar()}());";
    function substituir(texto,antes,depois){return texto.split(antes).join(depois)}
    fetch(origem,{cache:'default'}).then(function(resposta){
      if(!resposta.ok)throw new Error('Não foi possível carregar a saúde das notificações.');
      return resposta.text();
    }).then(function(html){
      var aquecimento=window.PortalTacsAdminWarmup;
      var conexaoSegura=JSON.stringify(aquecimento&&aquecimento.resultado||{ok:false,preparando:true}).replace(/</g,'\\u003c');
      var bootstrap='<head><base href="/atendimento-acs-farmaceutico/teste-v1/"><scr'+'ipt>window.PortalTacsAdminPreload='+conexaoSegura+';</scr'+'ipt>';
      html=substituir(html,'<head>',bootstrap);
      html=substituir(html,'<title>Recados e campanhas V1 • Portal TACS</title>','<title>Saúde das notificações • Portal TACS</title>');
      html=substituir(html,'</head>',estilo+'</head>');
      html=substituir(html,'<body>','<body class="modo-saude-notificacoes">');
      html=substituir(html,'<section id="saudeNotificacoes"',carregando+'<section id="saudeNotificacoes"');
      html=substituir(html,'</body>','<scr'+'ipt>'+vigia+'</scr'+'ipt></body>');
      document.open();document.write(html);document.close();
    }).catch(function(erro){
      var elemento=document.getElementById('mensagem');
      elemento.className='erro';elemento.textContent=erro.message+' Atualize a página.';
    });
  })();
  </script>
</body>
</html>
