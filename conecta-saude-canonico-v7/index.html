<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020812"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Conecta Saúde Comunitária</title><style>:root{--bg:#020812;--bg2:#061426;--card:#0b2338;--card2:#0e2d47;--line:#2c6f99;--txt:#fff;--muted:#aabccb;--teal:#20e0c0;--blue:#168cff;--red:#ff4b6e;--gold:#ffc033;--green:#16cf73;--purple:#7c3cff;--orange:#ff6b1a;--pink:#ef2f91;--shadow:0 26px 65px rgba(0,0,0,.42)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100svh;overflow-x:hidden;-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}.opening,.screen{min-height:100svh;background:radial-gradient(circle at 50% 28%,rgba(18,93,156,.25),transparent 34%),linear-gradient(180deg,#020812 0%,#030b18 62%,#020812 100%);padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 22px)}.opening{display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.stage{position:relative;height:min(54svh,560px);min-height:390px;width:min(100%,560px);margin:0 auto;display:grid;place-items:center}.rings{position:absolute;width:min(86vw,440px);height:min(86vw,440px);border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 64px,rgba(56,120,171,.23) 65px 66px,transparent 67px 128px);opacity:.78}.glow{position:absolute;width:270px;height:270px;border-radius:50%;background:radial-gradient(circle,rgba(21,127,230,.30),rgba(21,127,230,.10) 49%,transparent 72%)}.mainLogo{position:absolute;width:178px;height:178px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 31% 23%,#ffffff 0,#c8ecff 10%,#11346b 35%,#08235b 67%,#030a1a 100%);box-shadow:0 0 0 8px rgba(35,105,255,.14),0 0 0 18px rgba(11,45,98,.25),0 0 42px rgba(39,143,255,.55),inset 0 7px 16px rgba(255,255,255,.55),inset 0 -22px 35px rgba(0,3,20,.72);z-index:3}.mainLogo svg{width:126px;height:126px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}.planet{position:absolute;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 18px 32px rgba(0,0,0,.36),inset 0 3px 7px rgba(255,255,255,.42),inset 0 -13px 22px rgba(0,0,0,.34);z-index:2}.planet svg{width:40px;height:40px}.planet:before{content:"";position:absolute;inset:6px 8px auto 8px;height:20px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.44),transparent)}.p1{top:4%;left:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 24%,#fff,#3fa1ff 18%,#094dd2 66%,#04144a)}.p2{top:14%;right:12%;background:radial-gradient(circle at 35% 24%,#fff,#ffad4a 18%,#ff4f14 66%,#5a1406)}.p3{top:38%;right:0;background:radial-gradient(circle at 35% 24%,#fff,#63fff0 18%,#03aeb8 66%,#034b5c)}.p4{right:8%;bottom:13%;background:radial-gradient(circle at 35% 24%,#fff,#ffe26c 18%,#d69600 66%,#4e3100)}.p5{bottom:4%;left:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 24%,#fff,#63c8ff 18%,#1685d9 66%,#06315f)}.p6{left:9%;bottom:12%;background:radial-gradient(circle at 35% 24%,#fff,#43f18c 18%,#04a649 66%,#033b1b)}.p7{top:39%;left:0;background:radial-gradient(circle at 35% 24%,#fff,#b879ff 18%,#7525dd 66%,#260858)}.p8{top:15%;left:12%;background:radial-gradient(circle at 35% 24%,#fff,#ff75b3 18%,#e51871 66%,#520626)}.copy{width:min(100%,560px);margin:0 auto;text-align:left}.kicker{color:var(--teal);letter-spacing:.31em;font-size:13px;font-weight:950;margin-bottom:18px}.copy h1{font-size:clamp(38px,8.5vw,54px);line-height:1.08;letter-spacing:-.055em;margin:0 0 20px}.concepts{display:grid;grid-template-columns:1fr 1fr 1fr;margin:0 0 22px;color:#dbe6ee}.concept{text-align:center;border-left:1px solid rgba(112,172,222,.48);font-size:15px;line-height:1.25}.concept:first-child{border-left:0;text-align:left}.concept:last-child{text-align:right}.network{text-align:center;color:#9fe3d0;letter-spacing:.28em;font-size:13px;font-weight:850;margin:0 0 28px}.btn{width:100%;min-height:68px;border:0;border-radius:22px;background:linear-gradient(100deg,#19e0bd,#21c5de 48%,#168cff);color:#06111f;font-size:20px;font-weight:950;box-shadow:0 16px 34px rgba(12,116,211,.32);padding:0 18px}.btn.alt{background:transparent;border:1.5px solid var(--line);color:white;box-shadow:none}.btn.small{min-height:58px;font-size:17px}.btn:active{transform:translateY(1px)}.shell{width:min(100%,620px);margin:0 auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}.brand h2{font-size:23px;line-height:1.08;margin:0;font-weight:900;letter-spacing:-.03em}.brand small{display:block;color:var(--muted);font-size:16px;margin-top:3px}.pill{border:1px solid var(--line);border-radius:999px;color:#9fead7;padding:8px 13px;font-size:14px}.notice{background:#0c2c42;border-left:4px solid var(--teal);border-radius:16px;padding:16px 18px;color:#d7e5ef;font-size:18px;line-height:1.35;margin:14px 0 28px}.title{font-size:clamp(40px,8.8vw,58px);line-height:1.02;letter-spacing:-.055em;margin:0 0 16px}.lead{font-size:22px;line-height:1.42;color:#c3d1dc;margin:0 0 24px}.card{border:1.5px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#0d2c44,#07192d);box-shadow:var(--shadow);padding:20px;margin:0 0 18px}.progress{display:flex;gap:8px;margin-bottom:20px}.bar{height:8px;border-radius:999px;background:#1a3c58;flex:1}.bar.on{background:linear-gradient(90deg,var(--teal),var(--blue))}.field{margin:18px 0}.field label{display:block;font-size:20px;font-weight:900;margin:0 0 10px}.field input,.field textarea{width:100%;border:1.6px solid var(--line);border-radius:18px;background:#071d31;color:#fff;padding:0 16px;outline:none}.field input{height:66px;font-size:24px;font-weight:800}.field textarea{min-height:126px;padding-top:14px;font-size:19px;line-height:1.35;resize:none}.field input:focus,.field textarea:focus{box-shadow:0 0 0 4px rgba(32,224,192,.16);border-color:#29d7cd}.warn{color:#ffd371;font-weight:800;font-size:17px;line-height:1.4;margin-top:14px}.err{color:#ff8fa0;font-weight:900;font-size:17px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.module,.person,.service{border:1.5px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#0d2d45,#07192d);color:#fff;text-align:left;box-shadow:0 14px 28px rgba(0,0,0,.22)}.module{min-height:150px;padding:22px 20px}.moduleIcon,.personIcon,.serviceIcon{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;margin-bottom:20px;box-shadow:inset 0 2px 4px rgba(255,255,255,.35),inset 0 -10px 16px rgba(0,0,0,.32),0 10px 22px rgba(0,0,0,.26)}.moduleIcon svg,.personIcon svg,.serviceIcon svg{width:33px;height:33px}.module b,.service b{display:block;font-size:24px;line-height:1.05}.module small,.service small,.person small{display:block;color:var(--muted);font-size:18px;line-height:1.25;margin-top:7px}.person{width:100%;display:flex;align-items:center;gap:14px;padding:15px;margin-bottom:12px}.personIcon{margin-bottom:0;flex:none}.person b{font-size:20px}.service{width:100%;min-height:112px;padding:18px;display:flex;align-items:center;gap:14px}.serviceIcon{margin-bottom:0;flex:none}.service.on{border-color:var(--teal);box-shadow:0 0 0 4px rgba(32,224,192,.15),0 14px 28px rgba(0,0,0,.22)}.footer{color:#8299ad;text-align:center;font-size:13px;margin-top:22px}.row{display:flex;gap:12px}.row .btn{min-height:60px}.panel{position:fixed;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(10px);display:none;align-items:flex-end;z-index:9}.panel.on{display:flex}.drawer{width:100%;max-height:86svh;overflow:auto;background:#071426;border:1px solid #173e5b;border-radius:28px 28px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 22px);box-shadow:0 -24px 50px rgba(0,0,0,.46)}.drawerHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.drawerHead h3{font-size:28px;line-height:1.05;margin:0}.x{width:48px;height:48px;border-radius:16px;border:1px solid var(--line);background:#0b2237;color:#fff;font-size:28px}.item{border:1px solid #2d6f99;border-radius:18px;background:#0b2237;padding:15px;margin:10px 0}.item b{display:block;font-size:18px}.item small{display:block;color:var(--muted);margin-top:5px;font-size:16px;line-height:1.35}.status{display:inline-flex;border-radius:999px;padding:7px 11px;background:rgba(32,224,192,.14);color:#9cebd9;font-size:13px;font-weight:900;margin-top:10px}@media(max-width:380px){.planet{width:60px;height:60px}.planet svg{width:34px;height:34px}.mainLogo{width:152px;height:152px}.mainLogo svg{width:108px;height:108px}.stage{min-height:360px}.copy h1{font-size:35px}.title{font-size:37px}.lead{font-size:20px}.module b{font-size:22px}.module{min-height:136px;padding:18px}.grid{gap:11px}.concept{font-size:13px}.network{font-size:12px}}</style></head><body><div id="app"></div><script>const sv={logo:'<svg viewBox="0 0 120 120" fill="none"><path d="M73 29a33 33 0 1 0 0 62" stroke="white" stroke-width="14" stroke-linecap="round"/><path d="M73 60h30M88 45v30" stroke="#75efe7" stroke-width="13" stroke-linecap="round"/><path d="M29 60h15l7-13 13 28 7-15h10" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>',tooth:'<svg viewBox="0 0 64 64" fill="none"><path d="M21 10c6 0 7 4 11 4s5-4 11-4c9 0 13 8 10 19-2 8-5 19-11 22-5 2-5-12-10-12s-5 14-10 12c-6-3-9-14-11-22C8 18 12 10 21 10Z" fill="white"/></svg>',run:'<svg viewBox="0 0 64 64" fill="none"><circle cx="39" cy="12" r="7" fill="white"/><path d="M28 23l12 6 9 13M29 24l-8 12 11 3M34 38l-9 16M44 32l-2 21" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>',brain:'<svg viewBox="0 0 64 64" fill="none"><path d="M23 50c-8-3-13-10-13-19 0-12 9-21 22-21s22 9 22 21c0 9-5 16-13 19v-8h-18v8Z" fill="white"/><path d="M22 29h8l4-7 5 15 4-8h7" stroke="#0a9ea9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>',leaf:'<svg viewBox="0 0 64 64" fill="none"><path d="M50 12C28 12 15 23 15 42c0 7 5 10 11 10 19 0 28-16 24-40Z" fill="white"/><path d="M16 50c8-10 18-17 31-22" stroke="#09733c" stroke-width="5" stroke-linecap="round"/></svg>',doctor:'<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="17" r="10" fill="white"/><path d="M14 55c2-14 11-22 18-22s16 8 18 22H14Z" fill="white"/><path d="M24 36v11M40 36v11M32 44v9" stroke="#063b77" stroke-width="4" stroke-linecap="round"/></svg>',nurse:'<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="20" r="10" fill="white"/><path d="M17 55c2-13 10-20 15-20s13 7 15 20H17Z" fill="white"/><path d="M22 11h20v8H22z" fill="white"/><path d="M32 12v7M28 15h8" stroke="#7c3cff" stroke-width="4" stroke-linecap="round"/></svg>',personHeart:'<svg viewBox="0 0 64 64" fill="none"><circle cx="27" cy="20" r="10" fill="white"/><path d="M10 55c2-14 10-22 18-22 4 0 8 2 11 5" fill="white"/><path d="M48 35c-5-5-14 0-9 8l9 9 9-9c5-8-4-13-9-8Z" fill="white"/></svg>',unit:'<svg viewBox="0 0 64 64" fill="none"><path d="M14 53V22l18-10 18 10v31H14Z" fill="white"/><path d="M25 53V37h14v16M25 26h14M32 19v14" stroke="#0b506b" stroke-width="5" stroke-linecap="round"/></svg>',calendar:'<svg viewBox="0 0 64 64" fill="none"><rect x="10" y="14" width="44" height="40" rx="7" fill="white"/><path d="M10 25h44M22 10v9M42 10v9" stroke="#0b506b" stroke-width="5" stroke-linecap="round"/><path d="M22 35h5M36 35h6M22 44h20" stroke="#0b506b" stroke-width="4" stroke-linecap="round"/></svg>',megaphone:'<svg viewBox="0 0 64 64" fill="none"><path d="M13 37h10l25 10V17L23 27H13v10Z" fill="white"/><path d="M23 38l4 12h8l-6-14" stroke="#5a3900" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>',bell:'<svg viewBox="0 0 64 64" fill="none"><path d="M22 50h20M25 54c2 4 12 4 14 0M18 45h28c-5-5-5-13-5-19a9 9 0 0 0-18 0c0 6 0 14-5 19Z" fill="white"/></svg>',user:'<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="22" r="12" fill="white"/><path d="M12 56c3-15 12-23 20-23s17 8 20 23H12Z" fill="white"/></svg>',home:'<svg viewBox="0 0 64 64" fill="none"><path d="M12 32L32 14l20 18v21H12V32Z" fill="white"/><path d="M25 53V39h14v14" stroke="#0b506b" stroke-width="5" stroke-linejoin="round"/></svg>'};function icon(k,c){return '<span class="moduleIcon" style="background:radial-gradient(circle at 35% 24%,#fff 0,'+c+' 24%,#05223b 100%)">'+sv[k]+'</span>'}function logo(cls){return '<div class="'+cls+'">'+sv.logo+'</div>'}function planet(k,c,n){return '<div class="planet p'+n+'" style="background:'+c+'">'+sv[k]+'</div>'}const app=document.getElementById('app');const people=[{name:'João de Souza',cpf:'52998224725',dob:'28/12/1984',family:'F1'},{name:'Maria de Souza',cpf:'',dob:'12/05/1988',family:'F1'},{name:'Ana de Souza',cpf:'',dob:'14/09/2014',family:'F1'}];let st={cpf:'',dob:'',pin:'',person:null,member:null,pending:false,service:null};function fmt(v){let d=(v||'').replace(/\D/g,'').slice(0,11);return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}function valid(v){let d=(v||'').replace(/\D/g,'');if(d.length!=11||/^(\d)\1+$/.test(d))return false;let c=l=>{let s=0;for(let i=0;i<l;i++)s+=+d[i]*(l+1-i);let r=s*10%11;return r==10?0:r};return c(9)==+d[9]&&c(10)==+d[10]}function top(){let p=st.member||st.person;return '<div class="top"><div class="brand"><h2>Conecta Saúde Comunitária</h2><small>'+(p?p.name+' • Sítio Japaranduba':'Acesso seguro do morador')+'</small></div><div class="pill">Morador</div></div>'}function shell(title,lead,body,back){app.innerHTML='<main class="screen"><div class="shell">'+top()+body+'<p class="footer">Homologação segura: não grava CPF, não envia SMS e não vincula aparelho real.</p></div></main>';if(back){let b=document.getElementById('back');if(b)b.onclick=back}}function open(){app.innerHTML='<main class="opening"><section class="stage"><div class="rings"></div><div class="glow"></div>'+planet('tooth','radial-gradient(circle at 35% 24%,#fff,#3fa1ff 18%,#094dd2 66%,#04144a)',1)+planet('run','radial-gradient(circle at 35% 24%,#fff,#ffad4a 18%,#ff4f14 66%,#5a1406)',2)+planet('brain','radial-gradient(circle at 35% 24%,#fff,#63fff0 18%,#03aeb8 66%,#034b5c)',3)+planet('leaf','radial-gradient(circle at 35% 24%,#fff,#ffe26c 18%,#d69600 66%,#4e3100)',4)+planet('user','radial-gradient(circle at 35% 24%,#fff,#63c8ff 18%,#1685d9 66%,#06315f)',5)+planet('doctor','radial-gradient(circle at 35% 24%,#fff,#43f18c 18%,#04a649 66%,#033b1b)',6)+planet('nurse','radial-gradient(circle at 35% 24%,#fff,#b879ff 18%,#7525dd 66%,#260858)',7)+planet('personHeart','radial-gradient(circle at 35% 24%,#fff,#ff75b3 18%,#e51871 66%,#520626)',8)+'<div class="mainLogo">'+sv.logo+'</div></section><section class="copy"><div class="kicker">CONECTA SAÚDE COMUNITÁRIA</div><h1>Saúde, comunidade e cuidado conectados.</h1><div class="concepts"><div class="concept">CONECTA<br>PESSOAS</div><div class="concept">PROMOVE<br>SAÚDE</div><div class="concept">FORTALECE<br>A COMUNIDADE</div></div><div class="network">TACS + COMUNIDADE + UNIDADE</div><button class="btn" id="start">Começar</button></section></main>';document.getElementById('start').onclick=cpf}function steps(n){return '<div class="progress"><span class="bar '+(n>=1?'on':'')+'"></span><span class="bar '+(n>=2?'on':'')+'"></span><span class="bar '+(n>=3?'on':'')+'"></span></div>'}function cpf(e){shell('','', '<div class="card">'+steps(1)+'<h1 class="title">Acesso do morador</h1><p class="lead">Digite o CPF somente quando estiver correto. A busca só acontece depois que você tocar em continuar.</p><div class="field"><label>CPF</label><input id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" value="'+fmt(st.cpf)+'"></div><button class="btn" id="next">Confirmar CPF e continuar</button><p class="warn">Teste seguro: não grava CPF, não envia SMS e não vincula seu aparelho a nenhum morador real.</p>'+(e?'<p class="err">'+e+'</p>':'')+'</div>',open);let f=document.getElementById('cpf');f.oninput=()=>{st.cpf=f.value.replace(/\D/g,'').slice(0,11);f.value=fmt(st.cpf)};document.getElementById('next').onclick=()=>{if(!valid(st.cpf))return cpf('CPF inválido. Confira os 11 números.');let p=people.find(x=>x.cpf==st.cpf);if(p){st.person=p;pin()}else dob()}}function dob(e){shell('','', '<div class="card">'+steps(2)+'<h1 class="title">Confirme o nascimento</h1><p class="lead">CPF não localizado. Isso não bloqueia sua solicitação.</p><div class="field"><label>Data de nascimento</label><input id="dob" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" value="'+st.dob+'"></div><button class="btn" id="next">Continuar</button>'+(e?'<p class="err">'+e+'</p>':'')+'</div>',cpf);let f=document.getElementById('dob');f.oninput=()=>{let d=f.value.replace(/\D/g,'').slice(0,8);f.value=d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d;st.dob=f.value};document.getElementById('next').onclick=()=>{if(!/^\d{2}\/\d{2}\/\d{4}$/.test(st.dob))return dob('Digite a data completa.');st.person={name:'Morador em identificação',cpf:st.cpf,dob:st.dob,family:'',pending:true};st.pending=true;pin()}}function pin(e){shell('','', '<div class="card">'+steps(3)+'<h1 class="title">Crie seu PIN</h1><p class="lead">Use 4 números para reconhecer este acesso de teste.</p><div class="field"><label>PIN</label><input id="p1" type="password" inputmode="numeric" maxlength="4"></div><div class="field"><label>Confirmar PIN</label><input id="p2" type="password" inputmode="numeric" maxlength="4"></div><button class="btn" id="next">Criar PIN</button>'+(e?'<p class="err">'+e+'</p>':'')+'</div>',cpf);document.getElementById('next').onclick=()=>{let a=document.getElementById('p1').value.replace(/\D/g,''),b=document.getElementById('p2').value.replace(/\D/g,'');if(a.length!=4)return pin('O PIN precisa ter 4 números.');if(a!==b)return pin('Os PINs não conferem.');family()}}function family(){let m=st.person.family?people.filter(x=>x.family==st.person.family):[st.person];shell('','', '<div class="card"><h1 class="title">Escolha o integrante</h1><p class="lead">O acesso fica no aparelho responsável; a solicitação usa o integrante escolhido.</p>'+(st.pending?'<div class="notice">Cadastro pendente de revisão, sem bloquear o pedido.</div>':'')+'</div>'+m.map((p,i)=>'<button class="person" data-i="'+i+'"><span class="personIcon" style="background:radial-gradient(circle at 35% 24%,#fff,#63c8ff 22%,#11417a 100%)">'+sv.user+'</span><span><b>'+p.name+'</b><small>'+p.dob+' • Sítio Japaranduba</small></span></button>').join(''),pin);document.querySelectorAll('.person').forEach(b=>b.onclick=()=>{st.member=m[+b.dataset.i];home()})}function home(){let p=st.member||st.person;shell('','', '<div class="notice">Ambiente de teste: nenhuma vaga real será consumida e nenhum Push real será enviado.</div><h1 class="title">Como podemos ajudar?</h1><div class="grid"><button class="module" onclick="drawer(\'Agendas\')">'+icon('calendar','#3fa1ff')+'<b>Agendas</b><small>Dias e horários</small></button><button class="module" onclick="drawer(\'Profissionais\')">'+icon('doctor','#43f18c')+'<b>Profissionais</b><small>Equipe da unidade</small></button><button class="module" onclick="services()">'+icon('steth','#63fff0')+'<b>Serviços</b><small>Solicitações</small></button><button class="module" onclick="drawer(\'Campanhas\')">'+icon('megaphone','#ffc033')+'<b>Campanhas</b><small>Ações de saúde</small></button><button class="module" onclick="drawer(\'Recados\')">'+icon('bell','#ff6b1a')+'<b>Recados</b><small>Avisos da unidade</small></button><button class="module" onclick="profile()">'+icon('user','#168cff')+'<b>Meu Perfil</b><small>Dados e família</small></button></div><button class="btn alt" style="margin-top:18px" onclick="family()">Trocar integrante da família</button>',family)}function services(){let arr=[['Atendimento médico','Solicitar atendimento na unidade','doctor','#43f18c'],['Atendimento odontológico','Consulta comum ou urgência odontológica','tooth','#3fa1ff'],['Atendimento com enfermeira','Orientações e acompanhamento','nurse','#7c3cff'],['Atendimento com nutricionista','Solicitação de acompanhamento nutricional','leaf','#ffc033'],['Visita domiciliar do TACS','Pedido de visita na residência','home','#20e0c0'],['Bolsa Família','Acompanhamento de peso e altura','personHeart','#ef2f91']];shell('','', '<button id="back" class="btn alt small" style="margin-bottom:16px">Voltar</button><h1 class="title">Serviços</h1><p class="lead">Escolha o serviço. Não existe seletor nativo nem vaga automática nesta tela.</p>'+arr.map((s,i)=>'<button class="service" data-i="'+i+'"><span class="serviceIcon" style="background:radial-gradient(circle at 35% 24%,#fff,'+s[3]+' 22%,#05223b 100%)">'+sv[s[2]]+'</span><span><b>'+s[0]+'</b><small>'+s[1]+'</small></span></button>').join('')+'<div class="field"><label>Descrição</label><textarea id="desc" placeholder="Explique seu pedido"></textarea></div><button class="btn" id="send">Enviar solicitação de teste</button>',home);document.querySelectorAll('.service').forEach(b=>b.onclick=()=>{document.querySelectorAll('.service').forEach(x=>x.classList.remove('on'));b.classList.add('on');st.service=arr[+b.dataset.i][0]});document.getElementById('send').onclick=()=>{if(!st.service)return drawer('Escolha um serviço','Selecione primeiro um cartão de serviço.');drawer('Solicitação registrada','Pedido de teste para '+st.service+'. Nenhuma vaga real foi consumida.')}}function profile(){drawer('Meu Perfil','Morador: '+(st.member||st.person).name+'<br>Situação: homologação visual segura.')}function drawer(t,body){if(!document.getElementById('panel'))document.body.insertAdjacentHTML('beforeend','<div class="panel" id="panel"><div class="drawer"><div class="drawerHead"><h3 id="pt"></h3><button class="x" id="px">×</button></div><div id="pb"></div></div></div>');let p=document.getElementById('panel');document.getElementById('pt').textContent=t;document.getElementById('pb').innerHTML='<div class="item"><b>'+body+'</b><small>Conteúdo de homologação.</small><span class="status">Teste</span></div>';p.classList.add('on');document.getElementById('px').onclick=()=>p.classList.remove('on')}open();</script></body></html>
